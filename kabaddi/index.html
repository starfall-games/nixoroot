<style>
/* ===== 色やサイズのきまり ===== */
:root{
  --bg:#0b1020; --panel:rgba(12,18,38,.82); --line:rgba(255,255,255,.14);
  --txt:#f4f6ff; --sub:#a9b3d6; --hot:#ff7a1a; --hot2:#ffcf3a; --cool:#2fd0ff; --good:#3bf08a; --bad:#ff4d5e;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.big{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;letter-spacing:.02em}

/* ===== 試合中の表示（HUD） ===== */
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:0;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
#score .tm{display:flex;align-items:center;gap:8px;padding:6px 12px;min-width:120px}
#score .tm.r{flex-direction:row-reverse}
#score .nm{font-size:13px;font-weight:800;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score .pt{font-size:30px;line-height:1;min-width:38px;text-align:center}
#score .sw{width:6px;align-self:stretch}
#score .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;background:rgba(0,0,0,.35);min-width:74px}
#score .clk{font-size:20px;line-height:1}
#score .hf{font-size:10px;color:var(--sub)}
.mats{display:flex;gap:3px;margin-top:3px}
.mats i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.mats i.on{background:currentColor;box-shadow:0 0 6px currentColor}
#raidbar{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(320px,70vw);height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
#raidbar b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--hot2));transition:width .1s linear}
#raidinfo{position:absolute;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:12px;color:var(--sub);white-space:nowrap;text-shadow:0 1px 3px #000}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none}
#banner .b1{display:inline-block;font-size:clamp(34px,8vw,72px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px var(--hot);transform:skewX(-8deg)}
#banner .b2{font-size:clamp(14px,3.4vw,22px);font-weight:800;margin-top:6px;text-shadow:0 2px 6px #000}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) skewX(-8deg);opacity:0}100%{transform:scale(1) skewX(-8deg);opacity:1}}
#tip{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;max-width:90vw;text-align:center}
#floats{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;font-family:"Dela Gothic One",sans-serif;font-size:26px;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 12px currentColor;animation:flup 1.2s ease-out forwards;white-space:nowrap}
@keyframes flup{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
#replay{position:fixed;inset:0;pointer-events:auto;cursor:pointer}
#replay .bar{position:absolute;left:0;right:0;height:9vh;background:#000;transition:transform .35s}
#replay .bar.t{top:0}#replay .bar.b{bottom:0}
#replay .tag{position:absolute;top:calc(10vh + 8px);left:16px;font-family:"Dela Gothic One";font-size:20px;color:#fff;display:flex;gap:8px;align-items:center;text-shadow:0 2px 6px #000}
#replay .tag i{width:12px;height:12px;border-radius:50%;background:#ff3a3a;animation:blink 1s infinite;display:block}
#replay .what{position:absolute;bottom:calc(9vh + 14px);left:0;right:0;text-align:center;font-family:"Dela Gothic One";font-size:clamp(20px,5vw,34px);color:#ffcf3a;text-shadow:0 3px 0 #000,0 0 20px rgba(255,160,40,.6)}
#replay .skip{position:absolute;bottom:calc(9vh + 16px);right:16px;font-size:12px;color:#fff;opacity:.8;font-weight:800}
@keyframes blink{50%{opacity:.2}}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,40,60,0);transition:box-shadow .2s}

/* ===== さわる操作（スティックと息ボタン） ===== */
#ctrl{position:fixed;inset:0;pointer-events:none}
#stickzone{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);display:none}
#stick b{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 12px rgba(255,255,255,.4)}
#breath{position:absolute;right:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;pointer-events:auto;border-radius:50%}
#breath svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#breath .core{position:absolute;inset:16px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,#ffb066,#ff6a00 60%,#c43e00);box-shadow:0 6px 0 #7a2600,0 10px 30px rgba(255,106,0,.45);font-weight:800;text-align:center;line-height:1.1;transition:transform .06s}
#breath.on .core{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 #7a2600,0 0 40px rgba(255,160,40,.9)}
#breath .core .k{font-family:"Dela Gothic One";font-size:19px}
#breath .core .s{font-size:10px;opacity:.85;margin-top:2px}
#breath.def .core{background:radial-gradient(circle at 35% 30%,#7fe6ff,#13a6e0 60%,#0a6896);box-shadow:0 6px 0 #064a6b,0 10px 30px rgba(20,170,230,.45)}
#breath.def.on .core{box-shadow:0 2px 0 #064a6b,0 0 40px rgba(60,200,255,.9)}
#keyhelp{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--sub);opacity:.8;text-shadow:0 1px 2px #000}
#pausebtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);pointer-events:auto;font-size:18px}

/* ===== メニュー画面 ===== */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}
#panel{justify-content:flex-start}
#panel .card{margin:auto 0}
.scr.dim{background:radial-gradient(ellipse at center,rgba(11,16,32,.55),rgba(11,16,32,.92))}
#title h1{margin:0;font-family:"Dela Gothic One";font-size:clamp(44px,11vw,96px);line-height:.95;text-align:center;
  background:linear-gradient(180deg,#fff 10%,#ffd36b 55%,#ff7a1a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45)) drop-shadow(0 0 30px rgba(255,120,30,.45));transform:skewX(-6deg)}
#title .sub{font-size:14px;color:var(--sub);margin:8px 0 18px;letter-spacing:.3em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(460px,100%)}
.mbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:800;font-size:15px;backdrop-filter:blur(6px);transition:transform .08s,border-color .2s}
.mbtn:active{transform:scale(.97)}
.mbtn:hover{border-color:rgba(255,180,80,.6)}
.mbtn .ic{font-size:24px}
.mbtn small{display:block;font-size:10px;color:var(--sub);font-weight:500;margin-top:2px}
.mbtn.main{grid-column:1/-1;background:linear-gradient(135deg,#ff8a1f,#ff4f1f);border:0;font-size:20px;justify-content:center;box-shadow:0 6px 0 #9c2f00,0 10px 30px rgba(255,90,20,.35)}
.mbtn.main small{color:#ffe7cf}
/* ===== 選手カード・ガチャ ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;max-height:38vh;overflow:auto;padding:2px}
.pgrid.line{max-height:none;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.pgrid.res{max-height:none;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.pc{position:relative;border-radius:12px;padding:6px 5px 7px;text-align:center;background:linear-gradient(160deg,#2a3150,#141a2e);border:2px solid var(--rc,#9aa3b5);cursor:pointer;min-width:0;transition:transform .1s}
.pc:active{transform:scale(.96)}
.pc.rN{--rc:#9aa3b5}.pc.rR{--rc:#3aa0ff;background:linear-gradient(160deg,#1f4a86,#121c33)}.pc.rSR{--rc:#b45cff;background:linear-gradient(160deg,#5a2a8c,#1a1233)}
.pc.rSSR{--rc:#ffc531;background:linear-gradient(160deg,#a8761a,#3a2406 60%,#1a1206);box-shadow:0 0 14px rgba(255,197,49,.45)}
.pc.rSSR::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.pc .pr{font-size:10px;font-weight:800;color:var(--rc)}.pc .po{font-family:"Dela Gothic One";font-size:20px;line-height:1.1}.pc .pf{font-size:16px}
.pc .pn{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .pl{font-size:9px;color:var(--sub)}
.pc.nown{filter:grayscale(.85);opacity:.55}.pc.sel{outline:3px solid #fff;transform:translateY(-3px)}.pc.inl{opacity:.45}
.pc.big{width:96px;flex:none}.pgrid.line .pc .pn{font-size:9px}.pgrid.line .pc .po{font-size:16px}
.gbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0}
.gorb{width:90px;height:90px;border-radius:50%;--oc:#ffcf3a;background:radial-gradient(circle at 35% 30%,#fff,var(--oc) 45%,#2a1a00 100%);box-shadow:0 0 30px var(--oc);animation:orb 1.6s ease-in-out infinite}
.gorb.big{width:150px;height:150px;margin:30px auto 0;cursor:pointer;animation:orb .7s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(4deg)}}
.flip{position:relative;opacity:0;animation:flipin .45s forwards}
@keyframes flipin{0%{opacity:0;transform:rotateY(90deg) scale(.7)}100%{opacity:1;transform:none}}
.ptag{position:absolute;top:-6px;right:-4px;font-size:10px;font-weight:800;background:#ff4f1f;border-radius:8px;padding:1px 5px}
#panel.ssrflash{animation:ssrf .9s}
@keyframes ssrf{0%{background:rgba(255,220,120,.95)}100%{}}
.rankpill{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px}
.rankpill .rk{font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(520px,100%);backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.card h2{margin:0 0 12px;font-family:"Dela Gothic One";font-size:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:14px}
.chip.on{background:linear-gradient(135deg,#ff8a1f,#ff4f1f);border-color:transparent}
.btn{padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#ff8a1f,#ff4f1f);font-weight:800;font-size:16px;box-shadow:0 4px 0 #9c2f00}
.btn.gray{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--line)}
.btn:active{transform:translateY(2px)}
.lbl{font-size:12px;color:var(--sub);margin-top:10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach .ic{font-size:26px}
.ach b{display:block;font-size:14px}.ach span{font-size:11px;color:var(--sub)}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.bracket .col{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.bracket .m{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 8px;border:1px solid var(--line)}
.bracket .m div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.bracket .w{color:var(--hot2);font-weight:800}
.bracket .me{color:var(--cool)}
input[type=text]{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;width:100%;user-select:text;-webkit-user-select:text}
.sw{display:inline-block;width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw.on{border-color:#fff}
#tut{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translateX(-50%);width:min(480px,92vw);background:rgba(10,16,34,.92);border:1px solid rgba(255,200,90,.5);border-radius:16px;padding:12px 16px;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tut .st{font-size:11px;color:var(--hot2);font-weight:800}
#tut .tx{font-size:16px;font-weight:800;margin-top:4px;line-height:1.45}
#struggle{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center}
#struggle .t{font-family:"Dela Gothic One";font-size:28px;text-shadow:0 3px 0 #000;animation:shake .15s infinite}
#struggle .bar{width:min(300px,70vw);height:16px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin:8px auto;border:2px solid rgba(255,255,255,.4)}
#struggle .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#d6ff6b)}
@keyframes shake{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(-2px,1px)}}
#loading{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--sub)}
#resimg{width:100%;border-radius:14px;display:block;margin:8px 0;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.stat{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
.stat div:nth-child(3n+1){text-align:right;font-weight:800}.stat div:nth-child(3n+2){color:var(--sub);text-align:center;font-size:11px}.stat div:nth-child(3n){font-weight:800}
.toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top));transform:translateX(-50%);background:linear-gradient(135deg,#ffcf3a,#ff8a1f);color:#2a1300;font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .4s;z-index:50;pointer-events:none;white-space:nowrap}
@media (max-width:560px){ #pausebtn{top:calc(66px + env(safe-area-inset-top));width:34px;height:34px;font-size:15px} #score .tm{min-width:0;padding:6px 8px} #score .pt{font-size:26px;min-width:30px} #score .nm{max-width:84px;font-size:12px} .rankpill{font-size:11px;flex-wrap:wrap;justify-content:center;border-radius:16px} }
@media (max-height:500px){ #breath{width:110px;height:110px} #tip{bottom:120px} #title h1{font-size:44px} .mbtn{padding:9px 10px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 試合中の表示 -->
<div id="hud" class="hidden">
  <div id="score">
    <div class="tm" id="tmA"><span class="sw" id="swA"></span><div><div class="nm" id="nmA">-</div><div class="mats" id="matA"></div></div><span class="pt big" id="ptA">0</span></div>
    <div class="mid"><span class="clk big" id="clk">2:00</span><span class="hf" id="hf">前半</span></div>
    <div class="tm r" id="tmB"><span class="sw" id="swB"></span><div style="text-align:right"><div class="nm" id="nmB">-</div><div class="mats" id="matB" style="justify-content:flex-end"></div></div><span class="pt big" id="ptB">0</span></div>
  </div>
  <div id="raidbar"><b id="raidfill"></b></div>
  <div id="raidinfo"></div>
  <div id="floats"></div>
  <div id="banner"></div>
  <div id="tip" class="hidden"></div>
  <div id="struggle" class="hidden"><div class="t" id="strugT">もがけ！</div><div class="bar"><b id="strugFill"></b></div><div style="font-size:13px;font-weight:800" id="strugS">ボタンを連打！</div></div>
  <div id="vign"></div>
</div>

<!-- さわる操作 -->
<div id="ctrl" class="hidden">
  <div id="stickzone"><div id="stick"><b></b></div></div>
  <div id="breath">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/>
      <circle id="bring" cx="50" cy="50" r="46" fill="none" stroke="#7dfcff" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
    <div class="core"><span class="k" id="bk">カバディ</span><span class="s" id="bs">おしっぱなし</span></div>
  </div>
  <button id="pausebtn">⏸</button>
  <div id="keyhelp"></div>
</div>

<div id="replay" class="hidden"><div class="bar t"></div><div class="bar b"></div><div class="tag"><i></i>REPLAY</div><div class="what" id="replayWhat"></div><div class="skip">タップでスキップ ▶▶</div></div>
<div id="tut" class="hidden"><div class="st" id="tutS">チュートリアル</div><div class="tx" id="tutT"></div></div>

<!-- タイトル -->
<div id="title" class="scr hidden">
  <h1>いきどめ！<br>カバディ</h1>
  <div class="sub">BREATH RAID</div>
  <div class="menu">
    <button class="mbtn main" data-go="quick"><span class="ic">🤼</span><span>試合する<small>CPU と 1 試合</small></span></button>
    <button class="mbtn" data-go="rank"><span class="ic">🏅</span><span>ランク戦<small>勝ってランクを上げる</small></span></button>
    <button class="mbtn" data-go="cup"><span class="ic">🏆</span><span>大会<small>8チームのトーナメント</small></span></button>
    <button class="mbtn" data-go="tut"><span class="ic">🎓</span><span>チュートリアル<small>はじめての人はここ</small></span></button>
    <button class="mbtn" data-go="team"><span class="ic">👥</span><span>マイチーム<small>メンバー・名前・色</small></span></button>

const confetti = (() => {
  const N = 400, g = new THREE.PlaneGeometry(0.09, 0.05), m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
  const im = new THREE.InstancedMesh(g, m, N); im.frustumCulled = false; im.visible = false; scene.add(im);
  const P = [], M4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(1, 1, 1), v = new THREE.Vector3(), col = new THREE.Color();
  for (let i = 0; i < N; i++) { P.push({ x: 0, y: -10, z: 0, vx: 0, vy: 0, vz: 0, r: 0, rs: 0 }); im.setColorAt(i, col.setHSL(Math.random(), 0.9, 0.6)); }
  let life = 0;
  return {
    burst(cx, cz) { stageShow(null, 3.5); life = 4; im.visible = true; for (const p of P) { p.x = cx + rand(-5, 5); p.y = rand(7, 12); p.z = cz + rand(-5, 5); p.vx = rand(-0.5, 0.5); p.vy = rand(-1.5, -0.5); p.vz = rand(-0.5, 0.5); p.r = rand(0, 6); p.rs = rand(-8, 8); } },
    update(dt) {
      stageUpdate(dt);   // 会場・観客・光の演出（スタジアム担当）。毎フレームここから呼ぶ
      if (life <= 0) return; life -= dt; if (life <= 0) { im.visible = false; return; }
      P.forEach((p, i) => { p.x += p.vx * dt + Math.sin(p.r) * 0.01; p.y += p.vy * dt; p.z += p.vz * dt; p.r += p.rs * dt; if (p.y < 0) p.y = 0.01; e.set(p.r, p.r * 0.7, 0); q.setFromEuler(e); M4.compose(v.set(p.x, p.y, p.z), q, s); im.setMatrixAt(i, M4); });
      im.instanceMatrix.needsUpdate = true;
    },
  };
})();

  const N = 60, g = new THREE.SphereGeometry(0.12, 6, 4), m = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false });

  const P = [], M4 = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < N; i++) P.push({ x: 0, y: -5, z: 0, vx: 0, vy: 0, vz: 0, t: 0, s: 0 });
  return {
    puff(x, z, n = 10) { for (let i = 0; i < n; i++) { const p = P[k++ % N]; p.x = x; p.y = 0.1; p.z = z; const a = rand(0, 6.28), sp = rand(0.6, 1.8); p.vx = Math.cos(a) * sp; p.vz = Math.sin(a) * sp; p.vy = rand(0.3, 1); p.t = 0.6; p.s = rand(0.6, 1.4); } },

  };
})();

    case 'resolve': if (M.pt > (G.fast ? 0.2 : 2.0)) { if (M.hl && !M.demo && !M.tut && !G.fast) startReplay(M); else afterResolve(M); } break;

const CAM = { x: 0, y: 12, z: 14, lx: 0, ly: 0, lz: 0, t: 0 };
const CAM0 = { x: 0, y: 12, z: 14, lx: 0, ly: 0, lz: 0 };   // カメラの初期値（おかしくなったらここにもどす）
let lastW = 0, lastH = 0;
function updateCamera(dt) {
  // 画面の大きさが0（アプリ切りかえ・タブをうしろへ）のときは何もしない。0で割ると NaN になって画面がまっ暗のままになるため
  if (!(innerWidth > 0 && innerHeight > 0)) return;
  if (innerWidth !== lastW || innerHeight !== lastH) resize();   // 毎コマ、画面の大きさと合わせる
  if (![CAM.x, CAM.y, CAM.z, CAM.lx, CAM.ly, CAM.lz].every(Number.isFinite)) Object.assign(CAM, CAM0);
  if (!Number.isFinite(camera.fov)) camera.fov = 46;
  const M = G.M, asp = innerWidth / innerHeight, portrait = asp < 0.85;
  let tx, ty, tz, lx, ly = 0.6, lz;
  CAM.t += dt;
  if (M && M.phase === 'replay' && M.rp) {
    // リプレイ：低い位置から、レイダーのまわりをゆっくり回る
    const f = M.rp.focus, a = M.rp.ang + M.rp.t * 0.25, rr = portrait ? 6.5 : 5.2;
    tx = f.x + Math.sin(a) * rr; ty = 2.4; tz = f.z + Math.cos(a) * rr; lx = f.x; ly = 1.0; lz = f.z;
  } else if (!M || G.mode === 'title' || (M && M.demo)) {
    // タイトル：ゆっくり回る
    const a = CAM.t * 0.08; tx = Math.sin(a) * 15; tz = Math.cos(a) * 15; ty = 8.5; lx = 0; lz = 0; ly = 0;
  } else {
    const R = M.R, focus = R && R.raider ? R.raider : { x: 0, z: 0 };
    lx = focus.x * 0.5; lz = clamp(focus.z * 0.75, -4.6, 3) - 0.6;
    const H = portrait ? 12.4 : 6.9, D = portrait ? 9.2 : 7.8;
    tx = lx * 0.5; ty = H; tz = lz + D;
    if (M.phase === 'intro') { const k = Math.min(1, M.pt / 2.4); tx = lerp(-12, 0, k); ty = lerp(4, H, k); tz = lerp(4, D, k); lx = 0; lz = 0; }
    if (M.phase === 'struggle' || (M.phase === 'resolve' && M.pt < 1.2)) { ty = H * 0.72; tz = lz + D * 0.75; }
    if (M.phase === 'half' || M.phase === 'end') { const a = CAM.t * 0.2; tx = Math.sin(a) * 10; tz = Math.cos(a) * 10; ty = 7; lx = 0; lz = 0; }
  }
  // 目標の位置がおかしい（NaN）ときは、今の位置のまま
  if (![tx, ty, tz, lx, ly, lz].every(Number.isFinite)) { tx = CAM.x; ty = CAM.y; tz = CAM.z; lx = CAM.lx; ly = CAM.ly; lz = CAM.lz; }
  camera.fov = lerp(camera.fov, portrait ? 56 : 46, 0.1);
  const k = 1 - Math.pow(0.02, dt);
  CAM.x = lerp(CAM.x, tx, k); CAM.y = lerp(CAM.y, ty, k); CAM.z = lerp(CAM.z, tz, k);
  CAM.lx = lerp(CAM.lx, lx, k * 1.4); CAM.ly = lerp(CAM.ly, ly, k); CAM.lz = lerp(CAM.lz, lz, k * 1.4);
  const sh = G.shake; G.shake = Math.max(0, G.shake - dt * 1.2);
  camera.position.set(CAM.x + rand(-sh, sh) * 0.3, CAM.y + rand(-sh, sh) * 0.3, CAM.z);
  if (!camera.position.toArray().every(Number.isFinite)) { Object.assign(CAM, CAM0); camera.position.set(CAM0.x, CAM0.y, CAM0.z); }
  camera.lookAt(CAM.lx, CAM.ly, CAM.lz);
  camera.updateProjectionMatrix();
}
function resize() {
  if (!(innerWidth > 0 && innerHeight > 0)) return;   // 大きさ0のときは何もしない

// =====================================================================
//  メインループ（1秒に60コマで計算して、画面にかく）
// =====================================================================
let lastT = performance.now(), acc = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (G.slowT > 0) { G.slowT -= dt; if (G.slowT <= 0) G.slow = 1; }
  const M = G.M;
  if (!paused) {
    acc += dt * G.slow * (G.fast && M && !M.demo ? 4 : 1);
    let n = 0;
    while (acc >= DT && n < 10) {
      readInput();
      if (M) {
        // 人が守るとき、ボタンでタックル
        if (M.phase === 'raid' && M.R && !M.T[M.R.di].cpu && INPUT.pressed && !M.R.tackle && !M.tutNoTackle) startTackle(M, M.R.chance);
        stepMatch(M, DT);
        if (M.tutStep) M.tutStep();
      }
      clearEdges(); acc -= DT; n++;
    }
    if (n >= 10) acc = 0;
  }
  if (M && !M.demo) updateHUD(M);
  // チャンスの輪
  if (M && M.R && M.phase === 'raid' && !M.T[M.R.di].cpu && M.R.chance > 0 && !M.demo) {
    const c = M.R.chance; chanceRing.visible = true; chanceRing.position.set(M.R.raider.x, 0.02, M.R.raider.z);
    chanceRing.material.color.setHex(c >= 1 ? 0x3bf08a : c > 0.5 ? 0xffcf3a : 0xff5a6a); chanceRing.scale.setScalar(1 + Math.sin(now / (c >= 1 ? 70 : 160)) * 0.08);
  } else chanceRing.visible = false;
  glowLine.material.opacity = 0.45 + Math.sin(now / 160) * 0.35;
  CROWD.uTime.value = now / 1000;
  if (!M || M.phase !== 'raid') CROWD.uExcite.value = lerp(CROWD.uExcite.value, 0.25, 0.01);
  SND.crowd(M && !M.demo ? CROWD.uExcite.value : 0.15);
  ledTex.offset.x = (now / 1000 * 0.04) % 1;
  beams.forEach((b, i) => b.material.opacity = 0.035 + Math.sin(now / 900 + i) * 0.012 + (CROWD.uExcite.value > 0.8 ? 0.02 : 0));
  confetti.update(dt); dust.update(dt);
  SND.tick();
  updateCamera(dt);
  renderer.render(scene, camera);
}

// =====================================================================
//  マイチームとガチャ
//  ・ガチャはゲームの中のコインだけで引く（お金の課金はなし）
//  ・コインは 試合・大会・実績・毎日のボーナス でたまる
//  ・同じ選手が出たら「かけら」になる → 選手の強化や、ほしい選手との交換に使う
//  ・50回引いても SSR が出なかったら「天井」：好きな SSR を1人もらえる
// =====================================================================
const RAR = {
  N: { n: 'N', rate: 55, base: 66, col: '#9aa3b5', shard: 1, buy: 10 },
  R: { n: 'R', rate: 30, base: 70, col: '#3aa0ff', shard: 3, buy: 30 },
  SR: { n: 'SR', rate: 12, base: 74, col: '#b45cff', shard: 10, buy: 100 },
  SSR: { n: 'SSR', rate: 3, base: 78, col: '#ffc531', shard: 30, buy: 300 },
};
const RAR_ORDER = ['N', 'R', 'SR', 'SSR'];
const GACHA_COST = 100, GACHA_COST10 = 900, PITY_MAX = 50, LV_MAX = 5;
// いつか本物のお金でコインを買えるようにするときは、addCoins(n, 'ショップ') を呼ぶだけでよい形にしてある
// ----- ガチャで出る選手（ぜんぶ作りもの。毎回同じ顔ぶれになるように「たね」から作る） -----
const POOL = (() => {
  const R = seeded(hashStr('kabaddi-gacha-pool-v1')), out = [];
  const names = ['ハヤテ', 'ゴウ', 'リク', 'ソラ', 'カイ', 'レン', 'タイガ', 'ユウマ', 'ジン', 'ケンタ', 'アラタ', 'ショウ', 'ダイチ', 'ヒカル', 'ミナト', 'トウマ', 'セナ', 'コウキ', 'イブキ', 'ライ', 'アキラ', 'ツバサ', 'マサト', 'ナギ', 'ヨウタ', 'ハル', 'ルイ', 'テツ', 'キョウ', 'ユズル', 'シン', 'ガク', 'ケイ', 'リュウ', 'ノア', 'ソウ', 'タクミ', 'エイジ', 'ゲン', 'マモル', 'ススム', 'ヒロ', 'カズ', 'ジョウ', 'ダン', 'ユキ', 'ミツル', 'コタロウ'];
  const titles = { SSR: ['いなずま', '鉄壁の', '風神', '怪力', '韋駄天', '不死身の'], SR: ['俊足', 'カベの', 'ねばりの', '電光', '豪腕', 'しなやか', '必殺', '冷静な', '熱血', '技あり'] };
  const roles = ['レイダー', 'コーナー', 'カバー', 'オールラウンダー'];
  const counts = { SSR: 6, SR: 10, R: 14, N: 18 };
  let k = 0;
  for (const r of ['SSR', 'SR', 'R', 'N']) for (let i = 0; i < counts[r]; i++) {
    const role = roles[(i + (r === 'SSR' ? 0 : 1)) % 4], b = RAR[r].base, J = () => Math.round((R() - 0.5) * 8);
    const raid = b + (role === 'レイダー' ? 10 : role === 'コーナー' ? -6 : role === 'カバー' ? -3 : 3) + J();
    const tack = b + (role === 'コーナー' ? 9 : role === 'カバー' ? 6 : role === 'レイダー' ? -6 : 3) + J();
    const spd = b + (role === 'レイダー' ? 4 : 0) + J(), pow = b + (role === 'コーナー' ? 4 : 0) + J();
    const nm = names[k++ % names.length];
    out.push({ id: 'g' + out.length, rar: r, name: (titles[r] ? titles[r][i % titles[r].length] : '') + nm, short: nm, role, raid: clamp(raid, 40, 95), tack: clamp(tack, 40, 95), spd: clamp(spd, 40, 95), pow: clamp(pow, 40, 95), num: 1 + Math.floor(R() * 30), skin: SKINS[Math.floor(R() * SKINS.length)], hair: [0x15100c, 0x2a1a10, 0x0c0c0c, 0x3b2414, 0x6b4a2a][Math.floor(R() * 5)] });
  }
  return out;
})();
const EMBLEMS = ['🔥', '⚡', '🐯', '🦅', '🐉', '🦁', '🐺', '🦈', '🌊', '⭐', '🌸', '🛡', '🐘', '🦏', '🌪', '👊'];

// ----- セーブの引きつぎ（前のセーブに、マイチームとコインを足す） -----
function initMyTeam() {
  if (!SAVE.owned) {
    // はじめのメンバー（今までのチームの7人）を、そのまま自分の選手にする
    // 能力は N〜R くらいにそろえる（ガチャの選手をとる楽しみが出るように。差は大きすぎないように半分にちぢめる）
    const sq = v => Math.round(68 + (v - 70) * 0.5);
    SAVE.starters = makeRoster('me:' + (SAVE.team.name || ''), 70).map((d, i) => ({ id: 's' + i, rar: 'N', name: d.name, short: d.name, role: d.role, raid: sq(d.raid), tack: sq(d.tack), spd: sq(d.spd), pow: sq(d.pow), num: d.num, skin: d.skin, starter: true }));
    SAVE.owned = {}; SAVE.starters.forEach(d => SAVE.owned[d.id] = { lv: 1 });
    SAVE.lineup = SAVE.starters.map(d => d.id);
    SAVE.coins = 300 + Object.keys(SAVE.ach || {}).length * 100;   // はじめのコイン（もう取った実績の分もおまけ）
    SAVE.shards = 0; SAVE.pity = 0; SAVE.pulls = 0; SAVE.daily = '';
    save();
  }
  if (SAVE.team.emb == null) SAVE.team.emb = 0;
}
initMyTeam();
const pdata = id => POOL.find(p => p.id === id) || (SAVE.starters || []).find(p => p.id === id);
const lvOf = id => (SAVE.owned[id] || { lv: 1 }).lv;
// 能力（レベル1つで全部 +1。強さの差はつけすぎない）
function statsOf(id) { const d = pdata(id), b = lvOf(id) - 1; return { raid: d.raid + b, tack: d.tack + b, spd: d.spd + b, pow: d.pow + b }; }
const ovrOf = id => { const s = statsOf(id); return Math.round((s.raid + s.tack + s.spd + s.pow) / 4); };
// 試合に出る7人のデータを作る（newMatch で使う）
function myLineupRoster() {
  const ids = (SAVE.lineup || []).filter(id => pdata(id) && SAVE.owned[id]).slice(0, 7);
  for (const id of Object.keys(SAVE.owned)) if (ids.length < 7 && !ids.includes(id) && pdata(id)) ids.push(id);
  const used = new Set();
  const list = ids.map(id => {
    const d = pdata(id), s = statsOf(id); let num = d.num; while (used.has(num)) num = num % 30 + 1; used.add(num);
    return { name: d.short || d.name, full: d.name, num, role: d.role, raid: s.raid, tack: s.tack, spd: s.spd, pow: s.pow, skin: d.skin, hair: d.hair, rar: d.rar };
  });
  list.slice().sort((a, b) => b.raid - a.raid)[0].ace = true;
  return list;
}
function addCoins(n, why) { SAVE.coins = (SAVE.coins || 0) + n; save(); return n; }
const coinTxt = () => `🪙 ${SAVE.coins || 0}`;
// 毎日のボーナス（その日はじめてタイトルを開いたとき）
function dailyBonus() {
  const d = new Date(), key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  if (SAVE.daily === key) return; SAVE.daily = key; addCoins(150, '毎日');
  setTimeout(() => tipToast('🎁 毎日ボーナス 🪙150'), 900);
}
// 試合のあとにもらえるコイン
function matchCoins(M, win, draw) {
  const me = M.T[0], mul = [0.8, 1, 1.25, 1.5][M.cfg.diff] || 1;
  let c = (win ? 100 : draw ? 60 : 40) + me.st.superRaids * 10 + me.st.superTackles * 10 + me.st.allOuts * 10;
  if (M.cfg.kind === 'rank') c += 20;
  return addCoins(Math.round(c * mul), '試合');
}

// ----- ガチャを引く -----
function rollRar() { let x = Math.random() * 100; for (const r of ['SSR', 'SR', 'R', 'N']) { x -= RAR[r].rate; if (x < 0) return r; } return 'N'; }
function grant(id) {
  // 新しい選手なら仲間に。もう持っていたら「かけら」
  const d = pdata(id);
  if (SAVE.owned[id]) { SAVE.shards += RAR[d.rar].shard; return { id, dup: true, shard: RAR[d.rar].shard }; }
  SAVE.owned[id] = { lv: 1 }; return { id, dup: false };
}
function pullGacha(n) {
  const cost = n === 10 ? GACHA_COST10 : GACHA_COST * n;
  if ((SAVE.coins || 0) < cost) return null;
  SAVE.coins -= cost;
  const res = [];
  for (let i = 0; i < n; i++) {
    let r = rollRar();
    if (n === 10 && i === 9 && !res.some(x => RAR_ORDER.indexOf(pdata(x.id).rar) >= 2) && RAR_ORDER.indexOf(r) < 2) r = 'SR';   // 10連は SR 以上を1人かくてい
    SAVE.pulls = (SAVE.pulls || 0) + 1;
    SAVE.pity = r === 'SSR' ? 0 : (SAVE.pity || 0) + 1;
    res.push(grant(pick(POOL.filter(p => p.rar === r)).id));
  }
  if (SAVE.pity >= PITY_MAX) SAVE.pityReady = true;
  save(); return res;
}

function pcard(id, extra = '') {
  const d = pdata(id), own = !!SAVE.owned[id], s = statsOf(id);
  return `<div class="pc r${d.rar} ${own ? '' : 'nown'} ${extra}" data-pid="${id}"><div class="pr">${d.starter ? 'はじめ' : d.rar}</div><div class="po">${ovrOf(id)}</div><div class="pf">${['🏃', '🧱', '🛡', '⭐'][['レイダー', 'コーナー', 'カバー', 'オールラウンダー'].indexOf(d.role)]}</div><div class="pn">${d.name}</div><div class="pl">${d.role}${own ? ' Lv' + lvOf(id) : ''}</div></div>`;
}
const lvCost = id => RAR[pdata(id).rar].shard * lvOf(id) + 2;   // 強化に使うかけらの数

  show();
  M.tutNoTackle = true;
  let target = null;
  M.tutStep = () => {
    const R = M.R; if (!R) return;

    if (step === 3) { if (target && !target.touched) { target.B.ring.visible = true; target.B.ring.material.color.setHex(0x7dfcff); } if (R.touched.size) { step = 4; show(); } }
