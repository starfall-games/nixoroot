<style>
/* ===== 色やサイズのきまり ===== */
:root{
  --bg:#0c0f1c; --panel:rgba(14,18,34,.86); --line:rgba(255,255,255,.14);
  --txt:#f6f3ea; --sub:#b4b0c8; --aka:#e8473a; --shiro:#f4f1e8; --gold:#f2c45a; --ai:#2b4a8a; --good:#3bf08a; --bad:#ff4d5e;
  --r:16px; --vw:1vw; --vh:1vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;touch-action:none}
/* 横画面で固定（iPhone）：たて向きのとき、ゲームの画面を90度回す */
body.forceLand{position:fixed;top:0;left:0;overflow:hidden;transform-origin:0 0}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.big{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;letter-spacing:.02em}
.fude{font-family:"Yuji Syuku","Dela Gothic One",serif}

/* ===== 試合中の表示（HUD） ===== */
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
#score .sd{display:flex;align-items:center;gap:8px;padding:5px 10px;min-width:150px}
#score .sd.r{flex-direction:row-reverse}
#score .tag{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
#score .aka .tag{background:var(--aka)} #score .shiro .tag{background:var(--shiro);color:#222}
#score .nm{font-size:12px;font-weight:800;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
#score .nm small{display:block;font-size:9px;color:var(--sub);font-weight:500}
.marks{display:flex;gap:3px;min-width:52px}
.sd.r .marks{justify-content:flex-start;flex-direction:row-reverse}
.marks i{font-style:normal;width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:"Yuji Syuku",serif;font-size:14px;font-weight:800}
.marks i.f{border:0;width:auto;font-size:13px;color:var(--gold)}
.aka .marks i{color:#ff8a7d} .shiro .marks i{color:#fff}
#score .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;background:rgba(0,0,0,.35);min-width:70px}
#score .clk{font-size:20px;line-height:1}
#score .hf{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap}
.kibar{position:absolute;top:calc(60px + env(safe-area-inset-top));width:min(170px,26%);height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.kibar b{display:block;height:100%;width:50%;transition:width .12s linear}
.kibar.l{right:calc(50% + 8px)} .kibar.l b{background:linear-gradient(90deg,#ff6a3a,#ffd36b);margin-left:auto}
.kibar.r{left:calc(50% + 8px)} .kibar.r b{background:linear-gradient(90deg,#fff,#9fd8ff)}
.kibar.full{box-shadow:0 0 12px #ffd36b}
#kilbl{position:absolute;top:calc(57px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:10px;color:var(--sub);text-shadow:0 1px 2px #000}
#teamline{position:absolute;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:4px;font-size:10px}
#teamline span{padding:2px 6px;border-radius:8px;background:rgba(0,0,0,.45);border:1px solid var(--line);white-space:nowrap}
#teamline span.now{border-color:var(--gold);color:var(--gold)}
#teamline span.w{background:rgba(232,71,58,.6)} #teamline span.l{background:rgba(255,255,255,.75);color:#111} #teamline span.d{background:rgba(120,120,140,.5)}
#flags2d{position:absolute;top:calc(98px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:10px}
#flags2d i{width:22px;height:16px;border-radius:2px;display:block;opacity:0;transition:opacity .15s,transform .2s;transform:translateY(8px);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#flags2d i.on{opacity:1;transform:none}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none}
#banner .b1{display:inline-block;font-size:clamp(46px,11vw,110px);color:#fff;font-family:"Yuji Syuku",serif;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 34px rgba(255,190,90,.8)}
#banner .b1.aka{text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 34px rgba(255,80,60,.95)}
#banner .b2{font-size:clamp(14px,3.4vw,22px);font-weight:800;margin-top:6px;text-shadow:0 2px 6px #000}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#tip{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:800;max-width:90%;text-align:center}
#floats{position:absolute;inset:0;overflow:hidden}
.fl{position:absolute;font-family:"Dela Gothic One",sans-serif;font-size:22px;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 12px currentColor;animation:flup 1.1s ease-out forwards;white-space:nowrap}
@keyframes flup{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-56px}}
#suki{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid #ffe36b;box-shadow:0 0 18px #ffd000,inset 0 0 12px #ffd000;display:none}
#suki b{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:15px;font-weight:800;color:#ffe36b;white-space:nowrap;text-shadow:0 2px 3px #000}
#suki.go{animation:sk .5s ease-in-out infinite}
@keyframes sk{50%{transform:scale(.82)}}
#zan{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-family:"Yuji Syuku",serif;font-size:32px;color:#ffe36b;text-shadow:0 3px 0 #000,0 0 20px #ffb000;white-space:nowrap}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(255,40,60,0);transition:box-shadow .2s}

/* ===== さわる操作（スティックと打つボタン） ===== */
#ctrl{position:fixed;inset:0;pointer-events:none}
#stickzone{position:absolute;left:0;bottom:0;width:46%;height:66%;pointer-events:auto}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);display:none}
#stick b{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 12px rgba(255,255,255,.4)}
#stickhint{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));font-size:11px;color:var(--sub);opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
#pad{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:236px;height:206px;pointer-events:auto}
.wz{position:absolute;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#4a6fc0,#22396e 62%,#141f3e);box-shadow:0 5px 0 #0b1430,0 8px 22px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.22);transition:transform .05s}
.wz .k{font-family:"Yuji Syuku",serif;font-size:27px;line-height:1}
.wz .s{font-size:9px;opacity:.8;margin-top:2px}
.wz.on{transform:translateY(3px) scale(.95);box-shadow:0 2px 0 #0b1430,0 0 26px rgba(255,220,120,.85)}
.wz.hint{border-color:#ffe36b;box-shadow:0 5px 0 #0b1430,0 0 22px #ffd000;animation:sk .5s ease-in-out infinite}
#w-men{left:80px;top:0} #w-kote{right:0;top:64px} #w-do{left:80px;top:128px} #w-tsuki{left:0;top:68px;width:66px;height:66px} #w-tsuki .k{font-size:22px}
#w-kiai{position:absolute;right:calc(258px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;pointer-events:auto;font-weight:800;
  background:radial-gradient(circle at 35% 30%,#ffb066,#e8473a 60%,#8a1e14);box-shadow:0 5px 0 #5a120c,0 8px 22px rgba(232,71,58,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25)}
#w-kiai .k{font-family:"Yuji Syuku",serif;font-size:22px;line-height:1}#w-kiai .s{font-size:9px}
#w-kiai.cool{filter:grayscale(.7) brightness(.7)}
#keyhelp{position:absolute;left:12px;bottom:8px;font-size:11px;color:var(--sub);opacity:.8;text-shadow:0 1px 2px #000}
#pausebtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);pointer-events:auto;font-size:18px}
#autobtn{position:absolute;top:calc(56px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));padding:6px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);pointer-events:auto;font-size:11px;font-weight:800}
#autobtn.on{background:linear-gradient(135deg,#f2c45a,#e8473a);color:#1a0c00}

/* ===== メニュー画面 ===== */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y}
#panel{justify-content:flex-start}
#panel .card{margin:auto 0}
.scr.dim{background:radial-gradient(ellipse at center,rgba(12,15,28,.55),rgba(12,15,28,.93))}
#title{justify-content:flex-start}
#title .inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;width:100%}
#title h1{margin:0;font-family:"Yuji Syuku",serif;font-size:clamp(46px,12vw,104px);line-height:1;text-align:center;font-weight:400;
  background:linear-gradient(180deg,#fff 15%,#f6dfa0 55%,#e8a23a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(232,71,58,.55))}
#title h1 small{display:block;font-size:.42em;letter-spacing:.2em}
#title .sub{font-size:13px;color:var(--sub);margin:6px 0 14px;letter-spacing:.35em}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;width:min(560px,100%)}
.mbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 11px;text-align:left;display:flex;gap:9px;align-items:center;font-weight:800;font-size:14px;backdrop-filter:blur(6px);transition:transform .08s,border-color .2s}
.mbtn:active{transform:scale(.97)}
.mbtn:hover{border-color:rgba(242,196,90,.6)}
.mbtn .ic{font-size:22px}
.mbtn small{display:block;font-size:10px;color:var(--sub);font-weight:500;margin-top:2px}
.mbtn.main{grid-column:1/-1;background:linear-gradient(135deg,#e8473a,#a8261c);border:0;font-size:20px;justify-content:center;box-shadow:0 6px 0 #5a120c,0 10px 30px rgba(232,71,58,.35)}
.mbtn.main small{color:#ffe0d8}
.mbtn.main2{background:linear-gradient(135deg,#2f5bb0,#1b356e);border:0;box-shadow:0 5px 0 #0c1a3a}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#land-btn,#home-btn{padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--txt);text-decoration:none}
#land-note{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:13px;max-width:92%;z-index:60;text-align:center}
@media (max-width:620px){ .menu{grid-template-columns:1fr 1fr} }
/* ===== 選手カード・ガチャ ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:36vh;overflow:auto;padding:2px}
.pgrid.line{max-height:none;grid-template-columns:repeat(5,1fr);gap:6px}
.pgrid.res{max-height:none;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.pc{position:relative;border-radius:12px;padding:6px 5px 7px;text-align:center;background:linear-gradient(160deg,#2a3150,#141a2e);border:2px solid var(--rc,#9aa3b5);cursor:pointer;min-width:0;transition:transform .1s}
.pc:active{transform:scale(.96)}
.pc.rN{--rc:#9aa3b5}.pc.rR{--rc:#3aa0ff;background:linear-gradient(160deg,#1f4a86,#121c33)}.pc.rSR{--rc:#b45cff;background:linear-gradient(160deg,#5a2a8c,#1a1233)}
.pc.rSSR{--rc:#ffc531;background:linear-gradient(160deg,#a8761a,#3a2406 60%,#1a1206);box-shadow:0 0 14px rgba(255,197,49,.45)}
.pc.rSSR::after{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.pc .pr{font-size:10px;font-weight:800;color:var(--rc)}.pc .po{font-family:"Dela Gothic One";font-size:20px;line-height:1.1}.pc .pf{font-size:13px;font-family:"Yuji Syuku",serif}
.pc .pn{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .pl{font-size:9px;color:var(--sub)}
.pc .pos{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:#e8473a;border-radius:8px;padding:1px 6px;white-space:nowrap}
.pc.nown{filter:grayscale(.85);opacity:.55}.pc.sel{outline:3px solid #fff;transform:translateY(-3px)}.pc.inl{opacity:.45}
.pc.big{width:100px;flex:none}.pgrid.line .pc{margin-top:8px}.pgrid.line .pc .pn{font-size:9px}.pgrid.line .pc .po{font-size:16px}
.gbox{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0}
.gorb{width:90px;height:90px;border-radius:50%;--oc:#f2c45a;background:radial-gradient(circle at 35% 30%,#fff,var(--oc) 45%,#2a1a00 100%);box-shadow:0 0 30px var(--oc);animation:orb 1.6s ease-in-out infinite}
.gorb.big{width:150px;height:150px;margin:30px auto 0;cursor:pointer;animation:orb .7s ease-in-out infinite}
@keyframes orb{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(4deg)}}
.flip{position:relative;opacity:0;animation:flipin .45s forwards}
@keyframes flipin{0%{opacity:0;transform:rotateY(90deg) scale(.7)}100%{opacity:1;transform:none}}
.ptag{position:absolute;top:-6px;right:-4px;font-size:10px;font-weight:800;background:#e8473a;border-radius:8px;padding:1px 5px}
#panel.ssrflash{animation:ssrf .9s}
@keyframes ssrf{0%{background:rgba(255,220,120,.95)}100%{}}
.rankpill{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px}
.rankpill .rk{font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(560px,100%);backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.card h2{margin:0 0 12px;font-family:"Dela Gothic One";font-size:23px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;font-size:14px}
.chip.on{background:linear-gradient(135deg,#e8473a,#a8261c);border-color:transparent}
.btn{padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#e8473a,#a8261c);font-weight:800;font-size:16px;box-shadow:0 4px 0 #5a120c}
.btn.gray{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--line)}
.btn:active{transform:translateY(2px)}
.lbl{font-size:12px;color:var(--sub);margin-top:10px}
.list{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05)}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach .ic{font-size:26px}
.ach b{display:block;font-size:14px}.ach span{font-size:11px;color:var(--sub)}
.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.bracket .col{display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.bracket .m{background:rgba(255,255,255,.06);border-radius:10px;padding:6px 8px;border:1px solid var(--line)}
.bracket .m div{display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.bracket .w{color:var(--gold);font-weight:800}
.bracket .me{color:#9fd8ff}
input[type=text]{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;width:100%;user-select:text;-webkit-user-select:text}
.sw{display:inline-block;width:34px;height:34px;border-radius:10px;border:2px solid transparent}
.sw.on{border-color:#fff}
#tut{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top));transform:translateX(-50%);width:min(500px,92%);background:rgba(10,14,30,.92);border:1px solid rgba(242,196,90,.55);border-radius:16px;padding:10px 16px;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}

#loading{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--sub)}

.bouts .b .s{text-align:center;font-family:"Yuji Syuku",serif;font-size:15px;white-space:nowrap}

function seeded(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
function hashStr(t) { let h = 2166136261; for (const ch of t) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function makeKenshi(R, power, extra) {

}

}

// =====================================================================
//  音（Web Audio で全部その場で作る。音のファイルは使わない）
//  竹刀の「パーン」・踏みこみの「ドン」・気合いの声（メーン！コテー！ドー！ツキー！ヤー！）・拍手・太鼓・BGM・実況

const SND = (() => {
  let ac = null, master = null, se = null, bgmBus = null, crowdG = null, crowdF = null, noiseBuf = null, white = null, bgmNext = 0, bgmStep = 0;
  const MUTE = URLQ.has('mute') || URLQ.has('auto');   // テスト用：?mute（と ?auto）では音をいっさい出さない
  const on = () => !MUTE && SAVE.opt.sound && !(typeof G !== 'undefined' && G.mute);
  function init() {
    if (MUTE) return;   // 消音モードでは音の装置を作らない
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { build(new (window.AudioContext || window.webkitAudioContext)()); } catch (e) { ac = null; return; }
    try { if (window.speechSynthesis && SAVE.opt.comm !== false) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { }   // iPhone はさわったときに一度しゃべらせる
  }
  // 音の通り道を作る（テストでは、音の出ない OfflineAudioContext を渡して数字だけ確かめられる）
  function build(ctx) {
    ac = ctx;
    master = ac.createGain(); master.gain.value = 0.8;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;   // 大きすぎる音をおさえる（音われ防止）
    master.connect(comp); comp.connect(ac.destination);

    bgmBus = ac.createGain(); bgmBus.gain.value = 0.45; bgmBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); let b = 0; for (let i = 0; i < d.length; i++) { b = 0.97 * b + 0.03 * (Math.random() * 2 - 1); d[i] = b * 6 + (Math.random() * 2 - 1) * 0.15; }
    white = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const w = white.getChannelData(0); for (let i = 0; i < w.length; i++) w[i] = Math.random() * 2 - 1;
    // 武道館のひびき（木の床と高い天井：2.4秒くらい）
    const n = Math.floor(ac.sampleRate * 2.4), ir = ac.createBuffer(2, n, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const q = ir.getChannelData(ch); for (let i = 0; i < n; i++) q[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.8) * (i < 300 ? i / 300 : 1); }
    const rev = ac.createConvolver(), send = ac.createGain(), hp = ac.createBiquadFilter(); rev.buffer = ir; send.gain.value = 0.3; hp.type = 'highpass'; hp.frequency.value = 180;
    se.connect(send); send.connect(hp); hp.connect(rev); rev.connect(master);
    // 観客のざわざわ
    const src = ac.createBufferSource(); src.buffer = white; src.loop = true;
    crowdF = ac.createBiquadFilter(); crowdF.type = 'bandpass'; crowdF.frequency.value = 520; crowdF.Q.value = 1.1;
    crowdG = ac.createGain(); crowdG.gain.value = 0;
    src.connect(crowdF); crowdF.connect(crowdG); crowdG.connect(se); src.start();
  }
  const T = () => ac ? ac.currentTime : 0;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function env(g, t, a, peak, dcy) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy); }
  function tone(type, f0, f1, dur, vol, t = T(), bus) {

    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.004, vol, dur); o.connect(g); g.connect(bus || se); o.start(t); o.stop(t + dur + 0.05);

// ----- 試合（1試合＝三本勝負）を作る -----

// ----- 入場：礼 → 開始線へ3歩 → そんきょ → 「始め！」 -----

    else if (t < 2.4) { F.st = 'walk'; F.x = s * lerp(START_X + 1.6, START_X, clamp((t - 1.0) / 1.3, 0, 1)); }
    else if (t < 3.5) { F.st = M.round === 0 ? 'sonkyo' : 'kamae'; F.x = s * START_X; }

// 一本・反則のあと：開始線にもどる

// 反則（場外）：2回で相手に1本

// ----- 気（0〜100） -----
function addKi(F, v) { F.ki = clamp(F.ki + v, 0, 100); }

  const O = other(F); O.pressed = 0.8;   // 気合いで相手がひるむ（すきが出やすい）
  fx(F.M, () => { SND.shout('ya', F.side ? 175 : 205, 0.45); floatText(F, '気合', '#ffcf6b'); });

// ----- 剣士の1コマ -----

    if (F.moveF > 0.2 && d < 3.0) addKi(F, 7 * dt);
    if (F.moveF < -0.3) addKi(F, -7 * dt);
    if (d > 2.0 && d < 2.8) addKi(F, (1.5 + (F.d.kihaku - 60) / 20) * dt);

  }

  if (F.pressed) F.pressed = Math.max(0, F.pressed - dt);

    case 'kamae': {
      moveFighter(F, dt, F.moveF, F.moveL); faceTo(F, O, dt, 7);

      if (want) { F.buf = null; startStrike(F, want.tgt); }

    }

      if (F.buf && M.t - F.buf.t < 0.3 && F.stT > 0.05) { const w = F.buf; F.buf = null; startStrike(F, w.tgt); break; }

// ----- すき（構えのくずれ） -----

    if (Math.random() < Math.max(0.02, rate) * dt) {

//  メインループ（1秒に60コマで計算して、画面にかく）
// =====================================================================
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  const M = G.M;
  if (M && !G.paused) {
    acc += dt * (G.fast || 1);
    let n = 0;
    while (acc >= DT && n < 12) { readInput(M); stepBout(M, DT); stepRefs(M, DT); if (M.tutStep) M.tutStep(); acc -= DT; n++; if (G.M !== M) break; }
    if (n >= 12) acc = 0;
  }
  const M2 = G.M;
  if (M2 && M2.F && M2.F[0].B) {
    for (const F of M2.F) { F.B.root.position.set(F.x, 0, F.z); F.B.root.rotation.y = F.yaw; F.B.root.updateMatrixWorld(true); }
    for (const F of M2.F) poseFighter(F, dt);
    for (const r of M2.refs) poseRef(r, M2, dt);
    if (!M2.demo) updateHUD(M2);
  }
  updateCamera(dt);
  sparks.update(dt);
  CROWD.uTime.value += dt; confetti.update(dt);
  SND.tick();
  if (VW > 0 && VH > 0) renderer.render(scene, camera);
}

const POOL = (() => {
  const R = seeded(hashStr('kendo-gacha-pool-v1')), out = [], used = new Set();
  const titles = { SSR: ['疾風の', '不動の', '神速の', '鬼小手の', '天才', '無敗の'], SR: ['出ばなの', '鉄壁の', '居合の', '必殺', '冷静な', '熱血', '技あり', '豪快な', '電光', '粘りの'] };
  const counts = { SSR: 6, SR: 10, R: 14, N: 18 };
  const tokus = ['men', 'kote', 'do', 'tsuki', 'debana', 'kaeshi', 'hiki'];
  let k = 0;
  for (const r of ['SSR', 'SR', 'R', 'N']) for (let i = 0; i < counts[r]; i++) {

    const mei = MEI[Math.floor(R() * MEI.length)], b = RAR[r].base, J = () => Math.round((R() - 0.5) * 8);

    g.font = '700 28px "M PLUS Rounded 1c", sans-serif'; g.fillStyle = '#b4b0c8'; g.fillText(o.left.d.school, 300, 780); g.fillText(o.right.d.school, 780, 780);
  }
  if (o.big) { g.font = '400 150px "Yuji Syuku", serif'; g.fillStyle = '#fff'; g.fillText(o.big, 540, 610); g.font = '800 38px "M PLUS Rounded 1c", sans-serif'; g.fillStyle = '#b4b0c8'; g.fillText(o.bigSub || '', 540, 730); }
  g.fillStyle = 'rgba(0,0,0,.35)'; roundRect(g, 120, 840, 840, 330, 30); g.fill();

  const rk = rankOf(SAVE.rp), d = new Date();
  g.font = '700 30px "M PLUS Rounded 1c", sans-serif'; g.fillStyle = '#b4b0c8'; g.fillText(`${rk.ic} ${rk.n}　${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}　#いっぽん剣道`, 540, 1270);

}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// =====================================================================
//  団体戦（5人）・大会
// =====================================================================
function startTeam(cfg) {
  SND.init(); G.mute = false; G.fast = 1;
  const power = DIFF[cfg.diff].power;
  G.TM = { cfg, my: myLineup(), their: schoolRoster(cfg.school, power), res: [], i: 0, daihyo: false };
  teamPanel();
}
const teamScore = TM => { let a = 0, b = 0, ia = 0, ib = 0; for (const r of TM.res) { if (r.w === 0) a++; if (r.w === 1) b++; ia += r.ma.length; ib += r.mb.length; } return { a, b, ia, ib }; };
function teamTable(TM) {
  const rows = POS5.map((p, i) => {
    const r = TM.res[i], me = pdata(TM.my[i]), op = TM.their[i];
    return `<div class="b ${i === TM.i && !r ? 'now' : ''}"><span class="p">${p}</span><span class="${r && r.w === 0 ? 'wn' : ''}">${me.sei}</span><span class="s">${r ? `${r.ma.join('') || '－'} ${r.w === 0 ? '○' : r.w === 1 ? '●' : '△'} ${r.mb.join('') || '－'}` : '…'}</span><span class="${r && r.w === 1 ? 'wn' : ''}" style="text-align:right">${op.sei}</span></div>`;
  });
  if (TM.daihyoRes) { const r = TM.daihyoRes; rows.push(`<div class="b"><span class="p">代表</span><span class="${r.w === 0 ? 'wn' : ''}">${r.a}</span><span class="s">${r.ma.join('') || '－'} ${r.w === 0 ? '○' : '●'} ${r.mb.join('') || '－'}</span><span class="${r.w === 1 ? 'wn' : ''}" style="text-align:right">${r.b}</span></div>`); }
  return `<div class="bouts">${rows.join('')}</div>`;
}
function teamPanel() {
  const TM = G.TM, s = teamScore(TM), sc = TM.cfg.school, done = TM.res.length >= 5 && (s.a !== s.b || s.ia !== s.ib || TM.daihyoRes);
  if (done) return teamEnd();
  const needDaihyo = TM.res.length >= 5;
  openPanel(`<h2>🎌 団体戦 ${TM.cfg.kind === 'cup' ? '（大会）' : ''}</h2>
    <div style="text-align:center;font-weight:800">${EMBLEMS[SAVE.team.emb] || ''} ${SAVE.team.name}　<span style="font-family:'Yuji Syuku';font-size:22px">${s.a} − ${s.b}</span>　${sc.name}</div>
    <div style="text-align:center;color:var(--sub);font-size:12px">一本の数 ${s.ia} − ${s.ib}・CPU ${DIFF[TM.cfg.diff].n}</div>
    ${teamTable(TM)}
    ${needDaihyo ? '<div style="text-align:center;font-weight:800;color:var(--gold)">勝ち数も一本の数も同じ！ 代表戦（大将どうし・先に一本）</div>' : ''}
    <div class="row" style="justify-content:center"><button class="btn" id="go">${needDaihyo ? '代表戦へ' : POS5[TM.i] + '戦へ'}</button><button class="btn gray" id="auto">🤖 おまかせで戦う</button><button class="btn gray" id="quit">やめる</button></div>`);
  $('go').onclick = () => teamBout(false);
  $('auto').onclick = () => teamBout(true);
  $('quit').onclick = () => { if (!confirm('団体戦をやめますか？')) return; disposeBout(); showTitle(); };
}
function teamBout(autoMe) {
  const TM = G.TM, daihyo = TM.res.length >= 5, i = daihyo ? 4 : TM.i;
  G.fast = autoMe ? 3 : 1;
  const M = newBout({ kind: 'team', diff: TM.cfg.diff, myDiff: Math.max(1, TM.cfg.diff), a: kenshiOf(TM.my[i]), b: TM.their[i], allowDraw: !daihyo, autoMe, label: daihyo ? '代表戦' : POS5[i] + '戦', onEnd: M => teamBoutEnd(M, daihyo) });
  if (daihyo) { M.encho = true; }
  if (autoMe) M.quickIntro = true;
  showGame(M);
  banner(daihyo ? '代表戦' : POS5[i] + '戦', `${M.F[0].d.name}　対　${M.F[1].d.name}`, 1800);
  SND.drum(2, 0.45); SND.crowd(0.5);
}
function teamBoutEnd(M, daihyo) {
  const TM = G.TM; if (!TM) return;
  boutStats(M); unlock('first');
  const r = { w: M.winner, ma: M.F[0].marks.slice(), mb: M.F[1].marks.slice(), a: M.F[0].d.sei, b: M.F[1].d.sei };
  if (daihyo) TM.daihyoRes = r; else { TM.res.push(r); TM.i++; }
  if (M.winner === 0) addCoins(20 + M.F[0].stats.ippon * 10);
  save(); G.fast = 1;
  disposeBout(); $('hud').classList.add('hidden'); $('ctrl').classList.add('hidden');
  teamPanel();
}
function teamEnd() {
  const TM = G.TM, s = teamScore(TM), win = TM.daihyoRes ? TM.daihyoRes.w === 0 : s.a !== s.b ? s.a > s.b : s.ia > s.ib;
  SAVE.games++; if (win) { SAVE.wins++; SAVE.totals.teamWins++; unlock('team'); if (s.a === 5) unlock('sweep'); if (TM.cfg.diff >= 2) unlock('hard'); }
  const mul = [0.8, 1, 1.25, 1.5][TM.cfg.diff] || 1;
  let coins = addCoins(Math.round((win ? 150 : 60) * mul)), extra = '';
  if (TM.cfg.kind === 'cup' && SAVE.cup) {
    const C = SAVE.cup, oid = TM.cfg.school.id;
    let list = C.ids; for (let k = 0; k < C.round; k++) list = C.res[k].map(m => m.w);
    const res = [];
    for (let i = 0; i < list.length; i += 2) {
      const a = list[i], b = list[i + 1];
      if (a === 'me' || b === 'me') res.push({ a, b, sa: a === 'me' ? s.a : s.b, sb: a === 'me' ? s.b : s.a, w: win ? 'me' : oid });
      else { const x = Math.floor(rand(0, 6)), y = 5 - x - (Math.random() < 0.3 ? 1 : 0); res.push({ a, b, sa: x, sb: Math.max(0, y), w: x > y ? a : x < y ? b : pick([a, b]) }); }
    }
    C.res[C.round] = res;
    if (!win) { C.alive = false; extra = '<div style="text-align:center;font-weight:800">😢 大会はここで敗退…</div>'; }
    else { C.round++; if (C.round >= 3) { SAVE.cups++; unlock('cup'); coins += addCoins(300); extra = '<div style="text-align:center;font-weight:800;font-size:18px">🏆 大会優勝！</div>'; confetti.burst(0, 0); } else { coins += addCoins(50); extra = `<div style="text-align:center;font-weight:800">次は ${['一回戦', '準決勝', '決勝'][C.round]}！</div>`; } }
  }
  save();
  if (win) { SND.fanfare(); SND.applause(1.3); }
  const lines = POS5.map((p, i) => { const r = TM.res[i]; return `${p} ${pdata(TM.my[i]).sei} ${r.ma.join('') || '－'} ${r.w === 0 ? '○' : r.w === 1 ? '●' : '△'} ${r.mb.join('') || '－'} ${TM.their[i].sei}`; });
  const img = makeCard({ title: win ? '勝ち' : '負け', win, big: `${s.a} − ${s.b}`, bigSub: `${SAVE.team.name} 対 ${TM.cfg.school.name}`, sub: `団体戦・CPU ${DIFF[TM.cfg.diff].n}`, lines });
  openPanel(`<h2 style="text-align:center">${win ? '🎉 団体戦 勝利！' : '😣 団体戦 負け…'}</h2>
    <div style="text-align:center;font-family:'Yuji Syuku';font-size:38px">${s.a} − ${s.b}</div>
    <div style="text-align:center;color:var(--sub);font-size:13px">${SAVE.team.name} vs ${TM.cfg.school.name}（一本 ${s.ia} − ${s.ib}）</div>
    ${teamTable(TM)}${extra}
    <div style="text-align:center;font-weight:800;color:#f2c45a">🪙 +${coins} コイン（いま ${SAVE.coins}）</div>
    <img id="resimg" src="${img}" alt="結果カード">${shareRow()}
    <div class="row"><button class="btn" id="again">${TM.cfg.kind === 'cup' ? '大会へ' : 'もう1回'}</button><button class="btn gray" id="menu">メニュー</button></div>`);
  bindShare(img, `いっぽん！剣道🎌 団体戦 ${SAVE.team.name} ${s.a}-${s.b} ${TM.cfg.school.name}（${DIFF[TM.cfg.diff].n}）${win ? '勝利！' : ''} #いっぽん剣道`);
  $('again').onclick = () => { if (TM.cfg.kind === 'cup') MENU.cup(); else startTeam(TM.cfg); };
  $('menu').onclick = showTitle;
}
// 試合中の「おまかせ」：CPU に代わりに戦ってもらう（もう一度おすと自分にもどる）
$('autobtn').addEventListener('click', () => {
  const M = G.M; if (!M || M.demo) return;
  M.cfg.autoMe = !M.cfg.autoMe; const F = M.F[0];
  F.cpu = M.cfg.autoMe; M.human = M.cfg.autoMe ? -1 : 0; G.fast = M.cfg.autoMe ? 3 : 1;

function togglePause() {

      <div class="lbl">${IS_TOUCH ? '左：ドラッグで動く（相手の方へたおすと前に出る）／右：面・小手・胴・突き／気合ボタン（打ったあとすぐおすと残心）' : '矢印・WASD：動く　J 面　K 小手　L 胴　I 突き　スペース 気合'}</div>`);

$('pausebtn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.M && !G.M.demo && G.M.human >= 0 && !G.paused && G.mode === 'game') togglePause(); });   // 人が操作している試合だけ、自動で一時停止

// =====================================================================
//  けいこ（チュートリアル）
// =====================================================================
function startTutorial() {
  SND.init(); G.mute = false; G.TM = null; G.fast = 1;
  const op = Object.assign(makeKenshi(seeded(9), 60), { school: '町の道場', doC: 0x16181e, himo: 0xffffff, sei: '先生', name: '先生' });
  const M = newBout({ kind: 'tut', diff: 0, a: kenshiOf(myLineup()[4]), b: op, label: 'けいこ', mins: 99, venue: 0 });
  showGame(M);
  let step = 0;
  const STEPS = [
    ['間合い', IS_TOUCH ? '左がわをドラッグ。先生の方へたおすと前に出る（すり足）。一足一刀の間合い（竹刀の先が少し重なるくらい）まで近づこう' : '矢印キーで先生の方へ。竹刀の先が少し重なるくらいまで近づこう'],
    ['面', '先生の剣先が下がって、頭に黄色い輪が出たら「面」のすき！ すぐ「面」ボタン。打ったら「気合」ボタン（残心）も！'],
    ['小手', '先生の手もとが上がったら「小手」のすき！ 小手ボタン（キーボードは K）'],
    ['胴', '先生が手を大きく上げたら「胴」のすき！ 胴ボタン（キーボードは L）'],
    ['出ばな小手', 'こんどは先生が打ってくる。竹刀をふりかぶった瞬間に「小手」！ これが出ばな小手'],
    ['卒業', '🎉 けいこ卒業！ これで試合ができるよ。すきを見て打つ・前に出てせめる・打ったら残心！'],
  ];
  const tgtOf = ['', 'men', 'kote', 'do', '', ''];
  const show = () => { $('tut').classList.remove('hidden'); $('tutS').textContent = `けいこ ${Math.min(step + 1, 5)} / 5：${STEPS[step][0]}`; $('tutT').textContent = STEPS[step][1]; };
  show();
  const T = M.F[1];
  M.tutTgt = null;
  M.tutSuki = (F, rate) => F === T ? (step >= 1 && step <= 3 ? 0.9 : 0) : 0;   // 先生だけ、ねらいのすきを出す
  M.tutBlock = (A, D) => D === T ? (step >= 1 && step <= 3 && !(T.suki && T.suki.tgt === tgtOf[step]) ? 0.85 : 0) : 0.9;
  M.tutJudge = (A, z, q) => A === T ? 0 : q + 0.25;
  T.diff = Object.assign({}, DIFF[0], { aggro: 0, read: 0, debana: 0, kaeshi: 0 });
  let attackT = 0;
  M.tutStep = () => {
    if (M.phase === 'end') return;
    M.tutTgt = tgtOf[step] || null;
    const d = distF(M.F[0], T);
    if (step === 0 && M.phase === 'fight' && d < 2.6) { step = 1; show(); SND.point(); }
    // 先生は動かない（出ばなの練習だけ、ゆっくり打ってくる）
    if (M.phase === 'fight' && step === 4) {
      attackT += DT;
      if (T.st === 'kamae' && attackT > 2.6 && d < 2.9) { attackT = 0; startStrike(T, 'men'); if (T.strike) { T.strike.wind *= 3.5; T.strike.travel = clamp(d - 1.45, 0, 1); } }
    }
  };
  // 一本をとったら次へ（けいこでは試合は終わらない）
  M.onIppon = e => {
    if (e.by !== 0) return;
    if ((step >= 1 && step <= 3 && e.tgt === tgtOf[step]) || (step === 4 && e.debana)) {
      step++; show(); SND.point();
      if (step >= 5) { unlock('tut'); SAVE.tutDone = true; save(); setTimeout(() => { if (G.M === M) { disposeBout(); showTitle(); } }, 4000); }
    } else if (step === 4) tip('先生がふりかぶった瞬間に小手！', 2000);
  };
  T.cpu = true;
}

// =====================================================================
//  横画面で固定（FUTSAL STRIKE と同じ。SAVE.opt.lockLand に保存）

function portraitHint() { if (!FORCE && innerHeight > innerWidth * 1.1 && IS_TOUCH) tipToast('📱 スマホを横にすると大きく遊べるよ（タイトルの「🔒 横画面で固定」もあるよ）'); }
function tryLand() {
  if (!SAVE.opt.lockLand) return;
  const el = document.documentElement;
  if (IS_TOUCH && !document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => lockLandscape(true)).catch(() => onResize());
  else lockLandscape(true);
}
async function lockLandscape(quiet) {
  SAVE.opt.lockLand = true; save();
  let native = false;
  try {
    const el = document.documentElement;
    if (IS_TOUCH && !document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
    if (IS_TOUCH && screen.orientation && screen.orientation.lock) { await screen.orientation.lock('landscape'); native = true; }
  } catch (e) { }
  onResize(); landLabel();
  if (!quiet) landNote(native ? '🔒 横画面で固定したよ（Android）' : '🔒 固定したよ。<b>画面の回転ロックをオン</b>にして、スマホを横にして遊んでね');
  return native;
}
function unlockLandscape() {
  SAVE.opt.lockLand = false; save();
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { }
  onResize(); landLabel(); landNote('🔓 横画面の固定をやめたよ');
}
function landLabel() { const b = $('land-btn'); if (b) b.textContent = SAVE.opt.lockLand ? '🔒 横画面で固定：オン' : '🔓 横画面で固定：オフ'; }
function landNote(html) { const n = $('land-note'); if (!n) return; n.innerHTML = html; n.style.display = 'block'; clearTimeout(landNote.t); landNote.t = setTimeout(() => n.style.display = 'none', 6000); }
$('land-btn').onclick = () => { SND.init(); SND.click(); if (SAVE.opt.lockLand) unlockLandscape(); else lockLandscape(false); };
landLabel();

window.G = G;

// テスト用：CPU どうしの試合を一気に計算して、結果を返す（画面は使わない）。例：G.sim(1, 1, 20)
G.sim = (diffA = 1, diffB = 1, n = 10, mins = 2) => {
  G.simming = true;
  const out = { win: [0, 0, 0], ippon: {}, names: {}, blocks: 0, strikes: 0, hits: 0, judged: 0, flags1: 0, enchoes: 0, fouls: 0, avgTime: 0 };
  for (let k = 0; k < n; k++) {
    const a = schoolRoster(SCHOOLS[0], DIFF[diffA].power)[k % 5], b = schoolRoster(SCHOOLS[1], DIFF[diffB].power)[(k + 2) % 5];
    let res = null;
    const M = newBout({ kind: 'quick', sim: true, diff: diffB, myDiff: diffA, a, b, mins, onEnd: m => res = m });
    let steps = 0; while (!res && steps++ < 60 * 60 * 20) { stepBout(M, DT); stepRefs(M, DT); }
    out.win[M.winner < 0 ? 2 : M.winner]++;
    for (const e of M.events) {
      if (e.type === 'ippon') { out.ippon[e.tgt] = (out.ippon[e.tgt] || 0) + 1; out.names[e.name] = (out.names[e.name] || 0) + 1; }
      if (e.type === 'block') out.blocks++; if (e.type === 'hit') out.hits++; if (e.type === 'judge') { out.judged++; if (e.flags === 1) out.flags1++; } if (e.type === 'foul') out.fouls++;
    }
    out.strikes += M.F[0].stats.strikes + M.F[1].stats.strikes; if (M.encho) out.enchoes++; out.avgTime += M.t / n;
  }
  G.simming = false; return out;
};
