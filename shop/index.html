<script>
/* =========================================================
   どんぶりチェーン
   小さなラーメン屋 1店から、10店のチェーン店をめざす経営ゲーム。
   ・「お店」の画面：店の中のようすが見える（お客さん・店員・行列）
   ・「社長室」の画面：秘書や店長が相談に来る → 選ぶ。電話=銀行、モニター=記録…
   ・「町」の画面：地図で場所を見て、出店する
   ・1日ずつ「営業」で進む（営業のようすは本当の時間でアニメーション）
   ・お金がマイナスのまま3日たつと「倒産」
   ========================================================= */

/* ===== ここから「計算（ゲームのしくみ）」の部分。バランスはここで決まる ===== */
const SAVE_KEY = 'donburi-chain-save-v1';

/* ---------- 町のエリア（すべて架空の町） ----------
   traffic : 平日に前を通る人の数（1日）
   wk      : 土日の人通りの倍率
   fair    : このあたりの「ふつうの値段」（相場）
   sens    : 値段にどれだけうるさいか（大きいほど高いと来ない）
   rain    : 雨の日の人通りの倍率
   rivals  : 最初からあるライバル店の数
   rps     : 席1つあたりの家賃（1日）
   turn    : 席1つで1日に何人さばけるか（回転）           */
const AREAS = {
  jutaku:{name:'みどり台', kind:'住宅街',     emoji:'🏘', traffic:1500, wk:1.3, fair:750, sens:1.4, rain:0.8,  rivals:1, rps:600,  turn:8,  note:'土日に家族が来る。値段に少しきびしい'},
  shoten:{name:'さくら商店街', kind:'商店街', emoji:'🏮', traffic:2400, wk:1.4, fair:800, sens:1.1, rain:0.75, rivals:2, rps:850,  turn:9,  note:'ときどきお祭りで大にぎわい'},
  gakuen:{name:'学園通り', kind:'大学の前',   emoji:'🎓', traffic:3000, wk:0.5, fair:650, sens:2.0, rain:0.85, rivals:2, rps:700,  turn:10, note:'学生が多い。安くないと来ない。長い休みはガラガラ'},
  eki:   {name:'ひばり駅前', kind:'駅前',     emoji:'🚉', traffic:6000, wk:1.0, fair:850, sens:0.9, rain:0.95, rivals:4, rps:1100, turn:12, note:'人は多いがライバルも家賃も多い'},
  office:{name:'中央オフィス街', kind:'オフィス街', emoji:'🏢', traffic:5000, wk:0.3, fair:950, sens:0.7, rain:0.95, rivals:3, rps:1000, turn:12, note:'平日の昼はすごい。土日はほぼ人がいない'},
  road:  {name:'国道ぞい', kind:'郊外',       emoji:'🚗', traffic:2000, wk:1.6, fair:850, sens:1.0, rain:0.9,  rivals:1, rps:400,  turn:7,  note:'家賃が安くて広い。雪に弱い'},
  minato:{name:'みなと観光通り', kind:'観光地', emoji:'⛵', traffic:3300, wk:1.8, fair:1150, sens:0.5, rain:0.6, rivals:3, rps:1300, turn:10, note:'高くても売れる。夏と連休は大人気、冬はさびしい'},
  newtown:{name:'にしき台', kind:'ニュータウン', emoji:'🌱', traffic:1100, wk:1.3, fair:750, sens:1.2, rain:0.8, rivals:0, rps:380, turn:8,  note:'まだ人が少ないが、毎日少しずつ人がふえる'},
};

/* ---------- いろいろな数字（バランス） ---------- */
const WAGE = 9000;          // 店員1人の1日の給料
const MGR_WAGE = 15000;     // 店長の1日の給料
const PER_WORKER = 55;      // 1人が1日に作れる杯数
const FOOD = [150, 210, 300];            // 材料のランクごとの1杯の原価
const QNAME = ['ふつう', 'こだわり', '最高級'];
const ADS = [                            // 広告
  {name:'なし', cost:0, aw:0},
  {name:'チラシ', cost:3000, aw:0.6},
  {name:'SNS', cost:9000, aw:1.4},
  {name:'テレビCM', cost:30000, aw:3.2},
];
const WX = {sun:'☀️ 晴れ', cloud:'☁️ くもり', rain:'☔ 雨', snow:'⛄ 雪'};
const WDAY = ['月','火','水','木','金','土','日'];
const MAX_STORES = 10;
const CK_COST = 5000000, CK_DAILY = 12000;   // セントラルキッチン

/* ---------- 目標 ---------- */
const GOALS = [
  {id:'black7',  txt:'7日続けて黒字にする'},
  {id:'store2',  txt:'2店舗目を出す'},
  {id:'month100',txt:'30日間の利益の合計を100万円にする'},
  {id:'store3',  txt:'3店舗にする'},
  {id:'store5',  txt:'5店舗にする'},
  {id:'ck',      txt:'セントラルキッチンを作る'},
  {id:'store10', txt:'10店舗のチェーン店にする（クリア！）'},
  {id:'debtfree',txt:'10店舗で借金0円'},
];

let S = null;          // ゲームの状態（セーブするもの全部）
let tab = 'shop';      // いま見ているタブ
let openStore = null;  // 設定をひらいているお店
let busy = false;      // 営業アニメ中は操作できない

/* ===== 小さな道具 ===== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// お金の表示：1万円以上は「〇〇万円」
function yen(n){
  const s = n < 0 ? '-' : '';
  n = Math.abs(Math.round(n));
  if (n >= 10000) return s + (n / 10000).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '万円';
  return s + n.toLocaleString() + '円';
}
const sgn = n => (n >= 0 ? '+' : '') + yen(n);

/* ===== 日付（ゲームは4月1日から。1か月=30日・1年=12か月） ===== */
function dateOf(d){
  const year = Math.floor(d / 360) + 1;
  const month = (Math.floor(d / 30) % 12 + 3) % 12 + 1;   // 4月スタート
  const dom = d % 30 + 1;
  return {year, month, dom, wd: d % 7};
}
function dateStr(d){ const t = dateOf(d); return `${t.year}年目 ${t.month}月${t.dom}日（${WDAY[t.wd]}）`; }

/* ===== 季節・天気 ===== */
// 月ごとのラーメンの人気（夏はあつくて少し減る・冬はふえる）
const SEASON = {1:1.15, 2:1.1, 3:1.0, 4:1.0, 5:1.0, 6:0.95, 7:0.85, 8:0.82, 9:0.95, 10:1.0, 11:1.05, 12:1.1};
function rollWeather(d){
  const m = dateOf(d).month;
  const rainP = m === 6 ? 0.45 : m === 9 ? 0.33 : 0.2;
  const snowP = (m === 12 || m === 1 || m === 2) ? 0.12 : 0;
  const r = Math.random();
  if (r < snowP) return 'snow';
  if (r < snowP + rainP) return 'rain';
  if (r < snowP + rainP + 0.25) return 'cloud';
  return 'sun';
}
// あしたの出来事（天気とお祭り）を前の日に決めておく → 天気予報として見える
function rollForecast(d){
  return {wx: rollWeather(d), fest: Math.random() < 1 / 22};
}

/* ===== 物件（出店できる場所）を作る ===== */
function makeListing(areaId, small){
  const a = AREAS[areaId];
  const seats = small ? pick([8, 10, 12]) : pick([10, 12, 16, 20, 24]);
  const maxSeats = seats + pick([4, 8, 12]);
  const rent = Math.round(a.rps * maxSeats * rnd(0.85, 1.15) / 100) * 100;
  // 出店にかかるお金 = 内装（席×12万）＋ 保証金（家賃30日分）
  const openCost = Math.round((seats * 120000 + rent * 30) / 10000) * 10000;
  return {id: 'L' + (S.nextId++), area: areaId, seats, maxSeats, rent, openCost, born: S.day};
}
function refreshListings(force){
  // 7日ごとに古い物件が1〜2件消えて、新しい物件が出る
  if (!force && S.day % 7 !== 0) return;
  const n = force ? 6 : (Math.random() < 0.5 ? 1 : 2);
  for (let i = 0; i < n; i++){
    if (S.listings.length >= 6) S.listings.shift();
    S.listings.push(makeListing(pick(Object.keys(AREAS)), false));
  }
}

/* ===== 新しいゲーム ===== */
function newGame(){
  S = {
    day: 0, cash: 4000000, loan: 0, stores: [], listings: [], nextId: 1,
    areas: {}, foodMult: 1, ownerAt: null, ck: false,
    log: [], hist: [], goals: {}, negDays: 0, over: false, cleared: false,
    shopName: 'まんぷく亭', fc: null, today: null, streak: 0,
  };
  for (const k in AREAS) S.areas[k] = {rivals: AREAS[k].rivals, tMult: 1};
  S.fc = rollForecast(0);
  // 最初に選べる、小さくて安い物件3つ
  S.starters = ['jutaku', 'shoten', 'gakuen', 'newtown', 'road'].sort(() => Math.random() - 0.5).slice(0, 3)
    .map(a => makeListing(a, true));
  refreshListings(true);
}

/* ===== お店を開く ===== */
function openShop(L){
  if (S.cash < L.openCost) return false;
  S.cash -= L.openCost;
  const n = S.stores.length;
  const st = {
    id: 'S' + (S.nextId++), area: L.area, seats: L.seats, maxSeats: L.maxSeats, rent: L.rent,
    invest: L.openCost, staff: 1, mgr: false, price: Math.round(AREAS[L.area].fair / 50) * 50,
    q: 1, ads: 1, prepAuto: true, prep: 40,
    aw: 10 + brandFloor(n + 1),  // 知名度（チェーンが大きいと最初から少し有名）
    rep: 50,                     // 評判（星の数のもと）
    clean: 100,                  // きれいさ
    dem: [],                     // 最近の「来たかった人の数」
    no: n + 1, opened: S.day, last: null,
  };
  st.prep = Math.round(Math.min(capOf(st), 30 + st.aw));
  S.stores.push(st);
  if (S.ownerAt === null) S.ownerAt = st.id;
  addLog(`🎉 ${storeName(st)} がオープン！（${yen(L.openCost)}）`);
  return true;
}
function storeName(st){ return `${S.shopName} ${AREAS[st.area].name}店`; }
// お店が多いほど、新しいお店も最初から知られている（ブランド）
function brandFloor(n){ return Math.min(35, (n - 1) * 6); }

/* ===== お店の力 ===== */
function workers(st){ return st.staff + (st.mgr ? 1 : 0) + (S.ownerAt === st.id ? 1 : 0); }
function seatCap(st){ return st.seats * AREAS[st.area].turn; }
function staffCap(st){
  let c = workers(st) * PER_WORKER;
  if (!st.mgr && S.ownerAt !== st.id) c *= 0.85;   // 店長もオーナーもいないと手ぎわが悪い
  return Math.floor(c);
}
function capOf(st){ return Math.min(seatCap(st), staffCap(st)); }
function unitCost(st){ return Math.round(FOOD[st.q] * S.foodMult * (S.ck ? 0.85 : 1)); }

/* ===== その日の「来たい人の数」を計算（ここがゲームの心ぞう） ===== */
function demandOf(st, ctx, noise){
  const a = AREAS[st.area], as = S.areas[st.area];
  const t = dateOf(ctx.day);
  let traffic = a.traffic * as.tMult;
  if (t.wd >= 5) traffic *= a.wk;                         // 土日
  if (ctx.wx === 'rain') traffic *= a.rain;               // 雨
  if (ctx.wx === 'snow') traffic *= a.rain * (st.area === 'road' ? 0.55 : 0.75);
  if (ctx.wx === 'cloud') traffic *= 0.97;
  let season = SEASON[t.month];
  if (st.area === 'minato'){                              // 観光地は夏と連休が強い
    season = t.month === 8 ? 1.5 : (t.month === 5 && t.dom <= 7) ? 1.6 : [12, 1, 2].includes(t.month) ? 0.65 : 1.05;
  }
  if (st.area === 'gakuen' && [2, 3, 8].includes(t.month)) season *= 0.35;   // 大学の長い休み
  if (st.area === 'shoten' && ctx.fest) season *= 2;      // お祭り
  traffic *= season;
  // 同じエリアに自分の店が2つあると、お客さんを取り合う
  const own = S.stores.filter(s => s.area === st.area && s !== st).length;
  const rivals = as.rivals + own * 0.6;
  const awF = 0.25 + 0.75 * st.aw / 100;                  // 知名度
  const repF = 0.4 + 1.2 * st.rep / 100;                  // 評判
  const priceF = clamp(Math.exp(-a.sens * 2.2 * (st.price - a.fair) / a.fair), 0.15, 2.2);
  const qF = [0.92, 1.0, 1.08][st.q];
  let d = traffic * 0.09 * awF * repF * priceF * qF / (1 + 0.22 * rivals);
  if (noise) d *= rnd(0.88, 1.12);
  return Math.max(0, Math.round(d));
}

/* ===== 仕込み（あしたの分の材料を何杯分用意するか） ===== */
function autoPrep(st, ctx){
  const cap = capOf(st);
  // 店長かオーナーがいる店は、天気や曜日を見てうまく仕込む
  if (st.mgr || S.ownerAt === st.id) return Math.min(cap, Math.round(demandOf(st, ctx, false) * 1.08));
  // いない店は「最近の平均」だけで仕込む（雨や土日に弱い）
  const avg = st.dem.length ? st.dem.reduce((a, b) => a + b, 0) / st.dem.length : 30 + st.aw;
  return Math.min(cap, Math.round(avg * 1.1));
}

/* ===== 1日の営業を計算する（結果だけ。アニメは別） ===== */
function simDay(){
  const ctx = {day: S.day, wx: S.fc.wx, fest: S.fc.fest};
  const msgs = [];
  const res = {day: S.day, ctx, stores: [], sales: 0, profit: 0, msgs};
  for (const st of S.stores){
    const a = AREAS[st.area];
    const prep = st.prepAuto ? autoPrep(st, ctx) : st.prep;
    const demand = demandOf(st, ctx, true);
    const cap = capOf(st);
    const served = Math.min(demand, cap, prep);
    const lostCap = demand - Math.min(demand, cap);           // 席や人手が足りず帰った人
    const lostPrep = Math.min(demand, cap) - served;          // 売り切れで帰った人
    const sales = served * st.price;
    const food = prep * unitCost(st);                         // 仕込んだ分は全部お金がかかる（あまりはすてる）
    const wages = st.staff * WAGE + (st.mgr ? MGR_WAGE : 0);
    const util = 2500 + st.seats * 150;                       // 電気・ガス・水道
    const ads = ADS[st.ads].cost;
    const profit = sales - food - wages - st.rent - util - ads;
    // 満足度：材料・お得さ・待ち時間・売り切れ・きれいさ・店をまとめる人
    let sat = 55 + [-8, 4, 14][st.q]
      + clamp((a.fair - st.price) / a.fair * 60, -35, 20)
      - (demand ? lostCap / demand * 25 : 0)
      - (demand ? lostPrep / demand * 15 : 0)
      + (st.clean - 60) / 6
      + (S.ownerAt === st.id ? 4 : st.mgr ? 2 : -8)
      + rnd(-4, 4);
    sat = clamp(sat, 0, 100);
    if (served > 0) st.rep += (sat - st.rep) * 0.06;
    st.rep = clamp(st.rep, 0, 100);
    st.aw += ADS[st.ads].aw + served * 0.006 - st.aw * 0.012;
    st.aw = clamp(Math.max(st.aw, brandFloor(S.stores.length)), 0, 100);
    st.clean = Math.max(0, st.clean - 0.35);
    st.dem.push(demand); if (st.dem.length > 3) st.dem.shift();
    st.last = {demand, served, prep, cap, lostCap, lostPrep, sales, food, wages, rent: st.rent, util, ads, profit, sat: Math.round(sat)};
    res.stores.push({st, ...st.last});
    res.sales += sales; res.profit += profit;
  }
  // 本部のお金：3店目から、店がふえるほどかかる（事務・管理）
  const hq = S.stores.length >= 3 ? 12000 * (S.stores.length - 2) : 0;
  const ck = S.ck ? CK_DAILY : 0;
  const interest = Math.round(S.loan * 0.0005);               // 借金の利子（1日0.05%）
  const principal = Math.min(S.loan, Math.round(S.loan * 0.006)); // 毎日の返済（借金の0.6%）
  res.hq = hq; res.ckCost = ck; res.interest = interest; res.principal = principal;
  res.profit -= hq + ck + interest;
  S.cash += res.profit - principal;
  S.loan -= principal;

  // ---- いろいろな出来事 ----
  dailyEvents(msgs);
  // ---- お金がマイナス？ ----
  if (S.cash < 0){
    S.negDays++;
    msgs.push(`⚠️ お金がマイナス！あと${3 - S.negDays}日で戻さないと倒産します（銀行で借りるか、店を閉める）`);
    if (S.negDays >= 3){ S.over = true; msgs.push('💥 倒産してしまった…'); }
  } else S.negDays = 0;
  S.streak = res.profit > 0 ? S.streak + 1 : 0;

  S.hist.push({d: S.day, sales: res.sales, profit: res.profit, cash: S.cash});
  if (S.hist.length > 120) S.hist.shift();
  for (const m of msgs) addLog(m);

  // ---- あしたへ ----
  S.day++;
  S.areas.newtown.tMult = Math.min(2.6, S.areas.newtown.tMult + 0.0015);   // ニュータウンは人がふえていく
  S.fc = rollForecast(S.day);
  refreshListings(false);
  checkGoals(msgs);
  S.today = res;
  save();
  return res;
}

/* ===== ランダムな出来事 ===== */
function dailyEvents(msgs){
  const ids = Object.keys(AREAS);
  // 材料の値段は少しずつ動く
  S.foodMult = clamp(S.foodMult + rnd(-0.012, 0.012) + (1 - S.foodMult) * 0.02, 0.85, 1.4);
  if (Math.random() < 1 / 60){ S.foodMult = Math.min(1.4, S.foodMult + 0.12); msgs.push('📈 小麦やぶた肉が値上がり！材料が高くなった'); }
  // ライバル店が出る・つぶれる
  if (Math.random() < 1 / 30){
    const k = pick(ids);
    if (S.areas[k].rivals < 6){
      S.areas[k].rivals++;
      const mine = S.stores.some(s => s.area === k);
      msgs.push(`🍜 ${AREAS[k].name}にライバル店が開店${mine ? '…うちの店の近くだ！' : ''}（ライバル${S.areas[k].rivals}店）`);
    }
  }
  if (Math.random() < 1 / 45){
    const k = pick(ids.filter(k => S.areas[k].rivals > 0));
    if (k){ S.areas[k].rivals--; msgs.push(`🏚 ${AREAS[k].name}のライバル店が閉店した（ライバル${S.areas[k].rivals}店）`); }
  }
  for (const st of S.stores){
    // 店員さんが急にやめる
    if (st.staff > 0 && Math.random() < 1 / 70){ st.staff--; msgs.push(`😢 ${storeName(st)}の店員さんが1人やめた`); }
    // 評判がいいとテレビにとりあげられる
    if (st.rep >= 72 && Math.random() < 1 / 60){ st.aw = Math.min(100, st.aw + 25); msgs.push(`📺 ${storeName(st)}がテレビでしょうかいされた！知名度アップ`); }
    // 評判が悪いと悪い口コミ
    if (st.rep < 38 && Math.random() < 1 / 12){ st.rep -= 5; msgs.push(`👎 ${storeName(st)}にネットで悪い口コミ…`); }
    // きたないと保健所の注意
    if (st.clean < 30 && Math.random() < 1 / 10){ st.rep -= 8; msgs.push(`🧽 ${storeName(st)}が保健所に注意された（きれいさが低い）`); }
  }
}

/* ===== 目標のチェック ===== */
function checkGoals(msgs){
  const n = S.stores.length;
  const last30 = S.hist.slice(-30).reduce((a, h) => a + h.profit, 0);
  const ok = {
    black7: S.streak >= 7, store2: n >= 2, month100: last30 >= 1000000, store3: n >= 3,
    store5: n >= 5, ck: S.ck, store10: n >= 10, debtfree: n >= 10 && S.loan <= 0,
  };
  for (const g of GOALS){
    if (!S.goals[g.id] && ok[g.id]){
      S.goals[g.id] = S.day;
      const m = `🎯 目標たっせい：${g.txt}`;
      msgs.push(m); addLog(m);
      if (g.id === 'store10') S.cleared = true;
    }
  }
}
function addLog(m){ S.log.unshift({d: S.day, m}); if (S.log.length > 60) S.log.pop(); }

/* ===== 銀行：借りられる上限 ===== */
function creditLimit(){
  const assets = S.stores.reduce((a, s) => a + s.seats * 60000, 0);
  const h = S.hist.slice(-14);
  const avg = h.length ? h.reduce((a, x) => a + x.profit, 0) / h.length : 0;
  return Math.max(0, Math.round((3000000 + assets + Math.max(0, avg) * 30) / 100000) * 100000);
}
// 店を閉めたときに戻ってくるお金（内装の一部＋保証金）
function sellValue(st){ return Math.round((st.invest * 0.3 + st.rent * 30) / 10000) * 10000; }

/* =========================================================
   音（Web Audio で音を作る。音のファイルはつかわない）
   ========================================================= */
const Snd = {
  on: (() => { try { return localStorage.getItem('donburi-sound-v1') !== 'off'; } catch (e) { return true; } })(),
  ctx: null, bgmT: 0, bgmStep: 0,
  init(){
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  // ひとつの音：周波数・長さ・音色・音量・はじまり
  tone(f, dur, type = 'sine', vol = 0.08, delay = 0, f2 = null){
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  click(){ this.tone(900, 0.06, 'triangle', 0.05); },
  chime(){ this.tone(1320, 0.35, 'sine', 0.04); this.tone(1047, 0.5, 'sine', 0.04, 0.16); },   // お店のドアのチャイム
  cash(){ [1568, 2093, 2637].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.06, i * 0.07)); },  // レジの音
  bad(){ this.tone(220, 0.5, 'sawtooth', 0.04, 0, 110); },
  ring(){ for (let i = 0; i < 6; i++) this.tone(i % 2 ? 1300 : 1600, 0.06, 'square', 0.025, i * 0.07); },   // 電話
  good(){ [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.06, i * 0.09)); },
  // BGM：のんびりした五音音階のメロディー（とても小さい音）
  bgm(dt){
    if (!this.on || !this.ctx || document.hidden) return;
    this.bgmT -= dt;
    if (this.bgmT > 0) return;
    const step = live ? 0.2 : 0.32;
    this.bgmT = step;
    const mel = [0, 2, 4, 7, 9, 7, 4, 2, 0, -3, 0, 2, 4, 2, 0, null];
    const n = mel[this.bgmStep % mel.length];
    if (n !== null){
      const f = 392 * Math.pow(2, n / 12);
      this.tone(f, step * 1.6, 'triangle', 0.018);
      if (this.bgmStep % 4 === 0) this.tone(f / 2, step * 3, 'sine', 0.02);
    }
    this.bgmStep++;
  },
};

/* =========================================================

const LW = 360, LH = 280;      // 絵の中の大きさ（これを画面の大きさにのばして描く）
const cv = document.getElementById('stage'), g = cv.getContext('2d');
let K = 1;                     // 拡大率
function fitStage(){
  const wrap = document.getElementById('stageWrap');
  const par = wrap.parentElement, cs = getComputedStyle(par);
  const inner = par.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);   // すき間をのぞいた幅
  const maxW = Math.min(inner, (window.innerHeight * 0.44) * LW / LH);
  wrap.style.width = maxW + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(maxW * dpr); cv.height = Math.round(maxW * LH / LW * dpr);
  cv.style.height = (maxW * LH / LW) + 'px';
  K = cv.width / LW;
}
window.addEventListener('resize', fitStage);

/* 絵を描く道具 */
function rr(x, y, w, h, r, col){ g.fillStyle = col; g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); }
function circ(x, y, r, col){ g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function txt(s, x, y, size, col, align = 'center', bold = true){
  g.font = `${bold ? 'bold ' : ''}${size}px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
  g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(s, x, y);
}
function mix(a, b, t){   // 2つの色をまぜる（#rrggbb）
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',') + ')';
}

/* =========================================================
   お店の画面の「動き」（お客さん・店員・湯気）
   ========================================================= */
const SH = {sid: null, cust: [], staff: [], steam: [], far: [], spawn: 0, farT: 0};
const DOOR_X = 98, FLOOR_Y = 268, SEAT_Y = 232;
function visSeats(st){ return Math.min(st.seats, 12); }
function seatX(st, i){ const n = visSeats(st); return 130 + (i + 0.5) * (218 / n); }

function resetShop(st){
  SH.sid = st.id; SH.cust = []; SH.steam = []; SH.spawn = 0;
  SH.staff = [];
  const roles = [];
  if (S.ownerAt === st.id) roles.push('owner');
  if (st.mgr) roles.push('mgr');
  for (let i = 0; i < st.staff; i++) roles.push('staff');
  roles.slice(0, 5).forEach((r, i) => SH.staff.push({role: r, x: 150 + i * 40, tx: 150 + i * 40, job: null, t: 0, ph: Math.random() * 9}));
  SH.extraStaff = Math.max(0, roles.length - 5);
}
// お店の設定が変わったら、店員の人数を合わせる
function syncStaff(st){
  const want = Math.min(5, workers(st));
  if (SH.staff.length !== want || SH.sid !== st.id) resetShop(st);
}

function shopUpdate(dt, st){
  if (SH.sid !== st.id) resetShop(st);
  syncStaff(st);
  const r = live ? live.res.stores.find(x => x.st.id === st.id) : null;
  const p = live ? clamp(live.t / live.dur, 0, 1) : 0;
  const ts = live ? live.ts * (live.fast ? 5 : 1) : 1;     // 早送りの倍率
  const step = dt * ts;
  const n = visSeats(st);
  const EAT = 2.6;          // 食べる時間（秒・早送りなし）
  const SPEED = 62;         // 歩く速さ（1秒に何ドット）
  const open = live && p < 1;
  const soldOut = r && live.soldP[st.id] !== undefined && p >= live.soldP[st.id];

  // --- 新しいお客さんが来る ---
  if (open && r && r.demand > 0){
    const h = 11 + p * 11;
    const lam = (r.demand / Math.max(1, r.cap)) * (n / (EAT + 1.6)) * rush(h) / 1.05 * 0.9;
    SH.spawn += lam * step;
    while (SH.spawn >= 1){
      SH.spawn -= 1;
      if (SH.cust.length < 34) SH.cust.push({x: -14 - Math.random() * 20, y: FLOOR_Y, st: 'come', L: randLook(), ph: Math.random() * 6, seat: -1, t: 0, mood: null});
    }
  }
  // --- 遠くを通る人（窓の外） ---
  SH.farT -= dt;
  if (SH.farT <= 0){ SH.farT = rnd(0.8, 2.5); SH.far.push({x: Math.random() < 0.5 ? -6 : 90, d: 0, L: randLook()}); }
  SH.far.forEach(f => { if (!f.d) f.d = f.x < 0 ? 1 : -1; f.x += f.d * 18 * dt; f.ph = (f.ph || 0) + dt * 8; });
  SH.far = SH.far.filter(f => f.x > -10 && f.x < 94);

  const used = new Set(SH.cust.filter(c => c.seat >= 0).map(c => c.seat));
  const queue = SH.cust.filter(c => c.st === 'queue');
  for (const c of SH.cust){
    c.ph += step * 9;
    if (c.st === 'come'){
      c.x += SPEED * step;
      const qx = 78 - queue.length * 12;
      if (c.x >= Math.min(84, qx)){
        if (!open || soldOut){ c.st = 'leave'; c.mood = soldOut ? '💧' : null; continue; }
        const free = [...Array(n).keys()].filter(i => !used.has(i));
        if (free.length && queue.length === 0){ c.seat = pick(free); used.add(c.seat); c.st = 'enter'; if (Math.random() < 0.35) Snd.chime(); }
        else if (queue.length < 6){ c.st = 'queue'; queue.push(c); }
        else { c.st = 'leave'; c.mood = '💢'; }
      }
    } else if (c.st === 'queue'){
      const i = queue.indexOf(c);
      const tx = 78 - i * 12;
      if (c.x < tx) c.x = Math.min(tx, c.x + SPEED * step);
      c.t += step;
      if (i === 0){
        const free = [...Array(n).keys()].filter(k => !used.has(k));
        if (free.length && open && !soldOut){ c.seat = free[0]; used.add(c.seat); c.st = 'enter'; queue.shift(); }
      }
      if (!open || soldOut || c.t > 7 + i){ c.st = 'leave'; c.mood = soldOut ? '💧' : '💢'; queue.splice(queue.indexOf(c), 1); }
    } else if (c.st === 'enter'){
      const tx = seatX(st, c.seat);
      c.x += SPEED * step;
      if (c.x >= tx){ c.x = tx; c.st = 'wait'; c.t = 0; }
    } else if (c.st === 'wait'){
      c.t += step;    // 店員さんが運んでくるのを待つ
    } else if (c.st === 'eat'){
      c.t -= step;
      if (c.t <= 0){ c.st = 'out'; c.seat = -1; c.mood = Math.random() < 0.3 ? '😋' : null; c.moodT = 1.2; }
    } else if (c.st === 'out' || c.st === 'leave'){
      c.x -= SPEED * step;
    }
    if (c.moodT !== undefined) c.moodT -= step;
  }
  SH.cust = SH.cust.filter(c => c.x > -30);

  // --- 店員さんの動き ---
  const waiting = SH.cust.filter(c => c.st === 'wait' && !c.taken).sort((a, b) => b.t - a.t);
  const COOK = 0.9;
  for (const s of SH.staff){
    s.ph += dt;
    if (!s.job && waiting.length){
      const c = waiting.shift(); c.taken = true;
      s.job = {c, phase: 'pot'}; s.tx = 150 + Math.random() * 50;
    }
    if (s.job){
      const c = s.job.c;
      if (!SH.cust.includes(c) || c.st !== 'wait'){ s.job = null; continue; }
      if (s.job.phase === 'pot' && Math.abs(s.x - s.tx) < 2){ s.job.phase = 'cook'; s.t = COOK; }
      else if (s.job.phase === 'cook'){ s.t -= step; if (s.t <= 0){ s.job.phase = 'carry'; s.tx = c.x; } }
      else if (s.job.phase === 'carry' && Math.abs(s.x - s.tx) < 2){ c.st = 'eat'; c.t = EAT * rnd(0.8, 1.2); s.job = null; s.tx = s.x; }
    } else if (Math.random() < dt * 0.4){ s.tx = 140 + Math.random() * 200; }
    const sp = 75 * (s.job ? ts : 1) * dt;
    if (Math.abs(s.tx - s.x) > 1) s.x += Math.sign(s.tx - s.x) * Math.min(sp, Math.abs(s.tx - s.x));
  }
  // --- 湯気 ---
  if (Math.random() < dt * 9) SH.steam.push({x: rnd(140, 205), y: 112, a: 1, r: rnd(3, 6)});
  for (const c of SH.cust) if (c.st === 'eat' && Math.random() < dt * 2) SH.steam.push({x: c.x + rnd(-3, 3), y: 158, a: 0.7, r: 2.5});
  SH.steam.forEach(s => { s.y -= dt * 16; s.a -= dt * 0.6; s.r += dt * 3; });
  SH.steam = SH.steam.filter(s => s.a > 0);
}

/* ---------- 時刻で空の色を変える ---------- */
function skyCols(h){
  if (h < 16) return ['#7cc3f0', '#cfeaff', 0];
  if (h < 18) { const t = (h - 16) / 2; return [mix('#7cc3f0', '#f08a4b', t), mix('#cfeaff', '#ffd08a', t), t * 0.3]; }
  if (h < 19.5) { const t = (h - 18) / 1.5; return [mix('#f08a4b', '#1d2350', t), mix('#ffd08a', '#4a3a6a', t), 0.3 + t * 0.4]; }
  return ['#141a3a', '#2a2850', 0.7];
}

function wrapText(s, cx, y, maxW, lh, size, col){

}

// 顔の絵（小さい canvas に描いて画像にする）
const faceCache = {};

  const hair = {sec: '#2b1d14', mgr: '#1b1b1b', staff: '#4a2e1c', bank: '#555'}[kind];
  const shirt = {sec: '#e9eef8', mgr: '#2a2a2a', staff: '#f4f4f0', bank: '#30394a'}[kind];
  x.fillStyle = shirt; x.beginPath(); x.ellipse(26, 54, 20, 14, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#ffd9b8'; x.beginPath(); x.arc(26, 26, 14, 0, Math.PI * 2); x.fill();
  x.fillStyle = hair; x.beginPath(); x.arc(26, 23, 14.5, Math.PI * 1.02, Math.PI * 1.98); x.fill();

  if (kind === 'mgr' || kind === 'staff'){ x.fillStyle = kind === 'mgr' ? '#d8473a' : '#fff'; x.fillRect(12, 15, 28, 5); }
  if (kind === 'bank'){ x.strokeStyle = '#222'; x.lineWidth = 1.2; x.strokeRect(17, 24, 7, 5); x.strokeRect(28, 24, 7, 5); x.fillStyle = '#c0392b'; x.fillRect(25, 42, 3, 10); }
  x.fillStyle = '#2b1d14'; x.fillRect(19.5, 25, 2.5, 3); x.fillRect(30, 25, 2.5, 3);
  x.fillStyle = '#e07a6a'; x.beginPath(); x.arc(26, 33, 3, 0, Math.PI); x.fill();
  return faceCache[kind] = c.toDataURL();
}
function advisorOf(st){
  if (!st) return {face: 'sec', name: '秘書 みなみ'};
  if (st.mgr) return {face: 'mgr', name: `${shortName(st)} 店長 ${st.mgrName || 'たけし'}`};
  return {face: 'staff', name: `${shortName(st)} 店員`};
}

// 1日の終わりに、相談をつくる
function genConsults(res){
  S.consults = (S.consults || []).filter(c => S.day - c.day < 3);
  S.cd = S.cd || {};
  const cand = [];
  for (const s of res.stores){
    const st = S.stores.find(x => x.id === s.st.id); if (!st) continue;
    const sid = st.id, fair = AREAS[st.area].fair;
    if (s.lostCap >= 8 && staffCap(st) < seatCap(st)) cand.push({k: 'hire', sid, n: s.lostCap});
    else if (s.lostCap >= 8 && st.seats + 4 <= st.maxSeats) cand.push({k: 'expand', sid, n: s.lostCap});
    if (st.staff > 0 && staffCap(st) - Math.max(s.demand, s.served) >= PER_WORKER + 8) cand.push({k: 'fire', sid});
    if (s.lostPrep >= 8 && !st.prepAuto) cand.push({k: 'prepUp', sid, n: s.lostPrep});
    const waste = s.prep - s.served;
    if (waste > Math.max(12, s.prep * 0.25)) cand.push({k: st.prepAuto && !st.mgr && S.ownerAt !== st.id ? 'mgrHire' : 'prepDown', sid, n: waste});
    if (st.rep >= 65 && s.lostCap >= 5 && st.price < fair * 1.25) cand.push({k: 'priceUp', sid});
    if (s.served < s.cap * 0.45 && st.price > fair) cand.push({k: 'priceDown', sid});
    if (st.clean < 45) cand.push({k: 'reno', sid});
    if (st.rep >= 55 && Math.random() < 0.06) cand.push({k: 'deliver', sid});
    if (Math.random() < 0.03) cand.push({k: 'magazine', sid});
  }
  if (S.cash < 300000 && creditLimit() - S.loan >= 1000000) cand.push({k: 'loan'});
  const fresh = S.listings.filter(l => l.born === S.day && S.cash >= l.openCost * 0.8);
  if (fresh.length && S.stores.length < MAX_STORES) cand.push({k: 'listing', lid: fresh[0].id});
  // 同じ相談が続かないように（5日あける）
  const ok = cand.filter(c => { const key = c.k + (c.sid || ''); return S.cd[key] === undefined || S.day - S.cd[key] >= 5; })
    .filter(c => !S.consults.some(o => o.k === c.k && o.sid === c.sid));
  ok.sort(() => Math.random() - 0.5);
  const room = Math.max(0, 3 - S.consults.length);
  ok.slice(0, Math.min(2, room)).forEach(c => {
    S.cd[c.k + (c.sid || '')] = S.day;
    S.consults.push({...c, id: 'C' + (S.nextId++), day: S.day});
  });
}

// 相談の中身（セリフと選択肢）
function consultDef(c){
  const st = c.sid ? S.stores.find(s => s.id === c.sid) : null;
  if (c.sid && !st) return null;
  const who = advisorOf(st), sec = {face: 'sec', name: '秘書 みなみ'};
  const nm = st ? shortName(st) : '';
  switch (c.k){
    case 'hire': return {who, say: `社長、きのうは席があいているのに作るのが追いつかなくて、${c.n}人もお客さんを帰してしまいました…。店員をもう1人ふやしませんか？（1日 ${yen(WAGE)}）`,
      ch: [['ふやす', () => { st.staff++; return `${nm}の店員を${st.staff}人にした`; }], ['このまま', null]]};
    case 'expand': return {who, say: `お店がいっぱいで、${c.n}人が待ちきれずに帰りました。席を4つふやしませんか？（${yen(480000)}）`,
      ch: [['ふやす', () => { if (S.cash < 480000) return '!お金が足りません'; S.cash -= 480000; st.seats += 4; st.invest += 480000; return `${nm}を${st.seats}席にした`; }], ['まだいい', null]]};
    case 'fire': return {who, say: `きのうは店員がちょっとひまそうでした…。1人へらしますか？給料が1日 ${yen(WAGE)} へります。`,
      ch: [['へらす', () => { st.staff = Math.max(0, st.staff - 1); return `${nm}の店員を${st.staff}人にした`; }], ['このまま', null]]};
    case 'prepUp': return {who, say: `きのうはスープが売り切れて、${c.n}人に「ごめんなさい」しました。仕込みを10杯ふやしますか？`,
      ch: [['+10杯', () => { st.prep += 10; return `${nm}の仕込みを${st.prep}杯にした`; }], ['おまかせにする', () => { st.prepAuto = true; return `${nm}の仕込みをおまかせにした`; }], ['このまま', null]]};
    case 'prepDown': return {who, say: `きのうは${c.n}杯分の材料をすててしまいました…もったいないです。仕込みを少しへらしますか？`,
      ch: st.prepAuto ? [['手動で−10杯', () => { st.prepAuto = false; st.prep = Math.max(0, (st.last ? st.last.prep : 40) - 10); return `${nm}の仕込みを${st.prep}杯にした`; }], ['このまま', null]]
        : [['−10杯', () => { st.prep = Math.max(0, st.prep - 10); return `${nm}の仕込みを${st.prep}杯にした`; }], ['おまかせにする', () => { st.prepAuto = true; return `${nm}の仕込みをおまかせにした`; }], ['このまま', null]]};
    case 'mgrHire': return {who: sec, say: `${nm}は店長がいないので、天気や曜日に合わせた仕込みができず、${c.n}杯分すててしまいました。店長を雇いませんか？（1日 ${yen(MGR_WAGE)}）`,
      ch: [['店長を雇う', () => { hireMgr(st); return `${nm}に店長の${st.mgrName}さんが来た`; }], ['まだいい', null]]};
    case 'priceUp': return {who, say: `うちの店、評判がいいみたいで行列ができています！${yen(50)}だけ値上げしてみませんか？（いま ${yen(st.price)}）`,
      ch: [['値上げ', () => { st.price += 50; return `${nm}を${yen(st.price)}にした`; }], ['このまま', null]]};
    case 'priceDown': return {who, say: `お客さんが少なくて、席がガラガラです…。このあたりの相場は ${yen(AREAS[st.area].fair)}。少し値下げしませんか？（いま ${yen(st.price)}）`,
      ch: [['−50円', () => { st.price -= 50; return `${nm}を${yen(st.price)}にした`; }], ['このまま', null]]};
    case 'reno': return {who, say: `お店がだいぶよごれてきました（きれいさ ${Math.round(st.clean)}）。このままだと保健所に注意されるかも…。改装しますか？（${yen(st.seats * 40000)}）`,
      ch: [['改装する', () => { const cst = st.seats * 40000; if (S.cash < cst) return '!お金が足りません'; S.cash -= cst; st.clean = 100; st.rep = Math.min(100, st.rep + 3); return `${nm}を改装した`; }], ['あとで', null]]};
    case 'deliver': { const gain = 30 * (st.price - unitCost(st)); return {who, say: `近くの会社から「30杯 出前してほしい」と電話です！もうけは ${yen(gain)}。でも店がバタバタして、評判が少し下がるかもしれません。`,
      ch: [['受ける', () => { S.cash += gain; st.rep = Math.max(0, st.rep - 2); return `出前で ${yen(gain)} もうけた`; }], ['ことわる', null]]}; }
    case 'magazine': return {who: sec, say: `タウン誌の記者さんから「15万円で ${nm} の特集ページをつくりませんか？」とのことです。知名度が上がります。`,
      ch: [['のせる', () => { if (S.cash < 150000) return '!お金が足りません'; S.cash -= 150000; st.aw = Math.min(100, st.aw + 15); return `${nm}が雑誌にのった（知名度アップ）`; }], ['ことわる', null]]};
    case 'loan': return {who: {face: 'bank', name: 'ひばり信用金庫 やまださん'}, say: `社長、お金が少なくなっていますね。100万円までなら、すぐにお貸しできますよ。（利子は1日0.05%・毎日少しずつ返す）`,
      ch: [['100万円かりる', () => { if (creditLimit() - S.loan < 1000000) return '!もう借りられません'; S.loan += 1000000; S.cash += 1000000; addLog('🏦 100万円 借りた'); return '100万円 借りた'; }], ['けっこうです', null]]};
    case 'listing': { const L = S.listings.find(l => l.id === c.lid); if (!L) return null; const a = AREAS[L.area];
      return {who: sec, say: `社長、${a.name}（${a.kind}）に新しい物件が出ました！${L.seats}席・家賃 ${yen(L.rent)}/日・出店に ${yen(L.openCost)}。見に行きますか？`,
        ch: [['地図で見る', () => { mapSel = L.area; setScene('map'); return null; }], ['あとで', null]]}; }
  }
  return null;
}
function hireMgr(st){ st.mgr = true; if (!st.mgrName) st.mgrName = pick(MGR_NAMES); }

function consultHTML(c, inModal){
  const d = consultDef(c); if (!d) return '';
  return `<div class="card talk"><img src="${faceImg(d.who.face)}" alt="">
    <div style="flex:1"><div class="who">${d.who.name}</div><div class="say">${d.say}</div>
    <div class="ch">${d.ch.map((x, i) => `<button class="btn ${i === 0 ? 'main' : ''}" data-act="answer" data-id="${c.id}" data-v="${i}">${x[0]}</button>`).join('')}</div></div></div>`;
}
function showConsult(c){
  const d = consultDef(c);
  if (!d){ S.consults = S.consults.filter(o => o !== c); return render(); }
  $('ovl').innerHTML = `<div class="ov"><div class="box"><h2>📞 相談です</h2>${consultHTML(c, true)}</div></div>`;
}
function answer(id, i){
  const c = S.consults.find(o => o.id === id); if (!c) return;
  const d = consultDef(c);
  S.consults = S.consults.filter(o => o !== c);
  const fn = d && d.ch[+i] && d.ch[+i][1];
  if (fn){
    const m = fn();
    if (m && m[0] === '!'){ Snd.bad(); toast(m.slice(1)); }
    else if (m){ Snd.good(); toast('✅ ' + m); addLog('📞 ' + m); }
  } else Snd.click();
  $('ovl').innerHTML = '';
  save(); render();
}

function render(){
  if (!S) return;
  $('dateTxt').textContent = dateStr(live ? live.res.day : S.day) + (live ? ' 営業中' : '');
  $('wxTxt').textContent = (live ? '' : 'きょう ') + WX[live ? live.res.ctx.wx : S.fc.wx] + (S.fc.fest && !live ? ' 🏮' : '');
  const c = $('cash');

  c.textContent = '💰 ' + yen(cash);

  $('loanTxt').textContent = `借金 ${yen(S.loan)}・${S.stores.length}店`;
  const gl = GOALS.find(q => !S.goals[q.id]);
  $('goal').textContent = gl ? '🎯 ' + gl.txt : '🏆 すべての目標をたっせい！';
  $('sndBtn').textContent = Snd.on ? '🔊' : '🔇';
  document.querySelectorAll('#nav .sc').forEach(b => b.classList.toggle('on', b.dataset.scene === scene));
  const bd = $('badge'); bd.style.display = S.consults.length ? '' : 'none'; bd.textContent = S.consults.length;
  const multi = scene === 'shop' && S.stores.length > 1;
  $('prevSt').style.display = $('nextSt').style.display = multi ? 'block' : 'none';
  renderPanel();
  if (sheetKind) renderSheet();
}

function renderPanel(){
  const v = $('panel'), top = v.scrollTop;
  v.innerHTML = scene === 'shop' ? panelShop() : scene === 'office' ? panelOffice() : panelMap();

}

// 利益のグラフ（棒グラフ：緑=黒字、赤=赤字）
function drawChart(){
  const c = $('chart'); if (!c) return;
  const W = c.clientWidth, H = 150, dpr = window.devicePixelRatio || 1;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const data = S.hist.slice(-60);
  if (!data.length){ x.fillStyle = '#e0ccb6'; x.font = '13px sans-serif'; x.fillText('まだデータがありません', 10, 75); return; }
  const mx = Math.max(10000, ...data.map(d => Math.abs(d.profit)));
  const mid = H / 2, bw = W / 60;
  x.strokeStyle = '#ffffff40'; x.beginPath(); x.moveTo(0, mid); x.lineTo(W, mid); x.stroke();
  data.forEach((d, i) => {
    const hh = d.profit / mx * (H / 2 - 6);
    x.fillStyle = d.profit >= 0 ? '#74e89a' : '#ff7474';
    x.fillRect(i * bw + 1, hh >= 0 ? mid - hh : mid, Math.max(1, bw - 2), Math.abs(hh));
  });
  x.fillStyle = '#e0ccb6'; x.font = '11px sans-serif';
  x.fillText('+' + yen(mx), 4, 12); x.fillText('-' + yen(mx), 4, H - 3);
}

/* =========================================================
   ボタンを押したとき

document.addEventListener('click', e => {
  Snd.init();
  const t = e.target.closest('[data-scene],[data-act]');
  if (!t) return;
  if (t.dataset.act === 'closeSheetBg' && e.target !== t) return;   // シートの中をおしたときは閉じない
  if (live && !['snd', 'viewPrev', 'viewNext'].includes(t.dataset.act)) return;                       // 営業中は操作できない
  if (t.dataset.scene){ Snd.click(); setScene(t.dataset.scene); return; }
  act(t.dataset.act, t.dataset.id, t.dataset.v);
});

function act(a, id, v){
  const st = S && S.stores.find(s => s.id === id);
  if (!['run1', 'run7', 'answer'].includes(a)) Snd.click();
  switch (a){
    case 'snd': Snd.on = !Snd.on; try { localStorage.setItem('donburi-sound-v1', Snd.on ? 'on' : 'off'); } catch (e) {} break;
    case 'closeSheet': case 'closeSheetBg': closeSheet(); return;
    case 'sheet': openSheet(v, id); return;
    case 'scene': setScene(v); return;
    case 'mapArea': mapSel = v || null; if (scene !== 'map') scene = 'map'; break;
    case 'goStore': viewId = id; closeSheet(); scene = 'shop'; break;
    case 'viewPrev': case 'viewNext': {
      const i = S.stores.indexOf(viewed()), n = S.stores.length;
      viewId = S.stores[(i + (a === 'viewNext' ? 1 : n - 1)) % n].id; break;
    }
    case 'answer': answer(id, v); return;
    case 'price': st.price = clamp(st.price + +v, 300, 2500); break;
    case 'q': st.q = +v; break;
    case 'staff': st.staff = clamp(st.staff + +v, 0, 12); break;
    case 'mgr': if (st.mgr) st.mgr = false; else hireMgr(st); break;
    case 'owner': S.ownerAt = st.id; break;
    case 'prepAuto':
      st.prepAuto = !st.prepAuto;
      if (!st.prepAuto) st.prep = autoPrep(st, {day: S.day, wx: S.fc.wx, fest: S.fc.fest});
      break;
    case 'prep':
      if (st.prepAuto){ st.prep = autoPrep(st, {day: S.day, wx: S.fc.wx, fest: S.fc.fest}); st.prepAuto = false; }
      st.prep = clamp(st.prep + +v, 0, 600); break;
    case 'ads': st.ads = +v; break;
    case 'expand':
      if (S.cash < 480000) return toast('お金が足りません');
      if (st.seats + 4 > st.maxSeats) return;
      S.cash -= 480000; st.seats += 4; st.invest += 480000; addLog(`🪑 ${storeName(st)}の席を${st.seats}席にした`); break;
    case 'reno': {
      const c = st.seats * 40000;
      if (S.cash < c) return toast('お金が足りません');
      S.cash -= c; st.clean = 100; st.rep = Math.min(100, st.rep + 3); addLog(`🧽 ${storeName(st)}を改装した`); break;
    }
    case 'close':
      if (!confirm(`${storeName(st)}を閉店しますか？\n${yen(sellValue(st))} がもどってきます。`)) return;
      S.cash += sellValue(st); S.stores = S.stores.filter(s => s !== st);
      if (S.ownerAt === st.id) S.ownerAt = S.stores.length ? S.stores[0].id : null;
      addLog(`🚪 ${storeName(st)}を閉店した`);
      closeSheet();
      if (!S.stores.length) return gameOver('お店がなくなってしまった');
      break;
    case 'buy': {
      const L = S.listings.find(l => l.id === id);
      if (!L || S.cash < L.openCost) return toast('お金が足りません');
      if (!confirm(`${AREAS[L.area].name}に出店しますか？\n出店のお金 ${yen(L.openCost)}\n家賃 ${yen(L.rent)}/日`)) return;
      openShop(L); S.listings = S.listings.filter(l => l !== L);
      const ns = S.stores[S.stores.length - 1];
      viewId = ns.id; scene = 'shop'; Snd.good();
      save(); render(); openSheet('store', ns.id);
      toast('🎉 新しいお店ができた！店員の数や値段を決めよう');
      return;
    }
    case 'borrow': {
      const room = creditLimit() - S.loan;
      if (+v > room) return;
      S.loan += +v; S.cash += +v; addLog(`🏦 ${yen(+v)} 借りた`); Snd.cash(); break;
    }
    case 'repay': {
      const amt = v === 'all' ? S.loan : Math.min(+v, S.loan);
      if (S.cash < amt) return toast('お金が足りません');
      S.loan -= amt; S.cash -= amt; addLog(`🏦 ${yen(amt)} 返した`); break;
    }
    case 'ck':
      if (S.cash < CK_COST || S.stores.length < 3) return;
      S.cash -= CK_COST; S.ck = true; addLog('🏭 セントラルキッチンを作った！'); Snd.good();
      checkGoals([]); break;
    case 'reset':
      if (!confirm('本当に、はじめからやり直しますか？（いまのデータは消えます）')) return;
      localStorage.removeItem(SAVE_KEY); S = null; closeSheet(); showStart(); return;
    case 'run1': runDays(1); return;
    case 'run7': runDays(7); return;
  }
  save(); render();
}

function toast(m){
  const d = document.createElement('div');
  d.textContent = m;
  d.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);width:max-content;background:#000e;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;text-align:center;border:1px solid #ffffff30';
  document.body.appendChild(d); setTimeout(() => d.remove(), 2300);
}

/* =========================================================
   営業（本当の時間で 11:00 → 22:00 が動く）
   ========================================================= */
// お客さんが来る時間のかたより（お昼と夜にピーク）
function rush(h){ return 0.3 + Math.exp(-((h - 12.3) ** 2) / 1.2) * 1.6 + Math.exp(-((h - 19) ** 2) / 2) * 1.2; }
function rushCum(p){   // 0〜1：その時刻までに来た人の割合
  let a = 0, b = 0;
  for (let i = 0; i < 110; i++){ const h = 11 + i / 10, r = rush(h); b += r; if (i / 110 < p) a += r; }
  return a / b;
}
// 売り切れになる時刻（0〜1）
function soldTime(r){
  if (!r.lostPrep) return undefined;
  const want = Math.min(r.demand, r.cap);
  for (let p = 0; p <= 1; p += 0.01) if (rushCum(p) * want >= r.served) return p;
  return 1;
}

function runDays(n){
  if (live || S.over || !S.stores.length) return;
  Snd.init();
  closeSheet();
  if (scene !== 'shop'){ scene = 'shop'; }
  const results = [];
  const step = () => {
    const cash0 = S.cash;
    const r = simDay();
    genConsults(r);
    results.push(r);
    const stop = S.over || r.msgs.some(m => m.startsWith('⚠️'));
    const soldP = {}; r.stores.forEach(x => { const t = soldTime(x); if (t !== undefined) soldP[x.st.id] = t; });
    const dur = n === 1 ? 14 : 4.5;     // 1日の長さ（秒）
    live = {res: r, cash0, t: 0, dur, ts: 14 / dur, fast: false, soldP, hold: 0, done: () => {
      if (results.length < n && !stop) return step();
      live = null;
      SH.cust = [];
      if (S.over){ render(); return gameOver('お金がマイナスのまま3日たった'); }
      render();
      showResult(results);
    }};
    render();
  };
  step();
}

function liveUpdate(dt){
  if (!live) return;
  live.t += dt * (live.fast ? 5 : 1);
  const cum = rushCum(clamp(live.t / live.dur, 0, 1));     // ほかの店の杯数も数える
  for (const x of live.res.stores){ const el = document.getElementById('tick_' + x.st.id); if (el) el.textContent = Math.round(x.served * cum) + '杯'; }
  if (live.t >= live.dur){
    live.hold += dt;
    if (live.hold > (live.fast ? 0.2 : 0.8)){ const d = live.done; d(); }
  }
}

// 営業が終わったあとの結果
function showResult(rs){
  const sales = rs.reduce((a, r) => a + r.sales, 0), profit = rs.reduce((a, r) => a + r.profit, 0);
  const msgs = rs.flatMap(r => r.msgs);
  const last = rs[rs.length - 1];
  if (profit >= 0) Snd.cash(); else Snd.bad();
  let h = `<h2>${rs.length === 1 ? '🧾 きょうの結果' : `🧾 ${rs.length}日間の結果`}</h2>`;
  h += `<div class="sub" style="text-align:center">利益</div><div class="big num ${profit >= 0 ? 'plus' : 'minus'}" id="bigNum">${sgn(0)}</div>
    <div class="row" style="justify-content:center;gap:14px"><span class="sub">売り上げ ${yen(sales)}</span><span class="sub">お金 ${yen(S.cash)}</span></div>`;
  if (rs.length === 1){
    for (const s of last.stores){
      const a = AREAS[s.st.area];
      h += `<div class="card"><div class="row"><b>${a.emoji} ${a.name}店</b><b class="num ${s.profit >= 0 ? 'plus' : 'minus'}">${sgn(s.profit)}</b></div>
        <div class="row sub"><span>お客さん ${s.served}人（来たかった ${s.demand}人）</span><span>売り上げ ${yen(s.sales)}</span></div>
        <div class="sub">${s.lostCap ? `😣 ${s.lostCap}人が待ちきれず帰った　` : ''}${s.lostPrep ? `🍥 売り切れで${s.lostPrep}人帰った　` : ''}${s.prep > s.served ? `🗑 ${s.prep - s.served}杯分すてた　` : ''}満足度 ${s.sat}</div></div>`;
    }
    if (last.hq || last.ckCost || last.interest) h += `<div class="sub">本部 ${yen(last.hq)}・キッチン ${yen(last.ckCost)}・利子 ${yen(last.interest)} もひいています</div>`;
  }
  if (msgs.length) h += `<div class="card" style="margin-top:8px">${msgs.map(m => `<div class="log">${m}</div>`).join('')}</div>`;
  if (S.consults.length) h += `<div class="warn" style="background:#8a6a1f55;border-color:var(--gold)">📞 社長室に相談が${S.consults.length}件 来ています</div>`;
  if (S.cleared && !S.clearShown){ S.clearShown = true; save(); Snd.good(); h += `<div class="warn" style="background:#8a6a1f88;border-color:var(--gold);font-size:16px;text-align:center">🏆 10店舗のチェーン店になった！クリア！<br><span class="sub">${S.day}日かかった。このまま続けて「借金0円」もめざせる</span></div>`; }
  h += `<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
    ${S.consults.length ? '<button class="btn main" style="padding:12px 18px" id="toOffice">🏢 相談を聞く</button>' : ''}
    <button class="btn ${S.consults.length ? '' : 'main'}" style="padding:12px 30px" id="okBtn">OK</button></div>`;
  $('ovl').innerHTML = `<div class="ov"><div class="box">${h}</div></div>`;
  // 利益の数字をカウントアップ
  const el = $('bigNum'), t0 = performance.now();
  const up = now => { const k = clamp((now - t0) / 700, 0, 1); if (el.isConnected){ el.textContent = sgn(profit * (1 - (1 - k) ** 3)); if (k < 1) requestAnimationFrame(up); } };
  requestAnimationFrame(up);
  $('okBtn').onclick = () => { Snd.click(); $('ovl').innerHTML = ''; render(); };
  if ($('toOffice')) $('toOffice').onclick = () => { Snd.click(); $('ovl').innerHTML = ''; scene = 'office'; render(); };
}

function gameOver(why){
  S.over = true; save(); Snd.bad();
  $('ovl').innerHTML = `<div class="ov"><div class="box" style="text-align:center">
    <h2>💥 倒産…</h2><div>${why}</div>
    <div class="card" style="margin-top:10px;text-align:left">
      <div class="row"><span>つづいた日数</span><b>${S.day}日</b></div>
      <div class="row"><span>さいごのお店の数</span><b>${S.stores.length}店</b></div>
      <div class="row"><span>のこった借金</span><b>${yen(S.loan)}</b></div>
      <div class="row"><span>たっせいした目標</span><b>${Object.keys(S.goals).length} / ${GOALS.length}</b></div>
    </div>
    <div class="sub">ヒント：家賃と人件費は、お客さんが来なくても毎日かかる。出店は「人通り・ライバル・相場」をよく見て、借金はむりのない分だけ。</div>
    <button class="btn main" style="padding:12px 30px;margin-top:12px" id="againBtn">もう一度はじめる</button></div></div>`;
  $('againBtn').onclick = () => { localStorage.removeItem(SAVE_KEY); S = null; showStart(); };
}

/* =========================================================
   スタート画面（店の名前と、最初の物件を選ぶ）
   ========================================================= */
function titleBowl(){ return `<div style="font-size:54px;text-align:center;line-height:1.1;filter:drop-shadow(0 4px 6px #000a)">🍜</div>`; }
function showStart(){
  const saved = load();
  if (saved && !saved.over){
    $('ovl').innerHTML = `<div class="ov"><div class="box" style="text-align:center">
      ${titleBowl()}<div class="title">どんぶりチェーン</div>
      <div class="sub">1店のラーメン屋から、10店のチェーン店へ</div>
      <div class="card" style="margin-top:10px">${saved.shopName}・${saved.stores.length}店・${dateStr(saved.day)}</div>
      <button class="btn main" style="padding:12px 30px" id="contBtn">つづきから</button>
      <div style="margin-top:12px"><button class="btn" id="newBtn">はじめから</button></div></div></div>`;
    $('contBtn').onclick = () => { Snd.init(); S = fixSave(saved); $('ovl').innerHTML = ''; render(); };
    $('newBtn').onclick = () => { if (confirm('いまのデータは消えます。はじめからにしますか？')){ localStorage.removeItem(SAVE_KEY); startPick(); } };
    return;
  }
  startPick();
}
function startPick(){
  newGame(); fixSave(S);
  const card = L => { const a = AREAS[L.area]; return `<div class="card">
    <h3>${a.emoji} ${a.name}<span class="sub">（${a.kind}）</span></h3><div class="sub">${a.note}</div>
    <div class="row"><span>人通り ${a.traffic.toLocaleString()}人/日・ライバル${a.rivals}店・相場 ${yen(a.fair)}</span></div>
    <div class="row"><span>${L.seats}席・家賃 ${yen(L.rent)}/日</span><span>出店 <b>${yen(L.openCost)}</b></span></div>
    <div style="text-align:right"><button class="btn main" data-pick="${L.id}">ここにする</button></div></div>`; };
  $('ovl').innerHTML = `<div class="ov"><div class="box">
    ${titleBowl()}<div class="title">どんぶりチェーン</div>
    <div class="sub" style="margin:6px 0 8px">あなたは ${yen(S.cash)} を持って、ラーメン屋を始めることにした。
      小さな1店から、<b>10店のチェーン店</b>をめざそう。家賃・給料・材料は毎日かかる。お金がマイナスのまま3日たつと倒産！</div>
    <div class="sub">お店の名前（10文字まで・のれんには3文字）</div>
    <input type="text" id="nameIn" maxlength="10" value="${S.shopName}">
    <div class="sub" style="margin:10px 0 4px">最初のお店の場所を選ぼう</div>
    ${S.starters.map(card).join('')}</div></div>`;
  $('ovl').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    Snd.init(); Snd.good();
    const nm = $('nameIn').value.trim().slice(0, 10);
    if (nm) S.shopName = nm;
    openShop(S.starters.find(l => l.id === b.dataset.pick));
    delete S.starters;
    viewId = S.stores[0].id; scene = 'shop';
    save(); $('ovl').innerHTML = ''; render();
    toast('お店の絵をタップすると設定できる。決めたら「▶ 営業」！');
  });
}

/* ===== セーブ・ロード（localStorage） ===== */
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load(){ try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.stores ? s : null; } catch (e) { return null; } }
// 前の版のセーブにない項目をたす（前のセーブもそのまま遊べる）
function fixSave(s){
  s.consults = s.consults || [];
  s.cd = s.cd || {};
  for (const st of s.stores) if (st.mgr && !st.mgrName) st.mgrName = pick(MGR_NAMES);
  return s;
}

/* ===== ずっと回るループ（1秒に60回） ===== */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; T += dt;
  requestAnimationFrame(loop);    // 先に次をたのむ（エラーが出ても止まらないように）
  try {
    if (S && S.stores.length){
      liveUpdate(dt);
      if (scene === 'shop') shopUpdate(dt, viewed());
      Snd.bgm(dt);
    }
    drawStage();
  } catch (e) { console.error(e); }
}

/* テスト用：G.simDay() で アニメなしで1日進む */
window.G = {get S(){ return S; }, get live(){ return live; }, set S(v){ S = v; }, simDay, newGame, openShop, demandOf, capOf, autoPrep, AREAS, render, genConsults, setScene, fixSave};

fitStage();
showStart();
requestAnimationFrame(loop);
</script>
