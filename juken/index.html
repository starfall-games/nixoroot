   <div class="card"><table class="tbl">${res.report.map(x=>`<tr><td>${x.name}・${LVN[x.lv]}</td><td>${x.ok}/${x.N}</td></tr>${x.errs.map(e=>`<tr><td colspan=2 style="color:var(--ng);font-size:12px">${e}</td></tr>`).join('')}`).join('')}</table></div>`;
}

/* ---- 入力（タップ・キーボード） ---- */
function key(k){
  if(!sess||sess.done) return; snd('tap');
  if(k==='C') sess.input='';
  else if(k==='⌫') sess.input=sess.input.slice(0,-1);
  else if(sess.input.length<12){
    if(k==='/'&&(!/\d$/.test(sess.input)||sess.input.includes('/'))) return;
    if(k==='.'&&(!/\d$/.test(sess.input)||/[.\/と]/.test(sess.input))) return;
    if(k==='と'&&(!/^\d+$/.test(sess.input))) return;
    sess.input+=k;
  }
  const v=document.querySelector('#ab .val'); if(v){ v.className='val'+(sess.input?'':' ph'); v.innerHTML=sess.input?exprHTML(sess.input):'答えを入力'; }
}
const randomSet=()=>{ const items=[]; for(let i=0;i<5;i++){ const g=GL[Math.floor(Math.random()*GL.length)]; items.push({g:g.id,lv:1+Math.floor(Math.random()*2),seed:newSeed()}); } startSet(items,'random','おまかせ5問'); };
app.addEventListener('click',e=>{
  const st=e.target.closest('.stp'); if(st&&sess&&view==='play'){ sess.open=sess.open||{}; const i=st.dataset.st; sess.open[i]=!sess.open[i];
    if(sess.open[i]&&!sess.lastLog){ sess.pendTaps=sess.pendTaps||[]; if(!sess.pendTaps.includes(i)) sess.pendTaps.push(i); }
    if(sess.open[i]&&sess.lastLog){ const t=String(sess.lastLog[7]||'').split(',').filter(Boolean); if(!t.includes(i)){ t.push(i); sess.lastLog[7]=t.join(','); save(); } } const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.sch){ const id=b.dataset.sch, i=S.schools.findIndex(x=>x.id===id); if(i>=0) S.schools.splice(i,1); else if(S.schools.length<3){ const sc=SCHOOLS.find(x=>x.id===id); S.schools.push({id,name:sc.name,level:sc.level}); } else toast('えらべるのは3校までです'); save(); const q=document.getElementById('sf'); const v=q?q.value:''; setupQ=v; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(b.dataset.main){ const i=+b.dataset.main; const [x]=S.schools.splice(i,1); S.schools.unshift(x); save(); render(); return; }
  if(b.dataset.rm){ S.schools.splice(+b.dataset.rm,1); save(); render(); return; }
  if(b.dataset.go){ if(view==='play'&&b.dataset.go==='home'&&!confirm('セットをやめますか？')) return; go(b.dataset.go); return; }
  if(b.dataset.unit){ go('unit',b.dataset.unit); return; }
  if(b.dataset.start){ const g=b.dataset.start,lv=+b.dataset.lv; if(lv>FREE_MAX_LV&&!isPremium()){ go('pack'); return; } startSet(Array.from({length:5},()=>({g,lv,seed:newSeed()})),'unit',`${G[g].name}・${LVN[lv]}`); return; }
  if(b.dataset.noteone!==undefined){ const n=S.note[+b.dataset.noteone]; startSet([n],'note','まちがいノート'); return; }
  if(b.dataset.key){ if(view==='ta') taKey(b.dataset.key); else key(b.dataset.key); return; }
  const a=b.dataset.act;
  if(a==='finished'&&sess&&!sess.done){ sess.finSec=clampSec((performance.now()-sess.qt0)/1000-(sess.hid||0)); sess.done={paper:true,phase:'grade'}; stopQ(); render(); window.scrollTo(0,0); }
  if(a==='selfok'||a==='selfng') commit(a==='selfok',{paper:true});
  if(a==='giveup'&&sess&&!sess.done) commit(false,{paper:true,giveUp:true});
  if(a==='timeoutshow'&&sess&&!sess.done) commit(false,{paper:true,timeout:true});
  if(a==='tonote1'||a==='tonote0'){ if(sess&&sess.lastLog){ sess.lastLog[11]=a==='tonote1'?1:0; save(); toast('メモしたよ（記録は時間切れのままです）'); } }
  if(a==='paper'){ S.paper=!S.paper; save(); render(); }
  if(a==='answer') answer(false);
  if(a==='skip') answer(true);
  if(a==='extend') extend();
  if(a==='algtoggle'){ sess.open=sess.open||{}; sess.open.alg=!sess.open.alg; const y=window.scrollY; render(); window.scrollTo(0,y); }
  if(a==='hint'){ sess.hint=true; render(); }
  if(a==='next'){ sess.i++; if(sess.i<sess.items.length){ nextQ(); render(); window.scrollTo(0,0);} else finishSet(); }
  if(a==='quit'){ if(view==='ta'){ clearInterval(taTimer); taTimer=null; sess=null; go('ta'); return; } if(confirm('セットをやめますか？')) go('home'); }
  if(a==='noteall'){ startSet(S.note.slice(0,5).map(n=>({...n})),'note','まちがいノート'); }
  if(a==='random') randomSet();
  if(a==='weak') startWeak();
  if(a==='school') startSchool();
  if(a==='buy'){ gateQ=null; go('gate'); }
  if(a==='restore') restorePurchases();
  if(a==='gatego'){ const v=(document.getElementById('gin').value||'').trim(); if(+v===gateQ.ans&&v!==''){ gateQ=null; purchasePack(); go('pack'); } else { toast('ちがうよ。おとなの人にお願いしてね'); newGate(); render(); } }
  if(a==='setupdone'){ S.schoolsAsked=true; save(); go('home'); }
  if(a==='addcustom'){ const nm=(document.getElementById('cn').value||'').trim().slice(0,30), lv=+document.getElementById('cl').value; if(!nm){ toast('学校の名前を入れてね'); return; } if(S.schools.length>=3){ toast('えらべるのは3校までです'); return; } S.schools.push({id:null,name:nm,level:lv,custom:true}); save(); render(); }
  if(a==='tastart') taStart();
  if(a==='taans') taAnswer();
  if(a==='timer'){ S.timer=!S.timer; save(); render(); }
  if(a==='snd'){ S.snd=!S.snd; save(); render(); }
  if(a==='reset'){ if(confirm('本当に全部消しますか？ もとにもどせません。')){ const pr=S.premium===true; S=defSave(); S.premium=pr; SAVE=S; defHost(S); save(); go('home'); } }
});
function taKey(k){ if(!sess||sess.over) return; if(k==='C')sess.input=''; else if(k==='⌫')sess.input=sess.input.slice(0,-1); else if(sess.input.length<10) sess.input+=k;
  const v=document.querySelector('#ab .val'); if(v){ v.className='val'+(sess.input?'':' ph'); v.innerHTML=sess.input?exprHTML(sess.input):'答えを入力'; } }
app.addEventListener('input',e=>{ if(e.target.id==='sf'){ setupQ=e.target.value; const l=document.getElementById('slist'); if(l) l.innerHTML=schoolListHTML(); } });
app.addEventListener('change',e=>{ if(e.target.id==='goal'){ S.goal=+e.target.value; save(); } });
document.addEventListener('keydown',e=>{
  if(view!=='play'&&view!=='ta') return; const k=e.key;
  const inTA=view==='ta'&&sess&&sess.mode==='ta'&&!sess.over;
  if(/^[0-9]$/.test(k)||k==='/'||k==='.') { inTA?taKey(k):key(k); }
  else if(k==='Backspace'){ inTA?taKey('⌫'):key('⌫'); e.preventDefault(); }
  else if(k==='Enter'){ if(inTA) taAnswer(); else if(view==='play'){ if(sess.done&&!(sess.done.paper&&sess.done.phase==='grade')) app.querySelector('[data-act=next]')?.click(); else if(!sess.done&&S.paper) app.querySelector('[data-act=finished]')?.click(); else if(!sess.done) answer(false);} }
});

// テスト用：?test で自動チェック画面、window.SANSU でいろいろ呼べる
SANSU.state=()=>({view,sess,S});
window.__refresh=()=>{ if(['home','ana','pack','unit','settings'].includes(view)) render(); }; SANSU.purchasePack=purchasePack; SANSU.restorePurchases=restorePurchases; SANSU.weakLeft=weakLeft;
SANSU.go=go; SANSU.answerWith=(s)=>{ sess.input=s; answer(false); };
if(qs.has('test')) go('test'); else render();
}
</script>

  {t:'choice',q:'この文章で筆者が最も伝えたいこととして、適切なものを次から選び、記号で答えなさい。',c:['自分の弱さを知り、それを生かせる場所を見つけることも、一つの強さである。','植物はみな、人にふまれるほど強く育つ。','オオバコは、どんな植物と競争しても負けない。','雑草は人の役に立たないので、ぬいたほうがよい。'],e:'筆者の考えは、最後の⑤段落の傍線部②にまとめられています。説明文では<b>最後の段落</b>に筆者の主張が来ることが多いです。'},
  {t:'kiji',q:'オオバコが「ふまれる場所」で生きているのはなぜか。「競争」という言葉を使って、<b>五十字以内</b>で説明しなさい。',limit:50,must:'競争',pts:['ほかの植物との（光をうばい合う）競争に弱いこと','ふまれる場所では、ほかの植物が育ちにくいこと','ふまれても平気なつくりがあること（または、ふまれることで種が運ばれること）'],ex:'ほかの植物との光の競争には弱いが、ふまれても平気なので、ほかの草が育ちにくい場所なら生きられるから。',e:'④段落（競争に弱い）と②③段落（ふまれても平気・種が運ばれる）の両方をまとめます。理由を聞かれたら「〜から。」で終えましょう。'},
 ]},
 {id:'s-mono',lv:1,kind:'物語文',title:'バトンのあと',min:10,paras:[
  'ゴールの白いテープを切ったのは、となりのレーンの選手だった。',
  'ぼくらのチームは四位。地区大会の決勝に進めるのは三位までだ。第三走者のぼくが、バトンを受け取るときに一度手をすべらせたのが、すべてだった。',
  '「気にするなよ、湊」',
  'アンカーの大地が、ぼくの肩をたたいた。{1|いつもの大きな声ではなかった。}ぼくは「うん」とだけ言って、{2|すぐにくつのひもを結び直すふりをした。}顔を上げたら、何かがこぼれてしまいそうだった。',
  '帰り道、ぼくはわざと遠回りをして、河原の土手を歩いた。夕日が川の水をオレンジ色に光らせている。{3|きれいだと思う自分に、なんだか腹が立った。}',
  '土手の下のグラウンドでは、小さな子どもたちが鬼ごっこをしていた。一人の男の子が、何度も転んでは起き上がり、笑いながらまた走り出していく。ひざは砂だらけだ。',
  '（あんなに転んで、よく笑えるな。）',
  'そう思ったとき、ふと、四年生のころの自分を思い出した。足がおそくて、リレーの選手になんてなれるはずがないと思っていたころだ。毎朝、大地といっしょに公園を走った。最初は一周もついていけなかった。それでも、走るのは楽しかった。',
  'ぼくは立ち止まって、右手を開いた。バトンをにぎっていた手のひらに、まだ少しだけ赤いあとが残っている。',
  '（今日のぼくは、走るのが楽しかったっけ。）',
  '答えはすぐには出なかった。でも、さっきまで胸の中につまっていた重たいものが、ほんの少しだけ軽くなった気がした。',
  'ポケットの中で、スマートフォンがふるえた。大地からのメッセージだった。',
  '『明日の朝、いつもの公園な。』',
  'ぼくは返事を打とうとして、少し考えてから、短く一言だけ送った。',
  '『おう。』',
  'そして、土手の上を、家に向かって{4|走り出した。}',
 ],qs:[
  {t:'choice',q:'傍線部①から、大地のどんな様子が読み取れるか。最も適切なものを次から選び、記号で答えなさい。',c:['自分もくやしい気持ちをおさえて、湊を気づかっている様子。','バトンを落とした湊を、心の中で強く責めている様子。','走りつかれて、大きな声を出す元気もない様子。','結果には興味がなく、早く帰りたがっている様子。'],e:'いつもは大きな声の大地が、声を小さくしています。大地もくやしいはずですが、「気にするなよ」と湊を気づかっています。責めているなら「気にするな」とは言いません。'},
  {t:'choice',q:'傍線部②のように湊がしたのはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['泣きそうになっている顔を、大地に見られたくなかったから。','くつのひもが本当にほどけていたから。','大地の言葉に腹が立ち、返事をしたくなかったから。','早く次のレースの準備をしたかったから。'],e:'「<b>ふり</b>」なので、ひもはほどけていません。直後の「顔を上げたら、何かがこぼれてしまいそうだった」の「何か」は、なみだのことです。'},
  {t:'choice',q:'傍線部③のときの湊の気持ちとして、最も適切なものを次から選び、記号で答えなさい。',c:['負けてくやしいはずなのに、景色を美しいと感じてしまう自分を、ゆるせないような気持ち。','夕日がまぶしくて、前がよく見えないことにいらだつ気持ち。','遠回りをしたせいで、帰りがおそくなったことを後悔する気持ち。','優勝したチームのことを、うらやましく思う気持ち。'],e:'心はくやしさでいっぱいなのに、夕日を「きれい」と感じてしまった。その<b>ちぐはぐさ</b>に腹が立っているのです。'},
  {t:'choice',q:'河原で、転んでも笑って走る男の子を見たことは、湊にとってどんなきっかけになったか。最も適切なものを次から選び、記号で答えなさい。',c:['走ること自体が楽しかったころの自分を、思い出すきっかけ。','自分のほうが足が速いと、自信を取りもどすきっかけ。','子どもたちに走り方を教えてあげようと思うきっかけ。','リレーをやめて、別のスポーツを始めようと決めるきっかけ。'],e:'男の子を見たあと「四年生のころの自分」を思い出し、「それでも、走るのは楽しかった」と気づいています。'},
  {t:'nuki',q:'湊の心が少し軽くなったことがわかる一文をさがし、<b>初めの五字</b>をぬき出しなさい（句読点も一字に数えます）。',a:['でも、さっ'],e:'「<b>でも、さっ</b>きまで胸の中につまっていた重たいものが、ほんの少しだけ軽くなった気がした。」の一文です。'},
  {t:'choice',q:'『おう。』とだけ短く返事をしたことから、どんなことが読み取れるか。最も適切なものを次から選び、記号で答えなさい。',c:['多くを言わなくても大地の気持ちを受け止め、また走ろうと決めたこと。','大地にまだ腹を立てていて、話したくないこと。','スマートフォンで文字を打つのがめんどうだったこと。','明日の朝は公園に行けないと伝えたかったこと。'],e:'『明日の朝、いつもの公園な。』は「またいっしょに練習しよう」というさそいです。「おう。」は短い言葉ですが、その気持ちにこたえています。'},
  {t:'kiji',q:'傍線部④「走り出した」とあるが、このときの湊の気持ちを、<b>六十字以内</b>で説明しなさい。',limit:60,pts:['リレーでの失敗のくやしさ（落ちこみ）から、立ち直りかけていること','走ることの楽しさを思い出したこと','また大地といっしょに練習しよう（明日からがんばろう）という前向きな気持ち'],ex:'バトンの失敗でくやしく落ちこんでいたが、走る楽しさを思い出し、また明日から大地と練習しようと前向きになっている。',e:'物語の気持ちの記述は「<b>前の気持ち</b>（くやしい）→<b>きっかけ</b>（男の子・大地のメッセージ）→<b>後の気持ち</b>（前向き）」の順でまとめると書きやすいです。'},
 ]},
 {id:'s-shi',lv:1,kind:'詩',title:'土',author:'三好達治',min:4,poem:true,paras:['蟻が','蝶の羽をひいて行く','ああ','ヨットのやうだ'],
  note:'「やうだ」は昔のかなづかいで「ようだ」と読みます。',qs:[
  {t:'choice',q:'この詩で使われている表現技法として、最も適切なものを次から選び、記号で答えなさい。',c:['直喩（「〜のようだ」などを使ったたとえ）','擬人法（人でないものを人のように表す）','倒置法（言葉の順番を入れかえる）','反復（同じ言葉をくり返す）'],e:'「ヨットの<b>やうだ</b>（ようだ）」と、「ようだ」を使ってたとえているので<b>直喩</b>です。'},
  {t:'choice',q:'作者は、どのような様子を「ヨット」にたとえているか。最も適切なものを次から選び、記号で答えなさい。',c:['蟻が蝶の羽をひいて行く様子を、ヨットが帆を立てて進むすがたにたとえている。','蝶が空をとんでいく様子を、ヨットにたとえている。','蟻がたくさん集まっている様子を、ヨットの港にたとえている。','風にゆれる花を、ヨットにたとえている。'],e:'小さな蟻がひく<b>蝶の羽</b>が、ヨットの<b>帆</b>のように立って進んでいく様子です。'},
  {t:'choice',q:'三行目の「ああ」には、作者のどんな気持ちが表れているか。最も適切なものを次から選び、記号で答えなさい。',c:['小さな虫の動きの中に、思いがけない美しさを見つけたおどろきや感動。','蟻のはたらきがおそいことへのいらだち。','海に行けないことへのさびしさ。','蝶を助けられなかったことへのくやしさ。'],e:'「ああ」は、心が大きく動いたときの言葉です。足もとの小さな出来事が、広い海を進むヨットのように見えた<b>発見の感動</b>が表れています。'},
  {t:'nuki',q:'題名「土」を考えると、作者は地面の上を何に見立てていると考えられるか。<b>漢字一字</b>で答えなさい。',a:['海'],e:'ヨットが進むのは<b>海</b>です。地面（土）を海に、蝶の羽を帆に見立てています。'},
 ]},
 // ===== 上位 =====
 {id:'j-setsu',lv:2,kind:'説明文',title:'地図が捨てているもの',min:10,paras:[
  '①　駅前でもらった観光地図を広げてみる。そこには、駅と主な道、いくつかの寺や店が、色とりどりにえがかれている。けれども、道ばたの電柱や、家々のへい、その日にさいている花は、どこにもかかれていない。地図は、本当の町のすがたを、そのまま写したものではないのだ。',
  '②　もし、町にあるものをすべて地図にかきこんだら、どうなるだろうか。木の一本一本、看板の文字の一つ一つまでかきこめば、地図はたしかに本当の町に近づく。（　Ａ　）、それを手にした人は、かえって目的の場所を見つけられなくなるだろう。大切な道すじが、こまかな情報の中にうもれてしまうからである。',
  '③　つまり、地図にとって大切なのは、何をかくかと同じくらい、{1|何をかかないか}なのである。観光地図は名所をめぐる人のために、登山地図は山を歩く人のために、それぞれ必要なものだけを残し、ほかを思い切って捨てている。捨てることによって、地図ははじめて役に立つものになる。',
  '④　これは、地図だけの話ではない。わたしたちが人に何かを伝えるときも、同じことが言える。たとえば、昨日の出来事を友だちに話すとき、朝起きてから寝るまでのすべてを順番に話す人はいないだろう。相手が知りたいことは何か、自分が一番伝えたいことは何かを考え、話の中心となる部分を選び出しているはずだ。',
  '⑤　もちろん、捨てたものの中にも、大切なものはあるかもしれない。だからこそ、わたしたちは「何のために伝えるのか」をいつも考えておく必要がある。{2|目的がはっきりしていなければ、何を残し、何を捨てるかを決めることはできない}からだ。地図は、そのことをわたしたちに静かに教えてくれている。',
 ],qs:[
  {t:'choice',q:'空らん（　Ａ　）に入る言葉として、最も適切なものを次から選び、記号で答えなさい。',c:['しかし','だから','たとえば','なぜなら'],e:'前は「地図は本当の町に近づく」（よいこと）、後は「目的の場所を見つけられなくなる」（反対の結果）。前と後が<b>逆の内容</b>なので逆接の「しかし」です。'},
  {t:'choice',q:'傍線部①「何をかかないか」が大切なのはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['必要な情報だけを残すことで、使う人が目的の場所を見つけやすくなるから。','かかないほうが、地図を早く安く作ることができるから。','町の様子は毎日変わるので、こまかくかいてもむだになるから。','名所以外の場所は、だれにとっても大切ではないから。'],e:'②段落で「すべてをかくと大切な道すじがうもれる」、③段落で「捨てることによって、地図ははじめて役に立つ」と説明しています。'},
  {t:'nuki',q:'すべてをかきこんだ地図では、何が起こると筆者は述べているか。②段落から<b>二十四字</b>でぬき出しなさい（句読点も一字に数えます）。',a:['大切な道すじが、こまかな情報の中にうもれてしまう'],e:'②段落の最後「<b>大切な道すじが、こまかな情報の中にうもれてしまう</b>からである」から。「、」も一字に数えます。'},
  {t:'choice',q:'④段落の役割として、最も適切なものを次から選び、記号で答えなさい。',c:['地図の話を、人に何かを伝えるときにも当てはめて、話を広げている。','③段落の内容に反対する例をあげている。','地図の作り方を、具体的に説明している。','文章全体の結論をまとめている。'],e:'「これは、地図だけの話ではない」と書き、地図の話を<b>人に伝えること</b>に広げています（話題の発展）。'},
  {t:'choice',q:'本文の内容と合うものを次から一つ選び、記号で答えなさい。',c:['伝える目的をはっきりさせてこそ、何を残して何を捨てるかが決められる。','地図には、町にあるものをできるだけ多くかきこむべきだ。','捨てた情報の中には、大切なものは一つもない。','友だちに話すときは、出来事を起きた順にすべて話すのがよい。'],e:'⑤段落の内容です。ウは「捨てたものの中にも、大切なものはあるかもしれない」と<b>反対</b>のことが書かれています。'},
  {t:'kiji',q:'傍線部②とあるが、どういうことか。本文中の地図の例をふまえて、<b>六十字以内</b>で説明しなさい。',limit:60,pts:['目的によって、必要な情報（残すもの）がちがうこと','観光地図・登山地図など、地図の例にふれていること','何のために伝えるかが決まって初めて、残す情報と捨てる情報を選べること'],ex:'観光地図と登山地図で残すものがちがうように、何のために伝えるかが決まって初めて、残す情報と捨てる情報を選べるということ。',e:'「どういうことか」と聞かれたら、文末は「<b>〜ということ。</b>」。③段落の例（観光地図・登山地図）と⑤段落の主張をつなげます。'},
 ]},
 {id:'j-mono',lv:2,kind:'物語文',title:'ねこの消しゴム',min:11,paras:[
  '美羽が転校すると聞いたのは、夏休みが明けて三日目のことだった。',
  '「お父さんの仕事で、札幌に行くんだって」',
  'クラスの女子がそう話しているのを、わたしはろうかで聞いた。美羽とは一年生のときからずっと同じクラスで、帰り道もいっしょだった。それなのに、わたしはその話を、美羽本人からではなく、ほかの子から聞いたのだ。',
  'その日の帰り道、美羽はいつもより口数が少なかった。わたしは、{1|何も知らないふりをして}、昨日見たテレビの話ばかりした。美羽が何か言いかけるたびに、わざと声を大きくした。',
  '（　Ａ　）、わたしは聞きたくなかったのだ。美羽の口から「転校する」と言われてしまったら、それが本当になってしまう気がした。',
  '次の週、美羽は朝の会でみんなに転校のことを話した。教室がざわざわする中で、わたしは窓の外ばかり見ていた。休み時間になると、美羽のまわりにはすぐに人の輪ができた。わたしはその輪に入らず、本を開いたまま、{2|同じ行を何度も読んでいた}。',
  '出発の前の日の放課後、美羽がわたしの机の前に立った。',
  '「結衣、これ」',
  '差し出されたのは、小さな消しゴムだった。二年生のとき、二人で同じものを買った、ねこの形の消しゴムだ。わたしのはとっくになくしてしまったのに、美羽のものは、角が少し丸くなっただけで、まだそこにあった。',
  '「なんで、早く言ってくれなかったの」',
  '口から出たのは、{3|自分でもおどろくほどとがった声}だった。美羽は少しだけ目をふせた。',
  '「話そうとしたよ。でも、結衣、ずっとテレビの話してたから」',
  'わたしは何も言い返せなかった。言おうとしてくれていたのに、それをさえぎっていたのは、わたしのほうだったのだ。',
  '「ごめん」',
  'やっとそれだけ言うと、美羽は首を横にふって笑った。そのえがおが、にじんで見えた。',
  'その夜、わたしは消しゴムのケースをそっと外してみた。内側に、えんぴつの小さな字で何か書いてある。',
  '『ずっと友だち』',
  'わたしは消しゴムをにぎりしめたまま、引き出しから便せんを取り出した。明日の朝、駅まで走れば、まだ間に合うはずだ。',
 ],qs:[
  {t:'choice',q:'傍線部①「何も知らないふりをして」とあるが、わたしがそうしたのはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['美羽から転校の話を聞くと、それが本当のことになってしまう気がしたから。','美羽が転校することを、まだだれからも聞いていなかったから。','美羽に転校の話をされるのが、めんどうだったから。','美羽をおどろかせるために、知らないことにしておこうと思ったから。'],e:'すぐ後の段落に「美羽の口から『転校する』と言われてしまったら、それが本当になってしまう気がした」と<b>理由</b>が書かれています。'},
  {t:'choice',q:'空らん（　Ａ　）に入る言葉として、最も適切なものを次から選び、記号で答えなさい。',c:['本当は','しかも','ところが','たとえば'],e:'わざと明るくふるまっていたけれど、<b>本当は</b>聞きたくなかった、という「本心」を打ち明ける文です。'},
  {t:'choice',q:'傍線部②からわかる「わたし」の様子として、最も適切なものを次から選び、記号で答えなさい。',c:['本を読んでいるふりをしながら、美羽のことが気になって集中できない様子。','本の内容がむずかしくて、意味がよくわからない様子。','美羽よりも本のほうが大切だと思っている様子。','次の授業の準備に、いそがしくしている様子。'],e:'同じ行を何度も読むのは、内容が頭に入っていないからです。美羽のまわりの輪が<b>気になっている</b>のに、入れずにいます。'},
  {t:'choice',q:'傍線部③のような声になったのはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['さびしさや、自分に早く話してくれなかったと思うくやしさが、一度にあふれ出たから。','美羽が消しゴムをくれたことが、うれしくなかったから。','放課後に話しかけられて、早く帰りたかったから。','消しゴムをなくしたことを、責められると思ったから。'],e:'「なんで、早く言ってくれなかったの」という言葉から、<b>さびしさ</b>と<b>くやしさ</b>がおさえきれずに出たことがわかります。'},
  {t:'nuki',q:'「わたし」が、自分のほうにも悪いところがあったと気づいたことがわかる一文をさがし、<b>初めの五字</b>をぬき出しなさい（句読点も一字に数えます）。',a:['言おうとし'],e:'「<b>言おうとし</b>てくれていたのに、それをさえぎっていたのは、わたしのほうだったのだ。」の一文です。'},
  {t:'choice',q:'最後の段落で、「わたし」が便せんを取り出したことからわかることとして、最も適切なものを次から選び、記号で答えなさい。',c:['美羽の気持ちにこたえるため、自分の思いを手紙にして、出発前に伝えようと決めた。','美羽に消しゴムを返すため、駅に行こうと決めた。','転校のことをもう考えないように、手紙を書いて気をまぎらわせようとした。','美羽が自分を許していないと思い、あやまりの手紙を書くことにした。'],e:'『ずっと友だち』という言葉を読み、<b>自分の気持ちをきちんと伝えたい</b>と思ったのです。「まだ間に合うはずだ」から、明日の朝、駅へ行くつもりだとわかります。'},
  {t:'kiji',q:'この物語の中で、美羽に対する「わたし」の気持ちはどのように変わったか。<b>六十字以内</b>で説明しなさい。',limit:60,pts:['はじめは転校を受け入れられず、美羽をさけたり、話をさえぎったりしていたこと','美羽が話そうとしていたのに、自分がさえぎっていたと気づいて反省したこと','最後は美羽の思いを知り、自分の気持ちを伝えようと前向きになったこと'],ex:'転校を受け入れられず美羽をさけていたが、自分が話をさえぎっていたと気づいて反省し、最後は思いを伝えようと前向きになった。',e:'気持ちの変化は「<b>はじめ</b>→<b>きっかけ</b>→<b>最後</b>」の三つを入れて書きます。'},
 ]},
 {id:'j-shi',lv:2,kind:'詩',title:'風景　純銀もざいく',author:'山村暮鳥',min:6,poem:true,paras:[
  'いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','かすかなるむぎぶえ','いちめんのなのはな','',
  'いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','ひばりのおしやべり','いちめんのなのはな','',
  'いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','いちめんのなのはな','やめるはひるのつき','いちめんのなのはな'],
  note:'「おしやべり」は「おしゃべり」のこと。',qs:[
  {t:'choice',q:'この詩で最も目立つ表現技法を次から選び、記号で答えなさい。',c:['反復','直喩','擬人法','倒置法'],e:'「いちめんのなのはな」を何度も<b>くり返して（反復）</b>います。'},
  {t:'choice',q:'「いちめんのなのはな」をくり返すことで、どんな効果が生まれているか。最も適切なものを次から選び、記号で答えなさい。',c:['見わたすかぎり菜の花が広がる、どこまでも続く景色を感じさせる。','菜の花が少しずつ枯れていく様子を表している。','作者が菜の花をきらっていることを強調している。','菜の花の本数を、正確に読者に伝えている。'],e:'同じ行がならぶことで、目の前いっぱいに菜の花畑が<b>どこまでも広がる</b>感じが伝わります。'},
  {t:'choice',q:'「かすかなるむぎぶえ」「ひばりのおしやべり」は、作者が何によって感じとったものか。最も適切なものを次から選び、記号で答えなさい。',c:['耳（音）','目（色や形）','鼻（におい）','手（さわった感じ）'],e:'むぎぶえ（麦の茎で作った笛）の音も、ひばりの鳴き声も、<b>耳</b>で聞く音です。一面の黄色の中に、音がそっと入ってきます。'},
  {t:'choice',q:'「やめるはひるのつき」の意味として、最も適切なものを次から選び、記号で答えなさい。',c:['病んでいるように、青白くうすく見える昼間の月','やめてしまった昼の月見','昼になると消えてしまう夜の月','病院の窓から見える月'],e:'「やめる」は「<b>病める</b>（病気である）」。昼間の空にうすく白く見える月を、病人の顔色にたとえています。'},
  {t:'kiji',q:'この詩は、紙に書かれた文字を見ただけでも、ある景色がうかぶようにくふうされている。どのようなくふうか。<b>五十字以内</b>で説明しなさい。',limit:50,pts:['同じ行を何度もならべている（ひらがなだけで書いている）こと','文字のならび（見た目）そのものが、一面の菜の花畑のように見えること'],ex:'ひらがなの同じ行を何度もならべ、紙の上の文字そのものが、一面の菜の花畑のように見えるようにしている。',e:'題名の「もざいく（モザイク）」は、小さな石などをしきつめてえがく絵のこと。<b>文字をしきつめて絵にした</b>詩だと考えられます。'},
 ]},

 {id:'n-setsu',lv:3,kind:'説明文',title:'名前を知るということ',min:12,paras:[
  '①　散歩の途中で、見なれない鳥を見かけたとする。羽の色や、くちばしの形、鳴き声に、わたしたちはしばらく目をうばわれる。ところが、だれかが「あれはヒヨドリだよ」と教えてくれたとたん、多くの人は満足して、{1|また歩き出してしまう}。',
  '②　名前を知ることは、たしかに大切である。名前があれば、ほかの人とその鳥について話すことができるし、図鑑で調べることもできる。名前は、わたしたちが世界を整理し、人と知識を分かち合うための、すぐれた道具だといえる。',
  '③　（　Ａ　）、名前には思わぬ落とし穴もある。名前を知った瞬間に、わたしたちは「もうわかった」と感じてしまいやすいのだ。さっきまで目の前の一羽に向けられていた注意は、「ヒヨドリ」という一つの言葉の中に、すっぽりと収められてしまう。目の前にいるのは、ほかのどのヒヨドリともちがう、たった一羽の鳥であるにもかかわらず、である。',
  '④　子どもが「あれ、なに？」とたずねるとき、そこには純粋なおどろきがある。大人が名前を答えると、子どもはうなずく。けれども、本当に大切なのは、そのあとに続くはずの「どうしてあんなふうに鳴くのだろう」「何を食べているのだろう」という問いのほうではないだろうか。{2|名前は、問いの終わりではなく、始まりであるべきなのだ}。',
  '⑤　わたしたちは、知っている言葉が増えるほど、世界をよく知ったような気持ちになる。だが、言葉を知ることと、ものをよく見ることとは、同じではない。名前をいったん脇に置き、目の前のものをあらためて見つめ直すとき、見なれた世界は、思いがけない新しさをもってあらわれてくるはずである。',
 ],qs:[
  {t:'choice',q:'傍線部①「また歩き出してしまう」とあるが、筆者はこのような人のどんなところを問題にしているか。最も適切なものを次から選び、記号で答えなさい。',c:['名前を知っただけで、その鳥のことをわかったと思いこみ、それ以上見ようとしなくなるところ。','鳥の名前を知らないまま、その場を立ち去ってしまうところ。','鳥にきょうみがなく、はじめから見ようとしないところ。','鳥の名前を教えてくれた人に、お礼を言わないところ。'],e:'③段落に「名前を知った瞬間に、わたしたちは『もうわかった』と感じてしまいやすい」とあります。'},
  {t:'choice',q:'空らん（　Ａ　）に入る言葉として、最も適切なものを次から選び、記号で答えなさい。',c:['しかし','つまり','たとえば','そのうえ'],e:'②段落は名前の<b>よい点</b>、③段落は名前の<b>落とし穴（よくない点）</b>。反対の内容をつなぐので「しかし」です。'},
  {t:'nuki',q:'筆者は、名前のよい点をどのようなものだと述べているか。「〜道具」で終わる部分を、②段落から<b>二十七字</b>でぬき出しなさい（句読点も一字に数えます）。',a:['世界を整理し、人と知識を分かち合うための、すぐれた道具'],e:'②段落の最後「名前は、わたしたちが<b>世界を整理し、人と知識を分かち合うための、すぐれた道具</b>だといえる」から。'},
  {t:'choice',q:'傍線部②「名前は、問いの終わりではなく、始まりであるべきなのだ」とはどういうことか。最も適切なものを次から選び、記号で答えなさい。',c:['名前を知ったことをきっかけにして、そのものについてさらに疑問をもち、くわしく見ていくべきだということ。','名前を知らないものについては、問いをもつ必要がないということ。','名前を覚えるより先に、問いを立てる練習をするべきだということ。','子どもの問いには、大人が名前だけを答えてやればよいということ。'],e:'名前を知って「終わり」にせず、「どうして鳴くのだろう」などの<b>問いを始めるきっかけ</b>にするべきだ、という意味です。'},
  {t:'choice',q:'本文の内容に<b>合わないもの</b>を次から一つ選び、記号で答えなさい。',c:['名前は人と知識を分かち合うじゃまになるので、なるべく覚えないほうがよい。','名前を知ると、「もうわかった」と感じてしまいやすい。','同じ名前でよばれるものでも、一つ一つはちがっている。','知っている言葉が増えると、世界をよく知ったような気持ちになる。'],e:'筆者は②段落で名前を「すぐれた道具」と<b>みとめて</b>います。名前を覚えるなとは言っていません。「合わないもの」を選ぶ問題は、問題文をよく読みましょう。'},
  {t:'kiji',q:'筆者は、ものとどのように向き合うことが大切だと考えているか。本文全体をふまえて、<b>七十字以内</b>で説明しなさい。',limit:70,pts:['名前を知っただけで、わかったつもりにならないこと','名前を、問いを始めるきっかけにすること','名前をいったん脇に置き、目の前のもの（一つしかないもの）をよく見つめ直すこと'],ex:'名前を知っただけでわかったつもりにならず、名前を問いの始まりとして、目の前のものをあらためてよく見つめ直すことが大切だと考えている。',e:'③（わかったつもりの落とし穴）・④（問いの始まり）・⑤（見つめ直す）の三つの段落から、筆者の考えをまとめます。'},
 ]},
 {id:'n-mono',lv:3,kind:'物語文',title:'秒針の音',min:13,paras:[
  '祖父の仕事場は、いつも油のにおいがした。',
  '小さな机の上には、ふたを外された腕時計がならび、祖父は片目にルーペをはめて、ピンセットの先で米つぶほどの部品をつまんでいる。ぼくが入っていっても、祖父は顔を上げない。カチ、カチ、という音だけが、部屋の中で時間をきざんでいた。',
  '「じいちゃん、それ、直してもまた止まるんじゃないの」',
  'ぼくは、机のすみに置かれた古い腕時計を指さした。銀色のふちはくもり、ガラスには細かい傷がいくつも走っている。',
  '「スマホがあれば、時間なんていつでもわかるのに」',
  '言ってしまってから、しまったと思った。祖父の手が、ほんの一瞬止まったからだ。けれども祖父は、{1|何も言わずにまた手を動かし始めた}。',
  'しばらくして、祖父はぽつりと言った。',
  '「これはな、おまえの父さんが、初めての給料で買った時計だ」',
  'ぼくはおどろいて、もう一度その時計を見た。父は、ぼくが四歳のときに病気で亡くなった。父のことを、ぼくはあまり覚えていない。覚えているのは、大きな手と、笑うと目じりにできるしわくらいだ。',
  '「父さんはな、この時計を、それはだいじにしていた。止まるたびに、ここへ持ってきたもんだ。直せばまた動くって、信じてたんだろうな」',
  '祖父はルーペを外し、時計をぼくの手のひらにのせた。思っていたよりもずっと重い。耳を近づけると、かすかに、けれどもたしかに、カチ、カチ、と音がした。',
  '「……動いてる」',
  'ぼくは小さくつぶやいた。{2|その音は、ぼくの胸のおくのほうで、何かをノックしているようだった。}',
  '「動いているうちは、時計は生きてる。人が手をかければ、ちゃんと応えてくれる」',
  '祖父はそう言って、少しだけ笑った。その目じりに、見覚えのあるしわができていた。',
  'その夜、ぼくは自分の部屋で、時計を左の手首に巻いてみた。ベルトはぶかぶかで、時計はすぐに手首の内側へくるりと回ってしまう。{3|ぼくはそれを何度も直しながら、いつまでも秒針の音を聞いていた。}',
 ],qs:[
  {t:'choice',q:'「祖父の手が、ほんの一瞬止まった」のはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['孫の何気ない言葉が、息子の思い出のつまった時計を軽く見ているように聞こえ、心が動いたから。','孫に仕事のじゃまをされて、腹が立ったから。','小さな部品を、うっかり落としそうになったから。','孫の言うとおり、時計を直してもむだだと気づいたから。'],e:'この時計は、亡くなった息子（ぼくの父）が<b>だいじにしていた</b>時計です。それを「スマホがあれば」と言われ、祖父の心がゆれたのです。'},
  {t:'choice',q:'傍線部①から読み取れる祖父の人物像として、最も適切なものを次から選び、記号で答えなさい。',c:['孫の言葉に心をゆさぶられながらも、それを顔に出さず、だまって自分の仕事を続ける人物。','孫の話に興味がなく、仕事のことしか考えていない人物。','孫をきびしくしかるために、わざと無視している人物。','時計を直すことをあきらめ、手を動かしているふりをしている人物。'],e:'手が「一瞬止まった」（心が動いた）のに、「何も言わずに」仕事を続けています。<b>感情を表に出さない</b>、職人らしい人物です。'},
  {t:'choice',q:'傍線部②の表現の説明として、最も適切なものを次から選び、記号で答えなさい。',c:['「ようだった」というたとえを使い、時計の音が、ぼくの心の中にある父への思いを呼び起こそうとしている様子を表している。','時計の音が大きすぎて、ぼくの胸がどきどきしている様子を表している。','時計がこわれていて、変な音がしていることを表している。','ぼくが、早く部屋から出たいとあせっている様子を表している。'],e:'「ノックしているようだった」は<b>直喩</b>。父の時計の音が、心のおくにしまわれていた<b>父への思い</b>の「とびら」をたたいている、というイメージです。'},
  {t:'nuki',q:'祖父の顔に、ぼくが父のおもかげを感じたことがわかる表現を、本文中から<b>六字</b>でぬき出しなさい。',a:['見覚えのある'],e:'「その目じりに、<b>見覚えのある</b>しわができていた」。ぼくが覚えている父の「笑うと目じりにできるしわ」と重なっています。'},
  {t:'choice',q:'祖父の「動いているうちは、時計は生きてる。人が手をかければ、ちゃんと応えてくれる」という言葉にこめられた思いとして、最も適切なものを次から選び、記号で答えなさい。',c:['時計のことを言いながら、大切なものは手をかけ続ければ、思いとともに生き続けるのだと孫に伝えたい思い。','スマートフォンより時計のほうが便利だと、孫にわからせたい思い。','時計を直す仕事を、孫にぜひついでほしいという思い。','こわれた物は、すぐに新しい物に買いかえたほうがよいという思い。'],e:'時計の話の形をとりながら、父の思い出も<b>手をかければ生き続ける</b>ことを伝えています。物語文では、登場人物の言葉が二重の意味をもつことがよくあります。'},
  {t:'kiji',q:'傍線部③とあるが、このときの「ぼく」の気持ちを、時計に対する見方の変化にふれて、<b>八十字以内</b>で説明しなさい。',limit:80,pts:['はじめは古い時計を、スマホがあればいらない物だと軽く見ていたこと','父が大切にしていた時計だと知り、その音に父とのつながりを感じたこと','時計（父の思い出）をいとおしく、大切にしたいと思っていること'],ex:'古い時計をスマホがあればいらない物だと軽く見ていたが、父が大切にしていた時計だと知り、その音に父とのつながりを感じて、いとおしく大切に思っている。',e:'「見方の変化にふれて」とあるので、<b>前の見方</b>（いらない物）と<b>後の見方</b>（父とつながる大切な物）の両方を書きます。'},
 ]},
 {id:'n-shi',lv:3,kind:'詩',title:'素朴な琴',author:'八木重吉',min:6,poem:true,paras:['この明るさのなかへ','ひとつの素朴な琴をおけば','秋の美しさに耐へかね','琴はしづかに鳴りいだすだらう'],
  note:'昔のかなづかい：耐へかね（たえかね）・しづかに（しずかに）・だらう（だろう）。',qs:[
  {t:'choice',q:'この詩で使われている表現技法として、最も適切なものを次から選び、記号で答えなさい。',c:['擬人法','直喩','倒置法','対句'],e:'琴が秋の美しさに「<b>耐へかね</b>（がまんしきれず）」鳴り出す、と<b>人のように</b>書いているので擬人法です。'},
  {t:'choice',q:'「この明るさ」とは、何の明るさだと考えられるか。最も適切なものを次から選び、記号で答えなさい。',c:['秋の日の、すみきった光の明るさ','部屋の電灯の明るさ','作者の明るい性格','夜明けの空の明るさ'],e:'三行目に「秋の美しさ」とあります。秋のすんだ空気の中の<b>光</b>の明るさです。'},
  {t:'choice',q:'「耐へかね」の意味として、最も適切なものを次から選び、記号で答えなさい。',c:['がまんしきれなくなって','じっとがまんして','しかたなく','おそるおそる'],e:'「〜かねる」は「〜しきれない・〜できない」という意味です。'},
  {t:'choice',q:'最後の「だらう（だろう）」という言い方から、どんなことがわかるか。最も適切なものを次から選び、記号で答えなさい。',c:['実際に起きたことではなく、作者が心の中で思いえがいていることだということ。','実際に琴が鳴ったのを、作者が聞いたということ。','ほかの人から聞いた話だということ。','読者に、琴をおくように命令しているということ。'],e:'「〜ば」「〜だろう」は<b>仮定と推量</b>。「もし琴をおいたなら、きっと鳴り出すだろう」という<b>想像</b>です。'},
  {t:'kiji',q:'この詩で作者が伝えたかったことは何か。「琴」が何を表しているかにふれて、<b>六十字以内</b>で説明しなさい。',limit:60,pts:['秋の光の美しさに、深く感動していること','琴は、作者の（素朴な）心をたとえていると考えられること','だれもひかないのに、ひとりでに鳴り出すほど心がふるえていること'],ex:'秋の光があまりに美しく、素朴な琴のような自分の心も、だまっていられずにひとりでに鳴り出すほど感動しているということ。',e:'琴は「ひかなければ鳴らない」もの。それが<b>ひとりでに</b>鳴るほどの美しさ、というところがこの詩の中心です。'},
 ]},
 // ===== 最難関 =====
 {id:'s4-setsu',lv:4,kind:'説明文',title:'迷うことの意味',min:14,paras:[
  '①　知らない町でも、今では道に迷うことはほとんどない。手元の画面に行き先を入れれば、地図の上に青い線が引かれ、曲がり角に来るたびに音声が次の行動を教えてくれる。わたしたちは、目的地までの最短の道すじを、ほとんど考えることなくたどることができるようになった。',
  '②　これはまぎれもなく便利なことである。むだな時間が省かれ、約束の時間に遅れることも少なくなった。しかし、その便利さと引きかえに、わたしたちは何かを手放してはいないだろうか。',
  '③　かつて、知らない町を歩くことは、多かれ少なかれ「迷う」ことと同じだった。人は、太陽の位置や遠くに見える塔、坂の上り下りといった手がかりを、自分の体で一つ一つ確かめながら進んだ。道をまちがえれば、見たこともない路地に入りこみ、思いがけない店や景色に出会うこともあった。迷うことは、たしかに不安でむだの多い体験である。（　Ａ　）、それは同時に、世界と直接に向き合い、自分の感覚で世界を確かめていく体験でもあったのだ。',
  '④　画面の指示どおりに歩くとき、わたしたちの目は、町よりも画面のほうに向けられがちである。目的地に着いたとき、そこまでの道のりをほとんど覚えていないということも少なくない。そのとき、町はわたしたちにとって、ただ{1|通過するだけの背景}になってしまっている。',
  '⑤　もちろん、だからといって便利な道具を捨てるべきだと言いたいのではない。問題は、道具に頼ることそのものではなく、{2|道具がすべてを先回りしてくれることで、わたしたちが自分で考え、感じる機会を知らず知らずのうちに失っていく}ことにある。便利さは、それが便利であるがゆえに、わたしたちに失ったものの存在を気づかせにくい。',
  '⑥　ときには画面を閉じ、あえて遠回りをしてみるのもよいだろう。迷い、立ち止まり、あたりを見回すとき、わたしたちは再び世界の手ざわりを取りもどす。{3|迷うことは、むだではなく、世界と出会い直すための一つの方法}なのである。',
 ],qs:[
  {t:'choice',q:'空らん（　Ａ　）に入る言葉として、最も適切なものを次から選び、記号で答えなさい。',c:['だが','だから','たとえば','すなわち'],e:'前は迷うことの<b>悪い面</b>（不安でむだが多い）、後は<b>よい面</b>（世界と向き合う体験）。逆接の「だが」が入ります。'},
  {t:'choice',q:'傍線部①「通過するだけの背景」とはどういうことか。最も適切なものを次から選び、記号で答えなさい。',c:['町が、自分の目で見たり感じたりする対象ではなく、目的地へ向かう間にただ過ぎていくものになっているということ。','町の景色が美しすぎて、通りすぎるのがもったいないということ。','町が、写真をとるための背景としてしか使われていないということ。','町の道が複雑で、通りぬけることがむずかしいということ。'],e:'目は画面に向き、道のりも覚えていない。町は「向き合う相手」ではなく、<b>ただ後ろに流れていくもの</b>になっている、ということです。'},
  {t:'nuki',q:'筆者は、「迷う」ことのよい面を、どのような体験だと述べているか。「〜体験」に続くように、③段落から<b>二十六字</b>でぬき出しなさい（句読点も一字に数えます）。',a:['世界と直接に向き合い、自分の感覚で世界を確かめていく'],e:'③段落の最後「それは同時に、<b>世界と直接に向き合い、自分の感覚で世界を確かめていく</b>体験でもあったのだ」から。'},
  {t:'choice',q:'傍線部②を筆者が「問題」だと考えるのはなぜか。最も適切なものを次から選び、記号で答えなさい。',c:['便利さに慣れると、何を失ったのかにさえ気づかないまま、自分で考え感じる力を使わなくなってしまうから。','便利な道具は値段が高く、だれもが使えるわけではないから。','道具の指示がまちがっていることが多く、かえって道に迷ってしまうから。','道具を使うと、約束の時間に遅れることが増えるから。'],e:'⑤段落の最後「便利さは、それが便利であるがゆえに、わたしたちに失ったものの存在を<b>気づかせにくい</b>」がポイントです。'},
  {t:'multi',n:2,q:'筆者の考えに合うものを次から<b>二つ</b>選び、記号で答えなさい。',c:['便利な道具を使うこと自体が悪いわけではない。','迷うことには、不安やむだだけでなく、世界と直接向き合うという面もある。','道に迷わないように、画面の指示にはつねに従うべきだ。','便利な道具はすべて捨てて、昔の生活にもどるべきだ。','目的地までの道のりは、覚えておく必要がない。'],e:'⑤段落「便利な道具を捨てるべきだと言いたいのではない」、③段落「同時に、世界と直接に向き合い…」の二つです。「すべて」「つねに」など<b>言いすぎの選択肢</b>に注意。'},
  {t:'kiji',q:'傍線部③とあるが、筆者がそのように考えるのはなぜか。本文全体をふまえて、<b>八十字以内</b>で説明しなさい。',limit:80,pts:['便利な道具に頼ると、町がただの背景になり、自分で考え感じる機会を失ってしまうこと','迷うときには、自分の感覚で手がかりを確かめながら、世界と直接向き合えること','迷うことで、思いがけない出会いや世界の手ざわりを取りもどせること'],ex:'便利な道具に頼ると町はただの背景になり考え感じる機会を失うが、迷うときには自分の感覚で世界と直接向き合い、思いがけない出会いや手ざわりを取りもどせるから。',e:'「便利さで失うもの（④⑤）」と「迷うことで得られるもの（③⑥）」を<b>対比</b>させてまとめると、筆者の理由がはっきりします。文末は「〜から。」。'},
 ]},
 {id:'s4-mono',lv:4,kind:'物語文',title:'しおりの場所',min:14,paras:[
  '「長いあいだ　ありがとうございました」',
  '商店街のはずれにある古本屋のシャッターに、そんな紙がはられているのを見つけたのは、塾へ向かう途中のことだった。',
  'ぼくは自転車を止めた。紙のすみが、風にめくれてかさかさと鳴っている。閉店は、今週の土曜日と書いてあった。',
  '三年生のころまで、ぼくはほとんど毎日この店に通っていた。棚と棚のあいだの細い通路にすわりこみ、買えもしない図鑑や冒険小説を、店じまいの時間まで読みふけった。店主のおじいさんは、レジの奥で新聞を広げたまま、一度もぼくを追い出さなかった。',
  'それが、いつのまにか足が遠のいていた。塾に通い始めてからは、この店の前を通るときでさえ、ぼくは少し速くペダルをこいだ。{1|なぜそうしていたのか、自分でもうまく説明できなかった。}',
  '土曜日の夕方、ぼくは塾の帰りに、店の前に立っていた。シャッターは半分だけ開いていて、中から段ボールを運ぶ音が聞こえる。',
  'かがんで中をのぞくと、おじいさんが顔を上げた。前よりも少し背中が丸くなったように見えた。',
  '「大きくなったな」',
  'それだけ言うと、おじいさんは棚のいちばん下の段に手をのばし、一冊の本を取り出した。表紙のすり切れた、海の冒険の物語だった。ぼくが最後まで読み終えないまま、通わなくなった本だ。',
  '「これは売り物にならんから」',
  'おじいさんはそう言って、本をぼくの胸に押しつけた。ページのあいだから、色あせたしおりが一枚のぞいている。ぼくが、あの日はさんだままにしていたしおりだった。',
  '（　Ａ　）。ぼくはそれを言葉にしようとしたが、のどのところで何かがつかえて、出てきたのは「どうも」という、かすれた声だけだった。',
  'おじいさんは、それで十分だというように、軽く手をあげた。そしてまた、段ボールの山のほうへもどっていった。',
  '帰り道、ぼくは自転車を押して歩いた。商店街の明かりが、一つ、また一つとともり始める。{2|わきにかかえた本は、思っていたよりもずっと軽かった。}',
  '家に着くと、ぼくは塾のかばんを床に置いたまま、しおりのはさまったページを開いた。{3|物語の中の船は、三年前と同じ場所で、ぼくが乗りこむのを待っていた。}',
 ],qs:[
  {t:'choice',q:'傍線部①とあるが、このころの「ぼく」の気持ちとして、最も適切なものを次から選び、記号で答えなさい。',c:['塾に通う今の自分と、本に夢中だったころの自分との間に距離ができ、店に近づくとなんとなく気まずいような気持ち。','店主のおじいさんに、しかられるのがこわいという気持ち。','古本屋の本はもう全部読んでしまい、行く理由がないという気持ち。','塾に遅れないよう、少しでも急がなければならないという気持ち。'],e:'理由がはっきりしないまま「少し速くペダルをこいだ」。本に夢中だった<b>昔の自分</b>から離れてしまった<b>うしろめたさ</b>のような、言葉にしにくい気持ちです。'},
  {t:'choice',q:'空らん（　Ａ　）に入る文として、最も適切なものを次から選び、記号で答えなさい。',c:['おじいさんは、この本をずっととっておいてくれたのだ','おじいさんは、ぼくのことをすっかり忘れていたのだ','この本は、だれにも売れずに残っていただけなのだ','おじいさんは、店をたたむのが少しもさびしくないのだ'],e:'しおりが<b>あの日のまま</b>はさまっていたことから、おじいさんが三年間この本をとっておいてくれたと気づいたのです。「売り物にならん」は、てれかくしの言葉です。'},
  {t:'choice',q:'「おじいさんは、それで十分だというように、軽く手をあげた」からわかるおじいさんの気持ちとして、最も適切なものを次から選び、記号で答えなさい。',c:['うまく言葉にならなくても、ぼくの感謝の気持ちはちゃんと伝わっていると受け止めている。','ぼくの返事が短すぎて、がっかりしている。','早く片づけをしたいので、ぼくに帰ってほしいと思っている。','本をわたしたことを、少し後悔している。'],e:'「それで十分だ」＝かすれた「どうも」だけで<b>気持ちは伝わった</b>、ということです。'},
  {t:'nuki',q:'「ぼく」が本に夢中になっていたことがよくわかる言葉を、本文中から<b>六字</b>でぬき出しなさい。',a:['読みふけった'],e:'「店じまいの時間まで<b>読みふけった</b>」。「ふける」は、一つのことに夢中になるという意味です。'},
  {t:'choice',q:'傍線部②の表現の説明として、最も適切なものを次から選び、記号で答えなさい。',c:['本そのものの重さだけでなく、店をさけていたうしろめたさがとけて、ぼくの心が軽くなったことも表している。','古い本なので、紙がかわいて実際に軽くなっていたことを表している。','本に興味がなくなり、どうでもよくなったことを表している。','重い荷物を持つのに慣れて、力がついたことを表している。'],e:'物語では、物の様子に<b>人物の心</b>が重ねて書かれることがあります。「思っていたよりも」軽いのは、ぼくの心の変化を表しています。'},
  {t:'kiji',q:'傍線部③とあるが、この表現にはどのような「ぼく」の気持ちが表れているか。<b>八十字以内</b>で説明しなさい。',limit:80,pts:['おじいさんが本としおりをそのまま残してくれていたことに気づいたこと','本に夢中だったころの自分（三年前の自分）とつながり直せたこと','読みかけの物語の続きを、また楽しもうとしていること'],ex:'おじいさんがしおりごと本をとっておいてくれたおかげで、本に夢中だったころの自分にもどれた気がして、読みかけの物語の続きをまた楽しもうとしている。',e:'「船が待っていた」は<b>擬人法</b>。三年前のしおりの場所から、止まっていた物語（と昔の自分）が<b>また動き出す</b>ことを表しています。'},
 ]},
 {id:'s4-shi',lv:4,kind:'詩',title:'道程',author:'高村光太郎',min:7,poem:true,paras:['僕の前に道はない','僕の後ろに道は出来る','ああ、自然よ','父よ','僕を一人立ちにさせた広大な父よ','僕から目を離さないで守る事をせよ','常に父の気魄を僕に充たせよ','この遠い道程のため','この遠い道程のため'],
  note:'道程（どうてい）＝道のり。気魄（きはく）＝強い気力。充たせよ（みたせよ）＝いっぱいにせよ。',qs:[
  {t:'choice',q:'一行目と二行目で使われている表現技法として、最も適切なものを次から選び、記号で答えなさい。',c:['対句','直喩','倒置法','体言止め'],e:'「僕の前に道はない／僕の後ろに道は出来る」は、形をそろえて意味を対立させた<b>対句</b>です。'},
  {t:'choice',q:'一行目と二行目は、どういうことを表しているか。最も適切なものを次から選び、記号で答えなさい。',c:['だれかが用意した生き方はなく、自分が歩んだあとに、自分だけの生き方ができていくということ。','目の前の道が工事中で、通れないということ。','前に進むのをやめて、後ろにもどるべきだということ。','ほかの人が作った道を、そのまま歩いていけばよいということ。'],e:'「道」は<b>生き方・人生</b>のたとえ。決められた道はなく、<b>自分で切り開いていく</b>という決意です。'},
  {t:'nuki',q:'作者は「自然」を何とよびかえているか。詩の中から<b>漢字一字</b>でぬき出しなさい。',a:['父'],e:'「ああ、自然よ／<b>父</b>よ」。自分を一人立ちさせ育ててくれた存在として、自然を父とよんでいます。'},
  {t:'choice',q:'最後の二行で「この遠い道程のため」をくり返していることの効果として、最も適切なものを次から選び、記号で答えなさい。',c:['これから長い人生を自分の力で歩んでいくという強い決意を、強調している。','道のりが遠すぎて、もう歩きたくないという気持ちを表している。','書きまちがいを、そのまま残している。','父にもう一度、道を教えてほしいとたのんでいる。'],e:'<b>反復</b>によって、遠い道のり（人生）へ向かう<b>決意の強さ</b>が強調されています。'},
  {t:'multi',n:2,q:'この詩の内容に合うものを次から<b>二つ</b>選び、記号で答えなさい。',c:['作者は、自然を自分を育てた父のように感じ、呼びかけている。','作者は、自分の力で人生を切り開いていこうと決意している。','作者は、だれにもたよらず、自然からもはなれて生きたいと願っている。','作者は、すでに歩いた道をふり返り、後悔している。','作者は、父の言いつけに従って、決められた道を歩こうとしている。'],e:'作者は一人で歩む決意をしながらも、「目を離さないで守る事をせよ」と<b>自然（父）に見守りを願って</b>います。「自然からもはなれて」は合いません。'},
  {t:'kiji',q:'「常に父の気魄を僕に充たせよ」とあるが、作者はなぜ「自然」にこのように願っているのか。<b>七十字以内</b>で説明しなさい。',limit:70,pts:['前に道のない、遠い道のり（人生）を、自分の力で切り開いていかなければならないこと','一人で進むには、強い気力が必要なこと','自分を一人立ちさせた自然（父）に、いつも力をあたえ見守ってほしいこと'],ex:'だれも道を用意してくれない遠い人生を自分の力で切り開くには強い気力が必要なので、自分を育てた自然に、いつも力をあたえ見守ってほしいから。',e:'一・二行目（道はない＝自分で切り開く）と、最後の二行（遠い道程のため）をつなげて理由を書きます。'},
 ]},
];

function dayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayStr(d);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mark(s){return esc(s).replace(/【(.+?)】/,'<span class="tgt">$1</span>');}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}
function level(){const lv=1+Math.floor(Math.sqrt(S.xp/40));const a=40*(lv-1)*(lv-1),b=40*lv*lv;return{lv,p:(S.xp-a)/(b-a)};}
function title(lv){return lv<3?'ことばのたね':lv<5?'ことばの芽':lv<8?'ことばの若葉':lv<12?'ことばの木':lv<17?'ことばの森':'ことばの達人';}
function streakNow(){return(S.lastDay===dayStr()||S.lastDay===yesterday())?S.streak:0;}

// 単元のうち、いまのレベルで出る問題の番号
// 問題の「レベル」：データの最後が数字なら、それがレベル（1標準〜4最難関）。数字がない問題は、標準・上位の共通の問題
function itemLv(it){const l=it[it.length-1];return typeof l==='number'?l:0;}
// この問題を、レベル L のときに出すか：読み・書き取り・使い分けは、同じレベルの問題だけ。
// ほかの語句の単元（同音異義語・四字熟語・ことわざ・対義語）は、レベルの印がある問題はそのレベルだけ、印がない問題は標準・上位（1〜2）だけ
function inLevel(u,it,L){const l=itemLv(it);return UNITS[u].lv?l===L:(l?l===L:L<=2);}
function unitIdx(u){const U=UNITS[u],c=curLv();return U.items.map((_,i)=>i).filter(i=>inLevel(u,U.items[i],c));}
function mastered(u){return unitIdx(u).filter(i=>{const r=S.items[u+':'+i];return r&&r.s>=2;}).length;}
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}

// ---------- 音（?mute か 設定でオフ） ----------
let AC=null;
function snd(kind){
  if(MUTE||S.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='ok'?[660,880]:kind==='ng'?[220,180]:kind==='alarm'?[880,0,880,0,880]:[520,660,880];
    notes.forEach((f,i)=>{if(!f)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;
      const t=AC.currentTime+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+0.3);});
  }catch(e){}
}

/* ---------- タイマー ----------
   合格する人の目安の時間で数える。0になったら「時間です」のまど。
   「延長」は合わせて最大2分まで。延長しきって0になったら、自動で答え合わせ。 */
const TM={id:0,end:0,total:0,ext:0,step:30,onUp:null,onTick:null,running:false};
function tStart(sec,step,onTick,onUp){
  tStop();Object.assign(TM,{total:sec,ext:0,step,onTick,onUp,end:performance.now()+sec*1000,running:true});
  TM.id=setInterval(tTick,200);tTick();
}
function tTick(){
  if(!TM.running)return;const left=Math.max(0,(TM.end-performance.now())/1000);if(TM.onTick)TM.onTick(left);
  if(left<=0){clearInterval(TM.id);TM.running=false;tUp();}
}
function tStop(){TM.running=false;clearInterval(TM.id);closeModal();}
function tUp(){
  snd('alarm');
  if(TM.ext>=EXT_MAX){toast('延長の時間も終わりました。答え合わせ！');TM.onUp();return;}
  const add=Math.min(TM.step,EXT_MAX-TM.ext);
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML='<div class="box"><h2>⏰ 時間です</h2><p class="muted">合格する人がだいたい解き終える時間になりました。'+(TM.ext?'（延長 '+TM.ext+'秒 ずみ）':'')+'</p>'+
   '<button class="btn" id="mGrade">答え合わせする</button><div style="height:10px"></div>'+
   '<button class="btn sub" id="mExt">延長する（＋'+(add>=60?add/60+'分':add+'秒')+'）<br><span class="muted">延長はあと '+(EXT_MAX-TM.ext)+'秒 まで</span></button></div>';
  document.body.appendChild(m);
  $('mGrade').onclick=()=>{closeModal();TM.onUp();};
  $('mExt').onclick=()=>{closeModal();TM.ext+=add;TM.end=performance.now()+add*1000;TM.running=true;TM.id=setInterval(tTick,200);tTick();};
}
function closeModal(){const m=$('modal');if(m)m.remove();}

// ---------- 答えを記録する ----------
// note=false のとき「まちがいノート」には入れない（読解など）
function record(id,ok,note){
  const t=dayStr();
  if(S.lastDay!==t){S.streak=(S.lastDay===yesterday())?S.streak+1:1;S.lastDay=t;}
  S.days[t]=(S.days[t]||0)+1;
  S.ans++;if(ok)S.cor++;
  const gain=ok?10:2;S.xp+=gain;
  const r=S.items[id]||(S.items[id]={c:0,w:0,s:0});
  if(ok){r.c++;r.s++;}else{r.w++;r.s=0;}
  if(note!==false){
    if(!ok)S.miss[id]=0;                     // まちがえたらノートへ（れんぞく正解 0 から）
    else if(id in S.miss){S.miss[id]++;if(S.miss[id]>=2){delete S.miss[id];toast('📕 ノートから卒業！');}}
  }
  save();return gain;
}

function kanjiMemo(word,open){

    return '<div class="k">'+c+'</div><div>'+(b?'部首：'+esc(b)+'<br>':'')+'音：'+(on||'―')+'　訓：'+(kun||'―')+'</div>';});

}

// ---------- 問題を作る ----------
// q = {id, unit, kind:'choice'|'write', html, ask, choices, ans, kj, expl, answerText, memo, sec}
function makeQ(u,i){
  const it=UNITS[u].items[i],id=u+':'+i;let q;
  if(u==='yomi'){
    const w=it[0].match(/【(.+?)】/)[1];
    q=choiceQ(id,u,mark(it[0]),'赤い部分の読み方を選ぼう',it[1],[it[2],it[3],it[4]],false,
      '<span class="ans">'+esc(w)+'（'+esc(it[1])+'）</span><br>'+esc(it[5]));
    q.memo=w;
  }
  if(u==='kaki'){
    q={id,unit:u,kind:'write',html:mark(it[0]),ask:'赤いカタカナを漢字で書こう（下のわくに指で書けるよ）',answerText:it[1],
      expl:'<span class="ans">'+esc(it[0].replace(/【.+?】/,it[1]))+'</span><br>'+esc(it[2]),memo:it[1],sec:8+9*it[1].length};
  }
  if(u==='douon'){
    q=choiceQ(id,u,mark(it[0]),'赤い部分に合う漢字を選ぼう',it[1],it[2],true,
      '<span class="ans">'+esc(it[0].replace(/【.+?】/,it[1]))+'</span><br>'+esc(it[3]));
    q.memo=it[1];
  }
  if(u==='yoji'){
    const ex='<span class="ans">'+it[0]+'</span>　'+esc(it[1]);
    if(Math.random()<0.5){
      const w=it[0].split('');w[it[2]]='□';
      q=choiceQ(id,u,'<span class="big">'+w.join('')+'</span><span class="ask">意味：'+esc(it[1])+'</span>','□に入る漢字を選ぼう',it[0][it[2]],it[3],true,ex);
    }else{
      const yp=YOJI.filter(x=>x!==it&&itemLv(x)===itemLv(it)),others=shuffle(yp.length>=3?yp:YOJI.filter(x=>x!==it)).slice(0,3).map(x=>x[0]);
      q=choiceQ(id,u,esc(it[1]),'この意味の四字熟語を選ぼう',it[0],others,true,ex);
    }
  }
  if(u==='koto'){
    const ex='<span class="ans">'+esc(it[0])+'</span>（'+it[2]+'）<br>'+esc(it[1])+(it[3]?'<br>⚠ 「'+esc(it[3])+'」という意味だと思われやすいけど、まちがい。':'');
    if(it[4]&&Math.random()<0.5){
      q=choiceQ(id,u,'<span class="big">'+esc(it[0].replace(it[4],'□'))+'</span><span class="ask">意味：'+esc(it[1])+'</span>','□に入る漢字（体の部分）を選ぼう',it[4],it[5],true,ex);
    }else{
      const wrong=[];if(it[3])wrong.push(it[3]);
      const kp=KOTO.filter(x=>x!==it&&itemLv(x)===itemLv(it));
      shuffle(kp.length>=4?kp:KOTO.filter(x=>x!==it)).forEach(x=>{if(wrong.length<3)wrong.push(x[1]);});
      q=choiceQ(id,u,'<span class="big" style="font-size:1.6rem;letter-spacing:.05em">'+esc(it[0])+'</span>','この'+it[2]+'の意味を選ぼう',it[1],wrong,false,ex);
    }
  }
  if(u==='taigi'){
    const rev=Math.random()<0.5,a=rev?it[1]:it[0],b=rev?it[0]:it[1],k=it[2]==='対'?'対義語（反対の意味）':'類義語（にた意味）';
    const wd=f=>TAIGI.filter(f).map(x=>x[Math.random()<0.5?0:1]);
    let pool=shuffle(wd(x=>x!==it&&x[2]===it[2]&&itemLv(x)===itemLv(it)));
    if(pool.length<3)pool=pool.concat(shuffle(wd(x=>x!==it&&x[2]===it[2])));
    pool=pool.filter((w,k,arr)=>arr.indexOf(w)===k&&w!==a&&w!==b).slice(0,3);
    q=choiceQ(id,u,'<span class="big">'+a+'</span>','「'+a+'」の'+k+'を選ぼう',b,pool,true,
      '<span class="ans">'+a+(it[2]==='対'?' ⇔ ':' ＝ ')+b+'</span>');
  }
  if(u==='tsukai'){
    // 文の中に入る言葉をえらぶ。選択肢はどれも、ぱっと見ると合いそうな言葉にしてある
    const ex='<span class="ans">'+esc(it[0].replace(/【.+?】/,it[1]))+'</span><br>'+esc(it[3]);
    const short=[it[1]].concat(it[2]).every(x=>[...x].length<=5);
    q=choiceQ(id,u,mark(it[0]),'文に合う言葉を選ぼう',it[1],it[2],short,ex);
  }
  if(!q.sec)q.sec=UNITS[u].sec;
  return q;
}
function choiceQ(id,unit,html,ask,right,wrongs,kj,expl){
  const c=shuffle([right].concat(wrongs));
  return{id,unit,kind:'choice',html,ask,choices:c,ans:c.indexOf(right),kj,expl,answerText:right};
}
// 1回分の問題をえらぶ（まだ覚えていない問題を先に）
function pickSession(units,n){
  let all=[];units.forEach(u=>unitIdx(u).forEach(i=>all.push([u,i])));
  all=shuffle(all).sort((a,b)=>{const ra=S.items[a[0]+':'+a[1]],rb=S.items[b[0]+':'+b[1]];return (ra?ra.s:-1)-(rb?rb.s:-1);});
  return shuffle(all.slice(0,n)).map(x=>makeQ(x[0],x[1]));
}

// ---- 手書きのわく（自分で書いて、答えと見くらべる） ----
let PAD=null;
function setupPad(n){
  const cv=$('pad'),box=Math.min(100,Math.floor((Math.min(innerWidth,520)-48)/n)),dpr=window.devicePixelRatio||1;
  cv.style.width=box*n+'px';cv.style.height=box+'px';cv.width=box*n*dpr;cv.height=box*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  PAD={cv,ctx,box,n,down:false,last:null};
  drawGuide();
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{PAD.down=true;PAD.last=pos(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!PAD.down)return;const p=pos(e);ctx.strokeStyle='#2b2a27';ctx.lineWidth=Math.max(4,box/14);ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(PAD.last[0],PAD.last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();PAD.last=p;};
  cv.onpointerup=cv.onpointercancel=()=>{PAD.down=false;};
}
function drawGuide(){
  const {ctx,box,n}=PAD;ctx.clearRect(0,0,box*n,box);
  ctx.strokeStyle='#e3dccd';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  for(let k=0;k<n;k++){ctx.beginPath();ctx.moveTo(k*box+box/2,0);ctx.lineTo(k*box+box/2,box);ctx.moveTo(k*box,box/2);ctx.lineTo(k*box+box,box/2);ctx.stroke();}
  ctx.setLineDash([]);ctx.strokeStyle='#cfc6b3';for(let k=1;k<n;k++){ctx.beginPath();ctx.moveTo(k*box,0);ctx.lineTo(k*box,box);ctx.stroke();}
}
function clearPad(){if(PAD)drawGuide();}
function reveal(timeout){
  const q=Q.list[Q.i];Q.wInTime=TM.ext===0&&!timeout;Q.wExt=TM.ext>0;Q.wTm=(performance.now()-Q.t0)/1000;tStop();$('reveal').disabled=true;
  $('after').innerHTML=(timeout?'<p style="color:var(--red);text-align:center;font-weight:700">⏰ 時間です。答え合わせ！</p>':'')+
   '<div class="write-ans">'+esc(q.answerText)+'</div><div class="muted" style="text-align:center">自分の字と見くらべよう。とめ・はね・はらいも大事！</div>'+
   '<div class="row" style="margin-top:10px"><button class="btn" id="selfok" onclick="selfGrade(true)">⭕ 書けた</button><button class="btn red" id="selfng" onclick="selfGrade(false)">❌ まちがえた</button></div>';
  $('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function selfGrade(ok){if(Q.done)return;Q.done=true;finishOne(Q.list[Q.i],ok,Q.wInTime,false,{tm:Q.wTm,ext:Q.wExt});}

   '<div class="muted" style="margin-top:6px">時間内に正解 '+Q.inTime+'問・延長して正解 '+(Q.ok-Q.inTime)+'問　／　けいけん値 +'+Q.xp+'</div></div>'+

// ====================== 画面：長文読解・詩（入試の形） ======================
// 大問ひとつを、本文（上）と問題（下）で解く。全部書いてから「答え合わせ」。
const PTS={choice:5,multi:6,nuki:5,kiji:10};   // 配点
let D=null;   // いまの大問
function passageHTML(p){
  const mk=s=>esc(s).replace(/\{(\d)\|(.+?)\}/g,(m,n,t)=>'<span class="bou"><sup>'+'①②③④⑤⑥'[n-1]+'</sup>'+t+'</span>');
  if(p.poem)return '<p class="ptitle">'+esc(p.title)+'　'+esc(p.author)+'</p>'+p.paras.map(s=>s?'<p>'+mk(s)+'</p>':'<p class="gap"></p>').join('')+
    '<p class="src">'+esc(p.author)+'「'+esc(p.title)+'」（著作権の保護期間が終わった作品）'+(p.note?'<br>'+esc(p.note):'')+'</p>';

function startDoku(id,sel,opt){
  if(!poemOK(id)){showPack('詩の大問（無料は1つ分です）');return;}
  const base=PASSAGES.find(x=>x.id===id);let p=base;
  const sch=opt&&opt.school?opt.school:null;
  // sel（設問の番号の一覧）があるときは、その設問だけの「苦手ミニ演習」

  if(sch&&!sel)p=Object.assign({},base,{school:sch});
  D={p,ans:p.qs.map(q=>q.t==='multi'?[]:q.t==='choice'?-1:''),order:p.qs.map(q=>q.c?shuffle(q.c.map((_,k)=>k)):null),graded:false,ph:42,t0:performance.now()};
  const tot=p.qs.reduce((s,q)=>s+PTS[q.t],0);
  app.innerHTML='<div class="exam"><div class="inner">'+
   '<div class="ebar"><button class="x" onclick="quitD()" aria-label="やめる">✕</button><div class="ttl">'+(p.weak?'🎯 苦手ミニ演習　':p.school?'🏫 志望校モード　':'')+LEVELS[p.lv]+'レベル・'+p.kind+'<br>'+esc(p.title)+(p.author?'（'+esc(p.author)+'）':'')+'</div>'+
    '<span class="timer" id="tm">⏱ '+fmt(p.sec||p.min*60)+'</span></div>'+
   '<div class="ebar" style="padding-top:0"><button class="btn sub small" onclick="toggleTate()" id="tateBtn">'+(S.tate?'横書き':'縦書き')+'</button>'+
    '<button class="btn sub small" onclick="resizeP(1)">本文を大きく</button><button class="btn sub small" onclick="resizeP(-1)">小さく</button><span class="sp"></span><span class="muted">'+tot+'点満点</span></div>'+
   '<div class="ppane" id="pp"><div class="passage '+(S.tate?'tate':'yoko')+(p.poem?' poem':'')+'" id="ps">'+passageHTML(p)+'</div>'+
    '<div class="muted" id="hint" style="text-align:center;font-size:.75rem">'+(S.tate?'← 本文は左へスクロール':'↓ 本文は下へスクロール')+'</div></div>'+
   '<div class="qpane" id="qp"></div></div></div>';
  $('pp').style.setProperty('--ph',D.ph+'vh');

    ()=>grade(true));

function resizeP(d){D.ph=Math.max(22,Math.min(70,D.ph+d*12));$('pp').style.setProperty('--ph',D.ph+'vh');}
function toggleTate(){S.tate=!S.tate;save();const ps=$('ps');ps.className='passage '+(S.tate?'tate':'yoko')+(D.p.poem?' poem':'');ps.scrollLeft=0;ps.scrollTop=0;
  $('tateBtn').textContent=S.tate?'横書き':'縦書き';$('hint').textContent=S.tate?'← 本文は左へスクロール':'↓ 本文は下へスクロール';}
function quitD(){if(D.graded||confirm('この大問をやめますか？'))home();}
// 問題の部分をかく（答え合わせの前と後で同じ関数）
function renderQs(){
  const p=D.p;let h='';
  p.qs.forEach((q,i)=>{
    h+='<div class="eq" id="eq'+i+'"><div class="dq"><span class="pt">'+PTS[q.t]+'点</span>'+(D.p.weak?'<span class="tag" style="margin-right:6px">🎯 '+skillOf(D.p.id,D.p.orig[i])+'</span>':'')+'問'+(i+1)+'　'+q.q+'</div>';
    if(q.t==='choice'||q.t==='multi'){
      h+='<div class="choices">'+D.order[i].map((k,j)=>{
        const sel=q.t==='multi'?D.ans[i].includes(k):D.ans[i]===k;
        let cls='ch'+(sel?' sel':'');
        if(D.graded){const right=q.t==='multi'?k<q.n:k===0;cls='ch'+(right?' ok':sel?' ng':'');}
        return '<button class="'+cls+'" '+(D.graded?'disabled':'onclick="pick('+i+','+k+')"')+'><span class="lb">'+KANA[j]+'</span>'+esc(q.c[k])+'</button>';}).join('')+'</div>';
    }
    if(q.t==='nuki')h+='<input class="txt" id="in'+i+'" autocomplete="off" placeholder="ここに書く" value="'+esc(D.ans[i])+'" '+(D.graded?'disabled':'oninput="D.ans['+i+']=this.value"')+'>';
    if(q.t==='kiji')h+='<textarea class="txt" id="in'+i+'" placeholder="ここに書く（字数を数えます）" '+(D.graded?'disabled':'oninput="D.ans['+i+']=this.value;kjCount('+i+')"')+'>'+esc(D.ans[i])+'</textarea><div class="muted" id="kn'+i+'">'+cnt(D.ans[i])+' / '+q.limit+'字</div>';
    if(D.graded)h+=resultBox(q,i);
    h+='</div>';
  });
  if(!D.graded)h+='<button class="btn" onclick="grade(false)">答え合わせ</button>';
  else if(!D.fixed)h+='<button class="btn" id="fixBtn" onclick="fixScore()">記述の採点をして、点数を出す</button>';
  $('qp').innerHTML=h;
}
function pick(i,k){
  const q=D.p.qs[i];
  if(q.t==='multi'){const a=D.ans[i],x=a.indexOf(k);if(x>=0)a.splice(x,1);else{if(a.length>=q.n)a.shift();a.push(k);}}
  else D.ans[i]=k;
  const st=$('qp').scrollTop;renderQs();$('qp').scrollTop=st;
}
function cnt(s){return String(s).replace(/\n/g,'').length;}
function kjCount(i){const q=D.p.qs[i],n=cnt(D.ans[i]);$('kn'+i).textContent=n+' / '+q.limit+'字'+(n>q.limit?'（オーバー！）':'');}
function norm(s){return String(s).replace(/[\s　]/g,'').replace(/[,，]/g,'、').replace(/[.．]/g,'。');}
// 1問ごとの正解・不正解（記述は自分で採点するので null）
function judge(q,i){
  const a=D.ans[i];
  if(q.t==='choice')return a===0;
  if(q.t==='multi')return a.length===q.n&&a.every(k=>k<q.n);
  if(q.t==='nuki')return q.a.some(x=>norm(x)===norm(a));
  return null;
}
function resultBox(q,i){
  const ok=judge(q,i);let h='';
  if(q.t==='kiji'){
    const v=String(D.ans[i]).replace(/\n/g,''),warn=[];
    if(v.length>q.limit)warn.push('字数オーバー（'+v.length+'字）。本番では0点になることもあるので、この問題は0点にします。');
    if(v&&q.must)(Array.isArray(q.must)?q.must:[q.must]).forEach(w=>{if(v.indexOf(w)<0)warn.push('指定された言葉「'+w+'」が入っていないよ。');});
    if(!v)warn.push('何も書いていないので、解答例を読んでから書き直してみよう。');
    h+='<div class="ex"><b>解答例</b><br><span style="font-family:var(--kanji);font-weight:600">'+esc(q.ex)+'</span></div>'+
      (warn.length?'<p style="color:var(--red);font-size:.9rem;margin:6px 0">⚠ '+warn.join('<br>⚠ ')+'</p>':'')+
      '<div class="ex"><b>採点ポイント</b>（自分の答えに入っていたらチェック）</div>'+
      q.pts.map((t,k)=>'<label class="chk"><input type="checkbox" id="pt'+i+'_'+k+'"'+(D.fixed?' disabled':'')+(D.kchk&&D.kchk[i]&&D.kchk[i][k]?' checked':'')+'>'+esc(t)+'</label>').join('')+
      (D.fixed?'<div class="res">'+D.kscore[i]+' / '+PTS.kiji+'点</div>':'');
  }else{
    const right=q.t==='nuki'?q.a[0]:q.t==='multi'?D.order[i].map((k,j)=>k<q.n?KANA[j]:'').join('・').replace(/^・+|・+$/g,'').replace(/・{2,}/g,'・'):KANA[D.order[i].indexOf(0)];
    h+='<div class="res" style="color:'+(ok?'var(--main)':'var(--red)')+'">'+(ok?'⭕ 正解（'+PTS[q.t]+'点）':'❌ 正解は「'+esc(right)+'」')+'</div>';
  }
  return h+'<div class="ex">💡 '+q.e+'</div>';
}
function grade(timeUp){
  if(D.graded)return;
  if(!timeUp){
    const blank=D.p.qs.filter((q,i)=>q.t==='multi'?!D.ans[i].length:q.t==='choice'?D.ans[i]<0:!String(D.ans[i]).trim()).length;
    if(blank&&!confirm('まだ答えていない問題が'+blank+'問あります。答え合わせしますか？'))return;
  }
  D.inTime=TM.ext===0&&!timeUp;D.usedExt=TM.ext;D.took=(performance.now()-D.t0)/1000;tStop();D.graded=true;
  if(D.p.poem&&!isPremium()&&!S.poemFree){S.poemFree=D.p.id;save();}     // 詩の無料の1つ分は、答え合わせまでしたら「使った」
  if(D.p.weak&&!isPremium()){freeUse().doku++;save();}     // 苦手ミニ演習（無料）は、答え合わせまでしたらかぞえる
  $('tm').textContent=timeUp?'⏰ 終了':'✔ 終了';
  renderQs();$('qp').scrollTop=0;
  if(timeUp)toast('時間です。答え合わせ！');
}
function fixScore(){
  const p=D.p;D.kscore={};D.kchk={};
  p.qs.forEach((q,i)=>{if(q.t!=='kiji')return;
    D.kchk[i]=q.pts.map((_,k)=>$('pt'+i+'_'+k).checked);
    const n=D.kchk[i].filter(Boolean).length,over=cnt(D.ans[i])>q.limit,empty=!cnt(D.ans[i]);
    D.kscore[i]=(over||empty)?0:Math.round(PTS.kiji*n/q.pts.length);});
  D.fixed=true;
  let score=0,tot=0,okN=0;
  p.qs.forEach((q,i)=>{tot+=PTS[q.t];let ok;
    if(q.t==='kiji'){score+=D.kscore[i];ok=D.kscore[i]===PTS.kiji;}else{ok=judge(q,i);if(ok)score+=PTS[q.t];}
    if(ok)okN++;
    const oi=p.orig?p.orig[i]:i,nq=p.qs.length,sk=skillOf(p.id,oi);
    record('doku:'+p.id+':'+oi,ok,false);
    logQ({c:p.kind+'・'+sk,d:p.kind,s:sk,f:q.t,lv:p.lv,sc:q.t==='kiji'?D.kscore[i]/PTS.kiji:(ok?1:0),tm:Math.round(D.took/nq),tg:Math.round((p.sec||p.min*60)/nq),ex:D.usedExt>0?1:0,k:'doku:'+p.id+':'+oi});});
  if(!p.partial)S.doku[p.id]=Math.max(S.doku[p.id]||0,score);save();snd('fin');
  const pct=Math.round(score/tot*100);
  renderQs();
  $('qp').insertAdjacentHTML('afterbegin','<div class="card" style="text-align:center"><div class="muted">'+LEVELS[p.lv]+'レベル・'+p.kind+'「'+esc(p.title)+'」</div>'+
    '<div class="score">'+score+' / '+tot+'点</div><div>'+(pct>=80?'🎉 よく読めています！':pct>=70?'👏 目標の7割をこえたよ！':'📖 解説を読んで、もう一度ちょうせんしよう')+'</div>'+
    '<div class="muted" style="margin-top:6px">'+(D.inTime?'⏱ 目安の時間内に解けた！':D.usedExt?'⏱ 延長 '+D.usedExt+'秒 を使った':'⏱ 時間切れで答え合わせ')+'　／　正解 '+okN+' / '+p.qs.length+'問</div>'+
    (p.school?schoolReachHTML():'')+'<div class="row" style="margin-top:10px">'+(p.weak?'<button class="btn" onclick="startWeakDoku()">もう一度（苦手モード）</button>':p.school?'<button class="btn" onclick="startSchoolDoku()">もう一度（志望校モード）</button>':'<button class="btn" onclick="startDoku(\''+p.id+'\')">もう一度</button>')+'<button class="btn sub" onclick="home()">ホームへ</button></div></div>');
  $('qp').scrollTop=0;
}

// ====================== 記録と分析・苦手モード ======================
// 1問ごとの記録（端末の localStorage の中だけ。上限つき）
const LOG_MAX=1500;
const FORM_NAME={choice:'記号選択',multi:'記号選択（2つ）',nuki:'ぬき出し',kiji:'記述',write:'書き取り'};
function logQ(e){
  e.t=Date.now();if(!Array.isArray(S.log))S.log=[];
  S.log.push(e);if(S.log.length>LOG_MAX)S.log.splice(0,S.log.length-LOG_MAX);save();
}
// 分野（カテゴリ）ごとにまとめて、「苦手の点数」を出す
// 苦手の点数 ＝ まちがい(60) ＋ 延長(25) ＋ 時間のかかりすぎ(15)。最近の12問で見る。3問未満は0
function aggregate(L){
  const m={};
  S.log.forEach(e=>{(m[e.c]||(m[e.c]={c:e.c,d:e.d,es:[]})).es.push(e);});
  return Object.values(m).map(g=>{
    const es=g.es,n=es.length,last=es.slice(-12);
    const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
    const acc=avg(last.map(e=>e.sc)),ex=avg(last.map(e=>e.ex?1:0));
    const tr=last.filter(e=>e.tg>0).map(e=>e.tm/e.tg),ratio=tr.length?avg(tr):0;
    const weak=n<3?0:60*(1-acc)+25*ex+15*Math.min(1,Math.max(0,ratio-0.7)/0.6);
    let trend=null;
    if(n>=6){const k=Math.min(6,Math.floor(n/2));trend=avg(es.slice(-k).map(e=>e.sc))-avg(es.slice(-2*k,-k).map(e=>e.sc));}
    return{c:g.c,d:g.d,n,tgt:L?avg(es.map(e=>TARGET[L][(e.lv>0?e.lv:1)-1])):null,accAll:avg(es.map(e=>e.sc)),acc,ex,exN:es.filter(e=>e.ex).length,ratio,weak,trend};
  });
}
function catLabel(c){return UNITS[c]?UNITS[c].name:c;}
const KANJI_ADV={
 yomi:'読みは、まちがえた字を「漢字メモ」で部首・音読み・訓読みとセットで覚えよう。苦手モードでは、同じ字・同じ部首・同じ音のなかまも出るよ。',
 kaki:'書き取りは、とめ・はね・はらいと、形の似た字（「決」と「欠」など）の区別を意識しよう。',
 douon:'同音異義語は、意味のちがいを短い言葉で言えるようにすると迷わなくなる。',
 yoji:'四字熟語は、意味とセットで声に出して覚えよう。',
 koto:'ことわざ・慣用句は、使う場面を思いうかべて覚えると、意味を取りちがえにくい。',
 taigi:'対義語・類義語は、ペアで覚えて、にた言葉との使い分けも確かめよう。',
 tsukai:'文の中での使い方は、前後の言葉とのつながりと、似た言葉との意味のちがいを確かめて選ぼう。'};
const SKILL_ADV={
 心情:'心情は「前の気持ち→きっかけ→後の気持ち」の順で。言葉・行動・表情・情景に注目しよう。',
 理由:'「なぜ」の答えは、傍線部の前後の「だから・ので」に注目。記述は文末を「〜から。」に。',
 指示語:'指示語は前の部分から探し、答えを当てはめて意味が通るか確かめよう。',
 接続語:'前と後の関係（順接・逆接・例・まとめ）を先に考えてから選ぼう。',
 言いかえ:'「つまり・要するに」の前後や、同じ内容の別の表現を探そう。',
 要旨:'説明文は最後の段落と、くり返し出てくる言葉に筆者の主張がある。',
 構成:'各段落が「問い・答え・例・まとめ」のどれかを考えよう。',
 表現:'表現技法（直喩・擬人法・反復・対句・倒置法）の見分け方を整理しよう。',

function adviceFor(a){

function pct(x){return Math.round(x*100);}
function colorOf(acc){return acc>=0.8?'var(--main)':acc>=0.6?'var(--gold)':'var(--red)';}
function showStats(){

  }
  const mainSc=mainSchool(),LV=mainSc?mainSc.level:0,ag=aggregate(LV),avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);

  rank.forEach((a,i)=>{

    h+='<div class="rk"><div class="no">'+(i+1)+'</div><div class="nm">'+esc(catLabel(a.c))+tr+'</div>'+
      '<div class="muted">最近の正答率 '+pct(a.acc)+'%　時間 めやすの'+pct(a.ratio)+'%　延長 '+a.exN+'回（全'+a.n+'問）</div>'+

  h+=strongHTML(ag);

// ---------- 苦手モード（漢字・語句） ----------
// 1つの問題の「苦手度」：まちがい・延長・時間がかかった→ふえる／時間内に正解→へる（新しい記録ほど重い）
function itemWeak(key){
  let w=0;const es=S.log.filter(e=>e.k===key).slice(-5);
  es.forEach((e,i)=>{const rec=0.6+0.1*(i+1);
    if(e.sc<1)w+=3*rec*(1-e.sc);else if(e.ex)w+=1.5*rec;else if(e.tg>0&&e.tm>e.tg*0.8)w+=rec;else w-=rec;});
  return Math.max(-2,w);
}
const KANJI_U=['yomi','kaki','douon','yoji','koto','taigi','tsukai'];
function wordOf(u,i){
  const it=UNITS[u].items[i];
  if(u==='yomi')return it[0].match(/【(.+?)】/)[1];
  if(u==='kaki'||u==='douon')return it[1];
  if(u==='yoji'||u==='koto')return it[0];
  if(u==='tsukai')return it[1];
  return it[0]+it[1];
}
// 2つの言葉が「なかま」か：同じ漢字／同じ音読み／同じ部首
function relate(a,b){
  let best=null;
  for(const ca of a)for(const cb of b){
    if(!/[一-龥]/.test(ca)||!/[一-龥]/.test(cb))continue;
    if(ca===cb)return{w:0.7,why:'同じ漢字「'+ca+'」を使う言葉'};
    const ka=KJ[ca],kb=KJ[cb];if(!ka||!kb)continue;
    const [ba,oa]=ka.split('|'),[bb,ob]=kb.split('|');
    if(oa&&ob&&oa.split('・')[0]===ob.split('・')[0]){if(!best||best.w<0.45)best={w:0.45,why:'「'+ca+'」「'+cb+'」は同じ音「'+oa.split('・')[0]+'」の漢字'};}
    else if(ba&&bb&&ba.charAt(0)===bb.charAt(0)){if(!best)best={w:0.3,why:'「'+ca+'」「'+cb+'」は同じ部首「'+ba.charAt(0)+'」の漢字'};}
  }
  return best;
}
function startWeakKanji(){
  if(!S.log.some(e=>UNITS[e.c])){toast('まず漢字・語句を少し解くと、苦手が見えてきます');return;}
  let cap=PER;
  if(!isPremium()){const left=freeLeftQ();if(left<=0){showPack('苦手モードの今日の無料分（'+FREE_WEAK_Q+'問）は終わりました');return;}cap=Math.min(PER,left);}
  const all=[];
  KANJI_U.forEach(u=>UNITS[u].items.forEach((it,i)=>isPremium()||itemLv(it)<=3?all.push({u,i,key:u+':'+i,w:itemWeak(u+':'+i),word:wordOf(u,i),lvok:inLevel(u,it,curLv())}):0));
  const cw={};aggregate().forEach(a=>{cw[a.c]=a.weak;});
  const seeds=all.filter(x=>x.w>0.5).sort((a,b)=>b.w-a.w).slice(0,6);
  const sc=[];
  all.forEach(x=>{
    let s=x.w,why=x.w>0.5?'🎯 前にまちがえた／時間がかかった問題':'';
    let rel=0,rwhy='';
    seeds.forEach(sd=>{if(sd===x)return;const r=relate(sd.word,x.word);if(r&&sd.w*r.w>rel){rel=sd.w*r.w;rwhy='🎯 「'+sd.word+'」のなかま：'+r.why;}});
    if(rel>0){s+=rel;if(x.w<=0.5)why=rwhy;}
    s+=(cw[x.u]||0)/60;
    if(!x.lvok&&s<=0.6)return;      // ほかのレベルの問題は、苦手やなかまのときだけ
    sc.push({x,s:s+Math.random()*0.3,why:why||((cw[x.u]||0)>20?'苦手な分野：'+UNITS[x.u].name:'')});
  });
  sc.sort((a,b)=>b.s-a.s);
  const picked=sc.filter(o=>o.s>0.6).slice(0,PER);
  if(picked.length<PER){
    const used=new Set(picked.map(o=>o.x.key));
    shuffle(all.filter(x=>x.lvok&&!used.has(x.key))).sort((a,b)=>((S.items[a.key]||{s:-1}).s)-((S.items[b.key]||{s:-1}).s))
      .slice(0,PER-picked.length).forEach(x=>picked.push({x,why:'まだ覚えきれていない問題'}));
  }
  begin(shuffle(picked).slice(0,cap).map(o=>{const q=makeQ(o.x.u,o.x.i);q.why=o.why;return q;}),'🎯 苦手モード（漢字・語句）'+(isPremium()?'':'（無料：今日あと'+freeLeftQ()+'問）'));
  if(Q)Q.weakMode=true;
}

// ---------- 苦手モード（長文・詩） ----------
// まちがえた設問と「同じ型」「似た系統」の設問を、ほかの文章からあつめて出す
const SK_REL={心情:['理由','言いかえ'],理由:['心情','言いかえ'],言いかえ:['理由','要旨'],要旨:['言いかえ','構成'],構成:['要旨','内容把握'],
  指示語:['接続語','言いかえ'],接続語:['指示語','理由'],表現:['言いかえ','心情'],内容把握:['本文合致','言いかえ'],本文合致:['内容把握'],人物像:['心情']};
function startWeakDoku(){
  const ag=aggregate().filter(a=>a.c.indexOf('・')>=0);
  if(!ag.length){toast('まず長文や詩を解くと、苦手が見えてきます');return;}
  if(!isPremium()&&freeUse().doku>=FREE_WEAK_DOKU){showPack('苦手モード（長文・詩）の今日の無料分（'+FREE_WEAK_DOKU+'回）は終わりました');return;}
  const cw={};ag.forEach(a=>{cw[a.c]=a.weak;});
  const last=[...S.log].reverse().find(e=>String(e.k).indexOf('doku:')===0),lastPid=last?last.k.split(':')[1]:'';
  let best=null;
  PASSAGES.forEach(p=>{
    if(Math.abs(p.lv-curLv())>1||(!isPremium()&&p.lv>3)||!poemOK(p.id))return;
    const other=p.kind==='物語文'?'説明文':p.kind==='説明文'?'物語文':'';
    const ws=p.qs.map((q,i)=>{const sk=skillOf(p.id,i);let w=cw[p.kind+'・'+sk]||0;
      (SK_REL[sk]||[]).forEach(r=>{w=Math.max(w,0.4*(cw[p.kind+'・'+r]||0));});
      if(other)w=Math.max(w,0.5*(cw[other+'・'+sk]||0));
      return w;});
    const idx=ws.map((w,i)=>i).sort((a,b)=>ws[b]-ws[a]).slice(0,4);
    const tot=idx.reduce((a,i)=>a+ws[i],0)+(p.id===lastPid?0:5)+(p.lv===curLv()?2:0);
    if(!best||tot>best.tot)best={p,idx:idx.sort((a,b)=>a-b),tot,ws};
  });
  if(!best||best.idx.every(i=>best.ws[i]<=0)){toast('いまは苦手がありません。すばらしい！');return;}
  startDoku(best.p.id,best.idx);
}

// ====================== 志望校・合格の目安・志望校モード ======================
// 「合格の目安」は、アプリの作者が学校のレベルごとに決めた目標です。実際の合格者のデータではなく、学校や塾の公式のものでもありません。
// 学校のレベル → 問題レベル（標準・上位・難関・最難関）ごとの目標の正答率
const TARGET={1:[0.80,0.55,0.30,0.15],2:[0.90,0.70,0.45,0.25],3:[0.95,0.85,0.65,0.40],4:[0.95,0.88,0.72,0.52]};
function mean(a){return a.reduce((x,y)=>x+y,0)/(a.length||1);}
function schoolById(id){const h=JH.schools().find(s=>s.id===id);return SCHOOLS.find(s=>s.id===id)||h||null;} /* [まとめ版] 志望校は外がわの共通のもの */
function mySchools(){return JH.schools().map(h=>SCHOOLS.find(s=>s.id===h.id)||h);}
function mainSchool(){return mySchools()[0]||null;}
// 問題レベルごとの正答率から「到達度」を出す（5問以上といたレベルだけ。時間がめやすをこえるぶん少し引く）
function reachOf(L){
  const r=[null,{n:0,ok:0,rs:0,rn:0},{n:0,ok:0,rs:0,rn:0},{n:0,ok:0,rs:0,rn:0},{n:0,ok:0,rs:0,rn:0}];
  S.log.slice(-300).forEach(e=>{const o=r[e.lv];if(!o)return;o.n++;o.ok+=e.sc;if(e.tg>0){o.rs+=Math.min(3,e.tm/e.tg);o.rn++;}});
  const rows=[];
  for(let lv=1;lv<=4;lv++){const o=r[lv],t=TARGET[L][lv-1];rows.push({lv,n:o.n,acc:o.n?o.ok/o.n:null,target:t,ok:o.n>=5,ratio:o.rn?o.rs/o.rn:null});}
  const used=rows.filter(x=>x.ok);
  if(!used.length)return{pct:null,left:null,rows};
  const base=mean(used.map(x=>Math.min(1,x.acc/x.target)));
  const ratio=mean(used.map(x=>x.ratio==null?1:x.ratio));
  const pctv=Math.round(100*base*Math.min(1,1/Math.sqrt(Math.max(1,ratio))));
  return{pct:pctv,left:100-pctv,rows,ratio};
}
function reachBar(r){
  if(r.pct==null)return '<div class="muted">5問以上といたレベルがまだありません。解くと「合格の目安まで あと○%」が出ます。</div>';
  return '<div class="row"><b style="font-size:1.4rem">'+r.pct+'%</b><span class="muted">合格の目安への到達度　<b style="color:var(--red)">あと '+r.left+'%</b></span></div><div class="bar" style="margin:4px 0"><i style="width:'+r.pct+'%"></i></div>';
}

// ---------- 志望校モード ----------
// 漢字・語句：志望校のレベルの問題を、志望校で出やすい分野（書き取り・漢字がよく出る学校は多め）と、苦手・まだ覚えていない問題を中心に10問
function startSchoolKanji(){
  if(!isPremium()){showPack('志望校モード');return;}
  const sc=mainSchool();if(!sc){showSetup(false);return;}
  const ko=KO[sc.id]||{},L=sc.level,kj=[],vc=[];
  // 漢字（読み・書き取り）と語句に分けて、決まった数ずつ出す。漢字がよく出る学校は漢字を多めに（7問／ふつう5問）
  Object.keys(UNITS).forEach(u=>{const U=UNITS[u];U.items.forEach((it,i)=>{if(!inLevel(u,it,L))return;
    const key=u+':'+i,r=S.items[key],unseen=!r||r.s<2;
    const w=(1+(unseen?0.8:0)+Math.max(0,itemWeak(key))*0.4)*(u==='kaki'&&ko.kanji?1.6:1);
    ((u==='yomi'||u==='kaki')?kj:vc).push({u,i,k:Math.pow(Math.random(),1/w)});});});
  const nk=Math.min(kj.length,ko.kanji?7:5);
  kj.sort((a,b)=>b.k-a.k);vc.sort((a,b)=>b.k-a.k);
  const list=shuffle(kj.slice(0,nk).concat(vc.slice(0,PER-nk))).map(c=>{const q=makeQ(c.u,c.i);
    q.why='🏫 '+sc.name+'（'+LEVELS[L]+'）向けの練習'+(ko.kanji&&(c.u==='kaki'||c.u==='yomi')?'：漢字がよく出る学校':'');return q;});
  begin(list,'🏫 志望校モード（漢字・語句）');
  if(Q)Q.school=sc.id;
}
// 長文・詩：志望校のレベルの文章。出る文章の種類（データがある学校）のなかから、苦手な種類を優先。記述が多い学校は記述と理由・心情などの設問を中心に
function startSchoolDoku(){
  if(!isPremium()){showPack('志望校モード');return;}
  const sc=mainSchool();if(!sc){showSetup(false);return;}
  const ko=KO[sc.id]||{},L=sc.level;
  const kinds=(ko.kinds&&ko.kinds.length)?ko.kinds:['物語文','説明文'];
  const ag=aggregate(),accOf=k=>{const a=ag.filter(x=>x.c.indexOf(k+'・')===0);const n=a.reduce((s,x)=>s+x.n,0);return n?a.reduce((s,x)=>s+x.accAll*x.n,0)/n:-1;};
  // 苦手な種類ほど出やすい（まだ解いていない種類もよく出る）くじ引き
  const wt=kinds.map(k=>{const a=accOf(k);return a<0?2.5:1+(1-a)*3;});
  let rr=Math.random()*wt.reduce((x,y)=>x+y,0),kind=kinds[kinds.length-1];
  for(let i=0;i<kinds.length;i++){rr-=wt[i];if(rr<=0){kind=kinds[i];break;}}
  const p=PASSAGES.find(x=>x.lv===L&&x.kind===kind)||PASSAGES.find(x=>x.lv===L);
  if(!p){toast('このレベルの文章がまだありません');return;}
  if(ko.kiji){
    const sel=p.qs.map((q,i)=>i).filter(i=>p.qs[i].t==='kiji'||['理由','心情','言いかえ','要旨'].indexOf(skillOf(p.id,i))>=0);
    if(sel.length>=3&&sel.length<p.qs.length){startDoku(p.id,sel,{school:sc.id});return;}
  }
  startDoku(p.id,null,{school:sc.id});
}

// ---------- 分析：得意・目安との比較・レーダー ----------
const AXES=[
 {k:'読み',f:e=>e.c==='yomi'},{k:'書き取り',f:e=>e.c==='kaki'},{k:'語句',f:e=>['douon','yoji','koto','taigi','tsukai'].indexOf(e.c)>=0},
 {k:'物語文',f:e=>e.d==='物語文'},{k:'説明文',f:e=>e.d==='説明文'},{k:'詩',f:e=>e.d==='詩'},{k:'記述',f:e=>e.f==='kiji'},{k:'速さ',time:true}];
function radarData(L){
  const last=S.log.slice(-200),vals=[],tgs=[];
  AXES.forEach(a=>{
    if(a.time){const es=last.filter(e=>e.tg>0);vals.push(es.length<3?null:Math.min(1,1/Math.max(0.0001,mean(es.map(e=>e.tm/e.tg)))));tgs.push(0.9);return;}
    const es=last.filter(a.f);
    vals.push(es.length<3?null:mean(es.map(e=>e.sc)));
    tgs.push(L?(es.length?mean(es.map(e=>TARGET[L][(e.lv>0?e.lv:1)-1])):TARGET[L][1]):null);
  });
  return{vals,tgs};
}
function radarSVG(vals,tgs,labels){
  const cx=150,cy=140,R=92,n=labels.length;
  const P=(i,r)=>[(cx+R*r*Math.sin(2*Math.PI*i/n)).toFixed(1),(cy-R*r*Math.cos(2*Math.PI*i/n)).toFixed(1)];
  let g='';
  [0.25,0.5,0.75,1].forEach(r=>{g+='<polygon points="'+labels.map((_,i)=>P(i,r).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>';});
  labels.forEach((l,i)=>{const a=P(i,1),t=P(i,1.22);
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+a[0]+'" y2="'+a[1]+'" stroke="var(--line)"/><text x="'+t[0]+'" y="'+(+t[1]+4)+'" text-anchor="middle" font-size="11" fill="var(--sub)">'+l+(vals[i]==null?'(少)':'')+'</text>';});
  if(tgs)g+='<polygon points="'+labels.map((_,i)=>P(i,tgs[i]==null?0:tgs[i]).join(',')).join(' ')+'" fill="rgba(200,150,46,.15)" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 3"/>';
  g+='<polygon points="'+labels.map((_,i)=>P(i,vals[i]==null?0:vals[i]).join(',')).join(' ')+'" fill="rgba(47,93,80,.25)" stroke="var(--main)" stroke-width="2"/>';
  return '<svg viewBox="0 0 300 285" style="width:100%;max-width:360px;display:block;margin:0 auto" role="img" aria-label="レーダーチャート">'+g+'</svg>';
}
function strongHTML(ag){
  const st=ag.filter(a=>a.n>=3&&a.accAll>=0.7).map(a=>Object.assign({},a,{sv:70*a.accAll+20*(1-a.ex)+10*(a.ratio&&a.ratio<=1?1:Math.max(0,2-a.ratio))})).sort((a,b)=>b.sv-a.sv).slice(0,5);
  let h='<div class="sec">⭐ 得意ランキング</div><div class="card">';
  if(!st.length)h+='<div class="muted">まだ得意がはっきりしていません（同じ分野を3問以上解いて、正答率70%以上になると出ます）。</div>';
  st.forEach((a,i)=>{h+='<div class="rk"><div class="no" style="color:var(--main)">'+(i+1)+'</div><div class="nm">'+esc(catLabel(a.c))+'</div><div class="muted">正答率 '+pct(a.accAll)+'%　時間 めやすの'+pct(a.ratio)+'%　延長 '+a.exN+'回（全'+a.n+'問）</div></div>';});
  return h+'</div>';
}
function tableHTML(ag,L){
  const cl=(v,g,y)=>v>=g?'c-g':v>=y?'c-y':'c-r';
  let h='<div class="sec">分野×設問の形ごとの表 <span class="muted">（色：緑=よい・黄=もう少し・赤=苦手）</span></div><div class="card"><table class="st"><tr><th>分野・形</th><th>問</th><th>正答率</th><th>'+(L?'目安':'')+'</th><th>時間比</th><th>延長</th></tr>'+
   ag.slice().sort((a,b)=>a.c<b.c?-1:1).map(a=>{
     const ca=a.tgt!=null?cl(a.accAll-a.tgt,0,-0.15):cl(a.accAll,0.8,0.6);
     const ct=a.ratio?(a.ratio<=1?'c-g':a.ratio<=1.3?'c-y':'c-r'):'';
     return '<tr><td>'+esc(catLabel(a.c))+'</td><td class="'+(a.n>=10?'c-g':a.n>=3?'c-y':'c-n')+'">'+a.n+'</td><td class="'+ca+'">'+pct(a.accAll)+'%</td><td>'+(a.tgt!=null?pct(a.tgt)+'%':'―')+'</td><td class="'+ct+'">'+(a.ratio?pct(a.ratio)+'%':'―')+'</td><td>'+a.exN+'</td></tr>';}).join('')+
   '</table><div class="muted" style="margin-top:6px">問の色：10問以上=緑・3問以上=黄・それ未満=グレー（まだ少ない）。目安は、志望校のレベルのアプリの目標です。</div></div>';
  return h;
}
function compareHTML(){
  const ss=mySchools();
  if(!ss.length){const rd0=radarData(0);return '<div class="sec">🏫 志望校との比較</div><div class="card"><div class="muted" style="margin-bottom:8px">志望校を入れると、合格の目安とくらべられます。</div><button class="btn small" onclick="showSetup(false)">志望校をえらぶ</button></div><div class="sec">レーダーチャート</div><div class="card">'+radarSVG(rd0.vals,null,AXES.map(a=>a.k))+'</div>';}
  const m=mainSchool(),r=reachOf(m.level);

  ss.forEach(sc=>{const x=reachOf(sc.level);h+='<div style="margin:8px 0"><div class="row"><b>'+(sc.id===m.id?'★ ':'')+esc(sc.name)+'</b><span class="tag">'+LEVELS[sc.level]+'</span></div>'+reachBar(x)+'</div>';});
  h+='<div class="muted" style="margin:10px 0 4px">★ '+esc(m.name)+'：問題のレベルごと（5問以上で比べます）</div><table class="st"><tr><th>問題レベル</th><th>問</th><th>あなた</th><th>目安</th><th>差</th></tr>'+
   r.rows.map(x=>{const d=x.ok?x.acc-x.target:null;return '<tr><td>'+LEVELS[x.lv]+'</td><td>'+x.n+'</td><td>'+(x.acc==null?'―':pct(x.acc)+'%')+'</td><td>'+pct(x.target)+'%</td><td class="'+(d==null?'c-n':d>=0?'c-g':d>=-0.15?'c-y':'c-r')+'">'+(d==null?'―':(d>=0?'+':'')+Math.round(d*100)+'点')+'</td></tr>';}).join('')+'</table></div>';
  const rd=radarData(m.level);
  h+='<div class="sec">レーダーチャート <span class="muted">（緑=あなた・黄のてんせん=合格の目安）</span></div><div class="card">'+radarSVG(rd.vals,rd.tgs,AXES.map(a=>a.k))+
    '<div class="muted" style="text-align:center">最近の200問から。(少)=まだ3問未満。速さ=めやす時間より早いほど外側。</div></div>';
  return h;
}

// おとなの確認（ペアレンタルゲート）：大人向けの計算（例：17×6）を入れてもらう。通ったら onOk を呼ぶ
function parentGate(onOk){
  closeGate();
  const a=12+Math.floor(Math.random()*8),b=6+Math.floor(Math.random()*4);
  const m=document.createElement('div');m.className='modal';m.id='gate';
  m.innerHTML='<div class="box"><h2>おとなの確認</h2><p class="muted">ここからは、おうちの人といっしょに。次の計算の答えを入れてください。</p><div style="font-size:1.6rem;font-weight:700;margin:8px 0">'+a+' × '+b+' = ？</div><input class="txt" id="gans" inputmode="numeric" pattern="[0-9]*" autocomplete="off" style="text-align:center"><div style="height:10px"></div><button class="btn" id="gok">確認する</button><div style="height:8px"></div><button class="btn sub" id="gno">やめる</button></div>';
  document.body.appendChild(m);
  let miss=0;
  $('gno').onclick=closeGate;
  $('gok').onclick=()=>{
    if(parseInt($('gans').value,10)===a*b){closeGate();onOk();}

  };
}

<script>
/* =========================================================
   中学受験 問題演習（外がわ）
   ・算数と国語は、それぞれ別の「枠」（iframe）の中で動く。名前がぶつからないし、どちらかがこわれても、もう一方は動く
   ・セーブは1つ（juken-save-v1）：{ shared:{志望校・音・タイマー・合格パック}, sansu:{…}, kokugo:{…} }

   ・外への通信なし。データは端末の中だけ
   ========================================================= */
'use strict';
const FREE_ALL=true;                 // いまは全部無料（あとで false にすると、合格パックの区切りが効く）

function readOld(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function loadU(){
  let u=null; try{ u=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  const d={v:1,shared:defShared(),sansu:null,kokugo:null};
  if(u&&typeof u==='object'){ if(u.sansu)d.sansu=u.sansu; if(u.kokugo)d.kokugo=u.kokugo; Object.assign(d.shared,u.shared||{}); }
  d.shared.premium=Object.assign({sansu:false,kokugo:false},d.shared.premium||{});
  if(!Array.isArray(d.shared.schools)) d.shared.schools=[];
  if(!d.shared.migrated) migrate(d);
  return d;
}
// 元のセーブ（sansu-save-v1・kokugo-save-v1）があれば1つにまとめる。元のセーブは消さない
function migrate(d){
  const s=readOld('sansu-save-v1'), k=readOld('kokugo-save-v1'), sh=d.shared;
  if(s&&!d.sansu) d.sansu=s;
  if(k&&!d.kokugo) d.kokugo=k;
  if(!sh.schools.length){
    if(s&&Array.isArray(s.schools)&&s.schools.length){ sh.schools=s.schools.map(x=>x&&x.id?{id:x.id}:{id:'c'+Math.random().toString(36).slice(2,9),name:x.name,level:x.level,custom:true}); }
    else if(k&&Array.isArray(k.schools)&&k.schools.length){
      const cu=Array.isArray(k.custom)?k.custom:[]; let ids=k.schools.slice(); if(k.main&&ids.includes(k.main)) ids=[k.main,...ids.filter(x=>x!==k.main)];
      sh.schools=ids.map(id=>{ const c=cu.find(x=>x.id===id); return c?{id:c.id,name:c.name,level:c.level,custom:true}:{id}; });
    }
  }
  if((s&&s.schoolsAsked)||(k&&k.setupDone)||sh.schools.length) sh.setupDone=true;
  if(s&&s.snd===false) sh.snd=false; if(k&&k.mute===true) sh.snd=false;
  if(s&&s.timer===false) sh.timer=false;
  if(s&&s.premium===true) sh.premium.sansu=true;
  sh.migrated=true; try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){}
}

// バックアップを読みこむとき：合格パックの状態は、読みこむ中身では書きかえない（ずるで有料にならないように）
function mergeImport(cur,imp){
  const r={v:1,shared:Object.assign(defShared(),(imp&&imp.shared)||{}),sansu:(imp&&imp.sansu)||null,kokugo:(imp&&imp.kokugo)||null};
  r.shared.premium=Object.assign({sansu:false,kokugo:false},(cur&&cur.shared&&cur.shared.premium)||{});
  // 無料の分の記録（国語の詩の1つ分・無料の苦手モードの数・算数の苦手モードの日数）も、読みこむ中身では書きかえない
  const ck=(cur&&cur.kokugo)||{}, cs=(cur&&cur.sansu)||{};
  if(r.kokugo){ r.kokugo=Object.assign({},r.kokugo); r.kokugo.freeUse=ck.freeUse; r.kokugo.poemFree=ck.poemFree; }
  if(r.sansu){ r.sansu=Object.assign({},r.sansu); r.sansu.weakDay=cs.weakDay; }
  r.shared.migrated=true; return r;
}

function anaView(){
  const m=mainSchool(); const both=isPremium('sansu')&&isPremium('kokugo');
  if(!both) return `<div class="card center"><div style="font-size:34px">🔒</div><b>算数と国語を合わせた分析は、合格パックで</b><div class="sub" style="margin-top:6px">算数と国語の到達度のくらべ、どちらをもっと練習するとよいかのひとこと</div></div>`;
  if(!m) return `<div class="card center">志望校を入力すると、算数と国語を合わせた分析が出ます。<div style="margin-top:8px"><button class="btn main" id="b-setup">志望校を入力する</button></div></div>`;
  const a=reachOf('sansu',m.level), b=reachOf('kokugo',m.level);
  const ra=a.rows||[], rb=b.rows||[]; const cls=d=>d==null?'cn':d>=0?'cg':d>=-0.15?'co':'cr';
  const row=(lv)=>{ const x=ra[lv-1]||{}, y=rb[lv-1]||{}, t=x.target??y.target; const f=z=>z.acc==null?'<span class="cn">－</span>':`<span class="${cls(z.ok?z.acc-t:null)}" style="padding:2px 6px">${pct0(z.acc)}</span>`;
    return `<tr><td>${LEVEL_NAME[lv]}の問題</td><td>${f(x)}</td><td>${f(y)}</td><td>${t==null?'－':pct0(t)}</td></tr>`; };
  const W=300,H=150,gw=W/4; let o='';
  for(let i=0;i<4;i++){ const x=ra[i]||{}, y=rb[i]||{}, t=(x.target??y.target)||0, bx=i*gw+gw/2, h=v=>(v||0)*(H-40);
    o+=`<rect x="${bx-33}" y="${H-22-h(t)}" width="20" height="${h(t)}" rx="3" fill="none" stroke="var(--sub)" stroke-dasharray="4 3"/>`;
    if(x.acc!=null) o+=`<rect x="${bx-9}" y="${H-22-h(x.acc)}" width="20" height="${h(x.acc)}" rx="3" fill="var(--a)"/>`;
    if(y.acc!=null) o+=`<rect x="${bx+13}" y="${H-22-h(y.acc)}" width="20" height="${h(y.acc)}" rx="3" fill="var(--g)"/>`;
    o+=`<text x="${bx}" y="${H-6}" text-anchor="middle" class="sv-t">${LEVEL_NAME[i+1]}</text>`; }
  let adv; const pa=a.pct, pb=b.pct;
  if(pa==null&&pb==null) adv='まだ記録が少ないよ。算数も国語も、いろいろなレベルを5問以上といてみよう。';
  else if(pa==null||pb==null) adv=`${pa==null?'算数':'国語'}はまだ記録が少ないよ。${pa==null?'算数':'国語'}も5問以上といて、くらべられるようにしよう。`;
  else if(Math.abs(pa-pb)<5) adv=`算数（${pa}%）も国語（${pb}%）も、同じくらいの到達度だよ。苦手モードで、弱い所をのばそう。`;
  else adv=`${pa<pb?'算数':'国語'}の方が目安から遠いよ（算数 ${pa}%・国語 ${pb}%）。${pa<pb?'算数':'国語'}を、もう少し練習してみよう。`;
  return `<div class="card"><b>🏫 ${esc(m.name)}</b> <span class="sub">${LEVEL_NAME[m.level]}レベルの目安</span>
    <div class="row" style="justify-content:space-around;margin:12px 0"><div class="center"><div class="sub">🔢 算数の到達度</div><div class="big" style="font-size:32px">${pa==null?'－':pa+'%'}</div></div><div class="center"><div class="sub">📖 国語の到達度</div><div class="big" style="font-size:32px">${pb==null?'－':pb+'%'}</div></div></div>
    <div class="idea">💬 ${adv}</div></div>
    <div class="card"><b>問題のレベルごとの正答率</b><table class="tb"><tr><th>問題のレベル</th><th>🔢算数</th><th>📖国語</th><th>目安</th></tr>${[1,2,3,4].map(row).join('')}</table>
      <div class="sub" style="margin-top:8px">棒グラフ（点線＝目安・青＝算数・緑＝国語）</div><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto;display:block;margin:0 auto">${o}</svg>
      <div class="idea" style="font-size:12px">⚠️ 「アプリが決めた目安」で、実際の合格者のデータではありません。5問以上といたレベルだけが表に出ます。</div></div>`;
}
/* ボタン */
$('in').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='c-sansu') return show('sansu','home'); if(t.id==='c-kokugo') return show('kokugo','home');
  if(t.id==='b-setup'||t.id==='b-setup2'){ setupQ=''; return show('setup',cur==='settings'?'settings':'home'); }
  if(t.id==='b-ana') return show('ana','home'); if(t.id==='b-settings') return show('settings','home'); if(t.id==='b-backup') return show('backup','settings');
  if(t.id==='b-snd'){ U.shared.snd=!U.shared.snd; saveU(); return render(); } if(t.id==='b-timer'){ U.shared.timer=!U.shared.timer; saveU(); return render(); }
  if(t.id==='b-copy'){ const x=$('bk'); x.select(); try{ if(navigator.clipboard) navigator.clipboard.writeText(x.value); document.execCommand('copy'); toast('コピーしました'); }catch(er){ toast('文字を選んでコピーしてね'); } return; }
  if(t.id==='b-import'){ try{ if(!confirm('いまの記録は、貼りつけた記録に置きかわります。よいですか？')) return; importBackup($('bkin').value); }catch(er){ toast('読みこめませんでした（貼りつけた文字を見直してね）'); } return; }
  if(t.id==='b-setupdone'){ U.shared.setupDone=true; saveU(); setupFirst=false; const to=after||'home'; show(to==='home'||to==='settings'?to:to,'home'); return; }
  if(t.id==='b-addcustom'){ const nm=($('cn').value||'').trim().slice(0,30), lv=+$('cl').value; if(!nm) return toast('学校の名前を入れてね'); if(U.shared.schools.length>=3) return toast('えらべるのは3校までです'); U.shared.schools.push({id:'c'+Date.now().toString(36),name:nm,level:lv,custom:true}); saveU(); return render(); }
  if(t.dataset.sch){ const id=t.dataset.sch, l=U.shared.schools, i=l.findIndex(x=>x.id===id); if(i>=0) l.splice(i,1); else if(l.length<3) l.push({id}); else toast('えらべるのは3校までです'); saveU(); const y=$('main').scrollTop; render(); $('main').scrollTop=y; return; }
  if(t.dataset.main){ setMain(t.dataset.main); return render(); }
  if(t.dataset.rm){ const l=U.shared.schools, i=l.findIndex(x=>x.id===t.dataset.rm); if(i>=0) l.splice(i,1); saveU(); return render(); }
});
$('in').addEventListener('input',e=>{ if(e.target.id==='sf'){ setupQ=e.target.value; const l=$('slist'); if(l) l.innerHTML=schoolListHTML(); } });

/* ---------- 算数・国語の枠（iframe）に渡す入り口 ---------- */
const JUKEN={
  FREE_ALL, search:location.search,
  load:c=>U[c]?JSON.stringify(U[c]):null,                 // 各コースのセーブを読む（1つのセーブの中の自分の分）
  save:(c,j)=>{ try{ U[c]=JSON.parse(j); }catch(e){ return; } saveU(); },
  isPremium, purchasePack, restorePurchases,
  schools, setMain,
  getSetting:k=>U.shared[k], setSetting:(k,v)=>{ U.shared[k]=v; saveU(); },
  openSetup:()=>{ setupQ=''; show('setup',cur==='sansu'||cur==='kokugo'?cur:'home'); },
  openBackup:()=>show('backup',cur==='sansu'||cur==='kokugo'?cur:'home'),
  // テスト用
  get U(){ return U; }, mergeImport, exportBackup, importBackup, show, migrate, loadU, reachOf, frameWin, KEY, ALL_SCHOOLS
};
window.JUKEN=JUKEN;
function frameDoc(c){
  const t=$('app-'+c);
  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script>window.JH=parent.JUKEN;window.JQ=parent.location.search;<\/script>'+t.innerHTML+'</body></html>';
}
$('f-sansu').srcdoc=frameDoc('sansu'); $('f-kokugo').srcdoc=frameDoc('kokugo');
if(!U.shared.setupDone){ setupFirst=true; show('setup','home'); } else show('home','home');
// 枠（算数・国語）が読みこまれたら、ホームの到達度を出しなおす
['sansu','kokugo'].forEach(c=>{ $('f-'+c).onload=()=>{ if(cur==='home'||cur==='ana') render(); }; });
</script>
