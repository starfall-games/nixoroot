<script>
'use strict';
/* =========================================================
   算数（中学受験）
   ・問題は「数字を毎回かえて」プログラムが作る（問題集や入試問題は写していない）
   ・答えのまちがいを防ぐため、問題を作るプログラム(gen)とは別に
     答えを出すプログラム(solve)を用意して、たくさん自動でくらべる（?test）
   ========================================================= */

/* ---------- 分数（Frac）：答えをぴったり計算するための数 ---------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
class Frac{
  constructor(n,d=1){ if(d===0) throw Error('0でわった'); if(d<0){n=-n;d=-d} const g=gcd(n,d)||1; this.n=n/g; this.d=d/g; }
  add(o){o=F(o);return new Frac(this.n*o.d+o.n*this.d,this.d*o.d)}
  sub(o){o=F(o);return new Frac(this.n*o.d-o.n*this.d,this.d*o.d)}
  mul(o){o=F(o);return new Frac(this.n*o.n,this.d*o.d)}
  div(o){o=F(o);return new Frac(this.n*o.d,this.d*o.n)}
  eq(o){o=F(o);return this.n===o.n&&this.d===o.d}
  isInt(){return this.d===1}
  val(){return this.n/this.d}
}
// 整数や "1.25" のような文字を分数にする（小数は文字で書くこと）
function F(x){
  if(x instanceof Frac) return x;
  if(typeof x==='number'){ if(Number.isInteger(x)) return new Frac(x,1); return parseNum(String(+x.toFixed(8))); }
  return parseNum(String(x));
}
// "12" "1.25" "3/4" "1と3/4" を読む
function parseNum(t){
  t=String(t).trim();
  let m;
  if((m=/^(\d+)と(\d+)\/(\d+)$/.exec(t))) return new Frac(+m[2],+m[3]).add(+m[1]);
  if((m=/^(\d+)\/(\d+)$/.exec(t))) return new Frac(+m[1],+m[2]);
  if((m=/^(\d+)\.(\d+)$/.exec(t))) return new Frac(+(m[1]+m[2]),10**m[2].length);
  if((m=/^\d+$/.exec(t))) return new Frac(+t,1);
  throw Error('数として読めない: '+t);
}
// 小数で書ける分数か（分母が2と5だけ）
function isTerm(f){let d=f.d;while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1}
// 分数を小数の文字に（わり切れるときだけ）
function decStr(f){
  f=F(f); if(!isTerm(f)) return fracStr(f);
  let k=0,p=1; while(p%f.d!==0){p*=10;k++}
  const neg=f.n<0; let s=String(Math.abs(f.n)*(p/f.d));
  if(k>0){ s=s.padStart(k+1,'0'); s=s.slice(0,s.length-k)+'.'+s.slice(s.length-k); }
  return (neg?'-':'')+s;
}
// 分数を "3/4" や "1と3/4" の文字に（帯分数）
function fracStr(f){
  f=F(f); if(f.d===1) return String(f.n);
  const w=Math.floor(f.n/f.d), r=f.n-w*f.d;
  return w>0? `${w}と${r}/${f.d}` : `${f.n}/${f.d}`;
}
// 答えの書き方：int=整数 / dec=小数（だめなら分数） / frac=分数
function ansStr(f,fmt){ return fmt==='frac'? fracStr(f) : decStr(f); }
// 文字の中の分数をたての分数（HTML）にする
function exprHTML(s){
  return String(s).replace(/(\d+)と(\d+)\/(\d+)|(\d+)\/(\d+)|□/g,(m,w,a,b,c,d)=>{
    if(m==='□') return '<span class="box"></span>';
    if(w!==undefined) return `${w}<span class="fr"><span>${a}</span><span>${b}</span></span>`;
    return `<span class="fr"><span>${c}</span><span>${d}</span></span>`;
  });
}
const H=(f,fmt='frac')=>exprHTML(ansStr(F(f),fmt));  // 数→HTML
const D=f=>exprHTML(decStr(F(f)));                   // 小数で→HTML

/* ---------- 乱数（たね seed から毎回同じ問題を作れる） ---------- */
function mkRng(seed){
  let a=seed>>>0;
  const r=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  r.int=(lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
  r.pick=arr=>arr[Math.floor(r()*arr.length)];
  r.step=(lo,hi,s)=>lo+s*Math.floor(r()*(Math.floor((hi-lo)/s)+1));
  return r;
}

/* ---------- 式を読むプログラム（答えのチェック用・問題を作る方とは別） ---------- */
function parseExpr(s){
  const toks=[]; const re=/\s*(\d+と\d+\/\d+|\d+(?:\.\d+)?(?:\/\d+)?|[+\-−×÷()□])/y;
  re.lastIndex=0;
  while(re.lastIndex<s.length){
    const pos=re.lastIndex, m=re.exec(s);
    if(!m){ if(/^\s*$/.test(s.slice(pos))) break; throw Error('読めない: '+s.slice(pos)); }
    toks.push(m[1]);
  }
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  function expr(){ let a=term(); while(peek()==='+'||peek()==='−'||peek()==='-'){ const op=next()==='+'?'+':'−'; a={op,L:a,R:term()}; } return a; }
  function term(){ let a=fac(); while(peek()==='×'||peek()==='÷'){ const op=next(); a={op,L:a,R:fac()}; } return a; }
  function fac(){ const t=next(); if(t==='('){ const e=expr(); if(next()!==')') throw Error('かっこ'); return e; }
    if(t==='□') return {box:true}; if(t===undefined) throw Error('式が途中'); return {num:parseNum(t)}; }
  const e=expr(); if(i!==toks.length) throw Error('よぶんな文字'); return e;
}
function evalAst(a,x){
  if(a.box) return x; if(a.num) return a.num;
  const L=evalAst(a.L,x),R=evalAst(a.R,x);
  return a.op==='+'?L.add(R):a.op==='−'?L.sub(R):a.op==='×'?L.mul(R):L.div(R);
}
const hasBox=a=>a.box?true:a.num?false:hasBox(a.L)||hasBox(a.R);
// 逆算：外がわから順に「もどし算」をして□を求める
function unravel(a,target){
  while(!a.box){
    const inL=hasBox(a.L), other=evalAst(inL?a.R:a.L);
    if(inL){ target= a.op==='+'?target.sub(other):a.op==='−'?target.add(other):a.op==='×'?target.div(other):target.mul(other); a=a.L; }
    else   { target= a.op==='+'?target.sub(other):a.op==='−'?other.sub(target):a.op==='×'?target.div(other):other.div(target); a=a.R; }
  }
  return target;
}

/* ---------- 式を作るプログラム（問題を作る方） ---------- */
const PREC={'+':1,'−':1,'×':2,'÷':2};
function mkNode(op,L,R){
  let v=null;
  if(L.v&&R.v){
    if(op==='+')v=L.v.add(R.v); else if(op==='−')v=L.v.sub(R.v); else if(op==='×')v=L.v.mul(R.v); else if(R.v.n!==0)v=L.v.div(R.v);
  }
  const pr=PREC[op];
  const wl=L.pr<pr, wr=R.pr<pr||(R.pr===pr&&(op==='−'||op==='÷'));
  return {op,L,R,v,pr,box:L.box||R.box,s:(wl?'('+L.s+')':L.s)+' '+op+' '+(wr?'('+R.s+')':R.s)};
}
function buildTree(r,n,leaf,ops){
  if(n===0) return leaf();
  const k=r.int(0,n-1); const L=buildTree(r,k,leaf,ops), R=buildTree(r,n-1-k,leaf,ops);
  return mkNode(r.pick([...ops]),L,R);
}
const leafOf=(v,s)=>({v:F(v),s:s??ansStr(F(v),'frac'),pr:3,leaf:true});
function* nodes(t){ if(!t.leaf){ yield* nodes(t.L); yield* nodes(t.R); } yield t; }
// 全部の途中の答えが条件に合うか
function treeOK(t,{int=false,maxD=200,maxN=5000,maxV=999}={}){
  for(const n of nodes(t)){
    if(!n.v||n.v.n<=0) return false;
    if(int&&n.v.d!==1) return false;
    if(n.v.d>maxD||n.v.n>maxN) return false;
    if(!n.leaf&&n.op==='×'&&(n.L.v.eq(1)||n.R.v.eq(1))) return false;
    if(!n.leaf&&n.op==='÷'&&n.R.v.eq(1)) return false;
  }
  return t.v.val()<=maxV;
}
// 解き方の1行：t=式、why=タップしたときのくわしい説明、fig=説明の図
const W=(t,why,fig)=>({t,why,fig});
// 1つの計算（L op R）の意味を言葉で
function opWhy(n,paren){
  const L=n.L.v,R=n.R.v; let w='';
  if(paren) w+='（ ）の中は、いちばん先に計算する決まり。<br>';
  else if(n.op==='×'||n.op==='÷') w+='かけ算・わり算は、たし算・ひき算より先に計算する決まり。<br>';
  else w+='かけ算・わり算が終わったら、残りのたし算・ひき算を左から順に計算する。<br>';
  const decs=[n.L,n.R].filter(x=>x.leaf&&/\./.test(x.s));
  if(decs.length) w+=decs.map(x=>`小数は分数になおすと計算しやすい：${x.s} = ${exprHTML(`${x.v.n}/${x.v.d}`)}`).join('<br>')+'<br>';
  if((n.op==='+'||n.op==='−')&&(L.d!==1||R.d!==1)){
    const m=lcm(L.d,R.d);
    w+= L.d===R.d? `分母が同じ（${m}）なので、分子だけ${n.op==='+'?'たす':'ひく'}。` :
      `分母がちがうので、${L.d} と ${R.d} の最小公倍数 ${m} にそろえる（通分）：<br>${H(L)} = ${exprHTML(`${L.n*m/L.d}/${m}`)}、${H(R)} = ${exprHTML(`${R.n*m/R.d}/${m}`)}<br>分子を${n.op==='+'?'たして':'ひいて'} ${exprHTML(`${n.op==='+'?L.n*m/L.d+R.n*m/R.d:L.n*m/L.d-R.n*m/R.d}/${m}`)} → 約分・帯分数にして ${H(n.v)}`;
  }else if(n.op==='×'&&(L.d!==1||R.d!==1)) w+=`分数のかけ算は「分子×分子」「分母×分母」。かける前に、ななめに約分できるところは約分すると楽。<br>${exprHTML(`${L.n}/${L.d}`)} × ${exprHTML(`${R.n}/${R.d}`)} = ${exprHTML(`${L.n*R.n}/${L.d*R.d}`)} = ${H(n.v)}`;
  else if(n.op==='÷'&&(L.d!==1||R.d!==1||!n.v.isInt())) w+=`わり算は「わる数をひっくり返して（逆数にして）かける」。<br>${H(R)} の逆数は ${exprHTML(`${R.d}/${R.n}`)} → ${H(L)} × ${exprHTML(`${R.d}/${R.n}`)} = ${H(n.v)}`;
  else if(n.op==='÷') w+=`${L.n} の中に ${R.n} がいくつ入るか → ${n.v.n}こ。たしかめ：${R.n} × ${n.v.n} = ${L.n}`;
  else if(n.op==='×') w+=`${L.n} を ${R.n} こ分 → ${n.v.n}`;
  else w+=`${H(L)} ${n.op} ${H(R)} = ${H(n.v)}`;
  return w;
}
// 計算の順番どおりの説明（1行ずつタップでくわしく）
function evalSteps(t){
  const st=[];
  const walk=(n,paren)=>{ if(n.leaf) return;
    const pr=n.pr, wl=n.L.pr<pr, wr=n.R.pr<pr||(n.R.pr===pr&&(n.op==='−'||n.op==='÷'));
    walk(n.L,wl); walk(n.R,wr);
    st.push(W(`${H(n.L.v)} ${n.op} ${H(n.R.v)} = <b>${H(n.v)}</b>`,opWhy(n,paren))); };
  walk(t,false);
  return st;
}

/* ---------- 図（SVG）をかく道具 ---------- */
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const T=(x,y,s,c='sv-t',a='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${s}</text>`;
// 線分図：rows=[{name, segs:[{len, label, cls, dash}], right}]
function segFig(rows,opt={}){
  const max=Math.max(...rows.map(r=>r.segs.reduce((s,g)=>s+g.len,0)));
  const W=300, x0=60, sc=(W-x0-50)/max; let y=24, out='';
  rows.forEach(row=>{
    out+=T(x0-8,y+5,row.name,'sv-t','end');
    let x=x0;
    row.segs.forEach(g=>{
      const w=g.len*sc;
      out+=`<rect x="${x}" y="${y-9}" width="${w}" height="18" rx="3" class="${g.dash?'sv-d':(g.cls||'sv-a')}"/>`;
      if(g.label) out+=T(x+w/2,y-13,g.label,g.dash?'sv-tb':'sv-t');
      x+=w;
    });
    if(row.right) out+=T(x+6,y+5,row.right,'sv-tb','start');
    y+=44;
  });
  if(opt.total){ const yb=y-30; out+=`<path d="M${W-36} 14 h8 V${yb} h-8" class="sv"/>`+T(W-24,(14+yb)/2+5,opt.total,'sv-tb','start'); }
  return svg(W+(opt.total?40:0),y-14,out);
}
// 面積図（つるかめ算）
function areaFig(x,y,a,b,la,lb){
  const W=280,Hh=130, tot=x+y, sx=(W-70)/tot, sy=(Hh-30)/Math.max(a,b);
  const x1=30+x*sx, top=10;
  let o=`<rect x="30" y="${top+(Math.max(a,b)-a)*sy}" width="${x*sx}" height="${a*sy}" class="sv-a"/>`;
  o+=`<rect x="${x1}" y="${top+(Math.max(a,b)-b)*sy}" width="${y*sx}" height="${b*sy}" class="sv-b"/>`;
  o+=`<rect x="30" y="${top}" width="${x*sx}" height="${(Math.max(a,b)-a)*sy}" class="sv-d"/>`;
  o+=T(30+x*sx/2,Hh+2,la+' ?')+T(x1+y*sx/2,Hh+2,lb);
  o+=T(24,top+(Math.max(a,b)-a)*sy+a*sy/2+5,a,'sv-t','end');
  o+=T(x1+y*sx+6,top+b*sy/2+5,b,'sv-t','start');
  return svg(W+20,Hh+10,o);
}
// 多角形（座標はふつうの向き：上がプラス）
function polyFig(pts,labels=[],dashes=[],extra=''){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const W=260,Hh=150, s=Math.min((W-60)/(mxx-mnx||1),(Hh-50)/(mxy-mny||1));
  const X=x=>30+(x-mnx)*s, Y=y=>Hh-25-(y-mny)*s;
  let o=`<polygon points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" class="sv-a"/>`;
  dashes.forEach(d=>o+=`<line x1="${X(d[0])}" y1="${Y(d[1])}" x2="${X(d[2])}" y2="${Y(d[3])}" class="sv-d"/>`);
  labels.forEach(l=>o+=T(X(l[0])+(l[3]||0),Y(l[1])+(l[4]||0),l[2]));
  return svg(W,Hh,o+extra);
}

// てんびん図（食塩水）：左 x% a g、右 y% b g、支点 z%
function tenbinFig(x,y,z,a,b){
  const X=v=>30+(v-x)/(y-x)*240;
  let o=`<line x1="${X(x)}" y1="50" x2="${X(y)}" y2="50" class="sv"/><polygon points="${X(z)},52 ${X(z)-10},72 ${X(z)+10},72" class="sv-b"/>`;
  o+=`<line x1="${X(x)}" y1="50" x2="${X(x)}" y2="80" class="sv"/><rect x="${X(x)-22}" y="80" width="44" height="22" rx="4" class="sv-a"/>${T(X(x),96,a)}`;
  o+=`<line x1="${X(y)}" y1="50" x2="${X(y)}" y2="80" class="sv"/><rect x="${X(y)-22}" y="80" width="44" height="22" rx="4" class="sv-a"/>${T(X(y),96,b)}`;
  o+=T(X(x),40,x+'%')+T(X(y),40,y+'%')+T(X(z),40,z+'%','sv-tb');
  o+=T((X(x)+X(z))/2,20,'←'+decStr(F(z).sub(x))+'→','sv-tb')+T((X(z)+X(y))/2,20,'←'+decStr(F(y).sub(z))+'→','sv-tb');
  return svg(300,112,o);

// 正n角形に、1つの頂点から対角線（補助線）をひいた図
function ngonFig(n){

  return svg(160,156,o);

// 速さのダイヤグラム（グラフ）。lines=[{pts:[[時間,きょり],...], c:'a'|'b', name}]
function diaFig(D,Tmax,lines,ticks,dLabel){

  o+=`<line x1="${x0}" y1="${Y(D)}" x2="${x0+Wd}" y2="${Y(D)}" class="sv-d"/>`+T(x0-4,Y(D)+5,dLabel||D,'sv-t','end')+T(x0-4,y0+4,'0','sv-t','end');
  o+=T(x0+Wd+22,y0-6,'(分)','sv-t','end')+T(x0+4,y0-Hd-14,'(m)','sv-t','start');

  lines.forEach(l=>{o+=`<polyline points="${l.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="var(--${l.c})" stroke-width="3"/>`; const e=l.pts[l.label??0]; o+=T(X(e[0])+(l.dx||8),Y(e[1])+(l.dy||-6),l.name,'sv-tb','start');});
  o+=T(x0-30,Y(0)-2,'家','sv-t','middle')+T(x0-30,Y(D)+20,'駅','sv-t','middle');
  return svg(300,172,o);

/* =========================================================
   問題を作るプログラム（単元ごと）
   gen(r,lv) → {q:問題文, ans:答え(Frac), fmt, unit:単位, hint, steps:解き方, fig:図, p:チェック用の数}
   solve(p)  → 別のやり方で出した答え（Frac か 数）。gen の答えとくらべる
   ========================================================= */
const UNITS=[
  {id:'keisan',name:'計算',emo:'🧮'},
  {id:'wariai',name:'割合と比',emo:'📊'},
  {id:'hayasa',name:'速さ',emo:'🏃'},
  {id:'tokushu',name:'特殊算',emo:'🐢'},
  {id:'seishitsu',name:'数の性質',emo:'🔢'},
  {id:'baai',name:'場合の数',emo:'🎲'},
  {id:'heimen',name:'平面図形',emo:'📐'},
  {id:'rittai',name:'立体図形',emo:'🧊'},
];
const G={}, GL=[];
function def(id,o){o.id=id;G[id]=o;GL.push(o);}
const LVN=['','標準','上位','難関','最難関'];
const LVDESC=['','標準：学校のふつうの標準レベルの問題の難しさ','上位：上位校が出すくらいの問題の難しさ','難関：難関校が出すくらいの問題の難しさ','最難関：最難関校が出すくらいの問題の難しさ'];
const sumRange=(a,b)=>{let s=0;for(let i=a;i<=b;i++)s+=i;return s};

/* ===== 計算 ===== */
// tm = 目安の時間（秒）。レベル 標準・上位・難関・最難関 の順
def('kumi',{unit:'keisan',name:'四則混合の計算',desc:'かけ算・わり算が先、（ ）はもっと先',tm:[45,60,90,120],
  idea:'計算の順番：（ ）の中 → かけ算・わり算 → たし算・ひき算。同じなかまどうしは左から。',
  gen(r,lv){
    const c=[null,{n:2,lo:2,hi:20,max:200},{n:3,lo:2,hi:30,max:500},{n:4,lo:2,hi:60,max:999},{n:5,lo:2,hi:60,max:2000}][lv];
    let t=null;
    for(let i=0;i<6000&&!t;i++){ const x=buildTree(r,c.n,()=>leafOf(r.int(c.lo,c.hi)),'+−×÷'); if(treeOK(x,{int:true,maxV:c.max,maxN:5000})&&(lv<4||x.s.includes('('))) t=x; }
    if(!t) t=mkNode('+',leafOf(12),mkNode('×',leafOf(3),leafOf(4)));
    return {q:`次の計算をしましょう。<div class="ex">${exprHTML(t.s)}</div>`,ans:t.v,fmt:'int',unit:'',
      hint:'かけ算・わり算を先に計算。（ ）があれば、その中をいちばん先に。',steps:evalSteps(t),p:{s:t.s}};
  },
  solve:p=>evalAst(parseExpr(p.s))});

def('bunsu',{unit:'keisan',name:'分数・小数の計算',desc:'通分・約分・逆数のかけ算',tm:[60,90,120,180],
  idea:'たし算・ひき算は通分、かけ算は分子どうし分母どうし、わり算は逆数をかける。小数は分数になおす。',
  gen(r,lv){
    const ds=[2,3,4,5,6,8,9,10,12];
    const decs=['0.2','0.25','0.4','0.5','0.6','0.75','0.8','1.2','1.25','1.5','2.4','0.125','0.375','0.625','1.75'];
    const leaf=()=>{
      if(lv>=3&&r()<0.35){ const s=r.pick(decs); return leafOf(parseNum(s),s); }
      const d=r.pick(lv===4?[...ds,7,14,15,16,18]:ds); let f=new Frac(r.int(1,d-1),d);
      if(lv>=2&&r()<0.35) f=f.add(r.int(1,lv===4?4:2));
      return leafOf(f);
    };
    const n=[0,1,2,3,4][lv], ops=lv===1?'+−':'+−×÷';
    let t=null;
    for(let i=0;i<6000&&!t;i++){ const x=buildTree(r,n,leaf,ops); if(treeOK(x,{maxD:lv===1?24:lv===4?60:40,maxN:600,maxV:30})&&!x.v.eq(x.L.v)&&(lv<4||x.s.includes('('))) t=x; }
    if(!t) t=mkNode('+',leafOf(new Frac(1,2)),leafOf(new Frac(1,3)));
    const st=evalSteps(t); st.push(W('答えは約分して、仮分数は帯分数にしておこう。','入試では、答えは「それ以上約分できない形」で書く。分子が分母より大きい仮分数は、帯分数（整数と分数）になおすのがふつう。'));
    return {q:`次の計算をしましょう。<div class="ex">${exprHTML(t.s)}</div>`,ans:t.v,fmt:'frac',unit:'',
      hint:'たし算・ひき算は通分（分母をそろえる）。わり算は「わる数をひっくり返してかける」。小数は分数になおすと楽。',steps:st,p:{s:t.s}};
  },
  solve:p=>evalAst(parseExpr(p.s))});

def('gyakusan',{unit:'keisan',name:'逆算（□を求める）',desc:'外がわから順にもどしていく',tm:[60,90,150,210],
  idea:'いちばん最後に計算するところから順に、逆の計算（たし算↔ひき算、かけ算↔わり算）でもどす。',
  gen(r,lv){
    let t=null, frac=lv>=3;
    for(let i=0;i<6000&&!t;i++){
      const n=[0,2,3,3,4][lv]; let k=0; const bi=r.int(0,n);
      const leaf=()=>{ let v;
        if(frac){ if(lv===4&&r()<.3){ const s=r.pick(['0.25','0.5','0.75','1.2','1.5','2.5','0.4']); const l=leafOf(parseNum(s),s); if(k++===bi){l.box=true;l.s='□';} return l; }
          const d=r.pick([2,3,4,5,6,8]); v=new Frac(r.int(1,d*2-1),d); } else v=new Frac(r.int(2,lv===1?15:30));
        const l=leafOf(v); if(k++===bi){ l.box=true; l.s='□'; } return l; };
      const x=buildTree(r,n,leaf,'+−×÷');
      if(treeOK(x,{int:!frac,maxD:frac?30:1,maxN:frac?300:3000,maxV:frac?20:600})) t=x;
    }
    if(!t){ const b=leafOf(5); b.box=true; b.s='□'; t=mkNode('+',b,leafOf(3)); }
    const R=t.v, x=[...nodes(t)].find(n=>n.leaf&&n.box).v;
    const st=[]; let a=t, tg=R;
    while(!a.leaf){
      const inL=a.L.box, o=inL?a.R:a.L, part=inL?a.L:a.R; let nt;
      if(inL) nt= a.op==='+'?tg.sub(o.v):a.op==='−'?tg.add(o.v):a.op==='×'?tg.div(o.v):tg.mul(o.v);
      else nt= a.op==='+'?tg.sub(o.v):a.op==='−'?o.v.sub(tg):a.op==='×'?tg.div(o.v):o.v.div(tg);
      const inv= inL? {'+':'−','−':'+','×':'÷','÷':'×'}[a.op] : {'+':'−','−':'−','×':'÷','÷':'÷'}[a.op];
      const ps=part.leaf?'□':'（'+exprHTML(part.s)+'）';
      const calc= (!inL&&(a.op==='−'||a.op==='÷'))? `${H(o.v)} ${inv} ${H(tg)}` : `${H(tg)} ${inv} ${H(o.v)}`;
      const shape= inL? `${ps} ${a.op} ${H(o.v)} = ${H(tg)}` : `${H(o.v)} ${a.op} ${ps} = ${H(tg)}`;
      const rule= inL? {'+':'たして答えになる → 答えからひく','−':'ひいて答えになる → 答えにたす','×':'かけて答えになる → 答えをわる','÷':'わって答えになる → 答えにかける'}[a.op]
        : {'+':'たして答えになる → 答えからひく','−':'「ひかれる数 − □ = 答え」なら □ = ひかれる数 − 答え','×':'かけて答えになる → 答えをわる','÷':'「わられる数 ÷ □ = 答え」なら □ = わられる数 ÷ 答え'}[a.op];
      st.push(W(`${ps} = ${calc} = <b>${H(nt)}</b>`,`いま、式は<br>${shape}<br>という形。${ps==='□'?'□':'（ ）の部分'}をひとまとまりと見て、${rule}。<br>小さい数でためすとわかりやすい：${inL?{'+':'□+2=5 → □=5−2','−':'□−2=5 → □=5+2','×':'□×2=6 → □=6÷2','÷':'□÷2=3 → □=3×2'}[a.op]:{'+':'2+□=5 → □=5−2','−':'7−□=5 → □=7−5','×':'2×□=6 → □=6÷2','÷':'6÷□=3 → □=6÷3'}[a.op]}`));
      tg=nt; a=part;
    }
    return {q:`□にあてはまる数を求めましょう。<div class="ex">${exprHTML(t.s)} = ${H(R)}</div>`,ans:x,fmt:'frac',unit:'',
      hint:'最後に計算するところから、逆にもどしていこう。（たし算↔ひき算、かけ算↔わり算）',steps:st,p:{s:t.s,r:fracStr(R)}};
  },
  solve:p=>unravel(parseExpr(p.s),parseNum(p.r))});

def('kufu',{unit:'keisan',name:'工夫して計算',desc:'まとめる・入れかえる・分ける',tm:[45,60,90,120],
  idea:'そのまま計算せず、同じ数でまとめる・きりのいい数を作る・分数を分けるなど、楽になる形を探す。',
  gen(r,lv){
    const v=r.pick([[],['k25','k125','k99'],['bunpai','minus','pi'],['shift','tele','sum'],['sa','shift','tele']][lv]);
    let s,ans,st,hint;
    const mat='同じ数をかけている2つの式は「分配法則」でまとめられる：○×△ + ○×□ = ○×(△+□)';
    if(v==='k25'){const a=r.int(3,99); s=`25 × ${a} × 4`; ans=F(a*100); st=[W(`かける順番を入れかえて 25 × 4 = 100 を先に`,'かけ算だけの式は、どの順番でかけても答えは同じ。25×4=100 のように「きりのいい数」になる組を先に計算すると楽。'),W(`100 × ${a} = <b>${a*100}</b>`,`100倍は、うしろに0を2つつけるだけ。`)]; hint='25×4=100 になる組を先に。';}
    if(v==='k125'){const a=r.int(2,9); s=`125 × ${a} × 8`; ans=F(a*1000); st=[W(`125 × 8 = 1000 を先に`,'125×8=1000 はおぼえておくと便利。かけ算は順番を入れかえてよい。'),W(`1000 × ${a} = <b>${a*1000}</b>`,'1000倍は0を3つつける。')]; hint='125×8=1000 になる組を先に。';}
    if(v==='k99'){const a=r.int(3,60); s=`${a} × 99 + ${a}`; ans=F(a*100); st=[W(`${a} × 99 + ${a} × 1 と考える`,`${a} は「${a}×1」と同じ。そうすると、どちらも ${a} をかけている形になる。`),W(`${a} × (99 + 1) = ${a} × 100 = <b>${a*100}</b>`,mat)]; hint=`${a} は ${a}×1 と考えると、まとめられる。`;}
    if(v==='bunpai'){const x=F(r.int(101,399)).div(100), b=r.int(11,89), c=100-b; s=`${decStr(x)} × ${b} + ${decStr(x)} × ${c}`; ans=x.mul(100); st=[W(`同じ数 ${decStr(x)} でまとめる（分配法則）`,mat),W(`${decStr(x)} × (${b} + ${c}) = ${decStr(x)} × 100 = <b>${decStr(ans)}</b>`,`${b}+${c}=100 になるので、100倍するだけ（小数点を右に2つ）。`)]; hint='同じ数をかけている所をまとめよう。';}
    if(v==='minus'){const x=F(r.int(11,99)).div(10), c=r.int(11,79), b=c+r.pick([10,100]); s=`${decStr(x)} × ${b} − ${decStr(x)} × ${c}`; ans=x.mul(b-c); st=[W(`${decStr(x)} でまとめる`,mat.replace('+','−').replace('+','−')),W(`${decStr(x)} × (${b} − ${c}) = ${decStr(x)} × ${b-c} = <b>${decStr(ans)}</b>`,`${b}−${c}=${b-c} なので、${b-c}倍するだけ。`)]; hint='同じ数をかけている所をまとめよう。';}
    if(v==='pi'){const tot=r.pick([10,20,30]), a=r.int(1,tot-1), b=tot-a; s=`3.14 × ${a} + 3.14 × ${b}`; ans=F('3.14').mul(tot); st=[W(`3.14 でまとめる`,'円の問題でよく出る形。3.14のかけ算は何回もやるとまちがえやすいので、まとめて1回にする。'),W(`3.14 × (${a} + ${b}) = 3.14 × ${tot} = <b>${decStr(ans)}</b>`,'3.14×10=31.4、3.14×20=62.8、3.14×30=94.2 はおぼえておくと速い。')]; hint='3.14 の計算は、まとめてから1回だけ。';}
    if(v==='shift'){const x=parseNum(r.pick(['1.5','2.5','3.5','1.25','0.75','4.5'])), a=r.int(11,89), b=100-a, x10=x.mul(10), b10=F(b).div(10);
      s=`${decStr(x)} × ${a} + ${decStr(x10)} × ${decStr(b10)}`; ans=x.mul(100);
      st=[W(`${decStr(x10)} × ${decStr(b10)} = ${decStr(x)} × ${b}`,`かけ算は、かけられる数を10分の1にして、かける数を10倍しても答えは同じ。<br>${decStr(x10)}÷10 = ${decStr(x)}、${decStr(b10)}×10 = ${b}<br>こうすると、前の式と同じ ${decStr(x)} が出てくる。`),W(`${decStr(x)} × (${a} + ${b}) = ${decStr(x)} × 100 = <b>${decStr(ans)}</b>`,mat)]; hint='小数点をずらすと、同じ数が出てくる。';}
    if(v==='tele'){const m=r.int(1,lv===4?6:4), n=r.int(3,lv===4?8:6); const terms=[]; for(let k=m;k<m+n;k++) terms.push(`1/${k*(k+1)}`);
      s=terms.join(' + '); ans=new Frac(1,m).sub(new Frac(1,m+n));
      st=[W(`${exprHTML(`1/${m*(m+1)}`)} = ${exprHTML(`1/${m}`)} − ${exprHTML(`1/${m+1}`)} のように分ける`,`分母が「となりどうしの数のかけ算」（${m}×${m+1}=${m*(m+1)}）のとき、<br>${exprHTML(`1/${m}`)} − ${exprHTML(`1/${m+1}`)} = ${exprHTML(`${m+1}/${m*(m+1)}`)} − ${exprHTML(`${m}/${m*(m+1)}`)} = ${exprHTML(`1/${m*(m+1)}`)}<br>となるので、1つの分数を「2つの分数のひき算」に分けられる（部分分数分解）。`),
        W(`まん中が消えて ${exprHTML(`1/${m}`)} − ${exprHTML(`1/${m+n}`)} = <b>${H(ans)}</b>`,`全部分けて並べると<br>(${exprHTML(`1/${m}`)} − ${exprHTML(`1/${m+1}`)}) + (${exprHTML(`1/${m+1}`)} − ${exprHTML(`1/${m+2}`)}) + …<br>となって、となりどうしが打ち消し合い、最初と最後だけが残る。`)]; hint='分母が「となりどうしの数のかけ算」になっている。';}
    if(v==='sa'){const a=r.int(21,99), b=r.int(11,a-2); s=`${a} × ${a} − ${b} × ${b}`; ans=F((a+b)*(a-b));
      st=[W(`(${a} + ${b}) × (${a} − ${b}) と同じ`,`正方形の面積で考える：1辺${a}の正方形から1辺${b}の正方形を切り取った残りは、切って並べかえると「たて ${a}−${b}、横 ${a}+${b}」の長方形になる。`,svg(260,120,`<rect x="20" y="10" width="100" height="100" class="sv-a"/><rect x="20" y="10" width="60" height="60" fill="var(--card)" class="sv-d"/>${T(70,124,a)}${T(50,44,b)}<rect x="140" y="70" width="110" height="40" class="sv-a"/>${T(195,96,`${a+b} × ${a-b}`,'sv-tb')}`)),
        W(`${a+b} × ${a-b} = <b>${(a+b)*(a-b)}</b>`,'かけ算が1回ですむ。')]; hint='正方形から正方形を切り取った面積を考えてみよう。';}
    if(v==='sum'){const a=r.int(1,20), n=r.pick([10,20,25,30,40,50]); const b=a+n-1;
      ans=F((a+b)*n/2); st=[W(`${a}〜${b} は ${n}個`,`個数は「おわり − はじめ + 1」= ${b} − ${a} + 1 = ${n}。+1 をわすれやすい（植木算と同じ）。`),W(`(${a} + ${b}) × ${n} ÷ 2 = <b>${(a+b)*n/2}</b>`,`同じ式を逆の順に並べて、上下をたすと、どれも ${a}+${b} = ${a+b} になる。それが ${n}組あるので ${a+b}×${n}。これは2倍した分なので ÷2。`,svg(280,70,`${T(140,20,`${a} + ${a+1} + … + ${b}`)}${T(140,42,`${b} + ${b-1} + … + ${a}`)}<line x1="40" y1="50" x2="240" y2="50" class="sv"/>${T(140,66,`${a+b} が ${n}こ`,'sv-tb')}`))];
      return {q:`次の計算をしましょう。<div class="ex">${a} + ${a+1} + ${a+2} + … + ${b}</div>`,ans,fmt:'int',unit:'',hint:'逆の順に並べたものとたすと、どれも同じ数になる。',steps:st,p:{a,b}};}
    return {q:`くふうして計算しましょう。<div class="ex">${exprHTML(s)}</div>`,ans,fmt:'frac',unit:'',hint,steps:st,p:{s}};
  },
  solve:p=>{ if(p.s) return evalAst(parseExpr(p.s)); let x=0; for(let i=p.a;i<=p.b;i++)x+=i; return F(x); }});

/* ===== 割合と比 ===== */
const PCT='割合 = くらべる量 ÷ もとにする量。%は「100あたりいくつ」なので、%の数を100でわると小数の割合になる。';
def('wariai',{unit:'wariai',name:'割合・食塩水・売買',desc:'百分率・歩合・てんびん図',tm:[60,90,150,240],
  idea:PCT,
  gen(r,lv){
    const t=r.pick([[],['p1','p2','p3'],['p4','p5','p6'],['p7','p8','p9'],['p10','p11','p8']][lv]);
    let q,ans,fmt='int',u='円',hint,st,p,fig=null;
    const pd=x=>decStr(F(x).div(100));
    if(t==='p1'){const A=20*r.int(3,60), x=r.step(5,95,5); ans=F(A).mul(x).div(100); q=`${A}円の${x}%は何円ですか。`; hint='%を小数にすると、100でわった数。';
      st=[W(`${x}% → ${pd(x)}`,PCT),W(`${A} × ${pd(x)} = <b>${decStr(ans)}</b>円`,`もとにする量（${A}円）× 割合 = くらべる量。<br>たしかめ：${A}円の1%は${decStr(F(A).div(100))}円、その${x}こ分。`,segFig([{name:'円',segs:[{len:x,label:x+'%',cls:'sv-b'},{len:100-x,label:''}]}]))]; p={t,A,x};}
    if(t==='p2'){const A=20*r.int(3,60), x=r.step(5,95,5), y=A*x/100; ans=F(x); u='%'; q=`${y}円は${A}円の何%ですか。`; hint='くらべる量 ÷ もとにする量 = 割合';
      st=[W(`${y} ÷ ${A} = ${pd(x)}`,`「〜の何%」の「〜の」の方（${A}円）が、もとにする量。${y}円がくらべる量。`),W(`小数を%にするには100倍 → <b>${x}</b>%`,'割合の1 = 100%。0.01 = 1%。')]; p={t,A,y};}
    if(t==='p3'){const A=20*r.int(3,40), w=r.int(1,9), b=r.pick([0,5]), pc=10*w+b; ans=F(A).mul(pc).div(100); u='人';
      q=`${A}人の${w}割${b?b+'分':''}は何人ですか。`; hint='1割=0.1、1分=0.01';
      st=[W(`${w}割${b?b+'分':''} → ${pd(pc)}`,'歩合：1割 = 0.1 = 10%、1分 = 0.01 = 1%、1厘 = 0.001。'),W(`${A} × ${pd(pc)} = <b>${decStr(ans)}</b>人`,'もとにする量 × 割合 = くらべる量。')]; p={t,A,pc};}
    if(t==='p4'){const base=20*r.int(5,30), x=r.step(5,95,5), y=base*x/100; ans=F(base); u='ページ';
      q=`ある本の${x}%を読んだら、${y}ページでした。この本は全部で何ページですか。`; hint='もとにする量 = くらべる量 ÷ 割合';
      st=[W(`全部を□ページとすると □ × ${pd(x)} = ${y}`,'わからない「もとにする量」を□にして、かけ算の式を作るとまちがえにくい。'),W(`□ = ${y} ÷ ${pd(x)} = <b>${base}</b>`,`逆算：かけて${y}になるなら、${y}を${pd(x)}でわる。<br>${x}%が${y}ページ → 1%は${decStr(F(y).div(x))}ページ → 100%は${base}ページ、と考えてもよい。`,segFig([{name:'本',segs:[{len:x,label:`${x}%=${y}`,cls:'sv-b'},{len:100-x,label:''}],right:'100%=?'}]))]; p={t,x,y};}
    if(t==='p5'){const P=100*r.int(5,60), w=r.int(1,5); ans=F(P*(10-w)/10);
      q=`定価${P}円の品物を${w}割引きで買いました。代金は何円ですか。`; hint=`${w}割引き → 定価の (1 − ${decStr(F(w).div(10))}) 倍`;
      st=[W(`1 − ${decStr(F(w).div(10))} = ${decStr(F(10-w).div(10))}`,`定価を1とすると、${w}割（${decStr(F(w).div(10))}）引いたので、残りは ${decStr(F(10-w).div(10))}。`),W(`${P} × ${decStr(F(10-w).div(10))} = <b>${decStr(ans)}</b>円`,`${P}円の${w}割（${P*w/10}円）を出してから ${P}−${P*w/10} としても同じ。`)]; p={t,P,w};}
    if(t==='p6'){const C=100*r.int(3,50), w=r.int(1,5); ans=F(C*(10+w)/10);
      q=`原価${C}円の品物に、${w}割の利益を見こんで定価をつけました。定価は何円ですか。`; hint=`原価の (1 + ${decStr(F(w).div(10))}) 倍`;
      st=[W(`1 + ${decStr(F(w).div(10))} = ${decStr(F(10+w).div(10))}`,`原価を1とすると、利益${w}割（${decStr(F(w).div(10))}）をのせるので、定価は ${decStr(F(10+w).div(10))}。`),W(`${C} × ${decStr(F(10+w).div(10))} = <b>${decStr(ans)}</b>円`,'原価 × (1 + 利益の割合) = 定価')]; p={t,C,w};}
    if(t==='p7'){let k,w,z; do{k=r.int(3,30);w=r.int(2,5);z=r.int(1,w);}while((10+w)*(10-z)<=100);
      const C=100*k, P=C*(10+w)/10, S=P*(10-z)/10; ans=F(S-C);
      q=`原価${C}円の品物に${w}割の利益を見こんで定価をつけましたが、売れないので定価の${z}割引きで売りました。利益は何円ですか。`; hint='定価 → 売り値 → 売り値 − 原価 の順に。';
      st=[W(`定価：${C} × ${decStr(F(10+w).div(10))} = ${P}円`,'「見こむ」＝原価にのせる。原価がもとにする量。'),W(`売り値：${P} × ${decStr(F(10-z).div(10))} = ${S}円`,'ここでは「定価の」割引きなので、もとにする量は定価にかわる。ここがひっかけポイント。'),W(`利益：${S} − ${C} = <b>${S-C}</b>円`,'利益 = 売り値 − 原価')]; p={t,C,w,z};}
    if(t==='p8'){let a,b,x,y; do{a=50*r.int(2,8);b=50*r.int(2,8);x=r.int(2,15);y=r.int(2,15);}while(x===y||((a*x+b*y)*10)%(a+b)!==0);
      ans=F(a*x+b*y).div(a+b); u='%'; fmt='dec'; const lo=Math.min(x,y),hi=Math.max(x,y),wl=x<y?a:b,wr=x<y?b:a;
      q=`${x}%の食塩水${a}gと、${y}%の食塩水${b}gを混ぜると、何%の食塩水になりますか。`; hint='食塩の重さをそれぞれ出して、合計 ÷ 全体の重さ。（てんびん図でもとける）';
      st=[W(`食塩：${a} × ${pd(x)} = ${decStr(F(a*x).div(100))}g、${b} × ${pd(y)} = ${decStr(F(b*y).div(100))}g`,'食塩水の重さ × 濃さ = 食塩の重さ。'),W(`合わせて ${decStr(F(a*x+b*y).div(100))}g、食塩水は ${a+b}g`,'混ぜても、食塩の重さと食塩水の重さは、それぞれたし算になる。（濃さはたし算しない！）'),
        W(`${decStr(F(a*x+b*y).div(100))} ÷ ${a+b} × 100 = <b>${decStr(ans)}</b>%`,`濃さ = 食塩 ÷ 食塩水 × 100。<br>てんびん図でも：重さの比 ${wl}:${wr} の逆比が、うでの長さの比になる。`,tenbinFig(lo,hi,ans.val(),wl+'g',wr+'g'))]; p={t,a,b,x,y};}
    if(t==='p9'){let A,x,w; do{A=50*r.int(2,8);x=r.int(4,20);w=50*r.int(1,8);}while(((A*x)*10)%(A+w)!==0);
      ans=F(A*x).div(A+w); u='%'; fmt='dec';
      q=`${x}%の食塩水${A}gに、水を${w}g加えると何%の食塩水になりますか。`; hint='水を入れても食塩の重さはかわらない。';
      st=[W(`食塩：${A} × ${pd(x)} = ${decStr(F(A*x).div(100))}g`,'水を加えても、食塩はふえもへりもしない。だから先に食塩の重さを出す。'),W(`全体：${A} + ${w} = ${A+w}g`,'食塩水の重さは、水の分だけふえる。'),W(`${decStr(F(A*x).div(100))} ÷ ${A+w} × 100 = <b>${decStr(ans)}</b>%`,'濃さ = 食塩 ÷ 食塩水 × 100。水は「0%の食塩水」と考えて、てんびん図でもとける。')]; p={t,A,x,w};}
    if(t==='p10'){ // てんびん図：混ぜる量を求める
      let x,y,z,a,b; do{x=r.int(2,10);y=r.int(x+3,20);z=r.int(x+1,y-1);a=50*r.int(2,8);b=a*(z-x)/(y-z);}while(!Number.isInteger(b)||b%10!==0||b<50||b>800);
      ans=F(b); u='g';
      q=`${x}%の食塩水${a}gに、${y}%の食塩水を何gか混ぜたところ、${z}%の食塩水になりました。${y}%の食塩水を何g混ぜましたか。`; hint='てんびん図：うでの長さの比と、おもり（重さ）の比は逆になる。';
      st=[W(`うでの長さ：${z} − ${x} = ${z-x}、${y} − ${z} = ${y-z}`,'てんびん図では、左右の濃さと、混ぜたあとの濃さ（支点）との差が「うでの長さ」になる。',tenbinFig(x,y,z,a+'g','?g')),
        W(`うでの比 ${z-x}:${y-z} → 重さの比は逆の ${y-z}:${z-x}`,'てこと同じで「重さ × うでの長さ」が左右で等しいとつり合う。だから重さの比は、うでの長さの比の逆になる。'),
        W(`${a} ÷ ${y-z} × ${z-x} = <b>${b}</b>g`,`${x}%の方が ${y-z} にあたるので、1にあたる重さは ${a}÷${y-z}。それを ${z-x} 倍する。<br>たしかめ（食塩）：${decStr(F(a*x).div(100))} + ${decStr(F(b*y).div(100))} = ${decStr(F(a*x+b*y).div(100))}g、${decStr(F(a*x+b*y).div(100))} ÷ ${a+b} = ${z}%`)]; p={t,x,y,z,a};}
    if(t==='p11'){ // 売買：一部を値下げして売り切る
      let C,N,k,w,z,P; do{C=10*r.int(10,60);N=10*r.int(5,20);k=r.int(Math.ceil(N*0.5),N-5);w=r.int(2,5);z=r.int(1,4);const pr=C*(10+w)/10, pr2=pr*(10-z)/10; P=pr*k+pr2*(N-k)-C*N;
        if(Number.isInteger(pr)&&Number.isInteger(pr2)&&P>0) break; }while(true);
      const pr=C*(10+w)/10, pr2=pr*(10-z)/10; ans=F(P);
      q=`1個${C}円で${N}個仕入れた品物に、${w}割の利益を見こんで定価をつけました。${k}個は定価で売れましたが、残りは定価の${z}割引きで全部売りました。全体の利益は何円ですか。`;
      hint='「定価で売れた分」と「値下げして売った分」の売り上げを別々に出して、仕入れ値の合計をひく。';
      st=[W(`定価：${C} × ${decStr(F(10+w).div(10))} = ${pr}円`,'原価がもとにする量。'),W(`値下げ後：${pr} × ${decStr(F(10-z).div(10))} = ${pr2}円`,'こんどは定価がもとにする量。'),
        W(`売り上げ：${pr} × ${k} + ${pr2} × ${N-k} = ${pr*k+pr2*(N-k)}円`,`定価で ${k}個、残り ${N}−${k} = ${N-k}個 を値下げ。`),W(`利益：${pr*k+pr2*(N-k)} − ${C} × ${N} = <b>${P}</b>円`,'利益 = 売り上げ − 仕入れ値の合計')]; p={t,C,N,k,w,z};}
    return {q,ans,fmt,unit:u,hint,steps:st,fig,p};
  },
  solve(p){ // 小数のふつうの計算や、ためし算でたしかめる（分数のプログラムとは別）
    switch(p.t){case'p1':return p.A*p.x/100;case'p2':return p.y/p.A*100;case'p3':return p.A*p.pc/100;case'p4':return p.y*100/p.x;
      case'p5':return p.P*(1-p.w/10);case'p6':return p.C*(1+p.w/10);case'p7':return p.C*(1+p.w/10)*(1-p.z/10)-p.C;
      case'p8':return (p.a*p.x/100+p.b*p.y/100)/(p.a+p.b)*100;case'p9':return (p.A*p.x/100)/(p.A+p.w)*100;
      case'p10':{const res=[];for(let b=1;b<=3000;b++){if(Math.abs((p.a*p.x+b*p.y)/(p.a+b)-p.z)<1e-9)res.push(b);}return res.length===1?res[0]:null;}
      case'p11':{let s=0;for(let i=0;i<p.N;i++) s+= i<p.k? p.C*(1+p.w/10) : p.C*(1+p.w/10)*(1-p.z/10); return Math.round((s-p.C*p.N)*1000)/1000;}}
  }});

def('hi',{unit:'wariai',name:'比',desc:'比の分配・比例式・連比・やりとり',tm:[60,90,150,240],
  idea:'比は「1つ分（①）」がいくつかを考える。わかっている量が「比のいくつ分」にあたるかを見つける。',
  gen(r,lv){
    const t=r.pick([[],['bunpai','ichi'],['sa','hirei'],['renpi','yari'],['yari','tsukau']][lv]);
    const pr=()=>{let a,b;do{a=r.int(1,9);b=r.int(1,9);}while(a===b||gcd(a,b)!==1);return [a,b];};
    let q,ans,u='',st,hint,p,fmt='int',fig=null;
    if(t==='bunpai'){const [a,b]=pr(),k=r.int(2,30),S=(a+b)*k; ans=F(a*k); u='個';
      q=`${S}個のあめを、兄と弟で ${a}:${b} に分けます。兄は何個もらえますか。`; hint='全体を「比の和」でわると、1つ分が出る。';
      const f=segFig([{name:'兄',segs:Array.from({length:a},()=>({len:1,cls:'sv-a'}))},{name:'弟',segs:Array.from({length:b},()=>({len:1,cls:'sv-b'}))}],{total:`${S}`});
      st=[W(`比の和：${a} + ${b} = ${a+b}`,`兄を${a}こ分、弟を${b}こ分と考えると、全部で${a+b}こ分。`,f),W(`1つ分：${S} ÷ ${a+b} = ${k}`,`${a+b}こ分が${S}個にあたる。`),W(`兄：${k} × ${a} = <b>${a*k}</b>個`,`兄は1つ分の${a}こ分。`)];
      fig=segFig([{name:'兄',segs:[{len:a,label:`${a}`,cls:'sv-a'}],right:'?'},{name:'弟',segs:[{len:b,label:`${b}`,cls:'sv-b'}]}],{total:`${S}`}); p={t,S,a,b,who:0};}
    if(t==='ichi'){const [a,b]=pr(),k=r.int(2,30); ans=F(a*k); u='cm';
      q=`AとBの長さの比は ${a}:${b} です。Bが${b*k}cmのとき、Aは何cmですか。`; hint='Bの「1つ分」を先に求めよう。';
      st=[W(`1つ分：${b*k} ÷ ${b} = ${k}`,`Bは比の${b}にあたるので、${b}でわれば1つ分。`),W(`A：${k} × ${a} = <b>${a*k}</b>cm`,`Aは比の${a}にあたる。`)]; p={t,a,b,B:b*k};}
    if(t==='sa'){let [a,b]=pr(); if(a<b)[a,b]=[b,a]; const k=r.int(2,25); ans=F((a+b)*k); u='円';
      q=`姉と妹の持っているお金の比は ${a}:${b} で、姉は妹より${(a-b)*k}円多いです。2人のお金の合計は何円ですか。`; hint='比の差が何円にあたるかを考える。';
      st=[W(`比の差：${a} − ${b} = ${a-b} が ${(a-b)*k}円`,'線分図で、姉が多い部分は比の差にあたる。',segFig([{name:'姉',segs:[{len:b,cls:'sv-a'},{len:a-b,label:(a-b)*k+'円',dash:true}]},{name:'妹',segs:[{len:b,cls:'sv-b'}]}])),W(`1つ分：${(a-b)*k} ÷ ${a-b} = ${k}円`,'比の差のこ数でわる。'),W(`合計：${k} × (${a} + ${b}) = <b>${(a+b)*k}</b>円`,'合計は比の和にあたる。')]; p={t,a,b,D:(a-b)*k};}
    if(t==='hirei'){const [a,b]=pr(); const c=r.int(2,9)*b; ans=F(a*c).div(b); fmt='frac';
      q=`□にあてはまる数を求めましょう。<div class="ex">${a} : ${b} = □ : ${c}</div>`; hint='右の比は左の比を何倍したもの？（内項の積＝外項の積 でもOK）';
      st=[W(`${b} → ${c} は ${c/b}倍`,'比は、前と後ろに同じ数をかけても同じ比のまま。'),W(`□ = ${a} × ${c/b} = <b>${H(ans)}</b>`,`前の数にも同じ ${c/b} をかける。たしかめ：外側どうしのかけ算 ${a}×${c} と内側どうし ${b}×□ が等しい。`)]; p={t,a,b,c};}
    if(t==='renpi'){let a,b,c,d;do{[a,b]=pr();[c,d]=pr();}while(a*c+b*c+b*d>40);
      const L=lcm(b,c), A=a*L/b, B=L, C=d*L/c, g=gcd(gcd(A,B),C), A2=A/g,B2=B/g,C2=C/g, k=r.int(2,12), S=(A2+B2+C2)*k; ans=F(C2*k); u='g';
      q=`A、B、Cの重さの比は、A:B = ${a}:${b}、B:C = ${c}:${d} です。3つの合計が${S}gのとき、Cは何gですか。`; hint='Bの数をそろえて、A:B:C の連比にしよう。';
      st=[W(`Bを ${b} と ${c} の最小公倍数 ${L} にそろえる`,`2つの比でBの数がちがう（${b}と${c}）ので、そのままではつなげない。どちらも同じ数にすると、A・B・Cを1本の比で表せる。<br>A:B = ${a}:${b} → ${a*L/b}:${L}（${L/b}倍）<br>B:C = ${c}:${d} → ${L}:${d*L/c}（${L/c}倍）`),W(`A:B:C = ${A2}:${B2}:${C2}`,'連比。かんたんにできるときはする。'),W(`1つ分：${S} ÷ ${A2+B2+C2} = ${k}`,'合計は比の和にあたる。'),W(`C：${k} × ${C2} = <b>${C2*k}</b>g`,'')]; p={t,a,b,c,d,S};}
    if(t==='yari'){let a,b,c,d,Tt,K;
      for(;;){[a,b]=pr();if(a<b)[a,b]=[b,a];[c,d]=pr(); if(c*b>=d*a) continue; Tt=lcm(a+b,c+d)*r.int(1,4); if(Tt<40) Tt*=Math.ceil(40/Tt); K=Tt/(a+b)*a-Tt/(c+d)*c; if(K>0&&Tt<=1200) break;}
      const A=Tt/(a+b)*a; ans=F(A); u='円'; const m=lcm(a+b,c+d), x1=a*m/(a+b), x2=c*m/(c+d);
      q=`兄と弟の持っているお金の比は ${a}:${b} でした。兄が弟に${K}円あげたので、比は ${c}:${d} になりました。兄ははじめ何円持っていましたか。`;
      hint='2人の合計はかわらない。合計を「比の和」の最小公倍数でそろえよう。';
      st=[W(`合計はかわらないので、比の和 ${a+b} と ${c+d} を ${m} にそろえる`,'お金をあげても、2人の合計は同じ（「和が一定」）。だから、前の比と後の比の「和」を同じ数にそろえると、①の大きさが同じになってくらべられる。'),
        W(`前 ${x1}:${m-x1} → 後 ${x2}:${m-x2}`,`前の比を ${m/(a+b)}倍、後の比を ${m/(c+d)}倍した。`,segFig([{name:'前の兄',segs:[{len:x2,cls:'sv-a'},{len:x1-x2,label:K+'円',dash:true}]},{name:'後の兄',segs:[{len:x2,cls:'sv-a'}]}])),
        W(`兄の差 ${x1-x2} が ${K}円 → 1つ分 ${K/(x1-x2)}円`,'兄がへった分が、あげた金額。'),W(`兄のはじめ：${K/(x1-x2)} × ${x1} = <b>${A}</b>円`,'')];
      p={t,a,b,c,d,K};}
    if(t==='tsukau'){ // 2人が同じ金額を使う（差が一定）
      let a,b,c,d,K,x; for(;;){[a,b]=pr();if(a<b)[a,b]=[b,a];[c,d]=pr();if(c<d)[c,d]=[d,c]; if(c*b<=d*a) continue; const m=lcm(a-b,c-d); const ka=m/(a-b),kc=m/(c-d); const diff=a*ka-c*kc; if(diff<=0) continue; x=r.int(2,30); K=diff*x; if(c*kc>0&&K<=3000) {p={a,b,c,d,K,m,ka,kc,x};break;}}
      ({a,b,c,d,K,x}=p); const {m,ka,kc}=p, A=a*ka*x; ans=F(A); u='円';
      q=`兄と弟の持っているお金の比は ${a}:${b} でした。2人とも${K}円ずつ使ったので、比は ${c}:${d} になりました。兄ははじめ何円持っていましたか。`;
      hint='同じ金額を使ったので、2人の「差」はかわらない。比の差をそろえよう。';
      st=[W(`差はかわらないので、比の差 ${a-b} と ${c-d} を ${m} にそろえる`,'2人とも同じだけへると、差は一定（年れい算と同じ考え）。差をそろえると、①の大きさがそろう。'),
        W(`前 ${a*ka}:${b*ka} → 後 ${c*kc}:${d*kc}`,`前を${ka}倍、後を${kc}倍。`),W(`兄のへった分 ${a*ka-c*kc} が ${K}円 → 1つ分 ${x}円`,''),W(`兄のはじめ：${x} × ${a*ka} = <b>${A}</b>円`,'')];
      p={t,a,b,c,d,K};}
    return {q,ans,fmt,unit:u,hint,steps:st,fig,p};
  },
  solve(p){ // 1つずつためす（ぜんぶ調べる）
    const res=[];
    if(p.t==='bunpai'){for(let A=1;A<p.S;A++){const B=p.S-A; if(A*p.b===B*p.a)res.push(A);}}
    if(p.t==='ichi'){for(let A=1;A<=2000;A++) if(A*p.b===p.B*p.a)res.push(A);}
    if(p.t==='sa'){for(let s=1;s<=5000;s++){const big=s+p.D; if(big*p.b===s*p.a)res.push(big+s);}}
    if(p.t==='hirei') return new Frac(p.a*p.c,p.b);
    if(p.t==='renpi'){for(let A=1;A<p.S;A++)for(let B=1;A+B<p.S;B++){const C=p.S-A-B; if(A*p.b===B*p.a&&B*p.d===C*p.c)res.push(C);}}
    if(p.t==='yari'){for(let A=1;A<=3000;A++){ if((A*p.b)%p.a)continue; const B=A*p.b/p.a; if((A-p.K)*p.d===(B+p.K)*p.c&&A>p.K)res.push(A);}}
    if(p.t==='tsukau'){for(let A=1;A<=20000;A++){ if((A*p.b)%p.a)continue; const B=A*p.b/p.a; if(B>p.K&&(A-p.K)*p.d===(B-p.K)*p.c)res.push(A);}}
    return res.length===1?F(res[0]):null;
  }});

/* ===== 速さ ===== */
const KIHON='道のり ＝ 速さ × 時間、時間 ＝ 道のり ÷ 速さ、速さ ＝ 道のり ÷ 時間（「は・じ・き」）。単位をそろえてから計算する。';
def('hayasa',{unit:'hayasa',name:'速さの基本',desc:'道のり＝速さ×時間・単位のかえ方',tm:[45,60,120,180],
  idea:KIHON,
  gen(r,lv){
    const t=r.pick([[],['d','tm','sp'],['kmh2mpm','mps2kmh','km'],['avg','change'],['hiTime','avg']][lv]);
    let q,ans,u,st,hint,p,fmt='int';
    if(t==='d'){const a=r.int(3,80),h=r.int(2,6); ans=F(a*h); u='km'; q=`時速${a}kmで${h}時間進むと、何km進みますか。`; hint='道のり＝速さ×時間'; st=[W(`${a} × ${h} = <b>${a*h}</b>km`,`時速${a}km は「1時間に${a}km進む」こと。${h}時間ならその${h}倍。`)]; p={t,a,h};}
    if(t==='tm'){const a=r.step(40,90,5),m=r.int(4,30); ans=F(m); u='分'; q=`分速${a}mで${a*m}m歩くと、何分かかりますか。`; hint='時間＝道のり÷速さ'; st=[W(`${a*m} ÷ ${a} = <b>${m}</b>分`,`1分に${a}m進む。${a*m}mの中に${a}mが何こ入るか＝何分か。`)]; p={t,a,D:a*m};}
    if(t==='sp'){const a=r.int(4,60),h=r.int(2,5); ans=F(a); u='km'; q=`${a*h}kmを${h}時間で走りました。時速何kmですか。`; hint='速さ＝道のり÷時間'; st=[W(`${a*h} ÷ ${h} = <b>${a}</b>`,'時速は「1時間あたり何km」。全体を時間でわると1時間分になる。')]; p={t,D:a*h,h};}
    if(t==='kmh2mpm'){const a=3*r.int(1,20); ans=F(a*1000/60); u='m'; q=`時速${a}kmは、分速何mですか。`; hint='1km=1000m、1時間=60分'; st=[W(`時速${a}km = 1時間に${a*1000}m`,'kmをmになおすと×1000。'),W(`${a*1000} ÷ 60 = <b>${a*1000/60}</b> → 分速${a*1000/60}m`,'1時間＝60分なので、1分あたりにするには÷60。')]; p={t,a};}
    if(t==='mps2kmh'){const a=5*r.int(1,8); ans=F(a).mul('3.6'); u='km'; q=`秒速${a}mは、時速何kmですか。`; hint='1時間=3600秒。秒速×3600÷1000＝秒速×3.6'; st=[W(`1時間で ${a} × 3600 = ${a*3600}m`,'1時間＝60分＝3600秒。'),W(`${a*3600}m = <b>${decStr(ans)}</b>km → 時速${decStr(ans)}km`,'mをkmにするには÷1000。まとめると「秒速×3.6＝時速」。')]; p={t,a};}
    if(t==='km'){const a=r.step(50,90,10),m=r.int(5,40); ans=F(a*m).div(1000); u='km'; fmt='dec'; q=`分速${a}mで${m}分歩くと、何km進みますか。`; hint='mで出してから、1000でわってkmに。'; st=[W(`${a} × ${m} = ${a*m}m`,'道のり＝速さ×時間'),W(`${a*m}m = <b>${decStr(ans)}</b>km`,'1000m＝1km。')]; p={t,a,m};}
    if(t==='avg'){const pairs=[[60,40],[30,60],[12,6],[4,6],[60,30],[3,6],[40,60],[20,30],[80,120],[10,15],[45,30],[36,45]]; let [a,b]=r.pick(pairs); if(r()<.5)[a,b]=[b,a];
      const Dd=lcm(a,b); ans=F(2*Dd).div(Dd/a+Dd/b); u='km'; fmt='frac';
      q=`ある道のりを、行きは時速${a}km、帰りは時速${b}kmで往復しました。往復の平均の速さは時速何kmですか。`; hint='（速さの平均）ではない！ 往復の道のり÷往復の時間。道のりを決めてみよう。';
      st=[W(`片道を ${a} と ${b} の最小公倍数 ${Dd}km とする`,'道のりがわからないときは、計算しやすい数に決めてしまってよい（答えは道のりに関係なく同じになる）。'),W(`行き ${Dd/a}時間、帰り ${Dd/b}時間 → 合計 ${Dd/a+Dd/b}時間`,'時間＝道のり÷速さ'),W(`${Dd*2} ÷ ${Dd/a+Dd/b} = <b>${H(ans)}</b>`,`平均の速さ＝全体の道のり÷全体の時間。(${a}+${b})÷2 = ${(a+b)/2} とするのはまちがい（おそい方に長い時間かかるから）。`)]; p={t,a,b};}
    if(t==='change'){const a=r.step(50,80,10),b=a+r.step(20,60,10),x=r.int(5,20),y=r.int(3,15); const Dd=a*x+b*y; ans=F(x+y); u='分';
      q=`家から${Dd}mはなれた駅まで行きます。はじめは分速${a}mで${x}分歩き、残りは分速${b}mで走りました。家から駅まで全部で何分かかりましたか。`; hint='歩いた道のりを先に。残りの道のり÷走る速さ。';
      st=[W(`歩いた道のり：${a} × ${x} = ${a*x}m`,'速さが変わる問題は、速さごとに区切って考える。'),W(`残り：${Dd} − ${a*x} = ${b*y}m → ${b*y} ÷ ${b} = ${y}分`,'時間＝道のり÷速さ'),W(`${x} + ${y} = <b>${x+y}</b>分`,'')]; p={t,a,b,x,D:Dd};}
    if(t==='hiTime'){ // 速さの比と時間の比
      let a,b,m,Dd; do{a=r.step(60,100,10);b=r.step(40,a-10,10);m=r.int(2,12);Dd=m*a*b/(a-b);}while(!Number.isInteger(Dd)||Dd>6000||Dd%10!==0);
      ans=F(Dd); u='m';
      q=`AさんとBさんが同じ道のりを歩きます。Aさんは分速${a}m、Bさんは分速${b}mで歩くと、BさんはAさんより${m}分多くかかりました。この道のりは何mですか。`;
      hint='同じ道のりなら、速さの比と時間の比は逆になる。';
      const g=gcd(a,b);
      st=[W(`速さの比 A:B = ${a/g}:${b/g} → 時間の比は ${b/g}:${a/g}`,'道のりが同じとき、速い方が短い時間ですむ。速さが2倍なら時間は半分 → 時間の比は速さの比の逆（逆比）。'),
        W(`比の差 ${a/g-b/g} が ${m}分 → 1つ分 ${m/(a/g-b/g)}分`,'時間の差が比の差にあたる。',segFig([{name:'A',segs:[{len:b/g,cls:'sv-a'}]},{name:'B',segs:[{len:b/g,cls:'sv-b'},{len:a/g-b/g,label:m+'分',dash:true}]}])),
        W(`Aの時間 ${m/(a/g-b/g)*(b/g)}分 × 分速${a} = <b>${Dd}</b>m`,'道のり＝速さ×時間')]; p={t,a,b,m};}
    return {q,ans,fmt,unit:u,hint,steps:st,p};
  },
  solve(p){switch(p.t){case'd':return p.a*p.h;case'tm':return p.D/p.a;case'sp':return p.D/p.h;case'kmh2mpm':return p.a*1000/60;
    case'mps2kmh':return p.a*3600/1000;case'km':return p.a*p.m/1000;case'avg':{const tt=1/p.a+1/p.b;return 2/tt;}case'change':return p.x+(p.D-p.a*p.x)/p.b;
    case'hiTime':{const res=[];for(let D=10;D<=10000;D+=10){if(Math.abs(D/p.b-D/p.a-p.m)<1e-9)res.push(D);}return res.length===1?res[0]:null;}}}});

def('tabibito',{unit:'hayasa',name:'旅人算',desc:'出会う・追いつく・池のまわり',tm:[60,90,150,240],
  idea:'2人の間の「きょり」が、1分にどれだけちぢまるか（向かい合う＝速さの和、追いかける＝速さの差）を考える。',
  gen(r,lv){
    const t=r.pick([[],['meet'],['catch','meet2'],['ikeS','ikeO','ike2'],['ike3','catchD']][lv]);
    let q,ans,st,hint,p,fig=null; let u='分';
    const sumWhy=(a,b)=>`向かい合って進むと、1分でAが${a}m、Bが${b}m進むので、間のきょりは ${a}+${b} = ${a+b}m ずつちぢまる。`;
    if(t==='meet'||t==='meet2'){const a=r.step(40,90,5),b=r.step(40,90,5),tt=r.int(4,20),Dd=(a+b)*tt; ans=F(tt);
      q=t==='meet'?`${Dd}mはなれた所にいるAさんとBさんが、同時に向かい合って歩き始めました。Aさんは分速${a}m、Bさんは分速${b}mです。2人は何分後に出会いますか。`
        :`家と公園は${Dd}mはなれています。兄は分速${a}mで家から公園へ、弟は分速${b}mで公園から家へ、同時に出発しました。2人が出会うのは出発してから何分後ですか。`;
      hint='向かい合うときは、2人の速さの「和」で近づく。';
      fig=svg(300,70,`<line x1="20" y1="35" x2="280" y2="35" class="sv"/>${T(20,62,'A')}${T(280,62,'B')}${T(150,25,Dd+'m','sv-tb')}<path d="M24 45 l40 0 m-8 -5 l8 5 l-8 5" class="sv"/><path d="M276 45 l-40 0 m8 -5 l-8 5 l8 5" class="sv"/>${T(55,62,'分速'+a)}${T(245,62,'分速'+b)}`);
      st=[W(`1分で ${a} + ${b} = ${a+b}m 近づく`,sumWhy(a,b),fig),W(`${Dd} ÷ ${a+b} = <b>${tt}</b>分後`,`はじめの間のきょり${Dd}mが0になるまでの時間。たしかめ：${a}×${tt} + ${b}×${tt} = ${Dd}`)]; p={t,a,b,D:Dd};}
    if(t==='catch'||t==='catchD'){let a,b,tt,m; do{a=r.step(40,80,10);b=a+r.step(10,60,10);tt=r.int(3,20);m=(b-a)*tt/a;}while(!Number.isInteger(m)||m<2||m>20);
      const D=t==='catchD'; ans=F(D?b*tt:tt); if(D) u='m';
      q=`弟が分速${a}mで家を出発してから${m}分後に、兄が分速${b}mで同じ道を追いかけました。${D?'兄が弟に追いつくのは、家から何mのところですか。':'兄は家を出てから何分後に弟に追いつきますか。'}`;
      hint='兄が出発したとき、2人は何mはなれている？ 追いかけるときは速さの「差」で近づく。';
      const f=svg(300,80,`<line x1="20" y1="40" x2="280" y2="40" class="sv"/>${T(20,62,'家')}<circle cx="20" cy="40" r="5" class="sv-a"/><circle cx="${20+Math.min(200,a*m/(b*tt)*260)}" cy="40" r="5" class="sv-b"/><path d="M20 26 H${20+Math.min(200,a*m/(b*tt)*260)}" class="sv-d"/>${T(20+Math.min(200,a*m/(b*tt)*260)/2,20,a*m+'m','sv-tb')}${T(20,80,'兄','sv-t')}${T(20+Math.min(200,a*m/(b*tt)*260),62,'弟')}`);
      st=[W(`兄が出るとき、弟は ${a} × ${m} = ${a*m}m 先`,`弟は先に${m}分歩いているので、そのあいだに進んだきょりが「はじめの差」。`,f),W(`1分で ${b} − ${a} = ${b-a}m ちぢまる`,`同じ向きに進むと、兄は1分に${b}m、弟は${a}m進むので、差は ${b-a}m ずつちぢまる。`),W(`${a*m} ÷ ${b-a} = ${D?tt:'<b>'+tt+'</b>'}分後`,'差が0になったときが追いついたとき。'),...(D?[W(`${b} × ${tt} = <b>${b*tt}</b>m`,`兄が${tt}分で進んだきょり＝家から追いついた場所まで。たしかめ：弟は ${a}×(${m}+${tt}) = ${a*(m+tt)}m`)]:[])]; p={t,a,b,m};}
    if(t==='ikeS'||t==='ikeO'||t==='ike2'||t==='ike3'){const a=r.step(40,80,10),b=a+r.step(10,40,10),tt=r.int(4,20); const same=t==='ikeS', times=t==='ike2'?2:t==='ike3'?3:1;
      const v=same?b-a:a+b, Lp=v*tt; ans=F(tt*times);
      q=`まわりの長さが${Lp}mの池があります。AさんとBさんが同じ場所から${same?'同じ向き':'反対向き'}に同時に歩き始めました。Aさんは分速${a}m、Bさんは分速${b}mです。${same?'BさんがAさんにはじめて追いつく':times>1?`2人が${times}回目に出会う`:'2人がはじめて出会う'}のは何分後ですか。`;
      hint=same?'同じ向き：BがAより1周（池のまわり）多く歩いたときに追いつく。速さの差を使う。':'反対向き：2人合わせて1周歩いたときに出会う。速さの和を使う。';
      const ring=svg(160,150,`<circle cx="80" cy="75" r="55" class="sv"/><circle cx="80" cy="20" r="6" class="sv-b"/>${T(80,12,'スタート','sv-t')}<path d="M95 24 A55 55 0 0 1 130 50" class="sv" marker-end=""/>${T(140,48,'B','sv-tb','start')}<path d="M${same?95:65} ${same?34:24} A55 55 0 0 ${same?1:0} ${same?120:30} ${same?60:50}" class="sv-d"/>${T(same?118:20,same?80:48,'A','sv-tb','start')}`);
      st=[W(same?`1分で ${b} − ${a} = ${v}m 差がつく`:`1分で2人合わせて ${a} + ${b} = ${v}m 進む`,same?'同じ向きのとき、BがAに追いつくのは「BがちょうどAより1周多く歩いたとき」。1周分の差がつくまでの時間を考える。':'反対向きのとき、2人の歩いた道のりを合わせるとちょうど1周になったときに出会う。',ring),
        W(times>1?`${times}回目は2人合わせて${times}周 → ${Lp} × ${times} ÷ ${v} = <b>${tt*times}</b>分後`:`${Lp} ÷ ${v} = <b>${tt}</b>分後`,times>1?`1回出会ってからも、また2人合わせて1周すると次に出会う。だから${times}回目は合わせて${times}周。`:'')]; p={t,a,b,L:Lp,same,times};}
    return {q,ans,fmt:'int',unit:u,hint,steps:st,fig,p};
  },
  solve(p){ // 1分ずつ動かしてみる
    for(let m=1;m<=1000;m++){
      if(p.t==='meet'||p.t==='meet2'){ if(p.a*m+p.b*m===p.D) return F(m); }
      if(p.t==='catch'){ if(p.b*m===p.a*(m+p.m)) return F(m); }
      if(p.t==='catchD'){ if(p.b*m===p.a*(m+p.m)) return F(p.b*m); }
      if(p.t==='ikeS'){ if((p.b*m-p.a*m)%p.L===0) return F(m); }
      if(p.t==='ikeO'||p.t==='ike2'||p.t==='ike3'){ if((p.a*m+p.b*m)%p.L===0&&(p.a*m+p.b*m)/p.L===p.times) return F(m); }
    }
    return null;
  }});

def('diagram',{unit:'hayasa',name:'速さとグラフ（ダイヤグラム）',desc:'グラフから速さを読み、出会う時刻を求める',tm:[60,120,180,240],
  idea:'グラフの横は時間、たては道のり。線のかたむきが速さ。2本の線が交わったところで2人が出会う。',
  gen(r,lv){
    const t=['','read','meet','late','rest'][lv];
    let a,b,D,TA,TB,s=0,x=0,rr=0,tm,lines,ticks,q,st,ans,u='分',p;
    for(let i=0;i<5000;i++){
      a=r.step(40,90,10); b=r.step(40,90,10);
      if(t==='read'){ TA=r.int(10,40); D=a*TA; lines=[{pts:[[0,0],[TA,D]],c:'a',name:'Aさん',label:1,dx:-60,dy:-4}]; ticks=[TA]; tm=TA; break; }
      if(t==='meet'){ tm=r.int(5,20); D=(a+b)*tm; if(D%a||D%b) continue; TA=D/a; TB=D/b; lines=[{pts:[[0,0],[TA,D]],c:'a',name:'兄',label:1,dx:-30,dy:14},{pts:[[0,D],[TB,0]],c:'b',name:'弟',label:1,dx:-30,dy:-8}]; ticks=[TA,TB]; break; }
      if(t==='late'){ s=r.int(2,10); tm=r.int(s+3,30); D=a*tm+b*(tm-s); if(D%a||(D%b)) continue; TA=D/a; TB=s+D/b; if(TA>60||TB>60) continue; lines=[{pts:[[0,0],[TA,D]],c:'a',name:'兄',label:1,dx:-30,dy:14},{pts:[[s,D],[TB,0]],c:'b',name:'弟',label:1,dx:-30,dy:-8}]; ticks=[s,TA,TB]; break; }
      if(t==='rest'){ x=r.int(3,12); rr=r.int(3,10); tm=r.int(x+rr+2,40); D=a*(tm-rr)+b*tm; if(D%b) continue; const after=D-a*x; if(after%a) continue; TA=x+rr+after/a; TB=D/b; if(TA>70||TB>70||b*(x+rr)>=D-a*x) continue;
        lines=[{pts:[[0,0],[x,a*x],[x+rr,a*x],[TA,D]],c:'a',name:'兄',label:3,dx:-30,dy:14},{pts:[[0,D],[TB,0]],c:'b',name:'弟',label:1,dx:-30,dy:-8}]; ticks=[x,x+rr,TA,TB]; break; }
    }
    const Tmax=Math.max(...ticks)*1.05;
    const fig=diaFig(D,Tmax,lines,[...new Set(ticks)].sort((x,y)=>x-y),D+'');
    if(t==='read'){ans=F(a); u='m';
      q=`グラフは、Aさんが家から${D}mはなれた駅まで歩いたようすを表しています。Aさんは分速何mで歩きましたか。`;
      st=[W(`${TA}分で${D}m進んでいる`,'グラフの線が、家（0m）から出て、駅（'+D+'m）に着いた時刻を読む。'),W(`${D} ÷ ${TA} = <b>${a}</b>`,'速さ＝道のり÷時間')];}
    else{ ans=F(tm);
      q= t==='meet'?`グラフは、兄が家から駅へ、弟が駅から家へ、同時に出発して歩いたようすを表しています。2人が出会うのは出発してから何分後ですか。`
        : t==='late'?`グラフは、兄が家から駅へ、弟が駅から家へ歩いたようすを表しています。弟は兄より${s}分おそく出発しました。2人が出会うのは兄が出発してから何分後ですか。`
        : `グラフは、兄が家から駅へ、弟が駅から家へ同時に出発して歩いたようすを表しています。兄はとちゅうで${rr}分休みました。2人が出会うのは出発してから何分後ですか。`;
      st=[W(`兄の速さ：${t==='rest'?`${a*x} ÷ ${x}`:`${D} ÷ ${TA}`} = 分速${a}m、弟の速さ：${D} ÷ ${TB-s} = 分速${b}m`,'グラフから、それぞれの「かかった時間」と「進んだ道のり」を読んで速さを出す。'+(t==='late'?`弟は${s}分から出発しているので、かかった時間は ${TB}−${s} = ${TB-s}分。`:'')+(t==='rest'?`兄の線が横になっている所（${x}分〜${x+rr}分）は止まっている（休けい）。`:''))];
      if(t==='meet') st.push(W(`2人で1分に ${a+b}m 近づく → ${D} ÷ ${a+b} = <b>${tm}</b>分後`,'出会いの旅人算。グラフでは2本の線が交わる点の時刻。',fig));
      if(t==='late') st.push(W(`弟が出る${s}分後までに兄は ${a*s}m 進む`,`グラフで、弟の線が始まる時刻（${s}分）の兄の位置を読む。`),W(`残り ${D-a*s}m を2人で近づく：${D-a*s} ÷ ${a+b} = ${tm-s}分`,'ここからは出会いの旅人算。'),W(`${s} + ${tm-s} = <b>${tm}</b>分後`,'兄が出発してからの時間に直す。',fig));
      if(t==='rest') st.push(W(`兄が休み終わる${x+rr}分後、兄は ${a*x}m、弟は ${b*(x+rr)}m 進んでいる`,'兄は休んでいるあいだ、位置がかわらない。弟はそのあいだも歩いている。'),W(`残り ${D-a*x-b*(x+rr)}m を2人で近づく：÷ ${a+b} = ${tm-x-rr}分`,'休けいが終わってから出会うまでは、ふつうの出会いの旅人算。'),W(`${x+rr} + ${tm-x-rr} = <b>${tm}</b>分後`,'',fig));
    }
    p={t,a,b,D,s,x,rr};
    return {q:q+fig,ans,fmt:'int',unit:u,hint:'まずグラフから、2人の速さを読み取ろう。線が交わる点が出会うところ。',steps:st,p};
  },
  solve(p){ // 1分ずつ2人の位置を計算して、重なる時刻をさがす
    if(p.t==='read'){ for(let v=1;v<=500;v++) if(p.D%v===0&&p.D/v===p.D/p.a) return F(v); return null; }
    let A=0; for(let m=1;m<=500;m++){
      const moving= p.t!=='rest' || m<=p.x || m>p.x+p.rr; if(moving) A+=p.a;
      const B= p.D - p.b*Math.max(0,m-p.s);
      if(A===B) return F(m); if(A>B) return null;
    } return null;
  }});

def('tsuuka',{unit:'hayasa',name:'通過算',desc:'電車の長さも進む道のりに入れる',tm:[60,90,150,240],
  idea:'電車は「点」ではなく長さがある。電車の「先頭」か「最後尾」の1点に注目して、その点が進んだ道のりを考える。',
  gen(r,lv){
    const t=r.pick([[],['pole','bridge'],['kmh','len'],['pass','over'],['two','over']][lv]);
    let q,ans,st,hint,p,u='秒';
    const brFig=(L,B)=>svg(300,70,`<rect x="60" y="34" width="${Math.min(180,180*B/(B+L))}" height="8" class="sv-b"/>${T(60+Math.min(180,180*B/(B+L))/2,62,'鉄橋 '+B+'m')}<rect x="10" y="20" width="${Math.max(30,180*L/(B+L))}" height="12" rx="3" class="sv-a"/>${T(10,14,'電車 '+L+'m','sv-t','start')}<path d="M${10+Math.max(30,180*L/(B+L))} 26 L${60+Math.min(180,180*B/(B+L))+Math.max(30,180*L/(B+L))} 26" class="sv-d"/>`);
    if(t==='pole'){const v=r.int(10,25),s=r.int(5,15),L=v*s; ans=F(s); q=`長さ${L}mの電車が、秒速${v}mで走っています。この電車が電柱の前を通りすぎるのに何秒かかりますか。`; hint='電柱を通りすぎる＝電車の長さ分だけ進む。'; st=[W(`${L} ÷ ${v} = <b>${s}</b>秒`,`電車の先頭が電柱に来てから、最後尾が電柱を通りすぎるまでに、電車は自分の長さ${L}mだけ進む。`)]; p={t,v,L,B:0};}
    if(t==='bridge'||t==='kmh'){const v=t==='kmh'?5*r.int(2,6):r.int(10,25),s=r.int(15,60),L=10*r.int(8,25),B=v*s-L; if(B<=50) return this.gen(r,lv);
      ans=F(s); q=t==='bridge'?`長さ${L}mの電車が秒速${v}mで、長さ${B}mの鉄橋をわたります。わたり始めてからわたり終わるまで何秒かかりますか。`
        :`長さ${L}mの電車が時速${decStr(F(v).mul('3.6'))}kmで、長さ${B}mのトンネルを通ります。電車の先がトンネルに入ってから、最後がトンネルを出るまで何秒かかりますか。`;
      hint='鉄橋やトンネルの長さ＋電車の長さ を進む。'+(t==='kmh'?' 時速は秒速になおす（÷3.6）。':'');
      st=[...(t==='kmh'?[W(`時速${decStr(F(v).mul('3.6'))}km = 秒速${v}m`,'時速→秒速は ÷3.6（1時間＝3600秒、1km＝1000m なので ×1000÷3600）。')]:[]),W(`進む道のり：${B} + ${L} = ${B+L}m`,`電車の「最後尾」に注目すると、わたり始めは鉄橋の手前${L}mのところにいて、わたり終わりは鉄橋の向こうはし。だから最後尾は ${L}+${B}m 進む。`,brFig(L,B)),W(`${B+L} ÷ ${v} = <b>${s}</b>秒`,'時間＝道のり÷速さ')]; p={t,v,L,B};}
    if(t==='len'){const v=r.int(12,25),s=r.int(15,50),L=10*r.int(8,25),B=v*s-L; if(B<=50) return this.gen(r,lv);
      ans=F(L); u='m'; q=`秒速${v}mで走る電車が、長さ${B}mの鉄橋をわたり始めてからわたり終わるまで${s}秒かかりました。この電車の長さは何mですか。`; hint='進んだ道のり全体から、鉄橋の長さをひく。';
      st=[W(`進んだ道のり：${v} × ${s} = ${v*s}m`,'道のり＝速さ×時間'),W(`${v*s} − ${B} = <b>${L}</b>m`,'進んだ道のり＝鉄橋の長さ＋電車の長さ だから、鉄橋の長さをひくと電車の長さ。',brFig(L,B))]; p={t,v,s,B};}
    if(t==='pass'||t==='over'){let v1,v2,L1,L2,s;
      do{v1=r.int(12,30);v2=r.int(10,28);L1=10*r.int(10,25);L2=10*r.int(8,25);s=t==='pass'?(L1+L2)/(v1+v2):(L1+L2)/(v1-v2);}while(v1===v2||(t==='over'&&v1<v2)||!Number.isInteger(s)||s<=0||s>120);
      ans=F(s);
      q=t==='pass'?`長さ${L1}mで秒速${v1}mの電車Aと、長さ${L2}mで秒速${v2}mの電車Bが、向かい合って走っています。出会ってからすれちがい終わるまで何秒かかりますか。`
        :`長さ${L1}mで秒速${v1}mの電車Aが、前を同じ向きに走る長さ${L2}mで秒速${v2}mの電車Bに追いついてから、追いこし終わるまで何秒かかりますか。`;
      hint=t==='pass'?'すれちがい：2本の長さの和を、速さの和で進む。':'追いこし：2本の長さの和を、速さの差で進む。';
      st=[W(`長さの和：${L1} + ${L2} = ${L1+L2}m`,`Aの最後尾とBの最後尾に注目。${t==='pass'?'出会ったとき、2つの最後尾は2本の長さの和だけはなれていて、すれちがい終わるとき重なる。':'追いついたとき、Aの先頭とBの最後尾が重なっている。追いこし終わるのは、Aの最後尾がBの先頭をこえたとき。そのあいだにAはBより2本の長さの和だけ多く進む。'}`),W(t==='pass'?`速さの和：${v1} + ${v2} = ${v1+v2}m`:`速さの差：${v1} − ${v2} = ${v1-v2}m`,t==='pass'?'向かい合うので旅人算の「出会い」と同じ。':'同じ向きなので旅人算の「追いつき」と同じ。'),W(`${L1+L2} ÷ ${t==='pass'?v1+v2:v1-v2} = <b>${s}</b>秒`,'')]; p={t,v1,v2,L1,L2};}
    if(t==='two'){let v,L,B1,B2,s1,s2,ask; do{v=r.int(12,30);L=10*r.int(8,25);s1=r.int(10,40);s2=s1+r.int(5,40);B1=v*s1-L;B2=v*s2-L;}while(B1<60||B2>3000);
      ask=r.int(1,2); ans=F(ask===1?L:v); u=ask===1?'m':'m';
      q=`ある電車が、長さ${B1}mの鉄橋をわたり始めてからわたり終わるまでに${s1}秒、長さ${B2}mのトンネルに入り始めてから出終わるまでに${s2}秒かかりました。${ask===1?'この電車の長さは何mですか。':'この電車は秒速何mですか。'}`;
      hint='2つの「長さのちがい」と「時間のちがい」をくらべると、速さがわかる。';
      st=[W(`長さの差 ${B2} − ${B1} = ${B2-B1}m を、時間の差 ${s2} − ${s1} = ${s2-s1}秒 で進む`,'どちらも「電車の長さ＋橋（トンネル）の長さ」を進む。電車の長さは同じなので、進んだ道のりの差＝橋とトンネルの長さの差。それにかかった時間の差でわれば速さが出る。',segFig([{name:'鉄橋',segs:[{len:B1,label:B1+'m'},{len:L,label:'電車',cls:'sv-b'}],right:s1+'秒'},{name:'トンネル',segs:[{len:B2,label:B2+'m'},{len:L,label:'電車',cls:'sv-b'}],right:s2+'秒'}])),
        W(`速さ：${B2-B1} ÷ ${s2-s1} = 秒速${ask===2?'<b>'+v+'</b>':v}m`,''),...(ask===1?[W(`電車の長さ：${v} × ${s1} − ${B1} = <b>${L}</b>m`,'鉄橋のときに進んだ道のりから、鉄橋の長さをひく。')]:[])]; p={t,B1,B2,s1,s2,ask};}
    return {q,ans,fmt:'int',unit:u,hint,steps:st,p};
  },
  solve(p){ // 1秒ずつ電車を動かす・ためす
    if(p.t==='len'){ const res=[]; for(let L=1;L<=2000;L++){ if(p.v*p.s===p.B+L) res.push(L);} return res.length===1?F(res[0]):null; }
    if(p.t==='two'){ const res=[]; for(let v=1;v<=100;v++)for(let L=1;L<=1000;L++){ if(v*p.s1===p.B1+L&&v*p.s2===p.B2+L) res.push(p.ask===1?L:v);} return res.length===1?F(res[0]):null; }
    for(let s=1;s<=1000;s++){
      if(p.t==='pole'||p.t==='bridge'||p.t==='kmh'){ const head=p.v*s, tail=head-p.L; if(tail>=p.B) return F(s); }
      if(p.t==='pass'){ const ga=p.v1*s+p.v2*s; if(ga>=p.L1+p.L2) return F(s); }
      if(p.t==='over'){ const ga=(p.v1-p.v2)*s; if(ga>=p.L1+p.L2) return F(s); }
    }
    return null;
  }});

def('ryusui',{unit:'hayasa',name:'流水算',desc:'上り＝静水−流れ、下り＝静水＋流れ',tm:[60,90,150,240],
  idea:'下りの速さ＝静水の速さ＋流れの速さ、上りの速さ＝静水の速さ−流れの速さ。静水の速さは上りと下りのまん中。',
  gen(r,lv){
    const t=r.pick([[],['up','down'],['still','flow'],['ratio','still'],['stop','ratio']][lv]);
    let q,ans,st,hint,p,u='時間',fmt='int';
    const lineF=(s,c)=>segFig([{name:'下り',segs:[{len:s,label:'静水'+s},{len:c,label:'流れ'+c,cls:'sv-b'}]},{name:'上り',segs:[{len:s-c,label:'上り'+(s-c)},{len:c,label:'流れ',dash:true}]}]);
    if(t==='up'||t==='down'){let s,c,h; do{s=r.int(6,20);c=r.int(1,5);}while(c>=s); h=r.int(2,6); const v=t==='up'?s-c:s+c, Dd=v*h; ans=F(h);
      q=`静水での速さが時速${s}kmの船が、流れの速さが時速${c}kmの川を${Dd}km${t==='up'?'上る':'下る'}と、何時間かかりますか。`; hint=t==='up'?'上りの速さ＝静水の速さ−流れの速さ':'下りの速さ＝静水の速さ＋流れの速さ';
      st=[W(`${t==='up'?'上り':'下り'}の速さ：${s} ${t==='up'?'−':'+'} ${c} = ${v}km`,t==='up'?'上るときは流れにさからうので、流れの分だけおそくなる。':'下るときは流れにのるので、流れの分だけ速くなる。',lineF(s,c)),W(`${Dd} ÷ ${v} = <b>${h}</b>時間`,'時間＝道のり÷速さ')]; p={t,s,c,D:Dd};}
    if(t==='still'||t==='flow'){let s,c,Dd; do{s=r.int(5,20);c=r.int(1,6);Dd=lcm(s+c,s-c);}while(c>=s||Dd>90||Dd/(s+c)===Dd/(s-c));
      const hd=Dd/(s+c),hu=Dd/(s-c); ans=F(t==='still'?s:c); u='km';
      q=`ある川の${Dd}kmはなれた2つの町を船で往復すると、下りは${hd}時間、上りは${hu}時間かかりました。${t==='still'?'この船の静水での速さ':'この川の流れの速さ'}は時速何kmですか。`;
      hint='上りと下りの速さを出す。静水＝（下り＋上り）÷2、流れ＝（下り−上り）÷2';
      st=[W(`下り：${Dd} ÷ ${hd} = ${s+c}km、上り：${Dd} ÷ ${hu} = ${s-c}km`,'速さ＝道のり÷時間'),W(t==='still'?`静水：(${s+c} + ${s-c}) ÷ 2 = <b>${s}</b>`:`流れ：(${s+c} − ${s-c}) ÷ 2 = <b>${c}</b>`,'線分図で、下りは静水より流れの分長く、上りは流れの分短い。だから下りと上りの差は「流れ2つ分」、まん中が静水。',lineF(s,c))]; p={t,D:Dd,hd,hu};}
    if(t==='ratio'){const k=r.pick([2,3]), c=r.int(1,6), s=k===2?3*c:2*c; ans=F(c); u='km';
      q=`静水での速さが時速${s}kmの船で川を往復すると、上りにかかる時間は下りの${k}倍でした。川の流れの速さは時速何kmですか。`;
      hint='同じ道のりなら、時間が'+k+'倍 → 速さは'+k+'分の1。上り:下り の速さの比は 1:'+k+'。';
      st=[W(`速さの比 上り:下り = 1:${k}`,'同じ道のりを進むとき、時間の比と速さの比は逆になる。'),W(`静水の速さは上りと下りのまん中 → (1 + ${k}) ÷ 2 = ${(1+k)/2}`,'静水＝(上り＋下り)÷2'),W(`流れは ${(1+k)/2} − 1 = ${(k-1)/2} にあたる`,'流れ＝静水−上り'),W(`${s} ÷ ${(1+k)/2} × ${(k-1)/2} = <b>${c}</b>`,`静水 ${s}km が比の ${(1+k)/2} にあたる。`)]; p={t,s,k};}
    if(t==='stop'){ // とちゅうでエンジンが止まる（分速で）
      let s,c,D,x,m,rest; do{s=r.step(100,250,10);c=r.step(10,60,10);x=r.int(5,20);m=r.int(3,12);rest=r.int(5,30);D=(s-c)*x-c*m+(s-c)*rest;}while(c*2>=s||D<=0||(s-c)*x-c*m<=0||(s-c)*rest<=c*m);
      ans=F(x+m+rest); u='分';
      q=`静水で分速${s}mの船が、流れの速さが分速${c}mの川を${D}m上ります。出発してから${x}分後にエンジンが止まり、${m}分間流されました。その後また同じ速さで上りました。出発してから着くまで何分かかりましたか。`;
      hint='エンジンが止まっているあいだは、流れの速さで下流へもどされる。';
      st=[W(`上りの速さ：${s} − ${c} = 分速${s-c}m`,'上り＝静水−流れ'),W(`${x}分で ${(s-c)*x}m 上る`,''),W(`止まった${m}分で ${c} × ${m} = ${c*m}m もどされる`,'エンジンが止まると船は自分では進まず、流れといっしょに下流へ流される。'),
        W(`残り：${D} − ${(s-c)*x} + ${c*m} = ${(s-c)*rest}m → ${(s-c)*rest} ÷ ${s-c} = ${rest}分`,'もどされた分も、また上り直す。'),W(`${x} + ${m} + ${rest} = <b>${x+m+rest}</b>分`,'止まっていた時間も入れる。')]; p={t,s,c,D,x,m};}
    return {q,ans,fmt,unit:u,hint,steps:st,p};
  },
  solve(p){
    if(p.t==='up') return p.D/(p.s-p.c); if(p.t==='down') return p.D/(p.s+p.c);
    if(p.t==='stop'){ let pos=0; for(let m=1;m<=2000;m++){ if(m>p.x&&m<=p.x+p.m) pos-=p.c; else pos+=p.s-p.c; if(pos>=p.D) return pos===p.D?F(m):null; } return null; }
    const res=[];
    for(let s=1;s<=60;s++)for(let c=1;c<s;c++){
      if((p.t==='still'||p.t==='flow')&&(s+c)*p.hd===p.D&&(s-c)*p.hu===p.D) res.push(p.t==='still'?s:c);
      if(p.t==='ratio'&&s===p.s&&(s+c)===p.k*(s-c)) res.push(c);
    }
    return res.length===1?F(res[0]):null;
  }});

/* ===== 特殊算 ===== */
def('tsurukame',{unit:'tokushu',name:'つるかめ算',desc:'全部が片方だとしたら…（面積図）',tm:[60,90,150,240],
  idea:'「全部が片方だったら」と仮定して、実際との差を「1つ入れかえたときの差」でわる。面積図にするとわかりやすい。',
  gen(r,lv){
    const v=r.pick([[],['tk','ti'],['coin','pen'],['score','fruit'],['three','bensho']][lv]);
    if(v==='three'||v==='bensho') return this.gen4(r,v);
    let N=r.int(6,20),x=r.int(1,N-1),a,b,A,B,txt,u,ask=r.int(1,2),hint;
    if(v==='tk'){a=2;b=4;A='つる';B='かめ';u=ask===1?'羽':'ひき'; }
    if(v==='ti'){a=8;b=10;A='たこ';B='いか';u='ひき';}
    if(v==='coin'){a=r.pick([10,50]);b=100;A=a+'円玉';B='100円玉';u='枚';N=r.int(8,30);x=r.int(1,N-1);}
    if(v==='pen'){a=r.step(40,90,10);b=a+r.step(20,60,10);A=a+'円のえんぴつ';B=b+'円のボールペン';u='本';N=r.int(8,20);x=r.int(1,N-1);}
    if(v==='fruit'){a=r.step(60,120,10);b=a+r.step(20,80,10);A=a+'円のりんご';B=b+'円のなし';u='個';N=r.int(10,25);x=r.int(1,N-1);}
    if(v==='score'){const pp=r.int(3,6),m=r.int(1,3);a=-m;b=pp;N=r.pick([10,15,20,25]);x=r.int(1,Math.floor(N/2));A='まちがい';B='正解';u='問';ask=2;
      const Tt=b*(N-x)+a*x;
      txt=`${N}問のテストで、1問正解すると${pp}点もらえ、1問まちがえると${m}点へります。ゆうきさんは${Tt}点でした。正解したのは何問ですか。`;
      hint='全部正解だったら何点？ 1問まちがえるごとに、正解のときより何点へる？';}
    const Tt=a*x+b*(N-x);
    const nameA=v==='tk'?'つる':v==='ti'?'たこ':v==='coin'?a+'円玉':v==='pen'?'えんぴつ':v==='fruit'?'りんご':A, nameB=v==='tk'?'かめ':v==='ti'?'いか':v==='coin'?'100円玉':v==='pen'?'ボールペン':v==='fruit'?'なし':B;
    if(!txt){
      if(v==='tk') txt=`つるとかめが合わせて${N}います。足の数は合わせて${Tt}本です。${ask===1?'つるは何羽':'かめは何ひき'}いますか。`;
      if(v==='ti') txt=`足が8本のたこと、足が10本のいかが合わせて${N}ひきいます。足は全部で${Tt}本です。${ask===1?'たこ':'いか'}は何びきいますか。`;
      if(v==='coin') txt=`${a}円玉と100円玉が合わせて${N}枚あり、金額は${Tt}円です。${ask===1?a+'円玉':'100円玉'}は何枚ありますか。`;
      if(v==='pen'||v==='fruit') txt=`1${v==='pen'?'本':'個'}${a}円の${v==='pen'?'えんぴつ':'りんご'}と1${v==='pen'?'本':'個'}${b}円の${v==='pen'?'ボールペン':'なし'}を合わせて${N}${u}買うと、代金は${Tt}円でした。${ask===1?nameA:nameB}は何${u}買いましたか。`;
      hint='全部が「多い方」だったとしたら？ 実際との差を、1つ入れかえたときの差でわる。';
    }
    const ansV=ask===1?x:N-x, af=areaFig(x,N-x,Math.max(a,0),b,nameA,nameB);
    const st= v==='score'
      ? [W(`全部正解なら ${b} × ${N} = ${b*N}点`,'まず「全部正解だった」と仮定する（つるかめ算の考え方）。'),W(`実際との差：${b*N} − ${Tt} = ${b*N-Tt}点`,'仮定と実際の点数の差は、まちがえた問題のせいでへった分。'),W(`1問まちがえると ${b} + ${-a} = ${b-a}点へる → まちがい ${b*N-Tt} ÷ ${b-a} = ${x}問`,`ここがポイント：正解→まちがいに1問かえると、もらえるはずの${b}点がなくなり、さらに${-a}点引かれる。だから1問で ${b-a}点 の差。`),W(`正解：${N} − ${x} = <b>${N-x}</b>問`,'')]
      : [W(`全部が${nameB}だとすると ${b} × ${N} = ${b*N}`,`「全部${nameB}」と仮定する。面積図では、全体を高さ${b}の長方形と考えること。`,areaFig(0.0001,N,a,b,nameA,nameB)),W(`実際との差：${b*N} − ${Tt} = ${b*N-Tt}`,'仮定した長方形と、実際の面積（合計）の差。面積図で点線の部分にあたる。',af),W(`1つを${nameA}にかえると ${b} − ${a} = ${b-a} へる`,`${nameB}1つを${nameA}1つに入れかえると、${b}から${a}にかわるので ${b-a} へる。`),W(`${nameA}：${b*N-Tt} ÷ ${b-a} = ${ask===1?'<b>'+x+'</b>':x}`,`点線の部分は「たて ${b-a}、横 ${nameA}の数」の長方形。だから面積÷たて＝横。`,af),...(ask===2?[W(`${nameB}：${N} − ${x} = <b>${N-x}</b>`,'全体の数からひく。')]:[])];
    return {q:txt,ans:F(ansV),fmt:'int',unit:u,hint,steps:st,fig:v==='score'?null:af,p:{a,b,N,T:Tt,ask,nA:nameA,nB:nameB,v}};
  },
  gen4(r,v){
    if(v==='three'){ // 3種類のコイン（2種類の枚数が同じ）
      let n10,n50,n100,N,Tt; do{n10=r.int(2,15);n50=n10;n100=r.int(1,20);N=n10+n50+n100;Tt=10*n10+50*n50+100*n100;}while(N>40);
      const q=`10円玉、50円玉、100円玉が合わせて${N}枚あり、金額は${Tt}円です。10円玉と50円玉の枚数は同じです。100円玉は何枚ありますか。`;
      const st=[W(`10円玉と50円玉を1組にすると、2枚で60円 → 1枚あたり30円`,'枚数が同じ2種類は、セットにして「1枚平均30円の玉」と考えると、2種類のつるかめ算になる。'),W(`全部100円玉だとすると 100 × ${N} = ${100*N}円、差 ${100*N-Tt}円`,'ふつうのつるかめ算。'),W(`1枚を「30円玉」にかえると 70円へる → ${100*N-Tt} ÷ 70 = ${n10*2}枚（10円玉と50円玉）`,'100円−30円＝70円'),W(`100円玉：${N} − ${n10*2} = <b>${n100}</b>枚`,'')];
      return {q,ans:F(n100),fmt:'int',unit:'枚',hint:'同じ枚数の2種類を「1組」にまとめると、2種類のつるかめ算になる。',steps:st,p:{t:'three',N,T:Tt}};
    }
    // 弁償算：運ぶとa円、こわすとa円もらえずb円はらう
    const a=r.step(10,50,5),b=r.step(50,200,10),N=10*r.int(5,30),x=r.int(1,Math.floor(N/10)); const Tt=a*(N-x)-b*x;
    const q=`荷物を1個運ぶと${a}円もらえますが、とちゅうでこわすと、その分はもらえないうえに${b}円はらう約束です。${N}個運んだところ、もらったお金は${Tt}円でした。こわした荷物は何個ですか。`;
    const st=[W(`全部無事なら ${a} × ${N} = ${a*N}円`,'全部うまく運べたと仮定する。'),W(`差：${a*N} − ${Tt} = ${a*N-Tt}円`,''),W(`1個こわすと ${a} + ${b} = ${a+b}円へる`,`もらえるはずの${a}円がなくなり、さらに${b}円はらうので、1個で${a+b}円の差（ここをまちがえやすい）。`),W(`${a*N-Tt} ÷ ${a+b} = <b>${x}</b>個`,'')];
    return {q,ans:F(x),fmt:'int',unit:'個',hint:'1個こわすと、運べたときより何円へるかを考える（もらえない分＋はらう分）。',steps:st,p:{t:'bensho',a:-b,b:a,N,T:Tt,ask:1}};
  },
  solve(p){const res=[];
    if(p.t==='three'){for(let x=0;x<=p.N;x++)for(let z=0;x*2+z<=p.N;z++){if(x*2+z===p.N&&60*x+100*z===p.T)res.push(z);} return res.length===1?F(res[0]):null;}
    for(let x=0;x<=p.N;x++) if(p.a*x+p.b*(p.N-x)===p.T) res.push(p.ask===1?x:p.N-x); return res.length===1?F(res[0]):null;}});

def('wasa',{unit:'tokushu',name:'和差算',desc:'線分図で、差をそろえる',tm:[45,90,120,180],
  idea:'線分図をかいて、多い方を少ない方に（または少ない方を多い方に）そろえると、同じものがいくつ分かになる。',
  gen(r,lv){
    const t=r.pick([[],['two'],['three'],['give','three'],['pair','give']][lv]);
    let q,ans,st,fig,p,hint,u='円';
    if(t==='two'){const s=r.int(10,500),d=r.int(5,300),big=s+d,S=big+s,ask=r.int(1,2); ans=F(ask===1?big:s);
      q=`兄と弟の持っているお金を合わせると${S}円で、兄は弟より${d}円多く持っています。${ask===1?'兄':'弟'}は何円持っていますか。`;
      hint='多い方を少ない方にそろえる（差をひく）と、2人分が同じになる。';
      fig=segFig([{name:'兄',segs:[{len:s},{len:d,label:d,dash:true}]},{name:'弟',segs:[{len:s}]}],{total:S});
      st=ask===1?[W(`兄にそろえる：${S} + ${d} = ${S+d}（兄2人分）`,`弟の線に、足りない${d}円をつけたすと、兄と同じ長さになる。そのとき合計は${d}円ふえて、兄2人分。`,segFig([{name:'兄',segs:[{len:s},{len:d}]},{name:'弟',segs:[{len:s},{len:d,label:'+'+d,dash:true}]}],{total:S+d})),W(`${S+d} ÷ 2 = <b>${big}</b>円`,'2人分を2でわる。')]
        :[W(`弟にそろえる：${S} − ${d} = ${S-d}（弟2人分）`,`兄の線から、多い${d}円を切り取ると、弟と同じ長さになる。合計は${d}円へって弟2人分。`,fig),W(`${S-d} ÷ 2 = <b>${s}</b>円`,'2人分を2でわる。')]; p={t,S,d,ask};}
    if(t==='three'){const b=r.int(20,300),d1=r.int(5,80),d2=r.int(5,Math.min(80,b-1)),A=b+d1,C=b-d2,S=A+b+C; ans=F(b); u='まい';
      q=`A、B、Cの3人でカードを合わせて${S}まい持っています。AはBより${d1}まい多く、CはBより${d2}まい少ないです。Bは何まい持っていますか。`;
      hint='3人ともBにそろえよう。Aからは多い分をひき、Cには足りない分をたす。';
      fig=segFig([{name:'A',segs:[{len:b},{len:d1,label:d1,dash:true}]},{name:'B',segs:[{len:b}],right:'?'},{name:'C',segs:[{len:b-d2},{len:d2,label:d2,cls:'sv-d'}]}],{total:S});
      st=[W(`Bにそろえる：${S} − ${d1} + ${d2} = ${S-d1+d2}（B3人分）`,`Aは${d1}まい多いので切り取る（−${d1}）。Cは${d2}まい少ないのでつけたす（+${d2}）。すると3本ともBと同じ長さ。`,fig),W(`${S-d1+d2} ÷ 3 = <b>${b}</b>まい`,'3人分を3でわる。')]; p={t,S,d1,d2};}
    if(t==='give'){const S=2*r.int(30,500),k=r.int(5,Math.min(150,S/2-5)),half=S/2; ans=F(half+k);
      q=`姉と妹は合わせて${S}円持っています。姉が妹に${k}円あげると、2人の金額は同じになります。姉ははじめ何円持っていましたか。`;
      hint='あげたあとは2人とも同じ。それぞれ合計の半分。';
      st=[W(`あげたあと：${S} ÷ 2 = ${half}円ずつ`,'お金をやりとりしても、2人の合計はかわらない。同じになったのだから半分ずつ。'),W(`姉ははじめ ${half} + ${k} = <b>${half+k}</b>円`,`姉は${k}円あげて${half}円になったので、はじめはそれより${k}円多い。（はじめの差は ${k}×2 = ${2*k}円）`)]; p={t,S,k};}
    if(t==='pair'){const A=r.int(10,99),B=r.int(10,99),C=r.int(10,99),ask=r.pick(['A','B','C']); ans=F({A,B,C}[ask]); u='';
      q=`3つの数A、B、Cがあります。A+B=${A+B}、B+C=${B+C}、C+A=${C+A} です。${ask}はいくつですか。`;
      hint='3つの式を全部たすと、A・B・Cがそれぞれ2回ずつ入っている。';
      st=[W(`3つ全部たす：${A+B} + ${B+C} + ${C+A} = ${2*(A+B+C)}`,'A+B と B+C と C+A をたすと、AもBもCも2回ずつ出てくる。'),W(`A+B+C = ${2*(A+B+C)} ÷ 2 = ${A+B+C}`,'2回ずつなので2でわると、3つの合計。'),W(`${ask} = ${A+B+C} − ${ask==='A'?B+C:ask==='B'?C+A:A+B} = <b>${({A,B,C})[ask]}</b>`,`3つの合計から、${ask}以外の2つの和をひく。`)]; p={t,s1:A+B,s2:B+C,s3:C+A,ask};}
    return {q,ans,fmt:'int',unit:u,hint,steps:st,fig,p};
  },
  solve(p){const res=[];
    if(p.t==='two'){for(let s=0;s<=p.S;s++){const b=s+p.d; if(b+s===p.S)res.push(p.ask===1?b:s);}}
    if(p.t==='three'){for(let b=1;b<=p.S;b++){if((b+p.d1)+b+(b-p.d2)===p.S&&b-p.d2>0)res.push(b);}}
    if(p.t==='give'){for(let a=0;a<=p.S;a++){if(a-p.k===p.S-a+p.k)res.push(a);}}
    if(p.t==='pair'){for(let A=0;A<=200;A++){const B=p.s1-A,C=p.s2-B; if(B>=0&&C>=0&&C+A===p.s3)res.push({A,B,C}[p.ask]);}}
    return res.length===1?F(res[0]):null;}});

def('kabusoku',{unit:'tokushu',name:'過不足算・長いす',desc:'配り方を変えたときの差に注目',tm:[60,90,150,240],
  idea:'1人あたりの数をふやすと、全体で「1人分の差 × 人数」だけ多く必要になる。それが「あまり」と「不足」の合計（や差）になる。',
  gen(r,lv){
    let n,a,b,r1,s2,q,st,ask,typ;
    typ=lv===4?'isu':lv===3?r.pick(['ab','ff']):'ab';
    if(typ==='isu'){ // 長いす
      let a,b,n,e,rr,P; do{a=r.int(3,6);b=a+r.int(1,3);n=r.int(8,40);e=r.int(1,5);rr=b*(n-e)-a*n;P=a*n+rr;}while(rr<=0||rr>60||b*(n-e)<=0);
      const ask=r.int(1,2); const ans=F(ask===1?n:P);
      const q=`長いすに子どもが座ります。1きゃくに${a}人ずつ座ると${rr}人が座れません。1きゃくに${b}人ずつ座ると、ちょうど${e}きゃくが空いて、ほかはぴったり座れます。${ask===1?'長いすは何きゃく':'子どもは何人'}ですか。`;
      const st=[W(`${b}人ずつのとき、空いた${e}きゃくにも座ったとすると、あと ${b} × ${e} = ${b*e}人 座れる`,'「空いている長いす」は「座れる席があまっている」ということ。全部のいすに'+b+'人ずつ座るとしたら、席が'+b*e+'人分あまる（不足ではなく、席のあまり）。'),
        W(`${a}人ずつ → ${rr}人あまる、${b}人ずつ → 席が${b*e}人分あまる`,'人があまる（座れない）のと、席があまるのは反対向き。全部のいすに座る形にすると過不足算になる。'),
        W(`1きゃくで ${b-a}人 多く座れるので、全体で ${rr} + ${b*e} = ${rr+b*e}人 ちがう → ${rr+b*e} ÷ ${b-a} = ${ask===1?'<b>'+n+'</b>':n}きゃく`,'差の合計 ÷ 1きゃくあたりの差 ＝ いすの数'),...(ask===2?[W(`子ども：${a} × ${n} + ${rr} = <b>${P}</b>人`,'')]:[])];
      return {q,ans,fmt:'int',unit:ask===1?'きゃく':'人',hint:'空いている長いすにも座ったとしたら、何人分の席があまっている？',steps:st,p:{typ,a,b,rr,e,ask}};
    }
    for(;;){ n=r.int(4,35); a=r.int(2,8); b=a+r.int(1,4);
      if(typ==='ab'){ r1=r.int(1,20); s2=b*n-(a*n+r1); if(s2>0&&s2<n*b) break; }
      else { r1=r.int(1,15); s2=r.int(r1+1,40); if((b-a)*n===s2-r1&&a*n-r1>0) break; } }
    ask=lv===1?1:r.int(1,2);
    const M= typ==='ab'? a*n+r1 : a*n-r1;
    let ans=F(ask===1?n:M);
    const fg=segFig([{name:a+'こずつ',segs:[{len:a*n,label:'配った'},{len:typ==='ab'?r1:0.001,label:typ==='ab'?'あまり'+r1:'',cls:'sv-b'}]},{name:b+'こずつ',segs:[{len:b*n-s2,label:'ある分'},{len:s2,label:'たりない'+s2,dash:true}]}]);
    if(typ==='ab'){
      q=`子どもにみかんを配ります。1人に${a}個ずつ配ると${r1}個あまり、1人に${b}個ずつ配ると${s2}個たりません。${ask===1?'子どもは何人':'みかんは何個'}ですか。`;
      st=[W(`1人あたり ${b} − ${a} = ${b-a}個 ふやすと、全体で ${r1} + ${s2} = ${r1+s2}個 ちがう`,`みかんの数は同じ。${a}個ずつだと${r1}個あまり、${b}個ずつだと${s2}個たりない。だから「${b}個ずつ配るのに必要な数」と「${a}個ずつ配るのに必要な数」の差は、あまりとたりない分の合計 ${r1+s2}個。`,fg),W(`人数：${r1+s2} ÷ ${b-a} = ${ask===1?'<b>'+n+'</b>':n}人`,`1人あたり${b-a}個のちがいが、人数分集まって${r1+s2}個になった。`),...(ask===2?[W(`みかん：${a} × ${n} + ${r1} = <b>${M}</b>個`,`${a}個ずつ配った数に、あまりをたす。たしかめ：${b}×${n}−${s2} = ${M}`)]:[])];
    }else{
      q=`えんぴつを配ります。1人に${a}本ずつ配ると${r1}本たりず、1人に${b}本ずつ配ると${s2}本たりません。${ask===1?'人数は何人':'えんぴつは何本'}ですか。`;
      st=[W(`1人あたり ${b-a}本 ふやすと、たりない数が ${s2} − ${r1} = ${s2-r1}本 ふえる`,'どちらも「たりない」ときは、差をとる（合計ではない）。'),W(`人数：${s2-r1} ÷ ${b-a} = ${ask===1?'<b>'+n+'</b>':n}人`,''),...(ask===2?[W(`えんぴつ：${a} × ${n} − ${r1} = <b>${M}</b>本`,'')]:[])];
    }
    return {q,ans,fmt:'int',unit:ask===1?'人':(typ==='ab'?'個':'本'),hint:'1人分をふやしたとき、全体でいくつちがうか（あまり と たりない を合わせる）。',steps:st,fig:fg,p:{typ,a,b,r1,s2,ask}};
  },
  solve(p){const res=[];
    if(p.typ==='isu'){for(let n=1;n<=300;n++){const P1=p.a*n+p.rr,P2=p.b*(n-p.e); if(P1===P2&&n>p.e)res.push(p.ask===1?n:P1);} return res.length===1?F(res[0]):null;}
    for(let n=1;n<=300;n++){const M1=p.typ==='ab'?p.a*n+p.r1:p.a*n-p.r1, M2=p.b*n-p.s2; if(M1===M2&&M1>0)res.push(p.ask===1?n:M1);} return res.length===1?F(res[0]):null;}});

def('ueki',{unit:'tokushu',name:'植木算',desc:'間の数と木の数のちがい',tm:[45,60,90,150],
  idea:'木の数と「間の数」はちがう。まっすぐで両はしに植える＝間＋1、両はしに植えない＝間−1、まわり（輪）＝間と同じ。',
  gen(r,lv){
    const t=r.pick([[],['both','none'],['circle','len'],['tape','len'],['square','tape']][lv]);
    let q,ans,st,u='本',p,hint,fig=null;
    const treeFig=(n,ends)=>{let o=`<line x1="20" y1="30" x2="280" y2="30" class="sv"/>`; for(let i=0;i<=n;i++){const x=20+260*i/n; if(!ends&&(i===0||i===n)) continue; o+=`<circle cx="${x}" cy="30" r="6" class="sv-a"/>`;} for(let i=0;i<n;i++) o+=T(20+260*(i+.5)/n,52,'↔','sv-tb'); return svg(300,60,o);};
    if(t==='both'||t==='none'||t==='circle'){const k=r.pick([2,3,4,5,6,8,10,12,15,20]),m=r.int(4,40),Lp=k*m; const n=t==='both'?m+1:t==='none'?m-1:m; ans=F(n);
      q=t==='circle'?`まわりの長さが${Lp}mの池のまわりに、${k}mおきに木を植えます。木は何本いりますか。`
        :`長さ${Lp}mのまっすぐな道に、${k}mおきに木を植えます。${t==='both'?'両はしにも植える':'両はしには植えない'}とき、木は何本いりますか。`;
      hint=t==='both'?'両はしに植える：木の数＝間の数＋1':t==='none'?'両はしに植えない：木の数＝間の数−1':'池のまわり（円）：木の数＝間の数';
      st=[W(`間の数：${Lp} ÷ ${k} = ${m}`,`${k}mの「間」が全部でいくつあるか。`),W(t==='both'?`${m} + 1 = <b>${n}</b>本`:t==='none'?`${m} − 1 = <b>${n}</b>本`:`まわりなので間の数と同じ → <b>${n}</b>本`,`小さい数でたしかめよう：間が3つのとき、木は ${t==='both'?'4本（両はしをふくむ）':t==='none'?'2本（両はしをのぞく）':'3本（輪になるとはじめと終わりが同じ木）'}。図でかぞえてみて。`,treeFig(3,t!=='none'))];
      fig=t==='circle'?null:treeFig(Math.min(m,6),t==='both'); p={t,k,L:Lp};}
    if(t==='len'){const k=r.pick([3,4,5,6,8,10,12]),n=r.int(5,40),both=r.int(0,1); const m=both?n-1:n+1; ans=F(m*k); u='m';
      q=`まっすぐな道に、${k}mおきに木を${n}本植えました。${both?'両はしにも植えて':'両はしには植えずに'}いるとき、道の長さは何mですか。`;
      hint=both?'両はしに植える：間の数＝木の数−1':'両はしに植えない：間の数＝木の数＋1';
      st=[W(`間の数：${n} ${both?'−':'+'} 1 = ${m}`,both?'両はしに植えると、木の方が間より1つ多い。':'両はしに植えないと、間の方が木より1つ多い。',treeFig(3,!!both)),W(`${k} × ${m} = <b>${m*k}</b>m`,'道の長さ＝間の長さ×間の数')]; p={t,k,n,both};}
    if(t==='tape'){const a=r.int(10,40),b=r.int(1,5),n=r.int(4,20); ans=F(a*n-b*(n-1)); u='cm';
      q=`長さ${a}cmのテープ${n}本を、のりしろ${b}cmでまっすぐにつなぎます。全体の長さは何cmですか。`; hint='のりしろの数は、テープの本数−1。';
      fig=svg(300,60,`<rect x="10" y="20" width="110" height="18" class="sv-a"/><rect x="100" y="20" width="110" height="18" class="sv-b" opacity=".85"/><rect x="190" y="20" width="100" height="18" class="sv-a" opacity=".85"/>${T(110,55,'のりしろ','sv-tb')}`);
      st=[W(`テープの長さの合計：${a} × ${n} = ${a*n}cm`,'重ねる前の長さをぜんぶたす。'),W(`のりしろ ${n-1}か所：${b} × ${n-1} = ${b*(n-1)}cm`,'のりしろはテープとテープの「間」にできるので、両はしに植えない植木算と同じ：本数−1。',fig),W(`${a*n} − ${b*(n-1)} = <b>${a*n-b*(n-1)}</b>cm`,'重なった分だけ短くなる。')]; p={t,a,b,n};}
    if(t==='square'){const k=r.pick([2,3,4,5,6]),m=r.int(3,15),side=k*m; ans=F(4*m);
      q=`1辺が${side}mの正方形の土地のまわりに、${k}mおきにくいを打ちます。4つの角には必ずくいを打ちます。くいは全部で何本いりますか。`; hint='まわりを1周する輪と同じ。まわりの長さ÷間かく。';
      st=[W(`まわりの長さ：${side} × 4 = ${side*4}m`,'正方形のまわりは、1周すると元にもどる「輪」。'),W(`${side*4} ÷ ${k} = <b>${4*m}</b>本`,`輪の植木算なので、くいの数＝間の数。<br>（1辺ずつ「両はし植える」で ${m+1}本×4 とすると、角の4本を2回ずつ数えてしまうので −4 が必要。）`,svg(150,140,`<rect x="25" y="15" width="100" height="100" class="sv"/>${Array.from({length:4*Math.min(m,4)},(_,i)=>{const s=Math.min(m,4),side_=Math.floor(i/s),j=i%s,d=100*j/s;const [x,y]=[[25+d,15],[125,15+d],[125-d,115],[25,115-d]][side_];return `<circle cx="${x}" cy="${y}" r="5" class="sv-a"/>`;}).join('')}`))]; p={t,k,side};}
    return {q,ans,fmt:'int',unit:u,hint,steps:st,fig,p};
  },
  solve(p){ // 実際に木の場所を数える
    if(p.t==='tape'){let len=0;for(let i=0;i<p.n;i++){len+=p.a; if(i>0)len-=p.b;} return F(len);}
    if(p.t==='len'){const res=[];for(let Lp=1;Lp<=2000;Lp++){if(Lp%p.k)continue;let c=0;for(let x=0;x<=Lp;x+=p.k){if(!p.both&&(x===0||x===Lp))continue;c++;} if(c===p.n)res.push(Lp);} return res.length===1?F(res[0]):null;}
    if(p.t==='square'){const set=new Set(); for(let x=0;x<=p.side;x+=p.k){set.add(x+',0');set.add(x+','+p.side);set.add('0,'+x);set.add(p.side+','+x);} return F(set.size);}
    let c=0; for(let x=0;x<=p.L;x+=p.k){ if(p.t==='none'&&(x===0||x===p.L))continue; if(p.t==='circle'&&x===p.L)continue; c++; } return F(c);
  }});

def('nenrei',{unit:'tokushu',name:'年れい算',desc:'年れいの差はずっと同じ',tm:[60,90,150,210],
  idea:'何年たっても、2人の年れいの差はかわらない。人数がちがう和をくらべるときは、1年でふえる数がちがうことに注意。',
  gen(r,lv){
    let P,C,n,k,q,st,ans,p,fut;
    const t=r.pick([[],['after'],['after','before'],['sum'],['sum3','before']][lv]);
    if(t==='after'||t==='before'){
      for(;;){ k=r.int(2,5); n=r.int(1,15); C=r.int(3,15); fut=t==='after';
        if(fut){P=k*(C+n)-n;} else { if(C-n<1) continue; P=k*(C-n)+n; }
        if(P-C>=22&&P-C<=45) break; }
      ans=F(n);
      q=`いま、父は${P}才、子どもは${C}才です。父の年れいが子どもの年れいの${k}倍${fut?'になるのは何年後':'だったのは何年前'}ですか。`;
      const d=P-C, fg=segFig([{name:'父',segs:Array.from({length:k},(_,i)=>({len:1,label:i===0?'①':'',cls:i===0?'sv-a':'sv-b'}))},{name:'子',segs:[{len:1,label:'①'}]}]);
      st=[W(`年れいの差はずっと ${P} − ${C} = ${d}才`,'2人とも1年に1才ずつ年をとるので、差はかわらない。ここが年れい算のいちばん大事なところ。'),W(`そのとき「父＝子×${k}」なので、差 ${d} は子の ${k-1}つ分`,`線分図で、父は子の${k}つ分。父と子の差は ${k}−1 = ${k-1}つ分。`,fg),W(`そのときの子：${d} ÷ ${k-1} = ${d/(k-1)}才`,''),W(fut?`${d/(k-1)} − ${C} = <b>${n}</b>年後`:`${C} − ${d/(k-1)} = <b>${n}</b>年前`,'いまの年れいとくらべる。')];
      p={t,P,C,k,fut};
      return {q,ans,fmt:'int',unit:fut?'年後':'年前',hint:'2人の年れいの差は、何年たってもかわらない。',steps:st,fig:fg,p};
    }
    const kids=t==='sum3'?3:2;
    for(;;){ k=r.int(2,4); n=r.int(1,20); let S=0; for(let i=0;i<kids;i++) S+=r.int(1,12); const Pp=k*(S+kids*n)-2*n; if(Pp>=50&&Pp<=110&&k*kids!==2){ P=Pp; C=S; break; } }
    ans=F(n);
    q=`いま、両親の年れいの和は${P}才、子ども${kids}人の年れいの和は${C}才です。両親の年れいの和が、子ども${kids}人の年れいの和の${k}倍になるのは何年後ですか。`;
    st=[W(`1年たつと、両親の和は2才、子どもの和は${kids}才ふえる`,`人数がちがうので、1年でふえる数もちがう。だから「差が一定」は使えない。かわりに□年後の式を作る。`),W(`□年後：${P} + 2×□ = (${C} + ${kids}×□) × ${k}`,'□年後の両親の和と、子どもの和の'+k+'倍が等しい。'),W(`${P} + 2×□ = ${C*k} + ${kids*k}×□ → ${P-C*k} = ${kids*k-2}×□`,`右の（ ）をはずすと ${C}×${k} + ${kids}×□×${k}。両方から同じものを取りのぞくと、□の${kids*k-2}こ分が ${P-C*k}。`),W(`□ = ${P-C*k} ÷ ${kids*k-2} = <b>${n}</b>年後`,`たしかめ：${P+2*n} と (${C+kids*n})×${k} = ${(C+kids*n)*k}`)];
    return {q,ans,fmt:'int',unit:'年後',hint:`1年で、両親の和は2才、子どもの和は${kids}才ふえる。`,steps:st,p:{t,P,C,k,kids}};
  },
  solve(p){const res=[];for(let n=0;n<=100;n++){
      if(p.t==='after'&&p.P+n===p.k*(p.C+n))res.push(n);
      if(p.t==='before'&&p.C-n>0&&p.P-n===p.k*(p.C-n))res.push(n);
      if((p.t==='sum'||p.t==='sum3')&&p.P+2*n===p.k*(p.C+p.kids*n))res.push(n);} return res.length===1?F(res[0]):null;}});

def('shigoto',{unit:'tokushu',name:'仕事算',desc:'全体の仕事を「最小公倍数」にする',tm:[60,90,150,240],
  idea:'仕事全体を「かかる日数の最小公倍数」にすると、1日にできる量が整数になって計算しやすい。',
  gen(r,lv){
    const days=[3,4,5,6,8,9,10,12,14,15,18,20,21,24,28,30,36,40,42,45,60];
    const t=r.pick([[],['two'],['two','rest'],['three','rest'],['three','rest2']][lv]);
    let a,b,c,W_,q,st,ans,p;
    const why1=(W_,ds)=>`全体を1とすると、1日の量が分数（${ds.map(d=>exprHTML('1/'+d)).join('、')}）になって計算が大変。日数の最小公倍数 ${W_} を全体にすると、1日の量が整数になる。`;
    if(t==='two'){for(;;){a=r.pick(days);b=r.pick(days);W_=lcm(a,b);if(a!==b&&W_%(W_/a+W_/b)===0&&W_<=120)break;}
      const tt=W_/(W_/a+W_/b); ans=F(tt);
      q=`ある仕事を、Aさん1人ですると${a}日、Bさん1人ですると${b}日かかります。2人でいっしょにすると何日で終わりますか。`;
      st=[W(`仕事全体を ${a} と ${b} の最小公倍数 ${W_} とする`,why1(W_,[a,b])),W(`1日に A ${W_/a}、B ${W_/b} → 2人で ${W_/a+W_/b}`,`Aは${a}日で${W_}をするので1日に ${W_}÷${a} = ${W_/a}。Bも同じように。`),W(`${W_} ÷ ${W_/a+W_/b} = <b>${tt}</b>日`,'全体÷1日の量＝日数')]; p={t,a,b};}
    if(t==='rest'){for(;;){a=r.pick(days);b=r.pick(days);W_=lcm(a,b);if(a!==b&&W_<=120){const x=r.int(1,a-1);const rest=W_-x*(W_/a); if(rest%(W_/b)===0){p={t,a,b,x};break;}}}
      const x=p.x, y=(W_-x*(W_/a))/(W_/b); ans=F(y);
      q=`ある仕事を、Aさん1人ですると${a}日、Bさん1人ですると${b}日かかります。この仕事をAさんが${x}日したあと、残りをBさんがしました。Bさんは何日しましたか。`;
      st=[W(`仕事全体を ${W_} とする（A：1日${W_/a}、B：1日${W_/b}）`,why1(W_,[a,b])),W(`Aが ${x}日で ${W_/a} × ${x} = ${W_/a*x}`,''),W(`残り ${W_} − ${W_/a*x} = ${W_-W_/a*x} → ${W_-W_/a*x} ÷ ${W_/b} = <b>${y}</b>日`,'残りの仕事を、Bの1日の量でわる。')];}
    if(t==='rest2'){for(;;){a=r.pick(days);b=r.pick(days);c=r.pick(days);W_=lcm(lcm(a,b),c);if(a!==b&&W_<=240){const x=r.int(1,6);const done=x*(W_/a+W_/b);const rest=W_-done; if(rest>0&&rest%(W_/c)===0){p={t,a,b,c,x};break;}}}
      const x=p.x, y=(W_-x*(W_/a+W_/b))/(W_/c); ans=F(y);
      q=`ある仕事を、Aさん1人では${a}日、Bさん1人では${b}日、Cさん1人では${c}日かかります。はじめにAさんとBさんの2人で${x}日し、残りをCさん1人でしました。Cさんは何日しましたか。`;
      st=[W(`全体を ${a}、${b}、${c} の最小公倍数 ${W_} とする`,why1(W_,[a,b,c])),W(`AとBで1日 ${W_/a} + ${W_/b} = ${W_/a+W_/b} → ${x}日で ${x*(W_/a+W_/b)}`,''),W(`残り ${W_-x*(W_/a+W_/b)} ÷ ${W_/c} = <b>${y}</b>日`,'')];}
    if(t==='three'){for(;;){a=r.pick(days);b=r.pick(days);c=r.pick(days);W_=lcm(lcm(a,b),c);if(a!==b&&b!==c&&a!==c&&W_<=180&&W_%(W_/a+W_/b+W_/c)===0)break;}
      const tt=W_/(W_/a+W_/b+W_/c); ans=F(tt);
      q=`ある仕事を、Aさん1人では${a}日、Bさん1人では${b}日、Cさん1人では${c}日かかります。3人でいっしょにすると何日で終わりますか。`;
      st=[W(`全体を ${W_} とする`,why1(W_,[a,b,c])),W(`1日に A ${W_/a}、B ${W_/b}、C ${W_/c} → 合計 ${W_/a+W_/b+W_/c}`,''),W(`${W_} ÷ ${W_/a+W_/b+W_/c} = <b>${tt}</b>日`,'')]; p={t,a,b,c};}
    return {q,ans,fmt:'int',unit:'日',hint:'仕事全体を、かかる日数の最小公倍数にすると、1日の仕事が整数になる。',steps:st,p};
  },
  solve(p){ // 1日ずつ仕事を進める（全体は日数のかけ算＝最小公倍数とは別の数にする）
    const W_=p.a*p.b*(p.c||1); let done=0;
    for(let d=1;d<=500;d++){
      if(p.t==='two'){done+=W_/p.a+W_/p.b; if(done>=W_) return done===W_?F(d):null;}
      if(p.t==='three'){done+=W_/p.a+W_/p.b+W_/p.c; if(done>=W_) return done===W_?F(d):null;}
      if(p.t==='rest'){ if(d<=p.x) done+=W_/p.a; else done+=W_/p.b; if(done>=W_) return done===W_?F(d-p.x):null; }
      if(p.t==='rest2'){ if(d<=p.x) done+=W_/p.a+W_/p.b; else done+=W_/p.c; if(done>=W_) return done===W_?F(d-p.x):null; }
    }
    return null;
  }});
