<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<title>コインタウン</title>
<style>
  /* ===== 色や大きさのきまり ===== */
  :root{
    --bg:#1b1f3b; --bg2:#262b52; --card:#2f3563; --card2:#3a4178;
    --gold:#ffd447; --gold2:#ffb800; --text:#f4f5ff; --sub:#aab0e0;
    --ok:#5fe08a; --ng:#6b7099;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #34407a 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* 全体：スマホは縦にならべる・PC は左右にならべる */
  #app{display:flex; flex-direction:column; height:100%; max-width:1000px; margin:0 auto;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  @media (min-width:760px){ #app{flex-direction:row;} #left,#right{flex:1;} #right{border-left:2px solid var(--bg2);} }

  /* ===== 上：コインの数とタップする所 ===== */
  #left{display:flex; flex-direction:column; align-items:center; padding:12px 16px 6px; flex:0 0 auto;}
  #title{font-size:15px; color:var(--sub); letter-spacing:2px; margin-bottom:2px;}
  #coins{font-size:clamp(30px,9vw,46px); font-weight:900; color:var(--gold);
         text-shadow:0 3px 0 #8a5d00; line-height:1.1; text-align:center; word-break:break-all;}
  #cps{font-size:15px; color:var(--sub); margin:2px 0 8px;}
  #tapWrap{position:relative; width:min(46vw,210px); height:min(46vw,210px); margin:4px 0;}
  @media (min-width:760px){ #tapWrap{width:260px; height:260px; margin-top:30px;} }
  #bigCoin{
    width:100%; height:100%; border-radius:50%; border:none; cursor:pointer; padding:0;
    background:radial-gradient(circle at 35% 30%, #fff6b0 0%, var(--gold) 35%, var(--gold2) 75%, #c98a00 100%);
    box-shadow:0 8px 0 #8a5d00, 0 0 40px rgba(255,212,71,.35);
    font-size:min(22vw,110px); line-height:1; transition:transform .06s;
    display:flex; align-items:center; justify-content:center;
  }
  @media (min-width:760px){ #bigCoin{font-size:130px;} }
  #bigCoin.push{transform:scale(.92) translateY(4px); box-shadow:0 3px 0 #8a5d00, 0 0 60px rgba(255,212,71,.6);}
  #tapInfo{font-size:13px; color:var(--sub); margin-top:8px;}
  /* タップしたときに出る「+1」の字 */
  .pop{position:fixed; pointer-events:none; font-weight:900; color:var(--gold); font-size:22px;
       text-shadow:0 2px 0 #000a; animation:popUp .9s ease-out forwards; z-index:20;}
  @keyframes popUp{from{opacity:1; transform:translate(-50%,0) scale(1);} to{opacity:0; transform:translate(-50%,-70px) scale(1.2);}}

  /* ===== 下：お店のリスト ===== */
  #right{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; background:#0003; border-radius:18px 18px 0 0;}
  #shopHead{display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px;}
  #shopHead h2{font-size:17px; margin:0;}
  #amountBtns button{background:var(--card); color:var(--text); border:none; border-radius:10px;
       padding:6px 12px; font-size:14px; font-weight:bold; margin-left:4px; cursor:pointer;}
  #amountBtns button.on{background:var(--gold); color:#4a3200;}
  #shop{overflow-y:auto; padding:0 12px 12px; flex:1; -webkit-overflow-scrolling:touch;}
  .item{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:14px;
        padding:10px 12px; margin-bottom:8px; cursor:pointer; border:2px solid transparent; transition:transform .05s;}
  .item.can{border-color:var(--gold); background:var(--card2);}
  .item.cant{opacity:.55;}
  .item:active{transform:scale(.98);}
  .item .ico{font-size:34px; width:44px; text-align:center;}
  .item .mid{flex:1; min-width:0;}
  .item .nm{font-weight:bold; font-size:16px;}
  .item .desc{font-size:12px; color:var(--sub); margin-top:1px;}
  .item .cost{font-size:14px; font-weight:bold; margin-top:3px;}
  .item.can .cost{color:var(--ok);}
  .item .own{font-size:26px; font-weight:900; color:var(--sub); min-width:40px; text-align:right;}
  .item.locked .nm{color:var(--ng);}
  .item.locked .ico{filter:brightness(0) opacity(.4);}

  /* ===== おかえりのまど ===== */
  #welcome{position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:30; padding:16px;}
  #welcome.show{display:flex;}
  #welcome .box{background:var(--bg2); border-radius:20px; padding:22px 20px; text-align:center; width:100%; max-width:340px;
                border:3px solid var(--gold); animation:boxIn .3s ease-out;}
  @keyframes boxIn{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
  #welcome h3{margin:0 0 6px; font-size:20px;}
  #welcome .got{font-size:30px; font-weight:900; color:var(--gold); margin:10px 0; word-break:break-all;}
  #welcome .small{font-size:13px; color:var(--sub);}
  #welcome button{margin-top:14px; background:var(--gold); color:#4a3200; border:none; border-radius:12px;
                  padding:12px 30px; font-size:17px; font-weight:900; cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="title">🪙 コインタウン</div>
    <div id="coins">0</div>
    <div id="cps">毎秒 0 コイン</div>
    <div id="tapWrap"><button id="bigCoin" aria-label="コインをタップ">🪙</button></div>
    <div id="tapInfo">タップで +1</div>
  </div>
  <div id="right">
    <div id="shopHead">
      <h2>🏪 お店・工場</h2>
      <div id="amountBtns">
        <button data-n="1" class="on">×1</button><button data-n="10">×10</button>
      </div>
    </div>
    <div id="shop"></div>
  </div>
</div>

<div id="welcome">
  <div class="box">
    <h3>おかえり！</h3>
    <div class="small" id="awayTime"></div>
    <div class="got" id="awayCoins"></div>
    <div class="small" id="awayNote"></div>
    <button id="welcomeOk">うけとる</button>
  </div>
</div>

<script>
// =====================================================
//  コインタウン（放置・育成ゲーム）
//  タップでコインをかせいで、お店や工場を買うと
//  放っておいてもコインがふえていく。
//  閉じていた間のコインも、最大 8 時間ぶんもらえる。
// =====================================================

// ----- お店・工場のリスト（5種類） -----
// cost = さいしょのねだん / cps = 1つで毎秒ふえるコイン
const BUILDINGS = [
  { id:'lemon',   ico:'🍋', name:'レモネード屋台', cost:15,     cps:0.1, desc:'小さな屋台。のんびりかせぐ' },
  { id:'bakery',  ico:'🍞', name:'パン屋',         cost:100,    cps:1,   desc:'朝から行列のパン屋さん' },
  { id:'store',   ico:'🏪', name:'コンビニ',       cost:1100,   cps:8,   desc:'24時間ずっと開いている' },
  { id:'factory', ico:'🏭', name:'工場',           cost:12000,  cps:47,  desc:'コインを大量に作る工場' },
  { id:'bank',    ico:'🏦', name:'銀行',           cost:130000, cps:260, desc:'お金がお金をうむ' },
];
const PRICE_UP = 1.15;               // 1つ買うごとに、ねだんが 1.15 倍になる
const OFFLINE_MAX_SEC = 8 * 60 * 60; // 閉じていた間のコインは最大 8 時間ぶん
const SAVE_KEY = 'coin-town-save-v1'; // セーブの名前（ほかのゲームとかぶらない名前）

// ----- いまの状態（セーブするもの） -----
let state = {
  coins: 0,          // 持っているコイン
  total: 0,          // いままでにかせいだコインの合計（お店を見せるかどうかに使う）
  owned: {},         // お店ごとの持っている数  例: {lemon: 3}
  lastTime: Date.now(), // さいごに遊んでいた時刻（ミリ秒）
};
let buyN = 1; // まとめ買いの数（1 か 10）

// ----- セーブとロード（localStorage） -----
function save(){
  state.lastTime = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && typeof s.coins === 'number'){
      state.coins = s.coins; state.total = s.total || 0;
      state.owned = s.owned || {}; state.lastTime = s.lastTime || Date.now();
      return true;
    }
  }catch(e){}
  return false;
}

// ----- 計算 -----
function count(b){ return state.owned[b.id] || 0; }
// いま毎秒ふえるコイン（全部のお店の合計）
function totalCps(){ return BUILDINGS.reduce((s,b)=> s + b.cps * count(b), 0); }
// タップ1回でもらえるコイン：1 ＋ 毎秒コインの 5%（お店がふえるとタップも強くなる）
function tapValue(){ return 1 + totalCps() * 0.05; }
// n こまとめて買うときのねだん（1こ目, 2こ目… と 1.15 倍ずつ上がる合計）
function costOf(b, n){
  const first = b.cost * Math.pow(PRICE_UP, count(b));
  return Math.ceil(first * (Math.pow(PRICE_UP, n) - 1) / (PRICE_UP - 1));
}

// ----- 大きい数を読みやすく（万・億・兆…） -----
const UNITS = ['', '万', '億', '兆', '京', '垓'];
function fmt(n){
  if(n < 100) return (Math.floor(n*10)/10).toString();  // 小さいときは小数1けた
  n = Math.floor(n);
  if(n < 10000) return n.toLocaleString('ja-JP');
  let u = 0;
  while(n >= 10000 && u < UNITS.length-1){ n /= 10000; u++; }
  return (n < 100 ? n.toFixed(2) : n < 1000 ? n.toFixed(1) : Math.floor(n)) + UNITS[u];
}
// 秒を「◯時間◯分」に
function fmtTime(sec){
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  if(h > 0) return h + '時間' + m + '分';
  if(m > 0) return m + '分' + s + '秒';
  return s + '秒';
}

// ----- コインをふやす -----
function addCoins(n){ state.coins += n; state.total += n; }

// ----- 画面：お店のリストを作る -----
const shopEl = document.getElementById('shop');
const itemEls = [];
BUILDINGS.forEach((b, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<div class="ico">${b.ico}</div>
    <div class="mid"><div class="nm"></div><div class="desc"></div><div class="cost"></div></div>
    <div class="own">0</div>`;
  el.addEventListener('click', () => buy(i));
  shopEl.appendChild(el);
  itemEls.push(el);
});

// 買う
function buy(i){
  const b = BUILDINGS[i];
  if(!isVisible(i)) return;
  const c = costOf(b, buyN);
  if(state.coins < c) return;
  state.coins -= c;
  state.owned[b.id] = count(b) + buyN;
  save();
  updateShop();
}
// お店を見せるか：1つ前のお店を持っている or そのねだんの半分までかせいだ
function isVisible(i){
  const b = BUILDINGS[i];
  return count(b) > 0 || i === 0 || count(BUILDINGS[i-1]) > 0 || state.total >= b.cost / 2;
}

function updateShop(){
  BUILDINGS.forEach((b, i) => {
    const el = itemEls[i];
    const vis = isVisible(i);
    const c = costOf(b, buyN);
    el.classList.toggle('locked', !vis);
    el.classList.toggle('can', vis && state.coins >= c);
    el.classList.toggle('cant', vis && state.coins < c);
    el.querySelector('.nm').textContent   = vis ? b.name : '？？？';
    el.querySelector('.desc').textContent = vis ? `1つで 毎秒+${fmt(b.cps)}　（いま 毎秒+${fmt(b.cps*count(b))}）` : 'もっとかせぐと出てくる';
    el.querySelector('.cost').textContent = vis ? `🪙 ${fmt(c)}` + (buyN>1 ? `（${buyN}こ）` : '') : '';
    el.querySelector('.own').textContent  = count(b);
  });
}

// ----- 画面：上の数字 -----
const coinsEl = document.getElementById('coins');
const cpsEl = document.getElementById('cps');
const tapInfoEl = document.getElementById('tapInfo');
function updateTop(){
  coinsEl.textContent = fmt(state.coins);
  cpsEl.textContent = '毎秒 ' + fmt(totalCps()) + ' コイン';
  tapInfoEl.textContent = 'タップで +' + fmt(tapValue());
}

// ----- タップ -----
const bigCoin = document.getElementById('bigCoin');
function onTap(x, y){
  const v = tapValue();
  addCoins(v);
  // 「+1」の字を出す
  const p = document.createElement('div');
  p.className = 'pop';
  p.textContent = '+' + fmt(v);
  p.style.left = x + 'px'; p.style.top = (y - 20) + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
  // ボタンをへこませる
  bigCoin.classList.add('push');
  setTimeout(() => bigCoin.classList.remove('push'), 70);
  updateTop(); updateShop();
}
// スマホは指が何本でも1回ずつ数える（pointerdown）。連打でズームしないように
bigCoin.addEventListener('pointerdown', e => { e.preventDefault(); onTap(e.clientX, e.clientY); });
bigCoin.addEventListener('contextmenu', e => e.preventDefault());

// まとめ買いのボタン
document.querySelectorAll('#amountBtns button').forEach(btn => {
  btn.addEventListener('click', () => {
    buyN = +btn.dataset.n;
    document.querySelectorAll('#amountBtns button').forEach(b => b.classList.toggle('on', b === btn));
    updateShop();
  });
});

// ----- 閉じていた間のコイン -----
// 前の時刻と今の時刻の差（秒）× 毎秒コイン。最大 8 時間ぶん。
// 時計を前にもどした（差がマイナス）ときは 0。
const welcomeEl = document.getElementById('welcome');
function giveAwayCoins(awaySec){
  if(awaySec <= 0) return;
  const useSec = Math.min(awaySec, OFFLINE_MAX_SEC);
  const got = totalCps() * useSec;
  if(got <= 0) return;
  addCoins(got);
  // 1分より長く留守にしていたら「おかえり」を出す
  if(awaySec >= 60){
    document.getElementById('awayTime').textContent = fmtTime(awaySec) + ' るすにしていた間に…';
    document.getElementById('awayCoins').textContent = '🪙 +' + fmt(got);
    document.getElementById('awayNote').textContent = awaySec > OFFLINE_MAX_SEC
      ? '（もらえるのは最大 8 時間ぶんまで）' : 'お店や工場がかせいでくれた！';
    welcomeEl.classList.add('show');
  }
}
document.getElementById('welcomeOk').addEventListener('click', () => welcomeEl.classList.remove('show'));

// ----- メインのループ（本当の時間で進める） -----
// 1コマごとに「前のコマから何秒たったか」を見て、そのぶんだけコインをふやす。
// 画面が裏にいってループが止まっていたときは、もどってきたときにまとめて計算する。
let lastFrame = Date.now();
let lastSave = Date.now();
function loop(){
  const now = Date.now();
  const dt = (now - lastFrame) / 1000; // 秒
  lastFrame = now;
  if(dt > 2){
    // 2秒より長く止まっていた → 留守のあいだの計算（最大8時間）
    giveAwayCoins(dt);
  }else if(dt > 0){
    addCoins(totalCps() * dt);
  }
  updateTop(); updateShop();
  // 5秒ごとに自動セーブ
  if(now - lastSave > 5000){ save(); lastSave = now; }
  requestAnimationFrame(loop);
}

// 画面を閉じる・裏にいくときもセーブ
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
window.addEventListener('pagehide', save);

// ----- はじめる -----
if(load()){
  // 前に遊んでいたときの時刻との差で、閉じていた間のコインをもらう
  giveAwayCoins((Date.now() - state.lastTime) / 1000);
}
lastFrame = Date.now();
save();
updateTop(); updateShop();
requestAnimationFrame(loop);
</script>
</body>
</html>
