<script>
'use strict';
// =====================================================================
//  VOLLEY BLAST（バレーブラスト）― 6人制バレーボールの 3D ゲーム（three.js）
//  1つのファイルで全部動く。コートは 18m × 9m（本物と同じ）。
//
//  ★ コードのかたまり（さがすときは「[1]」などで検索）
//   [1] 小さな道具・設定          [2] セーブ
//   [3] 音（効果音・観客・BGM）    ← 音担当
//   [4] データ（チーム・ランク・大会・実績）
//   [5] 3D の土台（描く道具・カメラ・光）
//   [6] アリーナ（床・ネット・観客席・観客・電光板） ← スタジアム担当
//   [7] 選手の見た目（Y Bot・ユニフォーム・動き）    ← 選手ビジュアル担当
//   [8] ボール
//   [9] 試合のしくみ（ラリー・得点・ローテーション）
//   [10] CPU のかしこさ
//   [11] 操作（輪・タップ・スワイプ・トスボタン・サーブ）
//   [12] カメラ演出・リプレイ
//   [13] 画面（メニュー・大会・結果カード など）
//   [14] チュートリアル
//   [15] メインループ
//
//  座標：x = コートの長い方（自分のチームは x<0、相手は x>0）、y = 上、z = 横（手前が +）
//  テスト用：?auto（自分側も自動）・?speed=4（早送り）・?demo（タイトルのデモをずっと）・window.VG
// =====================================================================

// =====================================================================
//  [1] 小さな道具・設定
// =====================================================================
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const Q = new URLSearchParams(location.search);
const AUTO = Q.has('auto');                                   // 自分側もコンピューターが操作（テスト用）
const SPEED = clamp(parseFloat(Q.get('speed') || '1') || 1, 0.1, 20);   // 時間の早さ（テスト用）
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const NOSAVE = AUTO || Q.has('nosave');                        // テストのときはセーブしない
const MUTE = AUTO || Q.has('mute');                             // テスト用：音を出さない（?mute）

// =====================================================================
//  [2] セーブ（localStorage）
// =====================================================================
const SAVE_KEY = 'volley-blast-save-v1';
const DEF_SAVE = () => ({
  v: 1, teamName: 'そらいろクラブ', color: 0, rp: 0, exp: 0, lv: 1,
  games: 0, wins: 0, kills: 0, blocks: 0, aces: 0, digs: 0, perfects: 0, bestRally: 0, hardWins: 0,
  ach: {}, cups: {}, tut: false, sound: true, bgm: true, vib: true, len: 1, lastDiff: 'normal', cupRun: null,
});
let S;
try { S = Object.assign(DEF_SAVE(), JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { S = DEF_SAVE(); }
function save() { if (NOSAVE) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }

// =====================================================================
//  [3] 音（Web Audio で作る。音のファイルはない） ← 音担当

  T.querySelectorAll('[data-e1]').forEach(b => b.onclick = () => { S.emblem.c1 = b.dataset.e1; save(); SFX.click(); showTeam(); });

// =====================================================================

function coach(text, cb) {
  G.paused = true; $('#coachT').innerHTML = text; $('#coach').classList.add('on');
  $('#coachOK').onclick = () => { SFX.click(); $('#coach').classList.remove('on'); G.paused = false; cb && cb(); };
  if (AUTO) setTimeout(() => $('#coachOK').onclick(), 50);
}
const TUT_MSG = {
  receive: '① <b>レシーブ</b>：ボールのまわりの<b>色の輪</b>が小さくなって、<b>白い円と重なった瞬間</b>に画面をタップ！ ぴったりだと PERFECT！',
  toss: '② <b>トス</b>：下のボタンから<b>打つ人</b>をえらぶよ。輪が重なるときに押すとナイストス。光っているボタンがおすすめ（相手のブロックが少ない）',
  attack: '③ <b>アタック</b>：ボールが手に届く瞬間に、<b>相手コートの方へスワイプ</b>！ 上下でコース、長いほど強い。指を置くと時間がゆっくりになるよ。<b>紫のかげ</b>は相手のブロック',
  block: '④ <b>ブロック</b>：相手が打つ瞬間に<b>タップ</b>でジャンプ！ ボールにさわれたらワンタッチで、そのあとのレシーブが楽になる',
  serve: '⑥ <b>サーブ</b>：相手コートを<b>タッチしてねらいを決める</b> → 「サーブ！」でトス → 輪に合わせてタップ。ジャンプサーブは強いけど、タイミングがきびしいよ',
};
function tutOnPend(p) {
  const T = G.tut; if (!T || !isHuman(p.side)) return;
  let key = p.type;
  if (p.type === 'receive' && T.step === 2 && !T.seen.dig) { T.seen.dig = 1; coach('⑤ <b>ディグ</b>：打たれたスパイクも、レシーブと同じく<b>輪に合わせてタップ</b>！'); return; }
  if (T.seen[key]) return; T.seen[key] = 1;
  if (TUT_MSG[key] && key !== 'serve') coach(TUT_MSG[key]);
}
function startTutorial() {
  SFX.click(); bgmStop();
  startMatch({ kind: 'tut', team: { id: 'prac', name: '練習あいて', shirt: '#6c757d', shorts: '#343a40', num: '#fff', tier: 0, mods: {}, style: '' }, tier: 0, need: 1, pts: 99 });
  G.tut = { step: 1, seen: {} };
  $('#hud').style.display = 'block'; $('#pauseB').style.display = 'block';
  coach('やあ！ コーチの<b>ミナト</b>だよ。バレーは <b>レシーブ → トス → アタック</b> の3回で相手に返すスポーツ。まずは相手のサーブを受けてみよう！', () => tutStart(1));
}
function tutStart(step) {
  const T = G.tut; T.step = step; G.match.score = [0, 0]; updateHud();
  G.force = { cpuNoBlock: true, cpuRecvFail: true };
  if (step === 1) { G.match.serving = 1; newRally(); }
  if (step === 2) { // 相手がアタックしてくる
    G.force = { cpuNoBlock: true, cpuRecvFail: true, cpuOpt: 'L', cpuTarget: { l: 0, d: 6.8 }, cpuPower: 0.45, myBlockTouch: true };
    G.match.serving = 0; newRally(); G.gen++; G.events = []; G.state = 'rally'; showServeUI(false);
    const cp = TM(1).players.find(p => p.role === 'OH' && !isFront(TM(1), p)) || TM(1).players[1];
    ball.holder = null; ball.x = cp.x; ball.y = 0.8; ball.z = cp.z; G.rally.last = 1;
    after(0.6, () => { setAct(cp, 'pass', 0.5); SFX.bump(); pass(1, cp, 'A', { x: cp.x, y: 0.8, z: cp.z }); });
  }
  if (step === 3) { G.match.serving = 0; G.myServeType = 'float'; newRally(); coach(TUT_MSG.serve); }
}
function tutPoint(win) {
  const T = G.tut; G.rallyOn = false;
  if (win === 0) {
    if (T.step < 3) after(2.0, () => coach(T.step === 1 ? 'ナイス！ 3回つないで点がとれたね！ つぎは<b>守り</b>。相手のアタックを止めよう！' : 'すごい！ ブロックとディグもバッチリ！ さいごは<b>サーブ</b>だ！', () => tutStart(T.step + 1)));
    else after(2.0, () => { S.tut = true; unlock('tut'); addCoins(300); save(); coach('🎉 チュートリアル クリア！ ごほうびに 🪙300 コイン！ <b>ガチャ</b>で選手を集めて、<b>マイチーム</b>を作ろう。<b>フリー対戦</b>や<b>大会</b>でランクも上げていこう！', () => { G.tut = null; quitToMenu(); }); });
  } else after(2.0, () => coach('おしい！ 輪が<b>白い円と重なる瞬間</b>をよく見て、もう一回やってみよう！', () => tutStart(T.step)));
}

// =====================================================================
//  [15] メインループ
// =====================================================================
function update(dt) {
  G.t += dt; G.vt = G.t;
  while (G.events.length && G.events[0].t <= G.t) { const e = G.events.shift(); if (e.gen === G.gen) e.fn(); }
  checkPendMiss();
  // 選手
  for (const t of G.teams) for (const p of t.players) {
    if (p.jump) { const s = (G.t - p.jump.t0) / p.jump.dur; if (s >= 1) { p.y = 0; p.jump = null; } else p.y = p.jump.h * Math.sin(Math.PI * s); }
    const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz), spd = p.jump ? p.spd * 0.4 : (p.act === 'dive' && G.t < p.actUntil ? p.spd * 0.6 : p.spd);
    if (d > 0.03) { const st = Math.min(d, spd * dt); p.x += dx / d * st; p.z += dz / d * st; p.vx = dx / d * st / dt; p.vz = dz / d * st / dt; } else { p.vx = 0; p.vz = 0; }
    // 向き：ネットの方を向きながら、ボールを見る
    if (!(ball.holder === p)) {
      let fx = ball.x - p.x, fz = ball.z - p.z; const l = Math.hypot(fx, fz) || 1; fx = fx / l * 0.7 + dirOf(p.side); fz = fz / l * 0.7;
      if (p.act === 'spikeLoad' || p.act === 'spike' || p.act === 'block') { fx = dirOf(p.side); fz = 0; }
      const l2 = Math.hypot(fx, fz) || 1; p.fx = fx / l2; p.fz = fz / l2;
    } else { p.fx = dirOf(p.side); p.fz = 0; }
  }
  // ボール
  if (ball.holder) { const h = ball.holder; ball.x = h.x + dirOf(h.side) * 0.32; ball.y = 1.05 + h.y; ball.z = h.z + 0.18 * dirOf(h.side); }
  else if (ball.free) {
    const q = bAt(G.t), vyNow = ball.vy - GRAV * (G.t - ball.t0);
    ball.x = q.x; ball.y = q.y; ball.z = q.z;
    if (q.y <= BR && vyNow < 0) {
      ball.y = BR;
      if (!ball.landed) { ball.landed = true; onFloor(q); }
      const vb = -vyNow * 0.5;
      if (vb > 0.9) launchVel({ x: q.x, y: BR + 0.001, z: q.z }, ball.vx * 0.65, vb, ball.vz * 0.65); else { ball.free = false; }
    }
  }
  if (!ball.landed || ball.free) G.lastProgress = Math.max(G.lastProgress, ball.landed ? G.lastProgress : G.t);
  // 動かなくなったときの安全装置
  if (G.match && G.rally && G.rallyOn && !G.rally.over && G.state !== 'serveAim' && !G.paused && G.t - G.rally.start > 2 && G.t - G.lastProgress > 6) {
    console.warn('ラリーが止まったので点にする'); VG.stuck++; point(1 - G.rally.last, '');
  }
  if (G.rallyOn && G.state === 'serving' && ball.free && !ball.landed) G.state = 'rally';
  recordFrame();
}
const _ax = new THREE.Vector3();
let lastReal = performance.now();
function frame(now) { requestAnimationFrame(frame); tick(now); }
// 画面がかくれているとき（テスト）も止まらないように、しばらく描かれなければこちらで進める
setInterval(() => { const n = performance.now(); if (n - lastReal > 250) tick(n); }, 100);
function tick(now) {
  const rdt = Math.min(0.05, (now - lastReal) / 1000); lastReal = now; G.lastFrameReal = now;
  let scale = SPEED * (now < G.slowUntil ? G.slowS : 1);
  if (G.tut && G.pend.some(p => !p.done && isHuman(p.side) && p.t - G.t < 0.45 && p.t - G.t > -0.1)) scale *= 0.45;   // チュートリアル：ジャストの前でゆっくり
  G.curScale = scale;
  if (!G.paused) {
    if (G.replay) updateReplay(rdt);
    else { let dt = rdt * scale; while (dt > 1e-6) { const s = Math.min(dt, 1 / 120); update(s); dt -= s; } }
  }
  const adt = G.paused ? 0 : rdt * (G.replay ? 0.45 : scale);
  for (const t of G.teams) for (const p of t.players) animatePlayer(p, adt);
  // ボールの見た目
  let wx = 0;
  if (ball.wob && ball.free && !ball.landed) { const pr = clamp((G.t - ball.t0) / Math.max(0.1, ball.tEnd - ball.t0), 0, 1); wx = ball.wob * Math.sin(Math.PI * pr) * Math.sin(G.t * 9); }
  ballMesh.position.set(ball.x, ball.y, ball.z + wx);
  if (ball.free) ballMesh.rotateOnWorldAxis(ball.spinAxis, ball.spin * adt);
  ballShadow.position.set(ball.x, 0.014, ball.z + wx); ballShadow.scale.setScalar(clamp(0.55 - ball.y * 0.04, 0.2, 0.55));
  ball.hist.push(ballMesh.position.clone()); if (ball.hist.length > 16) ball.hist.shift();
  const sp = ball.free ? Math.hypot(ball.vx, ball.vz) : 0;
  trail.visible = sp > 13 && !ball.landed;
  if (trail.visible) { const a = trail.geometry.attributes.position; for (let i = 0; i < 16; i++) { const h = ball.hist[Math.max(0, ball.hist.length - 16 + i)] || ballMesh.position; a.setXYZ(i, h.x, h.y, h.z); } a.needsUpdate = true; }
  ARENA.excite = Math.max(0.2, ARENA.excite - rdt * 0.12);
  if (G.rallyOn && G.rally) ARENA.excite = Math.max(ARENA.excite, Math.min(0.75, 0.25 + G.rally.cross * 0.07));
  crowdLevel(G.human >= 0 ? ARENA.excite : 0.15);
  updateCrowd(now / 1000, rdt);
  updateCamera(rdt);
  renderer.render(scene, camera);
  drawOverlay(rdt);
  if (G.human >= 0 && G.match && $('#rally')) $('#rally').textContent = G.rallyOn && G.rally && G.rally.cross >= 3 ? `ラリー ${G.rally.cross}` : '';
}
