<script>
'use strict';
// =====================================================================
//  べんりな道具
// =====================================================================
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const MUTE = Q.has('mute');              // テスト用：?mute で音を作らない
const FAST = Q.has('fast');              // テスト用：?fast で待ち時間を短く
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const yen = v => (v < 0 ? '-' : '') + Math.abs(Math.round(v)).toLocaleString('ja-JP') + '円';
const man = v => (v / 10000).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '万円';
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const TIME_SCALE = 2;                    // 本当の1秒 ＝ ゲームの2分
const SAVE_KEY = 'life-save-v1', OPT_KEY = 'life-opt-v1';
let OPT = { sound: true, lockLand: false };
try { Object.assign(OPT, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); } catch (e) { }
const saveOpt = () => { try { localStorage.setItem(OPT_KEY, JSON.stringify(OPT)); } catch (e) { } };

// =====================================================================
//  音（Web Audio で作る。?mute のときは何も作らない）
// =====================================================================
const SND = {
  ctx: null,
  init() {
    if (MUTE || !OPT.sound || this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.out = this.ctx.createGain(); this.out.gain.value = 0.5; this.out.connect(this.ctx.destination);
      this.ambience();
    } catch (e) { this.ctx = null; }
  },
  off() { if (this.ctx) { try { this.ctx.close(); } catch (e) { } this.ctx = null; } },
  tone(f, d, type = 'sine', v = 0.15, t0 = 0) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + d + 0.05);
  },
  nbuf() { if (!this._nb) { const c = this.ctx, b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this._nb = b; } return this._nb; },
  noise(d, f, v, q = 1) {
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime;
    s.buffer = this.nbuf(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = q;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start(t); s.stop(t + d + 0.05);
  },
  ambience() {   // 町のざわざわ（とても小さく）
    const c = this.ctx; if (!c) return;
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf(); s.loop = true; fl.type = 'lowpass'; fl.frequency.value = 380; g.gain.value = 0.035;
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start();
  },
  step() { this.noise(0.07, rnd(250, 520), 0.12, 1.2); },
  click() { this.tone(900, 0.05, 'triangle', 0.08); },
  beep() { this.tone(2093, 0.1, 'square', 0.05); },
  coin() { this.tone(2600, 0.06, 'triangle', 0.07); this.tone(3300, 0.08, 'triangle', 0.05, 0.04); },
  drawer() { this.noise(0.18, 900, 0.2, 0.7); this.tone(1320, 0.25, 'sine', 0.06, 0.12); },
  chime() { [659, 523, 587, 392].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.09, i * 0.28)); },
  good() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.08, i * 0.08)); },
  bad() { this.tone(220, 0.3, 'sawtooth', 0.06); this.tone(180, 0.3, 'sawtooth', 0.05, 0.1); },
  money() { [1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.07, i * 0.06)); },
  door() { this.noise(0.4, 300, 0.1, 0.5); },
};

// =====================================================================
//  3D のじゅんび（three.js）
// =====================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 700); camera.rotation.order = 'YXZ';
const MAXANI = Math.min(8, renderer.capabilities.getMaxAnisotropy());

// 光：空の光（半球）＋ 太陽（影を作る）
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4f4636, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
{ const c = sun.shadow.camera; c.left = -34; c.right = 34; c.top = 34; c.bottom = -34; c.near = 1; c.far = 220; }
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
scene.fog = new THREE.Fog(0xbcd8f0, 70, 330);
// 夜の街灯（近くの3本だけ本当に光らせる）
const ROAM = []; for (let i = 0; i < 3; i++) { const l = new THREE.PointLight(0xffd9a0, 0, 16, 2); scene.add(l); ROAM.push(l); }

// 空（上と地平線の色を時間で変える）
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: V3(0, 1, 0) }, sunVis: { value: 1 }, night: { value: 0 } },
  vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top,hor,sunDir; uniform float sunVis,night; varying vec3 vP;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){ vec3 d=normalize(vP); float h=d.y;
      vec3 c=mix(hor,top,pow(clamp(h,0.0,1.0),0.45));
      if(h<0.0) c=mix(hor,hor*0.5,clamp(-h*5.0,0.0,1.0));
      float s=max(dot(d,normalize(sunDir)),0.0);
      c+=vec3(1.0,0.86,0.62)*pow(s,900.0)*4.0*sunVis + vec3(1.0,0.7,0.4)*pow(s,10.0)*0.22*sunVis;
      // 夜の星
      vec2 g=floor(vec2(atan(d.z,d.x)*180.0, h*180.0)); float st=step(0.997,h21(g))*night*clamp(h*3.0,0.0,1.0);
      c+=vec3(st);
      gl_FragColor=vec4(c,1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat); sky.renderOrder = -1; scene.add(sky);

// =====================================================================
//  テクスチャ（絵）を canvas で作る

// =====================================================================
const DOORS = [];
// 自動ドア（ガラス2まい）。axis='x' のかべ
function slideDoor(cx, z, w, locked) {
  const L = [], h = 2.1;
  for (const s of [-1, 1]) { const p = box(w / 2, h, 0.04, MT.glass, cx + s * w / 4, 0, z, { cast: false }); box(w / 2, 0.06, 0.06, MT.metal, 0, 0, 0, { parent: p, cast: false }).position.set(0, h / 2 - 0.03, 0); L.push(p); }
  const c = col(cx - w / 2, z - 0.1, cx + w / 2, z + 0.1);
  DOORS.push({ kind: 'slide', x: cx, z, w, parts: L, open: 0, c, locked: locked || (() => false) });
}
// ひらくドア（木）
function swingDoor(axis, hinge, at, w, inSign, locked, color = 0x6b4a33) {
  const piv = new THREE.Group(); scene.add(piv);
  const dm = cm(color, { roughness: .6 });
  if (axis === 'x') { piv.position.set(hinge, 0, at); box(w, 2.02, 0.05, dm, w / 2, 0, 0, { parent: piv }); box(0.04, 0.04, 0.16, MT.metal, w - 0.1, 0.98, 0, { parent: piv, cast: false }); }
  else { piv.position.set(at, 0, hinge); box(0.05, 2.02, w, dm, 0, 0, w / 2, { parent: piv }); box(0.16, 0.04, 0.04, MT.metal, 0, 0.98, w - 0.1, { parent: piv, cast: false }); }
  const c = axis === 'x' ? col(hinge, at - .1, hinge + w, at + .1) : col(at - .1, hinge, at + .1, hinge + w);
  DOORS.push({ kind: 'swing', axis, piv, x: axis === 'x' ? hinge + w / 2 : at, z: axis === 'x' ? at : hinge + w / 2, w, inSign, open: 0, c, locked: locked || (() => false) });
}
function updateDoors(dt) {
  for (const d of DOORS) {
    const lk = d.locked();
    let near = Math.hypot(P.x - d.x, P.z - d.z) < (d.kind === 'slide' ? 2.6 : 1.7);
    if (!near) for (const n of NPCS) if (Math.hypot(n.g.position.x - d.x, n.g.position.z - d.z) < 2.4) { near = true; break; }
    const tgt = (!lk && near) ? 1 : 0, was = d.open;
    d.open += clamp(tgt - d.open, -dt * 2.2, dt * 2.2);
    if (was === 0 && d.open > 0 && Math.hypot(P.x - d.x, P.z - d.z) < 3) SND.door();
    d.c.on = d.open < 0.6;
    if (d.kind === 'slide') { d.parts[0].position.x = d.x - d.w / 4 - d.open * d.w * .48; d.parts[1].position.x = d.x + d.w / 4 + d.open * d.w * .48; }
    else d.piv.rotation.y = (d.axis === 'x' ? -d.inSign : d.inSign) * 1.45 * d.open;
  }
}

    else if (how === 'work') { ST.energy -= 5.5 * h; ST.hunger -= 6 * h; }
    else { ST.energy -= 4.2 * h; ST.hunger -= 5.5 * h; }

}

  // 25日：給料日（今月はたらいた分がまとめて口座にふりこまれる）
  if (dd === 25 && ST.unpaid.g > 0) {
    const u = ST.unpaid; addLog(`給料（まちかどマート・${u.days}日分）`, u.n);
    ST.stats.earned += u.n;
    toast(`💴 給料日！ ${yen(u.n)} がふりこまれた（引かれる前は ${yen(u.g)}）`, 'good'); SND.money();
    if (!ST.ach.pay) { ST.ach.pay = dateStr(d); toast('🏅 実績：はじめての給料', 'gold'); }

  }
  if (dd === 26) { addLog('電気・ガス・水道', -ECON.utility); addLog('スマホ代', -ECON.phone); toast(`💡 光熱費とスマホ代 ${yen(ECON.utility + ECON.phone)} が引き落とされた`); }
  if (dd === 27) {
    if (ST.home === 'apt') { addLog('家賃（コーポさくら101）', -ECON.rent); toast(`🏠 家賃 ${yen(ECON.rent)} が引き落とされた`); }
    if (ST.loan) {
      const L = ST.loan, r = ECON.rate / 12, intr = Math.round(L.remain * r), pay = Math.min(L.monthly, L.remain + intr);
      L.remain = Math.max(0, L.remain - (pay - intr)); L.paid++;
      addLog(`住宅ローン返済（利息 ${yen(intr)}）`, -pay); toast(`🏦 住宅ローン ${yen(pay)} を返した（のこり ${man(L.remain)}）`);

}

    openPanel('🏠 すまいる不動産', `「${PROPS[ST.apply.prop].short}のお申しこみ、ありがとうございます。<b>ひだまり銀行</b>で住宅ローンの審査を受けてくださいね（平日 9:00〜15:00）。」`, [{ t: '申しこみをやめる', cls: 'warn', f: () => { ST.apply = null; closePanel(); toast('申しこみをとりけした'); } }, { t: 'とじる', f: closePanel }]);
    return;
  }
  if (ST.home !== 'apt') { openPanel('🏠 すまいる不動産', '「新しいお家の住み心地はどうですか？ 何かあったら、いつでも来てくださいね。」', [{ t: 'とじる', f: closePanel }]); return; }
  if (!sel) {
    openPanel('🏠 すまいる不動産', `「いらっしゃいませ。どんなお家をおさがしですか？」<br><span class="small">いまの口座：${yen(ST.money)}</span>` +
      Object.keys(PROPS).map(id => { const p = PROPS[id]; return `<div class="card"><b>${p.name}</b><br>${man(p.price)}・${p.info}<br><span class="small">諸費用（登記・仲介手数料・ローンの手数料など）約 ${man(fees(id))}・ローン毎月 約${yen(loanMonthly(p.price))}（頭金0・35年・金利1.8%）</span></div>`; }).join('') +
      `<div class="card small">売り土地 980万円（注文住宅は次のアップデート）</div>`,
      Object.keys(PROPS).map(id => ({ t: `${PROPS[id].short}をくわしく`, f: () => realtyMenu(id, 0) })));
    return;
  }
  const p = PROPS[sel], down = Math.round(p.price * downPct / 100), loan = p.price - down, mo = loanMonthly(loan), f = fees(sel), need = down + f;
  const annual = ST.job && ST.job.role === 'staff' ? ECON.staffMonthly * 12 : (ST.job ? wage() * 7 * 21 * 12 : 0);
  const ratio = annual ? mo * 12 / annual : 9;
  openPanel('🏠 ' + p.short + 'の資金計画', `<b>${p.name}</b><br>
    <div class="tabs">${[0, 10, 20].map(v => `<button data-dp="${v}" class="${v === downPct ? 'on' : ''}">頭金 ${v}%</button>`).join('')}</div>
    <table class="t"><tr><td>物件の値段</td><td class="r">${yen(p.price)}</td></tr><tr><td>頭金（自分のお金ではらう）</td><td class="r">${yen(down)}</td></tr>
    <tr><td>住宅ローン（銀行から借りる）</td><td class="r">${yen(loan)}</td></tr><tr><td>毎月の返済（35年・固定1.8%）</td><td class="r"><b>${yen(mo)}</b></td></tr>
    <tr><td>35年で返す合計</td><td class="r">${yen(mo * 420)}（利息 ${man(mo * 420 - loan)}）</td></tr>
    <tr><td>諸費用（自分のお金ではらう）</td><td class="r">${yen(f)}</td></tr><tr><td><b>今 必要なお金</b></td><td class="r"><b>${yen(need)}</b></td></tr>
    <tr><td>${p.monthly ? p.monthlyLabel + '＋' : ''}固定資産税（毎月）</td><td class="r">${yen(p.monthly + p.tax)}</td></tr></table>
    <div class="card small">年収（見こみ）${man(annual)} → 返済の割合 <b>${annual ? Math.round(ratio * 100) : '-'}%</b>（銀行は 30% 以下だと安心と考える）<br>
    ${ST.money >= need ? '✅ 必要なお金は足りている' : `❌ あと ${yen(need - ST.money)} 足りない`}<br>${ST.job && ST.job.role === 'staff' ? '✅ 正社員' : '⚠️ アルバイトだと審査に通りにくい'}</div>`,
    [{ t: '購入を申しこむ', cls: 'main', f: () => { ST.apply = { prop: sel, down, loan, mo, fee: f, day: dayIdx() }; closePanel(); SND.good(); toast('📝 購入を申しこんだ。銀行でローンの審査を受けよう', 'good'); save(); } }, { t: 'もどる', f: () => realtyMenu() }],
    { after: () => document.querySelectorAll('[data-dp]').forEach(b => b.onclick = () => realtyMenu(sel, +b.dataset.dp)) });
}
function bankMenu() {
  const a = ST.apply;
  let html = `「いらっしゃいませ。ひだまり銀行です。」<br>口座の残高：<b>${yen(ST.money)}</b>`;
  const btns = [];
  if (a && !a.done) {
    const p = PROPS[a.prop];
    html += `<div class="card">📝 住宅ローンの申しこみ：${p.short}（借りる額 ${man(a.loan)}・毎月 ${yen(a.mo)}）</div>`;
    btns.push({ t: '🔍 住宅ローンの審査を受ける', cls: 'main', f: () => loanReview() });
  } else if (ST.loan) html += `<div class="card">住宅ローン：のこり <b>${man(ST.loan.remain)}</b>・毎月 ${yen(ST.loan.monthly)}・${ST.loan.paid}回 返した</div>`;
  else html += `<div class="card small">家を買うときは、先に「すまいる不動産」で物件を申しこんでから来てね。住宅ローンの審査をします。</div>`;
  btns.push({ t: 'とじる', f: closePanel });
  openPanel('🏦 ひだまり銀行 窓口', html, btns);
}
function loanReview() {
  const a = ST.apply, j = ST.job, p = PROPS[a.prop];
  const annual = j && j.role === 'staff' ? ECON.staffMonthly * 12 : (j ? wage() * 7 * 21 * 12 : 0);
  const ratio = annual ? a.mo * 12 / annual : 9, need = a.down + a.fee;
  const ng = [];
  if (!j) ng.push('仕事をしていない');
  else if (j.role !== 'staff') ng.push('アルバイトなので、収入が安定しているか分からない（正社員になってから）');
  if (ratio > 0.3) ng.push(`年収にくらべて返済が多すぎる（${Math.round(ratio * 100)}%・30%以下が目安）`);
  if (ST.money < need) ng.push(`頭金と諸費用（${yen(need)}）が口座に足りない`);
  if (ST.money < 0) ng.push('引き落としの滞納がある');
  if (ng.length) { SND.bad(); openPanel('🔍 審査の結果', `<b class="minus">今回は審査に通りませんでした。</b><br>${ng.map(s => '・' + s).join('<br>')}<br><span class="small">条件がそろったら、また来てね。</span>`, [{ t: 'わかった', f: closePanel }]); return; }
  SND.good();
  openPanel('🔍 審査の結果', `<b class="plus">審査に通りました！</b><br>${p.name}<br><table class="t"><tr><td>今はらう（頭金＋諸費用）</td><td class="r"><b>${yen(need)}</b></td></tr><tr><td>借りる額</td><td class="r">${yen(a.loan)}</td></tr><tr><td>毎月の返済（27日）</td><td class="r">${yen(a.mo)} × 420回</td></tr></table><span class="small">契約すると、アパートは今月で出ていく（家賃は止まる）。</span>`,
    [{ t: '✍️ 契約して家を買う', cls: 'main', f: () => buyHome() }, { t: 'まだやめておく', f: closePanel }]);
}
async function buyHome() {
  const a = ST.apply, p = PROPS[a.prop];
  if (a.down) addLog(`頭金（${p.short}）`, -a.down);
  addLog('諸費用（登記・仲介手数料など）', -a.fee);
  ST.loan = a.loan > 0 ? { prop: a.prop, principal: a.loan, remain: a.loan, monthly: a.mo, paid: 0 } : null;
  ST.home = a.prop; a.done = true; ST.apply = null;
  ST.ach.home = dateStr(dayIdx());
  setFurniture(); closePanel(); PAUSE = true; SND.money();
  await fade('🔑 カギをうけとった！ 引っこし中…', 1500, () => { pass(180); const s = p.inside; P.x = s.x; P.z = s.z; P.yaw = s.yaw; });
  PAUSE = false; save();
  openPanel('🏡 家を買った！', `<b>${p.name}</b> があなたの家になった！<br>${dateStr(dayIdx())}・${ST.age}さい<br>
    <div class="card">🏅 実績：家を買った<br>のこりのローン ${man(ST.loan ? ST.loan.remain : 0)}・毎月 ${yen(ST.loan ? ST.loan.monthly : 0)}<br>口座 ${yen(ST.money)}</div>
    <span class="small">これからは家賃のかわりに、ローンと${p.monthly ? '管理費・' : ''}固定資産税をはらっていく。ベッドで寝られるよ。</span>`, [{ t: 'やったー！', cls: 'main', f: closePanel }]);
}

// =====================================================================
//  画面の情報（HUD）
// =====================================================================
function goalText() {
  const j = ST.job;
  if (!j) return '🎯 「まちかどマート」の店長と話して、アルバイトをはじめよう（家を出て右・交差点のむこう）';
  if (!ST.stats.shifts) return '🎯 カウンターの中のレジに入って、はじめての仕事をしよう（7:30〜11:00 に入る）';
  if (!ST.ach.pay) return '🎯 25日の給料日まではたらこう（📱スマホの「1週間おまかせ」も使えるよ）';
  if (j.role === 'part') return `🎯 正社員をめざそう（はたらいた日 ${j.days}／10・評価 ${Math.round(j.eval)}／70）`;
  if (ST.home === 'apt') { const n = Math.min(...Object.keys(PROPS).map(fees)); return ST.apply ? '🎯 ひだまり銀行で住宅ローンの審査を受けよう（平日 9:00〜15:00）' : `🎯 家を買おう！ 諸費用（約${man(n)}〜）をためて「すまいる不動産」へ`; }
  return '🏡 家を買った！ ローンを返しながら、人生をつづけよう';
}
let hudT = 0;
function updateHUD(dt) {
  hudT -= dt; if (hudT > 0) return; hudT = 0.25;
  const d = dayIdx();
  $('h-date').textContent = dateStr(d) + '　' + ST.age + 'さい';
  $('h-clock').textContent = hhmm(minOfDay());
  $('h-money').textContent = '💴 ' + yen(ST.money);
  $('h-en').textContent = Math.round(ST.energy); $('h-hu').textContent = Math.round(ST.hunger);
  $('b-en').style.width = ST.energy + '%'; $('b-hu').style.width = ST.hunger + '%';
  $('b-en').style.background = ST.energy < 20 ? '#ff5d6c' : '#5ad1ff'; $('b-hu').style.background = ST.hunger < 20 ? '#ff5d6c' : '#ffb35a';
  $('goal').textContent = goalText();
  const low = Math.min(ST.energy, ST.hunger);
  $('vig').style.boxShadow = `inset 0 0 160px 60px rgba(0,0,0,${low < 20 ? (20 - low) / 25 : 0})`;
}

// =====================================================================
//  タイトル・はじめる
// =====================================================================
function toTitle() {
  MODE = 'title'; PAUSE = false;
  ['hud', 'touch', 'actbtn', 'movehint', 'pos', 'shiftbar', 'say'].forEach(id => $(id).classList.add('hide'));
  $('title').classList.remove('hide');
  $('t-cont').style.display = loadSave() ? '' : 'none';
}
function startGame(st) {
  ST = st; SND.init();
  P.x = ST.pos.x; P.z = ST.pos.z; P.yaw = ST.pos.yaw; P.pitch = -0.05;
  setFurniture();
  ['pos', 'shiftbar', 'say'].forEach(id => $(id).classList.add('hide')); $('cross').classList.remove('hide');
  $('title').classList.add('hide'); $('hud').classList.remove('hide');
  if (IS_TOUCH) { $('touch').classList.remove('hide'); $('actbtn').classList.remove('hide'); $('movehint').classList.remove('hide'); setTimeout(() => $('movehint').classList.add('hide'), 8000); }
  MODE = 'walk';
  if (OPT.lockLand) lockLandscape(true);
  else if (IS_TOUCH && innerHeight > innerWidth * 1.1) toast('📱 スマホを横にすると大きく遊べるよ');
  if (!ST.started) {
    ST.started = true; save();
    openPanel('🏠 新しい生活のはじまり', `<b>${dateStr(0)} 朝 7:00</b><br>あなたは <b>22さい</b>。大学を出て、ひとりぐらしを始めたばかり。<br>
      <div class="card">💴 貯金：<b>50万円</b><br>🏠 住まい：アパート「コーポさくら」101号室（1K・家賃 5.8万円）<br>💼 仕事：まだない</div>
      目標は、<b>はたらいて、お金をためて、自分の家を買う</b>こと。<br>家賃・光熱費・年金・保険… 毎月お金は出ていく。体力とおなかにも気をつけて。<br>
      <span class="small">まずは近くのコンビニ「まちかどマート」で、アルバイトをさがそう。部屋のパソコンでも情報が見られるよ。</span>`, [{ t: 'はじめる', cls: 'main', f: closePanel }]);
  }
}
$('t-new').onclick = () => { SND.init(); SND.click(); const go = () => startGame(newState()); if (loadSave()) { if (confirm('セーブデータを消して、はじめからにする？')) go(); } else go(); };
$('t-cont').onclick = () => { SND.init(); SND.click(); const s = loadSave(); if (s) startGame(s); };

// =====================================================================
//  まいコマの動き
// =====================================================================
let last = performance.now(), titleT = 0, autosave = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!isFinite(dt) || dt < 0) dt = 0; dt = Math.min(dt, 0.05);
  if (LW() !== VW || LH() !== VH || FORCE !== wantForce()) onResize();
  if (!(innerWidth > 0 && innerHeight > 0) || !VW || !VH) return;
  if (MODE === 'title') {
    titleT += dt * 0.05;
    camera.position.set(Math.cos(titleT) * 40, 22, Math.sin(titleT) * 40); camera.lookAt(0, 2, 0);
    P.x = camera.position.x; P.z = camera.position.z;
    lightAt(10.5 + Math.sin(titleT * 0.6) * 5.5);
    const d = sun.userData.dir; sun.target.position.set(0, 0, 0); sun.position.set(d.x * 90, d.y * 90, d.z * 90); sky.position.copy(camera.position);
  } else {
    if (MODE === 'walk' && !PAUSE) {
      updatePlayer(dt);
      pass(dt * TIME_SCALE);
      if (ST.energy <= 0) faint('energy'); else if (ST.hunger <= 0) faint('hunger');
      const f = findInteract(); CUR_I = f;
      const pr = $('prompt');
      if (f) { pr.innerHTML = (IS_TOUCH ? '<b>［調べる］</b> ' : '<b>［E］</b> ') + f.lb; pr.classList.remove('hide'); } else pr.classList.add('hide');
      $('actbtn').style.opacity = f ? 1 : 0.35;
      autosave += dt; if (autosave > 20) { autosave = 0; save(); }
    }
    if (MODE === 'shift') updateShift(dt);
    applyCamera(); updateLight(); updateHUD(dt);
  }
  updateDoors(dt); updateWalkers(dt); updateTraffic(dt);
  renderer.render(scene, camera);
}

// =====================================================================
//  はじめる
// =====================================================================
buildTown(); wires(); makeWalkers(); makeTraffic();
// テスト用の道具（ブラウザのコンソールから）
window.G = {
  get ST() { return ST; }, P, PROPS, ECON, SHIFT, pass, newDay, loanMonthly, startGame, newState, save,
  tp(x, z, yaw = 0) { P.x = x; P.z = z; P.yaw = yaw; },
  setTime(h) { const m = h * 60 - minOfDay(); pass(m > 0 ? m : m + 1440); ST.energy = Math.max(ST.energy, 80); ST.hunger = Math.max(ST.hunger, 70); },
  scanAll() { SHIFT.items.forEach(scanItem); },
  posKey, get cust() { return shiftCust; }, get mode() { return MODE; }, get inter() { return CUR_I && CUR_I.lb; },
  weekAuto, finishShiftQuiet, bankMenu, realtyMenu, loanReview, buyHome, closePanel, shiftMenu, bossTalk, startShift,
};
onResize(); landLabel(); sndLabel();
requestAnimationFrame(frame);
toTitle();
if (Q.has('autostart')) startGame(loadSave() || newState());   // テスト用：?autostart ですぐ始める
</script>
