function pvpConfig(scale, la, lb){
  const SC = SCALES[scale], r = Math.random();
  const army = l => [{type:'sho', gen:l.gen}, ...l.subs.map(g => ({type:'bus', gen:g})), ...SC.units.map(t => ({type:t})), ...(l.items.includes('teppo') ? [{type:'tep'}] : [])];
  return {mode:'online', scale, W:SC.W, H:SC.H, sym:true, kind:Math.random() < 0.55 ? 'river' : 'field', foeBase:'camp', campHp:SC.camp,
    time:r < 0.5 ? 'day' : r < 0.75 ? 'dusk' : r < 0.88 ? 'night' : 'day', fog:r >= 0.88, rounds:SC.rounds, diff:1,
    clans:['hinata','aka'], load:[la, lb], army:[army(la), army(lb)], allow:[UNIT_ORDER, UNIT_ORDER], unitCap:SC.units.length + 8};
}
// 戦場を送れる形にする／受け取った戦場を自分の向きにする
function snapState(){
  const o = {...S}; delete o._df; delete o.newAch;
  o.units = S.units.map(u => { const {vx, vy, alpha, ax, ay, hop, ...r} = u; return r; });
  return JSON.stringify(o);
}
function flipState(st){
  const W = st.W, H = st.H, n = JSON.parse(JSON.stringify(st));
  n.map = st.map.map((r, y) => r.map((_, x) => st.map[H - 1 - y][W - 1 - x]));
  n.own = {}; for (const k in st.own){ const [x, y] = k.split(',').map(Number); n.own[key(W - 1 - x, H - 1 - y)] = 1 - st.own[k]; }
  for (const u of n.units){ u.x = W - 1 - u.x; u.y = H - 1 - u.y; u.side = 1 - u.side; }
  for (const o of n.objs){ o.x = W - 1 - o.x; o.y = H - 1 - o.y; o.side = 1 - o.side; }
  for (const k of ['food', 'load', 'buffs', 'stats', 'allow']) n[k] = n[k].slice().reverse();
  if (n.names) n.names = n.names.slice().reverse();
  n.side = 1 - st.side; n.first = 1 - (st.first || 0); n.clans = ['hinata', 'aka'];
  return n;
}
function adoptState(st){
  const old = new Map(S.units.map(u => [u.id, u])), mapChanged = st.map.map(r => r.join('')).join() !== S.map.map(r => r.join('')).join();
  for (const u of st.units){ const o = old.get(u.id); u.vx = o ? o.vx : u.x*B + B/2; u.vy = o ? o.vy : u.y*B + B/2; u.alpha = o ? o.alpha : 0; }
  st.newAch = S.newAch; st.names = st.names || S.names; S = st;
  if (mapChanged) TERR = paintTerrain(S);
}

/* ----- 送る・受け取る ----- */
function netSend(a){
  if (!NETI.on || !S || S.mode !== 'online') return;
  a.g = NETI.g; a.q = ++NETI.q;
  NETI.room.add('m' + NETI.seat, a.q, JSON.stringify(a)).catch(() => {});
}
function netRecv(str){
  let a; try { a = JSON.parse(str); } catch(e){ return; }
  if (!a) return;
  if (a.g !== NETI.g){ if (a.g > NETI.g) NETI.early.push(a); return; }   // 戦の始まりより先に届いたものは、とっておく
  if (a.q <= NETI.recvQ || NETI.queue.some(q => q.q === a.q)) return;
  NETI.queue.push(a); NETI.queue.sort((x, y) => x.q - y.q); pump();
}
async function pump(){
  if (NETI.pumping) return; NETI.pumping = true;
  try {
    while (NETI.queue.length && NETI.queue[0].q === NETI.recvQ + 1 && S && !S.over){
      const a = NETI.queue.shift(); NETI.recvQ = a.q;
      busy = true; renderHud();
      await applyRemote(a);
      if (S && S.side === 1) busy = false;
    }
  } finally { NETI.pumping = false; if (S && S.side === 0 && !S.over && !NETI.queue.length) busy = false; renderHud(); }
}
async function applyRemote(a){
  const fx = x => S.W - 1 - x, fy = y => S.H - 1 - y, byId = id => S.units.find(q => q.id === id);
  NETI.turnAt = Math.max(NETI.turnAt, Date.now() - SCALES[NETI.scale].turnSec * 1000 + 30000);   // 相手が動いているあいだは「返事がない」にしない
  switch (a.t){
    case 'mv': { const u = byId(a.id); if (u) await actMove(u, fx(a.x), fy(a.y)); break; }
    case 'atk': { const u = byId(a.id); if (u){ const tg = targetsFrom(u, u.x, u.y).find(t => t.x === fx(a.x) && t.y === fy(a.y)); if (tg) await actAttack(u, tg); } break; }
    case 'rf': if (TYPES[a.k]) await actReinforce(1, a.k); break;
    case 'tac': await actTactic(1, a.id, a.x != null ? unitAt(fx(a.x), fy(a.y)) : null); break;
    case 'sk': { const u = byId(a.id); if (u) await actSkill(u, a.x != null ? unitAt(fx(a.x), fy(a.y)) : null); break; }
    case 'end': adoptState(flipState(JSON.parse(a.snap))); busy = false; endTurn(); return;
    case 'resign': busy = false; finishBattle(0, '相手が退却した'); return;
  }
  afterAction();
}
function netWaitFoe(){ setInfo(`<span class="e">${esc(S.names ? S.names[1] : '相手')}の番…</span>　相手が動かすのを待っています`); pump(); }

/* ----- 部屋に入ったあとの共通のしたく ----- */
function attachRoom(){
  const R = NETI.room, me = NETI.seat, foe = 1 - me;
  R.onAdd('m' + foe, (i, v) => netRecv(v));
  R.on('on' + foe, v => { if (v) NETI.foeBeat = Date.now(); });
  R.on('st' + foe, v => { if (!v) return; try { const s = JSON.parse(v); if (s.g === NETI.g && s.at !== NETI.lastFoeStamp){ NETI.lastFoeStamp = s.at; showStamp(1, s.k); } } catch(e){} });
  for (const k of [0, 1]) R.on('again' + k, v => { NETI.again[k] = v || 0; if (NETI.seat === 0) tryRematch(); if ($('result').classList.contains('on')) onlineResultBtns(); });
  const beat = () => R.set('on' + me, Date.now()).catch(() => {});
  beat(); R.dropOnLeave('on' + me);
  NETI.ivs.push(setInterval(beat, 8000), setInterval(netTick, 500));
}
function leaveOnline(){
  if (!NETI.on && !NETI.room) return;
  NETI.ivs.forEach(clearInterval); NETI.ivs = [];
  try {
    if (NETI.reg){ NETI.reg.remove(NETI.code); NETI.reg.close(); }
    if (NETI.room){ if (NETI.seat === 0) NETI.room.remove(); else { NETI.room.remove('guest'); NETI.room.remove('on1'); } NETI.room.close(); }
  } catch(e){}
  Object.assign(NETI, {on:false, room:null, reg:null, code:'', foe:null, foeLoad:null, hostInfo:null, queue:[], phase:'menu', again:[0, 0]});
}
window.addEventListener('pagehide', () => { if (NETI.room && NETI.on){ try { NETI.room.set('on' + NETI.seat, null); } catch(e){} } });

/* ----- 部屋を作る（友だち用・ランダムマッチ用） ----- */
async function createRoom(pub){
  const name = readName(); if (!name) return false;
  try { await netReady(); } catch(e){ onErr('つながらなかったよ。ネットを確かめてね'); return false; }
  for (let i = 0; i < 8; i++){
    const code = String(1000 + (Math.random() * 9000 | 0)), room = makeRoom(code);
    let h; try { h = await room.get('host'); } catch(e){ onErr('つながらなかったよ。ネットを確かめてね'); room.close(); return false; }
    if (h){ room.close(); continue; }
    Object.assign(NETI, {on:true, room, code, seat:0, pub, scale:SV.scale ?? 1, g:0, foe:null, foeLoad:null, phase:'lobby', waitSince:Date.now(), again:[0, 0]});
    await room.set('host', {name, sc:NETI.scale, pub:pub ? 1 : 0, at:Date.now(), cid:NETI.cid});
    room.dropOnLeave(null);
    room.on('guest', v => onGuest(v));
    attachRoom();
    if (pub){ NETI.reg = makeRoom('pub'); NETI.reg.dropOnLeave(code); const hb = () => { if (!NETI.foe && NETI.reg) NETI.reg.set(code, {at:Date.now(), sc:NETI.scale}).catch(() => {}); }; hb(); NETI.ivs.push(setInterval(hb, 5000)); }
    renderOnline(); return true;
  }
  onErr('部屋が作れなかったよ。もう一度ためしてね'); return false;
}
function onGuest(v){
  if (NETI.seat !== 0) return;
  const had = NETI.foe;
  if (v){
    NETI.foe = {name:safeName(v.name), cid:v.cid}; NETI.foeLoad = v.load;
    if (!had){ sfx('horn'); if (NETI.reg){ NETI.reg.remove(NETI.code); } if (NETI.pub) setTimeout(() => { if (NETI.foe && NETI.phase === 'lobby') hostStart(); }, 2500); }
  } else { NETI.foe = null; NETI.foeLoad = null; }
  if (NETI.phase === 'lobby') renderOnline();
}
/* ----- 合言葉で部屋に入る ----- */
async function joinRoom(code, pub){
  const name = readName(); if (!name) return false;
  if (!/^\d{4}$/.test(code)){ onErr('合言葉は4けたの数字だよ'); return false; }
  try { await netReady(); } catch(e){ onErr('つながらなかったよ。ネットを確かめてね'); return false; }
  const room = makeRoom(code);
  let h; try { h = await room.get('host'); } catch(e){ room.close(); onErr('つながらなかったよ'); return false; }
  if (!h){ room.close(); if (!pub) onErr('その合言葉の部屋は見つからないよ'); return false; }
  const ok = await room.claim('guest', {name, cid:NETI.cid, load:myOnlineLoad(), at:Date.now()});
  if (!ok){ room.close(); if (!pub) onErr('その部屋はもう2人そろっているよ'); return false; }
  Object.assign(NETI, {on:true, room, code, seat:1, pub, scale:[0, 1, 2].includes(h.sc) ? h.sc : 1, g:0, hostInfo:{name:safeName(h.name)}, foe:{name:safeName(h.name)}, phase:'lobby', again:[0, 0]});
  room.dropOnLeave('guest');
  room.on('host', v => { if (!v && NETI.on && NETI.seat === 1 && NETI.phase === 'lobby'){ leaveOnline(); openOnline(); onErr('部屋がなくなったよ'); } });
  room.on('start', v => { if (v) guestStart(v); });
  attachRoom();
  sfx('horn'); renderOnline(); return true;
}
/* ----- 戦を始める ----- */
async function hostStart(){
  if (NETI.seat !== 0 || !NETI.foe || !NETI.on) return;
  const sc = NETI.scale;
  const cfg = pvpConfig(sc, sanitizeLoad(myOnlineLoad(), sc), sanitizeLoad(NETI.foeLoad, sc));
  newBattle(cfg);
  S.names = [safeName(SV.name), NETI.foe.name]; S.first = 0;
  NETI.g = Date.now(); NETI.q = 0; NETI.recvQ = 0; NETI.queue = []; NETI.early = []; NETI.again = [0, 0];
  await NETI.room.set('again0', 0); await NETI.room.set('again1', 0);
  await NETI.room.remove('m0'); await NETI.room.remove('m1');
  await NETI.room.set('start', JSON.stringify({g:NETI.g, sc, snap:snapState()}));
  beginOnlineBattle();
}
function guestStart(str){
  let m; try { m = JSON.parse(str); } catch(e){ return; }
  if (!m || m.g === NETI.g || NETI.seat !== 1) return;
  NETI.g = m.g; NETI.q = 0; NETI.recvQ = 0; NETI.queue = []; NETI.scale = m.sc;
  S = flipState(JSON.parse(m.snap));
  beginOnlineBattle();
}
async function beginOnlineBattle(){
  NETI.phase = 'battle';
  battleCfg = {mode:'online', scale:NETI.scale}; afterBattle = null;
  S.mode = 'online'; S.newAch = []; S.tutorial = false; sel = null; tsel = null; busy = true;
  FX.parts = []; FX.texts = []; FX.shots = []; FX.slashes = []; FX.ghosts = []; FX.rings = [];
  tut = null; show('battle'); $('tut').classList.remove('on'); $('zSt').style.display = '';
  putFace($('hFace0'), S.load[0].gen); putFace($('hFace1'), S.load[1].gen, true);
  TERR = paintTerrain(S);
  for (const u of S.units){ u.vx = u.x*B + B/2; u.vy = u.y*B + B/2; }
  resizeBattle(); camFit(); clampCam(true);
  running = true; lastFrame = 0; requestAnimationFrame(frame);
  Music.play('battle'); renderHud();
  sfx('horn'); banner(`オンライン　${SCALES[NETI.scale].name}`, 'g');
  countMe();
  await sleep(1300);
  busy = false; NETI.foeBeat = Date.now();
  startTurn();
  // 始まる前に届いていた相手の操作を読む
  const early = NETI.early.filter(a => a.g === NETI.g); NETI.early = []; for (const a of early) netRecv(JSON.stringify(a));
}
function netTick(){
  if (!NETI.on || !S || S.mode !== 'online' || S.over || NETI.phase !== 'battle') return;
  const lim = SCALES[NETI.scale].turnSec * 1000, el = Date.now() - NETI.turnAt;
  if (S.side === 0 && el > lim && !busy){ toast('時間切れ！'); finishSel(); tsel = null; closeModal(); netSend({t:'end', snap:snapState()}); endTurn(); return; }
  const lost = Date.now() - NETI.foeBeat > 30000;
  if (S.side === 1 && !NETI.pumping && (lost || el > lim + 45000)){ finishBattle(0, lost ? '相手の接続が切れた' : '相手から返事がない'); return; }
  if (lost && S.side === 0) setInfo('<span class="e">相手の接続が切れたかも…</span>　このまま待つか、ターンを進めてね');
  renderHud();
}
function turnLeft(){ return Math.max(0, Math.ceil((SCALES[NETI.scale].turnSec * 1000 - (Date.now() - NETI.turnAt)) / 1000)); }
/* ----- もう一戦 ----- */
function tryRematch(){
  if (NETI.seat !== 0 || !NETI.on || !S || !S.over) return;
  if (NETI.again[0] === NETI.g && NETI.again[1] === NETI.g && NETI.foe) hostStart();
}
function onlineResultBtns(){
  const btns = $('rBtns'); if (!btns || !lastResult || lastResult.mode !== 'online') return;
  const foeHere = NETI.on && Date.now() - NETI.foeBeat < 30000;
  const meReady = NETI.again[NETI.seat] === NETI.g, foeReady = NETI.again[1 - NETI.seat] === NETI.g;
  btns.innerHTML = `<button class="btn" id="rAgainOn" ${foeHere && !meReady ? '' : 'disabled'}>${meReady ? '相手を待っています…' : 'もう一戦（同じ相手）'}</button><button class="btn dark" id="rLeaveOn">部屋を出る</button>` +
    `<div class="note" style="width:100%">${!foeHere ? '相手は部屋を出たみたい' : foeReady ? '相手は「もう一戦」を押しているよ！' : ''}</div>`;
  $('rAgainOn').onclick = () => { sfx('tap'); NETI.room.set('again' + NETI.seat, NETI.g); };
  $('rLeaveOn').onclick = () => { sfx('tap'); leaveOnline(); openOnline(); };
}

function showStamp(side, k){
  const s = STAMPS[k]; if (!s) return;
  const d = document.createElement('div'); d.className = 'stampB ' + (side ? 'foe' : 'me'); d.textContent = s[0] + ' ' + s[1];
  document.body.appendChild(d); sfx('page');
  d.animate([{opacity:0, transform:'translateX(-50%) scale(.6)'}, {opacity:1, transform:'translateX(-50%) scale(1.08)', offset:.15}, {opacity:1, transform:'translateX(-50%) scale(1)', offset:.85}, {opacity:0}], {duration:2600}).onfinish = () => d.remove();
}

function openOnline(){ show('online'); Music.play('map'); renderOnline(); if (NETI.phase === 'menu') loadCount().then(() => { if (NETI.phase === 'menu' && $('online').classList.contains('on')) renderOnline(); }); }

  if ($('onMake')) $('onMake').onclick = async () => { sfx('tap'); await createRoom(false); };
  if ($('onJoin')) $('onJoin').onclick = async () => { sfx('tap'); await joinRoom(($('onCode').value || '').replace(/\D/g, ''), false); };
  if ($('onRand')) $('onRand').onclick = async () => { sfx('tap'); await randomMatch(); };
  if ($('onGo')) $('onGo').onclick = () => { sfx('tap'); hostStart(); };
  if ($('onLeave')) $('onLeave').onclick = () => { sfx('tap'); leaveOnline(); openOnline(); };
  if ($('onCpu')) $('onCpu').onclick = () => { sfx('tap'); leaveOnline(); openPrep('vs'); };
}
async function randomMatch(){
  if (!unlocked()) return;
  const name = readName(); if (!name) return;
  try { await netReady(); } catch(e){ onErr('つながらなかったよ'); return; }
  const sc = SV.scale ?? 1, reg = makeRoom('pub'); let all = {};
  try { all = await reg.all(); } catch(e){}
  reg.close();
  const now = Date.now();
  const cands = Object.entries(all).filter(([c, v]) => v && v.sc === sc && Math.abs(now - v.at) < 20000).sort((a, b) => a[1].at - b[1].at);
  for (const [code] of cands) if (await joinRoom(code, true)) return;
  await createRoom(true);
}
$('bOnBack').onclick = () => { sfx('tap'); leaveOnline(); openTitle(); };
setInterval(() => { if (NETI.phase === 'lobby' && NETI.pub && $('online').classList.contains('on')) renderOnline(); }, 5000);

// テスト用のつなぎ口
window.IK = {NETI, get S(){ return S; }, set S(v){ S = v; }, startBattle, vsConfig, storyConfig, tutConfig, aiBest, onCellTap, endTurn, get busy(){ return busy; }, get tut(){ return tut; }, playScene, openStory, openPrep, get SV(){ return SV; }};
checkUnlocks(); saveNow();   // 前の版で取った実績のごほうびも、ここで渡す
openTitle();
if (AUTO) startBattle(vsConfig(+(Q.get('diff') || 1), +(Q.get('scale') ?? 1)));
</script>
