<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15110d">
<title>いくさば！ 戦国天下統一</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
/* ===== 色（漆の黒・金・和紙）===== */
:root{
  --ink:#f3e9d2; --ink2:#cbb994; --sub:#a8977a;
  --lac:#1f1a16; --lac2:#2b231c;
  --gold:#d9b25f; --gold2:#8a6a2a;
  --red:#b8322a; --red2:#7a1d17;
  --blue:#2f5bb5; --blue2:#1a3570;
  --paper:#efe3c8; --pink:#2a2118;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#15110d}
body{color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-text-size-adjust:100%}
.brush{font-family:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:400}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow:hidden}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
button{font-family:inherit}
.btn{font-weight:800;font-size:17px;color:#fff6e0;border:2px solid var(--gold);border-radius:12px;padding:12px 18px;cursor:pointer;
  background:linear-gradient(180deg,#c9443a,#7a1d17);box-shadow:0 3px 0 #3a0d0a,inset 0 1px 0 rgba(255,255,255,.25);
  text-shadow:0 1px 0 rgba(0,0,0,.45);transition:transform .07s,filter .15s;letter-spacing:.04em}
.btn:active{transform:translateY(2px) scale(.98);filter:brightness(1.12)}
.btn.dark{background:linear-gradient(180deg,#3d342b,#1d1814)}
.btn.blue{background:linear-gradient(180deg,#3f6cc9,#1a3570);box-shadow:0 3px 0 #0b1a3a,inset 0 1px 0 rgba(255,255,255,.25)}
.btn.gold{background:linear-gradient(180deg,#f0d07d,#a77b2a);color:#2a1a05;text-shadow:none;box-shadow:0 3px 0 #4a3510,inset 0 1px 0 rgba(255,255,255,.5)}
.btn.small{font-size:14px;padding:8px 12px;border-radius:10px}
.btn:disabled{filter:grayscale(1) brightness(.6);opacity:.6}
.panel{background:linear-gradient(180deg,rgba(46,38,30,.95),rgba(24,19,15,.95));border:1.5px solid rgba(217,178,95,.55);border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,235,190,.08)}
.washi{background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 40%),
   repeating-linear-gradient(90deg,rgba(120,90,40,.04) 0 1px,transparent 1px 4px),
   #efe3c8;color:#2a2118}
.pill{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);border:1px solid rgba(217,178,95,.5);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.note{font-size:12px;color:var(--sub);text-align:center;line-height:1.5}
h2,h3{margin:0}
canvas{display:block}

/* ===== タイトル ===== */
#titleCv{position:absolute;inset:0;width:100%;height:100%}
#title .inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:auto;margin-bottom:auto;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 10px);width:100%}
.logo{font-size:min(68px,17vw);white-space:nowrap;line-height:1;color:#fff4dc;text-shadow:0 0 18px rgba(255,140,40,.55),0 4px 0 #3a0d0a,0 0 2px #000;letter-spacing:.02em}
.logo small{display:block;font-size:20px;letter-spacing:.3em;color:var(--gold);text-shadow:0 2px 0 #000;margin-top:8px;text-align:center}
.menu{display:flex;flex-direction:column;gap:10px;width:min(330px,92vw)}
.menu .btn{font-size:18px;padding:13px}
.menu .row2{display:flex;gap:8px} .menu .row2 .btn{flex:1;font-size:14px;padding:10px 6px}
.tinfo{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ===== バトル ===== */
#bcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 12px));display:flex;align-items:center;gap:8px;padding:6px 8px;z-index:5}
#hudTop{top:calc(var(--sat) + 6px)}
#hudBot{bottom:calc(var(--sab) + 6px)}
.face{width:46px;height:46px;flex:none;border-radius:10px;overflow:hidden;border:1.5px solid var(--gold);background:#000}
.face canvas{width:100%;height:100%}
.hud .mid{flex:1;min-width:0}
.hud .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .nm small{color:var(--sub);font-size:11px;margin-left:4px}
.bar{height:9px;background:rgba(0,0,0,.6);border-radius:5px;overflow:hidden;margin-top:3px;border:1px solid rgba(217,178,95,.35)}
.bar i{display:block;height:100%;transition:width .35s}
.bar.b i{background:linear-gradient(90deg,#5d8fe8,#2a4f9e)} .bar.r i{background:linear-gradient(90deg,#e8645a,#9a2620)}
.mini{font-size:12px;font-weight:800;color:var(--ink2);display:flex;gap:9px;margin-top:3px;align-items:center;white-space:nowrap}
.orders{display:inline-flex;gap:3px;align-items:center}
.orders i{width:12px;height:12px;border-radius:50%;background:#3b3128;border:1px solid #6b5a40;display:block}
.orders i.on{background:radial-gradient(circle at 35% 30%,#fff2b8,#e0a92a);border-color:#ffe39a;box-shadow:0 0 6px rgba(255,200,80,.7)}
.hbtns{display:flex;gap:5px}
.hbtns .btn{padding:7px 7px;font-size:12px;line-height:1.15;min-width:52px;border-radius:10px}
.roundp{font-size:13px}
#info{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 12px));z-index:5;font-size:14px;font-weight:800;
  padding:7px 11px;line-height:1.45;pointer-events:none}
#info .k{color:#8fb4ff} #info .e{color:#ff8f86} #info .g{color:var(--gold)}
#zoomBox{position:absolute;right:calc(env(safe-area-inset-right) + 8px);z-index:5;display:flex;flex-direction:column;gap:6px}
#zoomBox .btn{width:40px;height:40px;padding:0;font-size:20px;border-radius:50%}
.pulseBtn{animation:pulseB .6s infinite alternate}
@keyframes pulseB{from{box-shadow:0 0 0 0 rgba(255,210,90,.9)}to{box-shadow:0 0 0 7px rgba(255,210,90,.0),0 0 16px 4px rgba(255,210,90,.9)}}

/* 文字の演出（ターンの始まり・勝敗）*/
#banner{position:fixed;left:0;right:0;top:38%;z-index:30;pointer-events:none;display:flex;justify-content:center;opacity:0}
#banner div{font-size:min(34px,8.5vw);white-space:nowrap;padding:10px 40px;color:#fff;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);
  background:linear-gradient(90deg,transparent,rgba(26,53,112,.92) 15%,rgba(26,53,112,.92) 85%,transparent)}
#banner.r div{background:linear-gradient(90deg,transparent,rgba(122,29,23,.92) 15%,rgba(122,29,23,.92) 85%,transparent)}
#banner.g div{background:linear-gradient(90deg,transparent,rgba(110,80,20,.95) 15%,rgba(110,80,20,.95) 85%,transparent);font-size:min(46px,11vw)}
#toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:31;pointer-events:none;white-space:nowrap}
#toast div{font-size:34px;color:#ffe9a8;text-shadow:0 0 3px #000,0 3px 0 #3a0d0a,0 0 18px rgba(255,120,30,.8)}
/* カットイン（スキル・作戦）*/
#cutin{position:fixed;left:0;right:0;top:30%;height:130px;z-index:32;pointer-events:none;display:none;overflow:hidden}
#cutin .band{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(20,14,10,.92) 12%,rgba(20,14,10,.92) 88%,rgba(0,0,0,0));
  border-top:2px solid var(--gold);border-bottom:2px solid var(--gold)}
#cutin canvas{position:absolute;height:130px;width:130px;left:6%;top:0}
#cutin .t1{position:absolute;left:calc(6% + 140px);top:22px;font-size:40px;color:#fff3d0;text-shadow:0 0 10px rgba(255,150,40,.9),0 2px 0 #000}
#cutin .t2{position:absolute;left:calc(6% + 142px);top:80px;font-size:14px;font-weight:800;color:var(--ink2);right:8px}

/* チュートリアル */
#tut{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 12px));z-index:6;display:none;gap:10px;padding:8px 10px;
  border:2px solid var(--gold)}
#tut.on{display:flex}
#tut .face{width:52px;height:52px}
#tut .tx{font-size:14px;font-weight:800;line-height:1.55;flex:1;color:#2a2118}
#tut .tx em{font-style:normal;color:#a1281f}
#tut .nx{align-self:flex-end}

/* まど（モーダル）*/
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
.modal.on{display:flex}
.modal .panel{width:min(420px,100%);max-height:88vh;overflow-y:auto;padding:14px;touch-action:pan-y}
.modal h3{font-size:20px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cardrow{display:flex;gap:10px;align-items:center;padding:9px;border-radius:12px;background:rgba(255,240,200,.06);border:1px solid rgba(217,178,95,.3);margin-bottom:8px}
.cardrow .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(0,0,0,.4);border:1px solid rgba(217,178,95,.5);flex:none}
.cardrow .d{flex:1;font-size:12.5px;font-weight:800;color:var(--ink2);line-height:1.45}
.cardrow .d b{font-size:15px;color:var(--ink)}

/* ===== ストーリーの地図 ===== */
#mcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#storyTop{position:absolute;top:calc(var(--sat) + 6px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 12px));z-index:3;padding:8px 10px;display:flex;align-items:center;gap:8px}
#storyTop .t{flex:1}
#storyTop .t b{font-size:19px;display:block}
#provCard{position:absolute;bottom:calc(var(--sab) + 8px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 12px));z-index:3;padding:12px}
#provCard .hd{display:flex;align-items:center;gap:10px}
#provCard .hd .face{width:58px;height:58px}
#provCard .nm{font-size:22px}
#provCard .tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* ===== 会話の場面 ===== */
#scene{z-index:20}
#scv{position:absolute;inset:0;width:100%;height:100%}
.por{position:absolute;bottom:calc(var(--sab) + 150px);width:min(46vw,240px);height:min(46vw,240px);transition:opacity .3s,transform .3s,filter .3s}
.por canvas{width:100%;height:100%;border-radius:14px;border:2px solid rgba(217,178,95,.7);box-shadow:0 8px 24px rgba(0,0,0,.6)}
#porL{left:4%} #porR{right:4%}
.por.dim{filter:brightness(.45);transform:scale(.94)}
#sbox{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 10px);width:min(560px,calc(100% - 16px));min-height:130px;padding:14px 16px 12px;border-radius:14px;
  border:2px solid var(--gold2);box-shadow:0 8px 30px rgba(0,0,0,.6)}
#sname{position:absolute;top:-16px;left:14px;font-size:17px;padding:3px 14px;border-radius:8px;background:linear-gradient(180deg,#3d342b,#1d1814);border:1.5px solid var(--gold);color:#fff3d0}
#stext{font-size:16px;font-weight:800;line-height:1.7;min-height:80px}
#snext{position:absolute;right:12px;bottom:8px;font-size:13px;color:#7a5a20;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#sskip{position:absolute;top:calc(var(--sat) + 10px);right:10px;z-index:2}
#stitle{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:40px;color:#fff3d0;text-shadow:0 0 14px rgba(0,0,0,.9),0 2px 0 #000;display:none}

/* ===== 陣立て ===== */
#prep{padding:calc(var(--sat) + 8px) 8px 0;background:radial-gradient(circle at 50% 0%,#3a2a1c,#15110d 70%)}
#prep .top{display:flex;align-items:center;gap:8px;width:min(560px,100%);margin-bottom:6px}
#prep .top h2{flex:1;font-size:24px;white-space:nowrap;overflow:hidden}
#prepBody{width:min(560px,100%);flex:1;padding-bottom:150px}
.sec{padding:10px;margin-bottom:10px}
.sec h3{font-size:19px;display:flex;align-items:baseline;gap:8px;margin-bottom:8px;white-space:nowrap}
.sec h3 small{white-space:normal}
.sec h3 small{font-family:'M PLUS Rounded 1c',sans-serif;font-size:12px;color:var(--sub)}
.gens{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x pan-y}
.gcard{flex:none;width:118px;border-radius:12px;padding:6px;background:rgba(0,0,0,.35);border:2px solid rgba(217,178,95,.25);position:relative;cursor:pointer}
.gcard canvas{width:104px;height:104px;border-radius:8px}
.gcard .n{font-weight:800;font-size:13px;margin-top:4px}
.gcard .s{font-size:11px;color:var(--gold)}
.gcard.on{border-color:#ffd772;box-shadow:0 0 12px rgba(255,210,100,.5)}
.gcard .badge{position:absolute;top:4px;right:4px;background:#ffd772;color:#2a1a05;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.gcard.lock{filter:grayscale(1) brightness(.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.icard{border-radius:12px;padding:8px;background:rgba(0,0,0,.35);border:2px solid rgba(217,178,95,.25);position:relative;cursor:pointer;min-height:92px}
.icard .t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.icard .t .ic{font-size:22px}
.icard .d{font-size:11.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.icard .cost{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;background:#5a4220;border:1px solid var(--gold);border-radius:6px;padding:0 5px}
.icard.on{border-color:#ffd772;box-shadow:0 0 12px rgba(255,210,100,.5);background:rgba(90,66,32,.45)}
.icard.lock{opacity:.5}
.icard .lk{font-size:11px;color:#ff9f8f;margin-top:3px}
#prepBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 8px);width:min(560px,calc(100% - 16px));padding:10px;z-index:5}
.capbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:8px}
.capbar .bar{flex:1;height:12px;margin:0}
.capbar .bar i{background:linear-gradient(90deg,#f0d07d,#a77b2a)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg .btn{flex:1;padding:8px 2px;font-size:14px}
.seg .btn.on{outline:3px solid #ffd772}

/* ===== 結果・記録 ===== */
#result{justify-content:flex-start;gap:10px;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 24px);overflow-y:auto;touch-action:pan-y;background:radial-gradient(circle at 50% 30%,#3a2a1c,#0e0b08 75%)}
#result > *{flex:none}
.resT{font-size:72px;color:#ffe9a8;text-shadow:0 0 20px rgba(255,140,40,.7),0 4px 0 #3a0d0a}
.resT.lose{color:#9fb0c8;text-shadow:0 0 16px rgba(80,120,200,.5),0 4px 0 #0b1a3a}
.stats{width:min(380px,100%);display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-weight:800;font-size:15px;padding:12px}
.stats .v{text-align:right}
.gain{font-size:18px;font-weight:800;text-align:center;line-height:1.6}
.newget{background:rgba(255,215,114,.15);border:1px solid #ffd772;border-radius:10px;padding:7px 12px;font-weight:800;font-size:14px;margin:3px 0}
#shareImg{width:min(300px,80vw);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#record{padding:calc(var(--sat) + 8px) 8px 20px;background:#15110d}
#record .top{display:flex;align-items:center;gap:8px;width:min(560px,100%);margin-bottom:8px}
#record .top h2{flex:1;font-size:26px}
#recBody{width:min(560px,100%);flex:1}
.tabs{display:flex;gap:6px;width:min(560px,100%);margin-bottom:8px}
.tabs .btn{flex:1;padding:8px 4px;font-size:14px}
.tabs .btn.on{outline:3px solid #ffd772}
.ach{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px}
.ach .ic{font-size:26px;width:36px;text-align:center}
.ach.no{opacity:.4}
.ach .d{font-size:12px;color:var(--sub)}
#online{padding:calc(var(--sat) + 8px) 8px 0;background:radial-gradient(circle at 50% 0%,#2a3040,#15110d 70%)}
#online .top{display:flex;align-items:center;gap:8px;width:min(560px,100%);margin-bottom:8px}
#online .top h2{flex:1;font-size:26px}
#onBody{width:min(560px,100%);flex:1}
.inp{font:inherit;font-weight:800;font-size:18px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--gold);background:#1d1814;color:#fff;width:100%;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.stampB{position:fixed;left:50%;z-index:35;pointer-events:none;font-size:22px;font-weight:800;padding:8px 16px;border-radius:18px;background:#fffaf0;color:#2a2118;border:2px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap}
.stampB.foe{top:calc(var(--sat) + 86px)} .stampB.me{bottom:calc(var(--sab) + 150px)}
</style>
</head>
<body>

<!-- ===== タイトル ===== -->
<section id="title" class="screen on">
  <canvas id="titleCv"></canvas>
  <div class="inner">
    <div class="logo brush">いくさば！<small>戦国 天下統一</small></div>
    <div class="tinfo" style="margin:6px 0 4px"><span class="pill" id="tRank"></span><span class="pill" id="tCoin"></span></div>
    <div class="menu">
      <button class="btn" id="bStory">🏯 天下統一（ストーリー）</button>
      <button class="btn blue" id="bVs">⚔️ 一騎討ち（CPU対戦）</button>
      <button class="btn dark" id="bOn">🌐 オンライン対戦（友だち・ランダム）</button>
      <div class="row2">
        <button class="btn dark" id="bTut">📜 あそびかた</button>
        <button class="btn dark" id="bRec">📖 戦績・図鑑</button>
      </div>
      <div class="row2">
        <button class="btn dark small" id="bBgm">🎵 BGM：ON</button>
        <button class="btn dark small" id="bSe">🔊 効果音：ON</button>
      </div>
    </div>
    <div class="note" style="margin-top:6px">敵の本陣（城）を落とすか、敵の総大将をたおせば勝ち</div>
  </div>
</section>

<!-- ===== ストーリーの地図 ===== -->
<section id="story" class="screen">
  <canvas id="mcv"></canvas>
  <div id="storyTop" class="panel">
    <button class="btn dark small" id="bStoryBack">‹</button>
    <div class="t"><b class="brush" id="chapName">東海の章</b><span class="note" id="chapSub"></span></div>
    <span class="pill" id="sCoin"></span>
  </div>
  <div id="provCard" class="panel"></div>
</section>

<!-- ===== 会話の場面 ===== -->
<section id="scene" class="screen">
  <canvas id="scv"></canvas>
  <div class="por" id="porL"><canvas width="256" height="256"></canvas></div>
  <div class="por" id="porR"><canvas width="256" height="256"></canvas></div>
  <div id="stitle" class="brush"></div>
  <button class="btn dark small" id="sskip">スキップ ▶▶</button>
  <div id="sbox" class="washi"><div id="sname" class="brush"></div><div id="stext"></div><div id="snext">▼ タップ</div></div>
</section>

<!-- ===== 陣立て ===== -->
<section id="prep" class="screen">
  <div class="top"><button class="btn dark small" id="bPrepBack">‹ もどる</button><h2 class="brush" id="prepTitle">陣立て</h2><span class="pill" id="pCoin"></span></div>
  <div id="prepBody" class="scroll"></div>
  <div id="prepBar" class="panel"></div>
</section>

<!-- ===== バトル ===== -->
<section id="battle" class="screen">
  <canvas id="bcv"></canvas>
  <div class="hud panel" id="hudTop">
    <div class="face" id="hFace1"></div>
    <div class="mid">
      <div class="nm" id="hName1"></div>
      <div class="bar r"><i id="hBar1"></i></div>
      <div class="mini"><span id="hCas1"></span><span id="hFood1"></span><span id="hCnt1"></span></div>

const SAVE_KEY = 'ikusaba-save-v2', OLD_KEY = 'ikusaba-save-v1';
function defSave(){
  return {v:2, rp:0, w:0, l:0, d:0, byDiff:[[0,0],[0,0],[0,0]], ach:{}, tut:false, se:true, bgm:true, coins:0, diff:1, scale:1,
    owned:{gens:['haruto','hayate','shizuka','genji'], tactics:['charge','siege','spear','fire'], items:['foodbag','horse','ladder','bamboo']},
    load:{gen:'hayate', sub:'shizuka', tactics:['charge','siege','spear'], items:['foodbag']},
    sload:{subs:['hayate'], tactics:['charge','siege','spear'], items:['foodbag']},
    story:{prologue:false, own:['owari'], types:[], cleared:false}};
}
function loadSave(){
  const d = defSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      return Object.assign(d, s, {owned:Object.assign(d.owned, s.owned || {}), load:Object.assign(d.load, s.load || {}),
        sload:Object.assign(d.sload, s.sload || {}), story:Object.assign(d.story, s.story || {})});
    }
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
    if (old){ // 前の版から引っこし
      for (const k of ['rp','w','l','d','byDiff','ach','tut']) if (old[k] != null) d[k] = old[k];
      if (old.sound != null) d.se = old.sound;
      if (old.gen && GEN[old.gen]) d.load.gen = old.gen;
      d.coins = (old.w || 0) * 50;   // これまでの勝ちのぶん、コインをプレゼント
    }
  } catch(e){}
  return d;
}

/* =========================================================
   音：効果音と BGM（Web Audio でその場で作る。音のファイルは使わない）
   和の音階（都節：レ・ミ♭・ソ・ラ・シ♭）で、琴・太鼓・笛を鳴らす
   ========================================================= */
let AC = null, MASTER = null, SEG = null, BGG = null, REV = null, NOISE = null;
function ensureAC(){
  if (AC){ if (AC.state === 'suspended') AC.resume(); return true; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return false; }
  MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
  // ひびき（リバーブ）：ザーッという音をだんだん小さくしたものをたたみこむ
  const len = AC.sampleRate * 2, imp = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++){ const ch = imp.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6); }
  const conv = AC.createConvolver(); conv.buffer = imp;
  REV = AC.createGain(); REV.gain.value = 0.22; REV.connect(conv); conv.connect(MASTER);
  SEG = AC.createGain(); SEG.gain.value = 0.75; SEG.connect(MASTER);
  BGG = AC.createGain(); BGG.gain.value = 0.3; BGG.connect(MASTER);
  NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
  return true;
}
const OFF = [0,1,5,7,8];   // 都節の音階
const nf = deg => 146.83 * Math.pow(2, (Math.floor(deg/5)*12 + OFF[((deg%5)+5)%5]) / 12);

/* ----- 楽器 ----- */
function osc(type, f, t){ const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
function gainEnv(t, a, peak, d, dest){
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  g.connect(dest); return g;
}
function noiseSrc(t, dur, filterType, freq, q, dest, vol, decay){
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.setValueAtTime(freq, t); if (q) f.Q.value = q;
  const g = gainEnv(t, 0.003, vol, decay, dest);
  s.connect(f).connect(g); s.start(t, Math.random()); s.stop(t + dur);
  return f;
}
// 琴（はじく音）
function koto(f, t, vol, dest, rev = 0.5){
  const g = gainEnv(t, 0.004, vol, 1.5, dest);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f * 9, t); lp.frequency.exponentialRampToValueAtTime(f * 2.2, t + 0.6);
  lp.connect(g);
  const o1 = osc('triangle', f * 1.012, t); o1.frequency.exponentialRampToValueAtTime(f, t + 0.05);
  const o2 = osc('sawtooth', f * 2.003, t); const g2 = AC.createGain(); g2.gain.value = 0.14;
  o1.connect(lp); o2.connect(g2).connect(lp);
  o1.start(t); o2.start(t); o1.stop(t + 1.6); o2.stop(t + 1.6);
  if (rev){ const s = AC.createGain(); s.gain.value = rev; g.connect(s).connect(REV); }
}
// 太鼓（ドン）
function taiko(t, vol, dest, big){
  const o = osc('sine', big ? 115 : 150, t); o.frequency.exponentialRampToValueAtTime(big ? 48 : 70, t + 0.28);
  const g = gainEnv(t, 0.004, vol, big ? 0.6 : 0.35, dest); o.connect(g); o.start(t); o.stop(t + 0.7);
  noiseSrc(t, 0.12, 'lowpass', 420, 0, dest, vol * 0.5, 0.08);
  if (big){ const s = AC.createGain(); s.gain.value = 0.4; g.connect(s).connect(REV); }
}
// 締太鼓（カッ・トン）
function shime(t, vol, dest){
  const o = osc('sine', 360, t); o.frequency.exponentialRampToValueAtTime(210, t + 0.1);
  const g = gainEnv(t, 0.002, vol, 0.14, dest); o.connect(g); o.start(t); o.stop(t + 0.2);
  noiseSrc(t, 0.05, 'highpass', 2500, 0, dest, vol * 0.35, 0.04);
}
// 笛（フー）
function fue(f, t, dur, vol, dest){
  const o = osc('sine', f, t), lfo = osc('sine', 5.2, t), lg = AC.createGain(); lg.gain.value = f * 0.012;
  lfo.connect(lg).connect(o.frequency);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.18); g.gain.setValueAtTime(vol, t + dur - 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); const s = AC.createGain(); s.gain.value = 0.6; g.connect(s).connect(REV);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  noiseSrc(t, dur, 'bandpass', f * 2, 3, dest, vol * 0.25, dur);   // 息の音
}
// 鐘（チーン）
function kane(f, t, vol, dest){
  for (const [m, v, d] of [[1,1,2.2],[2.76,.5,1.2],[5.4,.25,.6]]){
    const o = osc('sine', f*m, t), g = gainEnv(t, 0.002, vol*v, d, dest); o.connect(g); o.start(t); o.stop(t + d + .1);
    const s = AC.createGain(); s.gain.value = 0.5; g.connect(s).connect(REV);
  }
}

/* ----- 効果音 ----- */
let lastSfx = {};
function sfx(name){
  if (!SV.se || SPEED === 0 || !ensureAC()) return;
  const t = AC.currentTime, D = SEG;
  if (lastSfx[name] && t - lastSfx[name] < 0.03) return;   // 同じ音が重なりすぎないように
  lastSfx[name] = t;
  switch (name){
    case 'tap':    { const o = osc('sine', 880, t); o.frequency.exponentialRampToValueAtTime(620, t+.05); const g = gainEnv(t,.002,.18,.07,D); o.connect(g); o.start(t); o.stop(t+.1); break; }
    case 'select': koto(nf(12), t, .22, D, .3); koto(nf(15), t + .05, .14, D, .3); break;
    case 'step':   noiseSrc(t, .06, 'lowpass', 700, 0, D, .12, .05); break;
    case 'slash':  { noiseSrc(t, .22, 'bandpass', 3200, 1.2, D, .35, .18).frequency.exponentialRampToValueAtTime(900, t+.2);
                     for (const f of [1480, 2310, 3520]){ const o = osc('square', f, t+.06), g = gainEnv(t+.06,.001,.035,.22,D); o.connect(g); o.start(t+.06); o.stop(t+.35); } break; }
    case 'bow':    noiseSrc(t, .3, 'bandpass', 2400, 2, D, .22, .26).frequency.exponentialRampToValueAtTime(500, t+.28);
                   { const o = osc('triangle', 180, t), g = gainEnv(t,.002,.15,.12,D); o.connect(g); o.start(t); o.stop(t+.15); } break;
    case 'gun':    noiseSrc(t, .45, 'lowpass', 2600, 0, D, .7, .35); taiko(t, .35, D, false);
                   { const s = AC.createGain(); s.gain.value = .5; noiseSrc(t, .5, 'lowpass', 1200, 0, s, .5, .45); s.connect(REV); } break;
    case 'cannon': taiko(t, .9, D, true); noiseSrc(t, .9, 'lowpass', 900, 0, D, .8, .8); break;
    case 'hit':    taiko(t, .32, D, false); noiseSrc(t, .1, 'bandpass', 1400, 1, D, .2, .08); break;
    case 'kill':   taiko(t, .6, D, true); { const o = osc('sawtooth', 260, t+.05); o.frequency.exponentialRampToValueAtTime(70, t+.5); const lp = AC.createBiquadFilter(); lp.frequency.value = 900; const g = gainEnv(t+.05,.01,.09,.45,D); o.connect(lp).connect(g); o.start(t+.05); o.stop(t+.6); } break;
    case 'castle': taiko(t, 1, D, true); noiseSrc(t, 1.2, 'lowpass', 500, 0, D, .7, 1.1); noiseSrc(t+.1, .6, 'bandpass', 1800, 1, D, .2, .5); break;
    case 'horn':   { // 法螺貝（ブオォー）
      const o = osc('sawtooth', 196, t), lfo = osc('sine', 4.5, t), lg = AC.createGain(); lg.gain.value = 3; lfo.connect(lg).connect(o.frequency);
      o.frequency.setValueAtTime(175, t); o.frequency.linearRampToValueAtTime(198, t + .25);
      const lp = AC.createBiquadFilter(); lp.frequency.value = 950; lp.Q.value = 2;
      const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .2); g.gain.setValueAtTime(.22, t + 1.1); g.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
      o.connect(lp).connect(g); g.connect(D); const s = AC.createGain(); s.gain.value = .6; g.connect(s).connect(REV);
      o.start(t); lfo.start(t); o.stop(t + 1.6); lfo.stop(t + 1.6); break; }
    case 'turnMe':  taiko(t, .7, D, true); taiko(t + .22, .55, D, true); break;
    case 'turnFoe': taiko(t, .6, D, true); taiko(t + .3, .4, D, false); taiko(t + .45, .4, D, false); break;
    case 'skill':   kane(nf(17), t, .25, D); [10,12,13,15].forEach((d,i) => koto(nf(d), t + .05 + i*.06, .18, D)); break;
    case 'tactic':  [7,8,10].forEach((d,i) => koto(nf(d), t + i*.07, .2, D)); shime(t + .25, .3, D); break;
    case 'fire':    noiseSrc(t, 1.2, 'bandpass', 900, .6, D, .35, 1.1); noiseSrc(t, 1, 'highpass', 3000, 0, D, .12, .9); break;
    case 'heal':    [12,15,17].forEach((d,i) => kane(nf(d), t + i*.1, .1, D)); break;
    case 'gate':    taiko(t, .9, D, true); noiseSrc(t, .8, 'lowpass', 300, 0, D, .7, .7); { const o = osc('square', 90, t+.05); const g = gainEnv(t+.05,.01,.05,.4,D); o.connect(g); o.start(t+.05); o.stop(t+.5); } break;
    case 'coin':    kane(nf(20), t, .12, D); kane(nf(22), t + .08, .1, D); break;
    case 'page':    noiseSrc(t, .12, 'highpass', 3000, 0, D, .1, .1); break;
    case 'bad':     { const o = osc('square', 150, t), g = gainEnv(t,.002,.06,.1,D); o.connect(g); o.start(t); o.stop(t+.12); break; }
    case 'win':     [5,7,10,12,15,17].forEach((d,i) => koto(nf(d), t + i*.12, .24, D)); kane(nf(22), t + .8, .22, D); taiko(t, .6, D, true); taiko(t + .72, .7, D, true); break;
    case 'lose':    [10,8,7,5,3].forEach((d,i) => koto(nf(d), t + i*.28, .2, D)); fue(nf(5), t + .3, 2, .08, D); break;
  }
}

/* ----- BGM（先の音を少しずつ予約して鳴らす） ----- */
const SONGS = {
  title: {bpm:64, steps:64, play(st, t){
    const b = st % 64;
    const arp = [0,5,7,10,12,10,7,5, 2,5,8,10,13,10,8,5];
    if (b % 4 === 0) koto(nf(arp[(b/4) % 16]), t, .16, BGG);
    if (b === 0 || b === 32) taiko(t, .25, BGG, true);
    if (b === 8) fue(nf(12), t, 3.4, .07, BGG);
    if (b === 40) fue(nf(10), t, 2.6, .07, BGG);
    if (b === 52) fue(nf(8), t, 2, .06, BGG);
  }},
  map: {bpm:84, steps:64, play(st, t){
    const b = st % 64;

    const m = mel[b % 32]; if (m != null && b % 2 === 0) koto(nf(m + (b >= 32 && b % 8 === 0 ? 0 : 0)), t, .16, BGG);

  battle: {bpm:112, steps:64, play(st, t){

};
const Music = {
  name:null, timer:null, nextT:0, step:0, tension:0,
  play(name){
    if (this.name === name && this.timer) return;
    this.stop(); this.name = name;
    if (!SV.bgm || SPEED === 0 || !ensureAC()) return;
    BGG.gain.cancelScheduledValues(AC.currentTime); BGG.gain.setValueAtTime(0.0001, AC.currentTime); BGG.gain.exponentialRampToValueAtTime(0.3, AC.currentTime + 1);
    this.nextT = AC.currentTime + 0.12; this.step = 0;
    this.timer = setInterval(() => this.tick(), 50);
  },
  stop(){ clearInterval(this.timer); this.timer = null; },
  tick(){
    const song = SONGS[this.name]; if (!song || !AC) return;
    const bpm = song.bpm * (this.name === 'battle' ? 1 + this.tension * 0.12 : 1);
    const spb = 60 / bpm / 4;
    if (this.nextT < AC.currentTime - 0.5) this.nextT = AC.currentTime + 0.05;   // 画面が止まっていたら追いつく
    while (this.nextT < AC.currentTime + 0.25){ song.play(this.step, this.nextT); this.step++; this.nextT += spb; }
  },
  refresh(){ const n = this.name; this.name = null; if (SV.bgm) this.play(n); else this.stop(); },
};
// 最初のタップで音を鳴らせるようにする（スマホのきまり）
window.addEventListener('pointerdown', () => { if (ensureAC() && Music.name && !Music.timer && SV.bgm) Music.refresh(); }, {passive:true});

// 色を明るく/暗くする（amt：-1〜1）
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0){ r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r|0},${g|0},${b|0})`;
}
function rgba(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function ell(g, x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, Math.max(.1,rx), Math.max(.1,ry), 0, 0, Math.PI*2); }
function poly(g, pts){ g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function rrect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ----- 家紋 ----- */
function drawKamon(g, kind, cx, cy, r, color){
  g.save(); g.fillStyle = color; g.strokeStyle = color; g.lineWidth = r * 0.16;
  if (kind === 'sun'){ ell(g, cx, cy, r, r); g.stroke(); ell(g, cx, cy, r*0.55, r*0.55); g.fill(); }
  else if (kind === 'wave'){ ell(g, cx, cy, r, r); g.stroke();
    for (let i = -1; i <= 1; i++){ g.beginPath(); g.moveTo(cx - r*0.7, cy + i*r*0.38); g.quadraticCurveTo(cx - r*0.35, cy + i*r*0.38 - r*0.28, cx, cy + i*r*0.38); g.quadraticCurveTo(cx + r*0.35, cy + i*r*0.38 + r*0.28, cx + r*0.7, cy + i*r*0.38); g.stroke(); } }
  else if (kind === 'diamond'){ poly(g, [[cx,cy-r],[cx+r*0.8,cy],[cx,cy+r],[cx-r*0.8,cy]]); g.stroke(); poly(g, [[cx,cy-r*0.45],[cx+r*0.36,cy],[cx,cy+r*0.45],[cx-r*0.36,cy]]); g.fill(); }
  else if (kind === 'mountain'){ poly(g, [[cx-r,cy+r*0.6],[cx-r*0.35,cy-r*0.5],[cx,cy+r*0.05],[cx+r*0.35,cy-r*0.8],[cx+r,cy+r*0.6]]); g.fill(); }
  else if (kind === 'moon'){ g.beginPath(); g.arc(cx, cy, r, 0.5, Math.PI*2 - 0.5 + Math.PI*0); g.arc(cx + r*0.45, cy - r*0.1, r*0.82, Math.PI*2 - 0.7, 0.7, true); g.closePath(); g.fill(); }
  else { g.beginPath(); g.moveTo(cx-r*0.7,cy-r*0.7); g.lineTo(cx+r*0.7,cy+r*0.7); g.moveTo(cx+r*0.7,cy-r*0.7); g.lineTo(cx-r*0.7,cy+r*0.7); g.stroke(); ell(g,cx,cy,r,r); g.stroke(); }
  g.restore();
}

      g.beginPath(); g.moveTo(cx + s*17, cy - 30); g.lineTo(cx + s*36, cy - 44); g.lineTo(cx + s*20, cy - 26); g.fill(); } }
  else if (kind === 'wave'){ g.beginPath(); g.moveTo(cx - 34, cy); g.quadraticCurveTo(cx - 30, cy - 34, cx, cy - 36); g.quadraticCurveTo(cx + 26, cy - 34, cx + 18, cy - 14); g.quadraticCurveTo(cx + 8, cy - 26, cx - 6, cy - 18); g.quadraticCurveTo(cx + 4, cy - 10, cx + 34, cy); g.closePath(); g.fill(); g.stroke(); }

const PCACHE = {};
function portraitCanvas(id, size = 128, mirror = false){
  const k = id + size + mirror; if (PCACHE[k]) return PCACHE[k];
  const c = document.createElement('canvas'); c.width = c.height = size; paintPortrait(c, GEN[id], mirror); return PCACHE[k] = c;
}
function putFace(el, id, mirror){
  el.innerHTML = ''; const c = document.createElement('canvas'); c.width = c.height = 128;
  c.getContext('2d').drawImage(portraitCanvas(id, 128, mirror), 0, 0); el.appendChild(c);
}

const SPR_RES = 3;   // 細かさ（ズームしてもきれいに）

  const c = document.createElement('canvas'); c.width = w * SPR_RES; c.height = h * SPR_RES;

// cfg: {W,H,kind,sym,foeBase,seed}

  if (cfg.kind === 'river' || cfg.kind === 'delta'){
    const rows = cfg.kind === 'delta' ? [Math.floor(H*0.36), Math.floor(H*0.64)] : [Math.floor(H/2) - (cfg.sym ? 1 : 0)];
    rows.forEach((row, ri) => {
      const cr = {}; const nB = 1 + R(2), nF = 2 + R(2);
      const xs = shuffle([...Array(W).keys()]).filter(x => x > 0 && x < W - 1);
      for (let i = 0; i < nB && i < xs.length; i++) cr[xs[i]] = 'b';
      for (let i = nB; i < nB + nF && i < xs.length; i++) cr[xs[i]] = 'd';
      if (cfg.sym){ // 対称：x と W-1-x の両方がわたれるように
        for (const x in cr){ cr[W-1-x] = cr[W-1-x] || cr[x]; }
      }
      riverRow(row, cr);
      if (cfg.sym){ for (let x = 0; x < W; x++) m[H-1-row][W-1-x] = m[row][x]; }
      if (cfg.kind === 'river' && !cfg.sym && row + 1 < H - 2 && R(2)){ for (let x = 0; x < W; x++) m[row + 1][x] = cr[x] ? (cr[x] === 'b' ? 'b' : 'd') : 'r'; }
    });
  }
  // 城（敵側・上）
  if (cfg.foeBase === 'keep'){
    const big = W >= 10, x0 = cx - (big ? 3 : 2), x1 = cx + (big ? 3 : 2), y1 = big ? 4 : 3;
    for (let y = 0; y <= y1; y++) for (let x = x0; x <= x1; x++){
      if (x === x0 || x === x1 || y === y1) m[y][x] = 'w'; else m[y][x] = 'o';
    }
    m[y1][cx] = 'g'; objs.push({kind:'gate', side:1, x:cx, y:y1, hp:9, max:9});
    if (big){ m[2][x1] = 'g'; objs.push({kind:'gate', side:1, x:x1, y:2, hp:9, max:9}); }
    m[1][cx] = 'c'; objs.push({kind:'keep', side:1, x:cx, y:1, hp:big ? 20 : 17, max:big ? 20 : 17});
    for (let y = y1 + 1; y < H - 2; y++) if (m[y][cx] === 'p') m[y][cx] = 'o';   // 門へ続く道
    if (cfg.mountain){ for (let y = y1 + 1; y <= y1 + 2; y++) for (let x = 0; x < W; x++) if (m[y][x] === 'p' && x !== cx && R(3)) m[y][x] = 'm'; }
  }
  // 森・山・田んぼ・村（上半分にばらまく）
  const scatter = (t, n, y0, y1v, cluster) => {
    let k = 0, guard = 0;
    while (k < n && guard++ < 300){
      let x = R(W), y = y0 + R(Math.max(1, y1v - y0));
      if (!free(x, y)) continue; set(x, y, t); k++;
      if (cluster) for (let j = 0; j < cluster; j++){ const [dx, dy] = DIRS[R(4)]; if (free(x + dx, y + dy) && y + dy < y1v && y + dy >= y0){ set(x + dx, y + dy, t); k++; } }
    }
  };
  const top0 = cfg.foeBase === 'keep' ? (W >= 10 ? 5 : 4) : 1;
  const area = cfg.sym ? half : H - 1;
  scatter('f', Math.round(W*H*0.07), top0, area, 1);
  scatter('m', Math.round(W*H*0.03), top0 + 1, area - 1, 0);
  if (cfg.kind === 'delta' || cfg.kind === 'river') scatter('h', Math.round(W*H*0.06), top0, area, 1);
  else scatter('h', Math.round(W*H*0.03), top0, area, 1);
  scatter('v', cfg.sym ? 1 : 2, top0 + 1, area - 1, 0);
  if (!cfg.sym && cfg.foeBase !== 'keep') scatter('f', Math.round(W*H*0.03), half - 2, H - 3, 1);
  // 本陣（陣幕）
  const camp = (side, x, y) => { m[y][x] = 'c'; objs.push({kind:'camp', side, x, y, hp:cfg.campHp || 16, max:cfg.campHp || 16}); };
  camp(0, cx, H - 1);
  if (cfg.foeBase !== 'keep') camp(1, ex, 0);
  // 本陣のまわりと、出陣する列はあけておく
  for (const o of objs) if (o.kind !== 'gate') for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    const x = o.x + dx, y = o.y + dy; if ((dx || dy) && x >= 0 && y >= 0 && x < W && y < H && !'cwgo'.includes(m[y][x]) && !(o.kind === 'keep')) m[y][x] = 'p'; }
  // 道（自分の本陣から上へ）
  for (let y = H - 2; y >= Math.floor(H*0.55); y--) if (m[y][cx] === 'p') m[y][cx] = 'o';
  return {map:m, objs};
}

// 兵を並べる（side の軍。list は {type, gen}）
function deploy(side, list){
  const base = mainObj(side), fwd = side === 0 ? -1 : 1;
  const zoneDepth = Math.min(Math.floor(S.H * 0.4), 3 + Math.floor(list.length / S.W));
  const inZone = (x, y) => side === 0 ? y >= S.H - 1 - zoneDepth : y <= zoneDepth + (S.objs.some(o => o.kind === 'gate' && o.side === side) ? 2 : 0);
  const cells = [];
  for (let y = 0; y < S.H; y++) for (let x = 0; x < S.W; x++){
    const t = S.map[y][x]; if (!inZone(x, y) || 'rwgcd'.includes(t) || unitAt(x, y)) continue;
    cells.push({x, y});
  }
  const cxm = (S.W - 1) / 2;
  const score = (type, c) => {
    const f = side === 0 ? (S.H - 1 - c.y) : c.y;   // 前に出ているほど大きい
    const d = dist(c.x, c.y, base.x, base.y), side2 = Math.abs(c.x - cxm);
    switch (type){
      case 'sho': return -d*3 - side2*0.3;
      case 'bus': return -Math.abs(d - 2)*2 - side2*0.2;
      case 'ashi': case 'samu': return f*2 - side2*0.4;
      case 'kiba': return f*1.5 + side2*0.8;
      case 'shinobi': return f*2 + (S.map[c.y][c.x] === 'f' ? 3 : 0);
      default: return f*1 - Math.abs(f - zoneDepth*0.5)*1.5 - side2*0.2;   // 弓・鉄砲・大筒は真ん中あたり
    }
  };
  const placed = [];
  for (const it of list){
    let best = null, bs = -1e9;
    for (const c of cells){ if (unitAt(c.x, c.y)) continue; const s = score(it.type, c) + Math.random()*0.3; if (s > bs){ bs = s; best = c; } }
    if (!best) continue;
    placed.push(mkUnit(side, it.type, best.x, best.y, it.gen));
  }
  return placed;
}
function mkUnit(side, type, x, y, gen){
  const T = TYPES[type];
  const max = T.hp + ((type === 'ashi' || type === 'samu') && hasItem(side, 'armor') ? 3 : 0);
  const u = {id:S.nextId++, side, type, x, y, hp:max, max, gen:gen || null, acted:false, moved:false, spent:false, amb:false, free:false, rev:0, skillUsed:false,
    vx:x*B + B/2, vy:y*B + B/2};
  S.units.push(u); return u;
}

/* cfg：
   {mode:'vs'|'story'|'tut', W,H, kind, foeBase, time, fog, seed, rounds, diff,
    clans:[c0,c1], load:[{gen, subs, tactics, items}, ...], army:[list0, list1], allow:[types0, types1], prov} */
function newBattle(cfg){
  S = {
    W:cfg.W, H:cfg.H, seed:cfg.seed || (Math.random()*1e9|0), mode:cfg.mode, prov:cfg.prov || null,
    own:{}, units:[], nextId:1, objs:[], side:0, round:1, maxRound:cfg.rounds || 12, orders:3, food:[3,3],
    clans:cfg.clans, load:cfg.load.map(l => ({gen:l.gen, subs:l.subs || [], tactics:(l.tactics || []).map(id => ({id, used:false})), items:(l.items || []).slice()})),
    buffs:[0,1].map(() => ({mv:0, guard:-1, charge:false, night:false, sandan:false, mist:-1, rumor:0, atk:0, toka:false})),
    turnCount:0, diff:cfg.diff, env:{time:cfg.time || 'day', fog:!!cfg.fog}, over:false, winner:null,
    stats:[0,1].map(() => ({kills:0, ambush:0, pincer:0, reinf:0, dmg:0, tactics:0, gates:0})),
    allow:cfg.allow || [UNIT_ORDER, UNIT_ORDER], unitCap:cfg.unitCap || 16, tutorial:cfg.mode === 'tut',
  };
  if (cfg.fixedMap){ S.map = cfg.fixedMap.map(r => r.split('')); S.objs = cfg.fixedObjs.map(o => ({...o})); }
  else { const g = genMap({...cfg, seed:S.seed}); S.map = g.map; S.objs = g.objs; }
  for (let s = 0; s < 2; s++) if (hasItem(s, 'foodbag')) S.food[s] += 3;
  if (cfg.fixedUnits){ for (const [side, type, x, y, gen, hp] of cfg.fixedUnits){ const u = mkUnit(side, type, x, y, gen); if (hp) u.hp = hp; } }
  else {
    const p0 = deploy(0, cfg.army[0]);
    if (cfg.sym){ // 一騎討ち：相手も同じ並び（点対称）
      const rest = [];
      cfg.army[1].forEach((it, i) => { const u = p0[i]; if (u && !unitAt(S.W - 1 - u.x, S.H - 1 - u.y)) mkUnit(1, it.type, S.W - 1 - u.x, S.H - 1 - u.y, it.gen); else rest.push(it); });
      if (rest.length) deploy(1, rest);
    } else deploy(1, cfg.army[1]);
  }
  return S;
}

/* =========================================================

function viewRange(viewer){
  if (S.env.time !== 'night' && !S.env.fog) return 99;
  return hasItem(viewer, 'noroshi') ? 3 : 2;
}
// u は viewer 側から見えない？
function hiddenFrom(u, viewer){
  if (u.side === viewer || u.rev > 0) return false;
  let near = 99;
  for (const o of S.units) if (o.side === viewer && o.hp > 0){ const d = dist(o.x, o.y, u.x, u.y); if (d < near) near = d; }
  const forest = S.map[u.y][u.x] === 'f', mist = S.buffs[u.side].mist >= S.turnCount, ninja = u.type === 'shinobi';
  if (forest || mist || ninja){ const r = forest && hasItem(viewer, 'noroshi') ? 2 : 1; return near > r; }

}
const visibleOcc = (x, y, viewer) => { const o = unitAt(x, y); return o && (o.side === viewer || !hiddenFrom(o, viewer)) ? o : null; };
function moveCost(t, u, x, y){
  const ty = u.type, b = S.buffs[u.side], heavy = ty === 'kiba' || isGen(ty);
  switch (t){
    case 'r': return b.toka ? 3 : Infinity;
    case 'd': return b.toka ? 1 : (heavy ? 2 : 3);
    case 'w': return ty === 'shinobi' ? 2 : (hasItem(u.side, 'ladder') && (ty === 'ashi' || ty === 'samu') ? 3 : Infinity);
    case 'c': return Infinity;
    case 'g': { const o = objAt(x, y); return o && o.side !== u.side ? Infinity : 1; }
    case 'f': return heavy ? 3 : ty === 'shinobi' ? 1 : 2;
    case 'm': return heavy || ty === 'ozutsu' ? 3 : 2;
    case 'h': return heavy ? 3 : 2;
    default: return 1;
  }
}
const moveRange = u => TYPES[u.type].mv + (S.buffs[u.side].mv || 0) + (u.type === 'kiba' && hasItem(u.side, 'horse') ? 1 : 0);
const canShootAfterMove = u => !(u.type === 'tep' || u.type === 'ozutsu') || S.buffs[u.side].sandan;
// 動けるマス（ダイクストラ法）
function reach(u){
  const mv = moveRange(u), res = new Map();
  res.set(key(u.x, u.y), {x:u.x, y:u.y, c:0, prev:null});
  const q = [{x:u.x, y:u.y, c:0}];
  while (q.length){
    let bi = 0; for (let i = 1; i < q.length; i++) if (q[i].c < q[bi].c) bi = i;
    const cur = q.splice(bi, 1)[0];
    if (cur.c > res.get(key(cur.x, cur.y)).c) continue;
    for (const [dx, dy] of DIRS){
      const nx = cur.x + dx, ny = cur.y + dy; if (!inb(nx, ny)) continue;
      const nc = cur.c + moveCost(S.map[ny][nx], u, nx, ny); if (nc > mv) continue;
      const o = unitAt(nx, ny); if (o && o.side !== u.side && !hiddenFrom(o, u.side)) continue;   // 見えている敵は通れない
      const k = key(nx, ny), ex = res.get(k); if (ex && ex.c <= nc) continue;
      res.set(k, {x:nx, y:ny, c:nc, prev:key(cur.x, cur.y)}); q.push({x:nx, y:ny, c:nc});
    }
  }
  return res;
}
function moveCells(u){
  const r = reach(u), out = new Map();
  for (const [k, n] of r){ if ((n.x === u.x && n.y === u.y) || visibleOcc(n.x, n.y, u.side) || objAt(n.x, n.y)) continue; out.set(k, n); }
  return {r, out};
}
function pathTo(r, x, y){ const p = []; let k = key(x, y); while (k){ const n = r.get(k); p.unshift(n); k = n.prev; } return p; }
const rangeMax = (u, px, py) => TYPES[u.type].rmax + (RANGED(u.type) && S.map[py][px] === 'm' ? 1 : 0);
function targetsFrom(u, px, py){
  const T = TYPES[u.type], rmax = rangeMax(u, px, py), list = [];
  for (const o of S.units){
    if (o.side === u.side || o.hp <= 0 || hiddenFrom(o, u.side)) continue;
    const d = dist(px, py, o.x, o.y); if (d >= T.rmin && d <= rmax) list.push({kind:'unit', t:o, x:o.x, y:o.y});
  }
  for (const o of S.objs){
    if (o.side === u.side || o.hp <= 0) continue;
    const d = dist(px, py, o.x, o.y); if (d >= T.rmin && d <= rmax) list.push({kind:'obj', t:o, x:o.x, y:o.y});
  }
  return list;
}
const OBJ_MUL = {ashi:1.3, ozutsu:1.6, samu:1, kiba:0.7, yumi:0.6, tep:0.6, shinobi:0.8, sho:1, bus:1};
function calcDamage(a, ax, ay, tg, opt = {}){
  let atk = TYPES[a.type].atk + (a.type === 'kiba' && S.buffs[a.side].charge ? 2 : 0) + (S.buffs[a.side].atk || 0);
  let m = 1; const tags = [];
  const defSide = tg.t.side;
  if (tg.kind === 'unit'){
    const d = tg.t, mu = matchup(a.type, d.type); m *= mu;
    if (mu > 1) tags.push('相性◎'); else if (mu < 1) tags.push('相性×');
    const ter = TER[S.map[d.y][d.x]]; if (ter.def){ m *= ter.def; tags.push(ter.def > 1 ? '浅瀬で無防備' : ter.name + 'で守り'); }
    if (!opt.counter){
      if (S.units.some(o => o.side === a.side && o.id !== a.id && o.hp > 0 && dist(o.x, o.y, d.x, d.y) === 1)){ m *= 1.4; tags.push('挟み撃ち'); }
      if (opt.hidden || S.buffs[a.side].night){ m *= 1.5; tags.push('奇襲'); }
    }
  } else { m *= OBJ_MUL[a.type] || 1; if (a.type === 'ashi' || a.type === 'ozutsu') tags.push('城攻め'); }
  if (S.buffs[defSide].guard >= S.turnCount){ m *= 0.5; tags.push('鉄壁'); }
  const gr = hasItem(a.side, 'banner') ? 2 : 1;
  if (!isGen(a.type) && S.units.some(o => o.side === a.side && isGen(o.type) && o.hp > 0 && dist(o.x, o.y, ax, ay) <= gr)){ m *= 1.2; tags.push('号令'); }
  if (S.map[ay][ax] === 'm' && !(tg.kind === 'unit' && S.map[tg.t.y][tg.t.x] === 'm')){ m *= 1.2; tags.push('高所'); }
  if (opt.counter) m *= 0.5;
  let dmg = Math.max(1, Math.round(atk * m));
  if (tg.kind === 'obj' && hasItem(a.side, 'ladder')) dmg += 1;
  if (tg.kind === 'unit' && RANGED(a.type) && hasItem(defSide, 'bamboo')){ dmg = Math.max(1, dmg - 1); tags.push('竹束'); }
  return {dmg, tags};
}
function canCounter(d, a){
  const T = TYPES[d.type], dd = dist(d.x, d.y, a.x, a.y);

}
function spend(u){
  if (u.spent) return;
  u.spent = true; u.amb = hiddenFrom(u, 1 - u.side);   // 動く前に見えていなければ「奇襲」
  if (u.free) u.free = false; else S.orders--;
}
function collectDead(){
  const dead = S.units.filter(q => q.hp <= 0);
  for (const d of dead) S.stats[1 - d.side].kills++;
  if (dead.length) S.units = S.units.filter(q => q.hp > 0);
  return dead;
}
function coreMove(u, x, y){
  const r = reach(u); if (!r.has(key(x, y))) return null;
  spend(u);
  const path = pathTo(r, x, y); let ambush = null, end = path.length - 1;
  for (let i = 1; i < path.length; i++){
    const o = unitAt(path[i].x, path[i].y);
    if (o && o.side !== u.side){ ambush = o; let j = i - 1; while (j > 0 && unitAt(path[j].x, path[j].y) && unitAt(path[j].x, path[j].y) !== u) j--; end = j; o.rev = 2; break; }
  }
  u.x = path[end].x; u.y = path[end].y; u.moved = true;
  if (ambush) u.acted = true;
  let village = false;
  if (!ambush && S.map[u.y][u.x] === 'v' && S.own[key(u.x, u.y)] !== u.side){ S.own[key(u.x, u.y)] = u.side; village = true; }
  return {path:path.slice(0, end + 1), ambush, village};
}
function damageObj(o, dmg, side){
  const before = o.hp; o.hp = Math.max(0, o.hp - dmg);
  S.stats[side].dmg += (before - o.hp) * 2;   // 本陣・門へのダメージは戦功2倍
  if (o.kind === 'gate' && o.hp <= 0){ S.map[o.y][o.x] = 'o'; S.objs = S.objs.filter(q => q !== o); S.stats[side].gates++; return true; }

function coreAttack(u, tg){
  spend(u);

  let gateBroken = false;
  if (tg.kind === 'unit'){ const b = tg.t.hp; tg.t.hp = Math.max(0, b - r.dmg); S.stats[u.side].dmg += b - tg.t.hp; }
  else gateBroken = damageObj(tg.t, r.dmg, u.side);

  if (r.tags.includes('挟み撃ち')) S.stats[u.side].pincer++;

  if (tg.kind === 'unit' && tg.t.hp > 0 && canCounter(tg.t, u)){
    const c = calcDamage(tg.t, tg.t.x, tg.t.y, {kind:'unit', t:u, x:u.x, y:u.y}, {counter:true});
    const b = u.hp; u.hp = Math.max(0, b - c.dmg); S.stats[tg.t.side].dmg += b - u.hp; counter = {dmg:c.dmg};

    if ((dx || dy) && inb(x, y) && !'rwgc'.includes(S.map[y][x]) && !unitAt(x, y)) list.push({x, y});
  }
  list.sort((a, b) => (side === 0 ? a.y - b.y : b.y - a.y) || Math.abs(a.x - c.x) - Math.abs(b.x - c.x));

function coreReinforce(side, type){

}
// 作戦を使う（fx：画面の演出に使う情報）

function aiDiff(me){ return me === 1 ? S.diff : +(Q.get('p0') || 1); }
// 敵の本陣までの「歩く遠さ」の地図（門は通れるとして少し遠く数える）
function distField(me){
  const target = mainObj(1 - me); const D = [...Array(S.H)].map(() => Array(S.W).fill(99));

  const q = [[target.x, target.y]]; D[target.y][target.x] = 0;

    let bi = 0; for (let i = 1; i < q.length; i++) if (D[q[i][1]][q[i][0]] < D[q[bi][1]][q[bi][0]]) bi = i;
    const [x, y] = q.splice(bi, 1)[0];
    for (const [dx, dy] of DIRS){ const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue;
      const c = cost(S.map[ny][nx]); if (c >= 99) continue; const nd = D[y][x] + c; if (nd < D[ny][nx]){ D[ny][nx] = nd; q.push([nx, ny]); } }

function buildThreat(foe, me){

    const origins = canShootAfterMove(f) ? [...reach(f).values()] : [{x:f.x, y:f.y}];
    for (const o of origins){
      const rm = rangeMax(f, o.x, o.y);
      for (let y = Math.max(0, o.y - rm); y <= Math.min(S.H - 1, o.y + rm); y++) for (let x = Math.max(0, o.x - rm); x <= Math.min(S.W - 1, o.x + rm); x++){

}
function threatAt(threat, u, x, y){

}
function posScore(u, x, y, ctx){

  const aggr = 0.55 + S.round * 0.06 + (behind ? 0.5 : 0);

  const tgt = mainObj(1 - me);

  const t = S.map[y][x];

  if (t === 'd') s -= 1.2;
  if (t === 'v' && S.own[key(x, y)] !== me) s += 3;
  const w = [0.1, 0.25, 0.35][diff];
  const dang = threatAt(threat, u, x, y);
  s -= Math.min(dang, u.hp) * w * TYPES[u.type].val / 5;
  if (dang >= u.hp) s -= u.type === 'sho' ? [8, 40, 80][diff] : [0.5, 2.5, 4][diff] + TYPES[u.type].val * 0.4 * diff;
  const myBase = mainObj(me);
  if (u.type === 'sho' && myBase) s -= dist(x, y, myBase.x, myBase.y + (me === 1 ? 1 : -1)) * 0.7;
  if (u.type === 'bus') s -= Math.min(df[y][x], 40) * 0.25;

}
function attackScore(u, x, y, tg, hid){

}

      if (c.id === 'fire') use = S.units.filter(u => u.side === foe && 'fv'.includes(S.map[u.y][u.x])).length >= 2;

      if (c.id === 'night') use = S.round >= 2 && mine.filter(a => foesV.some(f => dist(f.x, f.y, a.x, a.y) <= TYPES[a.type].mv + TYPES[a.type].rmax)).length >= 3;

const BCV = $('bcv'), BG = BCV.getContext('2d');
let DPR = Math.min(2, window.devicePixelRatio || 1);

function viewW(){ return BCV.clientWidth; } function viewH(){ return BCV.clientHeight; }
function resizeBattle(){
  DPR = Math.min(2, window.devicePixelRatio || 1);

  const top = $('hudTop').offsetHeight, bot = $('hudBot').offsetHeight;

}
function zoomLimits(){
  const vw = viewW(), vh = viewH() - CAM.padT - CAM.padB;

}
function clampCam(snap){

  const vw = viewW(), vh = viewH(), mw = S.W * B * CAM.tz, mh = S.H * B * CAM.tz, ah = vh - CAM.padT - CAM.padB;
  CAM.tx = mw <= vw ? (vw - mw) / 2 : clamp(CAM.tx, vw - mw - 20, 20);
  CAM.ty = mh <= ah ? CAM.padT + (ah - mh) / 2 : clamp(CAM.ty, vh - CAM.padB - mh - 30, CAM.padT + 30);
  if (snap){ CAM.x = CAM.tx; CAM.y = CAM.ty; CAM.z = CAM.tz; }
}
function camFit(){ const vw = viewW(); CAM.tz = vw / (S.W * B); camLook(S.W / 2, S.H - 3); }
function camLook(cx, cy, snap){   // マス (cx,cy) を画面のまん中へ
  const vw = viewW(), vh = viewH(); const ah = vh - CAM.padT - CAM.padB;
  CAM.tx = vw / 2 - (cx * B + B / 2) * CAM.tz; CAM.ty = CAM.padT + ah / 2 - (cy * B + B / 2) * CAM.tz;
  clampCam(snap);
}
function camFollow(x, y){   // 画面のはしにいたら、そこへ動かす
  const sx = CAM.tx + (x * B + B/2) * CAM.tz, sy = CAM.ty + (y * B + B/2) * CAM.tz;
  const vw = viewW(), vh = viewH();
  if (sx < vw * 0.15 || sx > vw * 0.85 || sy < CAM.padT + 40 || sy > vh - CAM.padB - 30) camLook(x, y);
}

  const nz = clamp(CAM.tz * f, ...zoomLimits());
  const wx = (px - CAM.tx) / CAM.tz, wy = (py - CAM.ty) / CAM.tz;

}
$('zIn').onclick = () => { sfx('tap'); zoomAt(1.3, viewW()/2, viewH()/2); };
$('zOut').onclick = () => { sfx('tap'); zoomAt(1/1.3, viewW()/2, viewH()/2); };

  if (PTR.size === 1) drag = {sx:e.clientX, sy:e.clientY, cx:CAM.tx, cy:CAM.ty, t:performance.now(), moved:false};
  if (PTR.size === 2){ const [a, b] = [...PTR.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), z:CAM.tz}; drag = null; }
});
BCV.addEventListener('pointermove', e => {
  if (!PTR.has(e.pointerId)) return; PTR.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && PTR.size === 2){ const [a, b] = [...PTR.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((pinch.z * d / pinch.d) / CAM.tz, (a.x + b.x)/2, (a.y + b.y)/2); CAM.x = CAM.tx; CAM.y = CAM.ty; CAM.z = CAM.tz; return; }
  if (drag){ const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.hypot(dx, dy) > 8) drag.moved = true;
    if (drag.moved){ CAM.tx = drag.cx + dx; CAM.ty = drag.cy + dy; clampCam(); CAM.x = CAM.tx; CAM.y = CAM.ty; } }
});
const ptrUp = e => {
  PTR.delete(e.pointerId);
  if (drag && !drag.moved && performance.now() - drag.t < 600){
    const wx = (e.clientX - CAM.x) / CAM.z, wy = (e.clientY - CAM.y) / CAM.z;
    const x = Math.floor(wx / B), y = Math.floor(wy / B);
    if (S && inb(x, y)){ ripple(wx, wy); onCellTap(x, y); }
  }
  if (PTR.size === 0){ drag = null; pinch = null; }
};
BCV.addEventListener('pointerup', ptrUp); BCV.addEventListener('pointercancel', ptrUp);
BCV.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX, e.clientY); }, {passive:false});

function fxText(x, y, txt, o = {}){ FX.texts.push({x:x*B + B/2, y:y*B + B/2 + (o.dy || 0), txt, col:o.col || '#fff', stroke:o.stroke || '#5a0d08', size:o.size || 24, t0:now() + (o.delay || 0), dur:o.dur || 1000}); }
function fxBurst(x, y, kind, n = 12){

    const a = Math.random() * Math.PI * 2, sp = kind === 'smoke' ? 10 + Math.random()*20 : kind === 'debris' ? 40 + Math.random()*90 : 30 + Math.random()*110;
    FX.parts.push({x:cx + (Math.random()-.5)*20, y:cy + (Math.random()-.5)*14, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (kind === 'smoke' ? 20 : kind === 'ember' || kind === 'fire' ? 50 : 30),

/* ----- 毎フレームの絵 ----- */
function frame(t){
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - (lastFrame || t)) / 1000); lastFrame = t;
  if (!S || !TERR || !viewW() || !viewH()) return;   // 大きさ0のときは描かない（次のコマを待つ）
  if (BCV.width !== Math.round(viewW() * DPR) || BCV.height !== Math.round(viewH() * DPR)) resizeBattle();   // 大きさが変わっていたら合わせる
  const k = Math.min(1, dt * 10);
  CAM.x += (CAM.tx - CAM.x) * k; CAM.y += (CAM.ty - CAM.y) * k; CAM.z += (CAM.tz - CAM.z) * k;
  const sx = CAM.shake ? (Math.random() - .5) * CAM.shake : 0, sy = CAM.shake ? (Math.random() - .5) * CAM.shake : 0; CAM.shake *= 0.86; if (CAM.shake < 0.3) CAM.shake = 0;
  const g = BG, vw = viewW(), vh = viewH();
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = '#0d0a07'; g.fillRect(0, 0, vw, vh);
  g.setTransform(DPR * CAM.z, 0, 0, DPR * CAM.z, DPR * (CAM.x + sx), DPR * (CAM.y + sy));
  g.drawImage(TERR, 0, 0, S.W * B, S.H * B);
  // 水のきらめき
  g.strokeStyle = 'rgba(220,240,255,.22)'; g.lineWidth = 1.4;
  for (let y = 0; y < S.H; y++) for (let x = 0; x < S.W; x++){
    const tt = S.map[y][x]; if (tt !== 'r' && tt !== 'd') continue;
    for (let i = 0; i < 2; i++){ const ph = hash2(x, y, i); const off = ((t * 0.012 + ph * B) % B); const yy = y*B + 12 + i*26 + ph*10;
      g.beginPath(); g.moveTo(x*B + off - 8, yy); g.quadraticCurveTo(x*B + off, yy - 2.5, x*B + off + 8, yy); g.stroke(); }
  }
  // 村の持ち主の旗
  for (const k2 in S.own){ const [x, y] = k2.split(',').map(Number); drawFlag(g, x*B + 10, y*B + 30, 26, 7, CLANS[S.clans[S.own[k2]]].color, t, x + y); }
  // 本陣・門の HP と、けむり・火
  for (const o of S.objs){
    const X = o.x*B, Y = o.y*B, r = o.hp / o.max;
    if (o.kind !== 'gate'){ drawFlag(g, X + 4, Y + 20, 46, 10, CLANS[S.clans[o.side]].color, t, o.x * 3, CLANS[S.clans[o.side]].kamon); drawFlag(g, X + B - 6, Y + 20, 46, 10, CLANS[S.clans[o.side]].color, t, o.x * 5 + 1, CLANS[S.clans[o.side]].kamon); }
    g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(X + 6, Y - 8, B - 12, 7); g.fillStyle = o.side === 0 ? '#5d8fe8' : '#e8645a'; g.fillRect(X + 7, Y - 7, (B - 14) * r, 5);
    if (r < 0.5 && Math.random() < dt * 6) fxBurst(o.x, o.y, 'smoke', 1);
    if (r < 0.25 && Math.random() < dt * 10) fxBurst(o.x, o.y, 'fire', 1);
  }
  drawHighlights(g, t);
  // 兵（下にいるほど手前）
  const list = S.units.slice().sort((a, b) => a.vy - b.vy);
  for (const u of list){
    const tx = u.ax != null ? u.ax : u.x*B + B/2, ty = u.ay != null ? u.ay : u.y*B + B/2;
    u.vx += (tx - u.vx) * Math.min(1, dt * 16); u.vy += (ty - u.vy) * Math.min(1, dt * 16);
    const want = u.side === 0 ? (hiddenFrom(u, 1) && !S.over ? 0.62 : 1) : (hiddenFrom(u, 0) && !S.over ? 0 : 1);
    u.alpha = u.alpha == null ? want : u.alpha + (want - u.alpha) * Math.min(1, dt * 6);
    if (u.alpha > 0.02) drawUnit(g, u, t, u.alpha);
  }

    const gh = FX.ghosts[i], p = (t - gh.t0) / 700; if (p >= 1){ FX.ghosts.splice(i, 1); continue; }
    gh.u.vy += 0.15; drawUnit(g, gh.u, t, (1 - p) * gh.a);
  }
  drawFx(g, t, dt);
  // 光（夕方・夜・霧）
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawLight(g, t, vw, vh);
}
function drawHighlights(g, t){

    for (const n of sel.moves.values()){ g.fillStyle = `rgba(80,140,255,${0.3 + pulse*0.12})`; g.fillRect(n.x*B + 2, n.y*B + 2, B - 4, B - 4); g.strokeStyle = 'rgba(200,225,255,.9)'; g.lineWidth = 2; g.strokeRect(n.x*B + 3, n.y*B + 3, B - 6, B - 6); g.fillStyle = 'rgba(230,240,255,.85)'; ell(g, n.x*B + B/2, n.y*B + B/2, 3.5, 3.5); g.fill(); }
  }
  if (sel && sel.targets){

      const X = tg.x*B, Y = tg.y*B; g.fillStyle = `rgba(230,60,50,${0.25 + pulse*0.2})`; g.fillRect(X + 2, Y + 2, B - 4, B - 4);
      g.strokeStyle = '#ff9a8a'; g.lineWidth = 2; g.beginPath(); g.arc(X + B/2, Y + B/2, 14, 0, 7); g.moveTo(X + B/2 - 20, Y + B/2); g.lineTo(X + B/2 + 20, Y + B/2); g.moveTo(X + B/2, Y + B/2 - 20); g.lineTo(X + B/2, Y + B/2 + 20); g.stroke();
      const d = calcDamage(sel.u, sel.u.x, sel.u.y, tg, {hidden:sel.u.spent ? sel.u.amb : hiddenFrom(sel.u, 1)}).dmg, kill = d >= tg.t.hp;
      g.fillStyle = kill ? '#ffd772' : '#7a1d17'; rrect(g, X + B - 30, Y + 2, 28, 16, 5); g.fill();
      g.fillStyle = kill ? '#3a1a00' : '#fff'; g.font = "800 11px 'M PLUS Rounded 1c'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(kill ? '撃破' : '-' + d, X + B - 16, Y + 10.5);
    }

  const tn = tutNeed();
  if (tn){
    let cx = null, cy = null;
    if (tn.x != null){ cx = tn.x; cy = tn.y; }
    if (tn.t === 'castle'){ const c = mainObj(0); cx = c.x; cy = c.y; }
    if (cx != null){ g.strokeStyle = `rgba(255,215,114,${0.5 + pulse*0.5})`; g.lineWidth = 4 + pulse*2; g.strokeRect(cx*B + 2, cy*B + 2, B - 4, B - 4);
      g.fillStyle = '#ffd772'; g.beginPath(); const ay = cy*B - 6 - pulse*6; g.moveTo(cx*B + B/2, ay + 10); g.lineTo(cx*B + B/2 - 9, ay - 4); g.lineTo(cx*B + B/2 + 9, ay - 4); g.closePath(); g.fill(); }
  }

function drawFx(g, t, dt){

    g.strokeStyle = r.col + (1 - p) + ')'; g.lineWidth = 2.5; g.beginPath(); g.arc(r.x, r.y, 6 + p * 22, 0, 7); g.stroke(); }
  for (let i = FX.shots.length - 1; i >= 0; i--){

    else { g.fillStyle = '#1a1a1e'; ell(g, x, y, 5, 5); g.fill(); g.fillStyle = 'rgba(0,0,0,.25)'; ell(g, x, lerp(s.y0, s.y1, p) + 10, 5, 2); g.fill(); }
  }
  for (let i = FX.slashes.length - 1; i >= 0; i--){ const s = FX.slashes[i], p = (t - s.t0) / s.dur; if (p >= 1){ FX.slashes.splice(i, 1); continue; }
    g.save(); g.translate(s.x, s.y); g.rotate(s.a); g.strokeStyle = `rgba(255,255,255,${1 - p})`; g.lineWidth = 4 * (1 - p) + 1; g.beginPath(); g.arc(0, 0, 18 + p*6, -1.1, 1.1 * (p*2 - 0.2)); g.stroke(); g.restore(); }
  for (let i = FX.parts.length - 1; i >= 0; i--){

    q.vy += q.g * dt; q.vx *= 0.98; q.x += q.vx * dt; q.y += q.vy * dt; const a = 1 - q.age / q.life;
    if (q.kind === 'smoke'){ g.fillStyle = `rgba(70,66,60,${a * 0.35})`; ell(g, q.x, q.y, q.size * (1.6 - a*0.6), q.size * (1.6 - a*0.6)); g.fill(); }
    else if (q.kind === 'fire' || q.kind === 'ember'){ g.fillStyle = `rgba(255,${120 + 100*a|0},40,${a})`; ell(g, q.x, q.y, q.size * a, q.size * a); g.fill(); }

async function animPath(u, path){

    u.ax = path[i].x*B + B/2; u.ay = path[i].y*B + B/2; u.hop = now();
    if (seen) sfx('step');

  u.ax = null; u.ay = null;
}
async function actMove(u, x, y){

}

/* =========================================================
   ターンの流れ
   ========================================================= */
let battleCfg = null;
function afterAction(){ renderHud(); const e = coreCheckEnd(); if (e){ finishBattle(e.winner, e.reason, e); return true; } return false; }
async function startTurn(){
  coreStartTurn();
  const s = S.side;
  sfx(s === 0 ? 'turnMe' : 'turnFoe');
  banner(s === 0 ? `わが軍の番　${S.round}/${S.maxRound}` : (S.mode === 'online' ? '相手の番' : '敵軍の番'), s === 0 ? '' : 'r');
  renderHud(); infoDefault();
  NETI.turnAt = Date.now();
  if (S.mode === 'online'){ if (s === 1) netWaitFoe(); return; }   // オンライン：相手の番は待つだけ
  if (s === 1 || AUTO) runAI(s);
  else { tutAdvance('turn'); }
}
function endTurn(){
  if (S.over) return;
  sel = null; tsel = null;
  const r = coreEndTurn();
  if (r === 'judge'){ renderHud(); judge(); return; }
  startTurn();
}
function judge(){
  const a = judgeScore(0), b = judgeScore(1);
  finishBattle(a > b ? 0 : a < b ? 1 : -1, `${S.maxRound}ターン終了・戦功の判定（${a} 対 ${b}）`);
}
async function runAI(me){
  busy = true; renderHud();
  await sleep(700);
  if (S.over){ busy = false; return; }
  if (S.tutorial && me === 1 && S.round === 1){ setInfo('<span class="e">野盗たちは、ようすを見ている…</span>'); await sleep(1100); busy = false; endTurn(); return; }
  for (const sp of aiPlanSpecial(me, 'start')){
    if (S.over) break;
    if (sp.kind === 'tac') await actTactic(me, sp.id, sp.target); else await actSkill(sp.u, sp.target);
    if (afterAction()){ busy = false; return; }
  }
  // 援軍（采配が多いときだけ）
  const myN = S.units.filter(q => q.side === me).length, foeN = S.units.filter(q => q.side !== me).length;
  if (S.orders >= 3 && (myN < foeN + 1 || S.food[me] >= 12)){   // 数が足りないときだけ援軍
    const t = aiReinforceType(me); const keep = aiDiff(me) === 2 ? 0 : 1;
    if (t && S.food[me] >= TYPES[t].cost + keep && canReinforce(me, t)){ await actReinforce(me, t); renderHud(); }
  }
  const limit = S.tutorial ? 2 : 99; let n = 0;
  while (S.orders > 0 && !S.over && n++ < limit){
    const b = aiBest(me); if (!b) break;
    await aiExec(b);
    if (afterAction()){ busy = false; return; }
    await sleep(260);
  }
  // 一番槍：もう一度動かす
  const spear = S.load[me].tactics.find(c => c.id === 'spear' && !c.used);
  if (!S.over && spear && S.food[me] >= TAC.spear.food && aiDiff(me) > 0){
    const cand = S.units.filter(u => u.side === me && u.acted && !RANGED(u.type)).map(u => ({u, t:targetsFrom(u, u.x, u.y).length})).filter(c => c.t > 0)[0];
    if (cand){ await actTactic(me, 'spear', cand.u); const b = aiBest(me, cand.u.id); if (b){ await aiExec(b); if (afterAction()){ busy = false; return; } } }
  }
  for (const sp of aiPlanSpecial(me, 'end')){
    if (S.over) break;
    if (sp.kind === 'tac') await actTactic(me, sp.id, sp.target); else await actSkill(sp.u, sp.target);
    if (afterAction()){ busy = false; return; }
  }
  busy = false;
  if (!S.over) endTurn();
}
async function aiExec(b){
  const u = b.u;
  if (!hiddenFrom(u, 0)){ sel = {u, moves:null, targets:null}; camFollow(u.x, u.y); await sleep(220); sel = null; }
  let ok = 'ok';
  if (b.x !== u.x || b.y !== u.y) ok = await actMove(u, b.x, b.y); else spend(u);
  if (ok === 'ok' && b.tg && !S.over && (!u.moved || canShootAfterMove(u))){
    const tg = targetsFrom(u, u.x, u.y).find(t => t.x === b.tg.x && t.y === b.tg.y);
    if (tg) await actAttack(u, tg);
  }
  u.acted = true;
}

/* =========================================================
   自分の操作（タップ）
   ========================================================= */
function selectUnit(u){
  sel = {u, phase:'move', moves:new Map(), targets:[]}; refreshSel(); sfx('select'); unitInfo(u);
}
function refreshSel(){
  const u = sel.u;
  if (sel.phase === 'move'){ sel.moves = moveCells(u).out; sel.targets = (!u.moved || canShootAfterMove(u)) ? targetsFrom(u, u.x, u.y) : []; }
  else { sel.moves = new Map(); sel.targets = canShootAfterMove(u) ? targetsFrom(u, u.x, u.y) : []; }
}
function finishSel(){ if (sel && sel.u.spent) sel.u.acted = true; sel = null; }
async function onCellTap(x, y){
  if (busy || !S || S.over || S.side !== 0 || AUTO) return;
  const u = unitAt(x, y), vis = u && (u.side === 0 || !hiddenFrom(u, 0)) ? u : null;
  // 作戦・スキルの相手えらび
  if (tsel){
    const c = tsel.cells.get(key(x, y));
    if (!tutAllow(tsel.kind === 'tac' ? 'tactic' : 'skill', x, y)){ sfx('bad'); tutNudge(); return; }
    const t2 = tsel; tsel = null;
    if (!c){ setInfo('やめました'); sfx('tap'); return; }
    busy = true; renderHud();
    netSend(t2.kind === 'tac' ? {t:'tac', id:t2.id, x, y} : {t:'sk', id:t2.u.id, x, y});
    if (t2.kind === 'tac') await actTactic(0, t2.id, c); else await actSkill(t2.u, c);
    busy = false; if (afterAction()) return; renderHud(); infoDefault(); if (t2.kind === 'tac') tutAdvance('tactic'); return;
  }
  const canPick = v => v && v.side === 0 && !v.acted && (v.spent || v.free || S.orders > 0);
  let act;
  if (sel){
    const tg = sel.targets.find(t => t.x === x && t.y === y);
    if (tg) act = {k:'attack', tg};
    else if (sel.phase === 'move' && sel.moves.has(key(x, y))) act = {k:'move'};
    else if (vis === sel.u) act = {k:'deselect'};
    else if (canPick(vis)) act = {k:'select', u:vis};
    else act = {k:'cancel'};
  } else {
    const base = mainObj(0);
    if (canPick(vis)) act = {k:'select', u:vis};
    else if (base && x === base.x && y === base.y) act = {k:'castle'};
    else act = {k:'info'};
  }
  if (!tutAllow(act.k, x, y)){ sfx('bad'); tutNudge(); return; }
  if (act.k === 'select'){ finishSel(); selectUnit(act.u); tutAdvance('select'); return; }
  if (act.k === 'deselect'){ finishSel(); sfx('tap'); infoDefault(); return; }
  if (act.k === 'cancel'){ finishSel(); if (vis) unitInfo(vis); else terrainInfo(x, y); return; }
  if (act.k === 'castle'){ tutAdvance('castle'); openReinforce(); return; }
  if (act.k === 'info'){ sfx('tap'); if (vis) unitInfo(vis); else terrainInfo(x, y); return; }
  if (act.k === 'move'){
    busy = true; renderHud(); const su = sel.u; sel.moves = new Map(); sel.targets = [];
    netSend({t:'mv', id:su.id, x, y});
    const res = await actMove(su, x, y); busy = false;
    if (res === 'ambushed'){ sel = null; renderHud(); infoDefault(); tutAdvance('move'); return; }
    sel = {u:su, phase:'attack', moves:new Map(), targets:[]}; refreshSel();
    if (!sel.targets.length){ su.acted = true; sel = null; infoDefault(); }
    else setInfo('<span class="g">赤いマスの敵を攻撃！</span>　攻撃しないなら、ほかのマスをタップ（待機）');
    renderHud(); tutAdvance('move'); return;
  }
  if (act.k === 'attack'){
    busy = true; const su = sel.u; sel = null; renderHud();
    netSend({t:'atk', id:su.id, x:act.tg.x, y:act.tg.y});
    await actAttack(su, act.tg); busy = false;
    if (afterAction()) return;
    renderHud(); infoDefault(); tutAdvance('attack'); return;
  }
}

  for (const t of shuffle(TACTICS)){ if (tac.length >= (diff === 0 ? 2 : MAX_TAC)) break; if (t.cost <= cap - 1){ tac.push(t.id); cap -= t.cost; } }
  for (const it of shuffle(ITEMS)){ if (items.length >= MAX_ITEM) break; if (it.cost <= cap){ items.push(it.id); cap -= it.cost; } }
  return {tactics:tac, items};
}

  return l;
}

/* ===== 戦の終わり ===== */
let lastResult = null;
async function finishBattle(winner, reason, info){
  if (S.over) return;
  S.over = true; sel = null; tsel = null; busy = true; renderHud();
  const win = winner === 0, draw = winner === -1;
  Music.stop(); sfx(win ? 'win' : 'lose');
  banner(win ? '勝利！' : draw ? '引き分け' : '敗北…', win ? 'g' : 'r');
  $('tut').classList.remove('on');
  if (win) for (let i = 0; i < 40; i++) FX.parts.push({x:Math.random()*S.W*B, y:-20, vx:(Math.random()-.5)*30, vy:40 + Math.random()*60, g:10, life:3, age:0, size:2.5, kind:'ember'});
  const before = SV.rp; let coins = 0, rp = 0;
  const st = S.stats[0];
  if (S.mode === 'tut'){ SV.tut = true; giveAch('tut'); coins = win ? 100 : 30; }
  else if (S.mode === 'vs'){
    const D = DIFFS[S.diff];
    if (win){ rp = D.rp; coins = Math.round(D.coin * SCALES[battleCfg.scale ?? 1].coin); SV.w++; SV.byDiff[S.diff][0]++; giveAch('first'); if (S.diff >= 1) giveAch('normal'); if (S.diff >= 2) giveAch('hard'); }
    else if (draw){ rp = 5; coins = 40; SV.d++; }
    else { rp = -D.lose; coins = 20; SV.l++; SV.byDiff[S.diff][1]++; }
  } else if (S.mode === 'online'){
    const k = SCALES[battleCfg.scale ?? 1].coin;
    if (win){ rp = 30; coins = Math.round(150 * k); SV.w++; SV.onW = (SV.onW || 0) + 1; giveAch('online'); }
    else if (draw){ rp = 5; coins = 40; SV.d++; }
    else { rp = -10; coins = 30; SV.l++; SV.onL = (SV.onL || 0) + 1; }
  } else {
    if (win){ const Bt = BATTLES[S.prov]; coins = Bt.reward.coins; SV.w++; rp = 30;
      if (!SV.story.own.includes(S.prov)) SV.story.own.push(S.prov);
      for (const t of Bt.reward.types || []) if (!SV.story.types.includes(t)) SV.story.types.push(t);
      if (Object.keys(PROVS).every(p => SV.story.own.includes(p))){ SV.story.cleared = true; giveAch('tokai'); }
    } else { coins = 20; SV.l++; }
  }
  if (S.mode !== 'tut'){   // チュートリアルでは「初陣」だけ
    if (win){ if (info && info.base) giveAch('castle'); if (S.round <= 6) giveAch('speed'); if (S.env.time === 'night') giveAch('nightw'); if (SV.w >= 10) giveAch('wins10'); }
    if (st.ambush > 0) giveAch('ambush'); if (st.pincer >= 3) giveAch('pincer'); if (st.reinf > 0) giveAch('reinf');
  }
  SV.coins += coins; SV.rp = Math.max(0, SV.rp + rp);
  const got = checkUnlocks(); saveNow();
  lastResult = {win, draw, reason: win || draw ? reason : reason.replace('落とした', '落とされた').replace('討ち取った', '討ち取られた'),
    mode:S.mode, prov:S.prov, diff:S.diff, scale:battleCfg.scale ?? 1, coins, rp, rankUp:rankOf(before) !== rankOf(SV.rp) && rp > 0, newAch:S.newAch.slice(), got,
    foeName:S.names ? S.names[1] : null, gen:S.load[0].gen, foe:S.load[1].gen, round:Math.min(S.round, S.maxRound), stats:{...st}, lost:S.stats[1].kills, time:S.env.time};
  if (window.IK_ONEND) window.IK_ONEND(winner, reason);
  await sleep(2200);
  running = false;
  showResult();
}

let sceneState = null;
const sceneBg = pid => ({mikawa:'field', mino:'fog', ise:'night', omi:'dusk'}[pid] || 'castle');
function playScene(lines, bg){
  return new Promise(resolve => {
    show('scene');
    const cv = $('scv'), d = Math.min(2, window.devicePixelRatio || 1);
    let base = null;
    const drift = makeDrifters(bg === 'fog' ? 10 : 40, bg === 'night' ? 'firefly' : bg === 'fog' ? 'mist' : 'ember');
    sceneState = {lines, i:-1, typing:null, resolve, drift, left:null, right:null};
    const loop = t => {
      if (!sceneState || !$('scene').classList.contains('on')) return;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h){ requestAnimationFrame(loop); return; }   // まだ大きさが決まっていない（0）ときは、次のコマを待つ
      if (!base || base.width !== Math.round(w*d) || base.height !== Math.round(h*d)){
        cv.width = Math.round(w*d); cv.height = Math.round(h*d);
        base = document.createElement('canvas'); base.width = cv.width; base.height = cv.height; paintScene(base, bg);
      }
      const g = cv.getContext('2d'); g.setTransform(1,0,0,1,0,0); g.drawImage(base, 0, 0); g.scale(d, d); if (bg !== 'castle' && bg !== 'field') drawDrifters(g, w, h, drift, t); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    $('porL').style.opacity = 0; $('porR').style.opacity = 0;
    Music.play('map');
    nextLine();
  });
}
function nextLine(){
  const st = sceneState; if (!st) return;
  if (st.typing){ clearInterval(st.typing.id); $('stext').textContent = st.typing.text; st.typing = null; return; }
  st.i++;
  if (st.i >= st.lines.length){ const r = st.resolve; sceneState = null; r(); return; }
  const [who, side, text] = st.lines[st.i];
  sfx('page');
  if (who === 'narr'){ $('sname').style.display = 'none'; $('porL').classList.add('dim'); $('porR').classList.add('dim'); }
  else {
    $('sname').style.display = ''; $('sname').textContent = GEN[who].name;
    const el = side === 'L' ? $('porL') : $('porR'), other = side === 'L' ? $('porR') : $('porL');
    if ((side === 'L' ? st.left : st.right) !== who){ paintPortrait(el.querySelector('canvas'), GEN[who], side === 'R'); if (side === 'L') st.left = who; else st.right = who; }
    el.style.opacity = 1; el.classList.remove('dim'); other.classList.add('dim');
  }
  // 1文字ずつ出す（本当の時間で）
  const t0 = performance.now(); $('stext').textContent = '';
  const id = setInterval(() => { const n = Math.floor((performance.now() - t0) / 35); $('stext').textContent = text.slice(0, n); if (n >= text.length){ clearInterval(id); if (st.typing && st.typing.id === id) st.typing = null; } }, 30);
  st.typing = {id, text};
  if (SPEED === 0){ clearInterval(id); $('stext').textContent = text; st.typing = null; }
}
$('scene').addEventListener('click', e => { if (e.target.id === 'sskip') return; nextLine(); });
$('sskip').onclick = () => { sfx('tap'); if (!sceneState) return; const st = sceneState; if (st.typing) clearInterval(st.typing.id); st.typing = null; st.i = st.lines.length; nextLine(); };

function drawMap(t){
  const cv = $('mcv'), d = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;   // 大きさ0のときは描かない（次のコマで描く）
  if (cv.width !== Math.round(w*d) || cv.height !== Math.round(h*d)){ cv.width = Math.round(w*d); cv.height = Math.round(h*d); }
  const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.fillStyle = '#3e5f6c'; g.fillRect(0, 0, w, h);

  mapView = {s, ox, oy};
  g.save(); g.translate(ox, oy); g.scale(s, s); g.drawImage(MAPBG, 0, 0);
  const pulse = 0.5 + 0.5*Math.sin(t*0.005);

    g.fillStyle = '#efe9dc'; g.fillRect(cx - 16, cy - 6, 32, 22); g.fillStyle = '#2b2f3c'; poly(g, [[cx - 24, cy - 4], [cx, cy - 22], [cx + 24, cy - 4]]); g.fill();
    g.fillStyle = '#efe9dc'; g.fillRect(cx - 9, cy - 26, 18, 10); g.fillStyle = '#2b2f3c'; poly(g, [[cx - 15, cy - 24], [cx, cy - 36], [cx + 15, cy - 24]]); g.fill();
    drawFlag(g, cx + 26, cy + 18, 54, 16, C.color, t, cx, C.kamon);

    if (P.boss && !mine){ g.font = "800 22px 'M PLUS Rounded 1c'"; g.fillStyle = '#7a1d17'; g.fillText('決戦', cx, cy + 92); }
  }
  g.restore();
}

class FBRoom {   // 本物：ikusa/〇〇
  constructor(path){ this.ref = firebase.database().ref('ikusa/' + path); this.offs = []; }
  async get(k){ return (await this.ref.child(k).get()).val(); }
  async all(){ return (await this.ref.get()).val() || {}; }
  set(k, v){ return this.ref.child(k).set(v); }
  add(list, i, v){ return this.ref.child(list).child(String(i)).set(v); }
  async claim(k, v){ const r = await this.ref.child(k).transaction(cur => cur ? undefined : v); return r.committed; }   // 2人が同時に入っても1人だけ
  incr(k){ return this.ref.child(k).transaction(v => (v || 0) + 1); }
  on(k, cb){ const r = this.ref.child(k), f = s => cb(s.val()); r.on('value', f); this.offs.push(() => r.off('value', f)); }
  onAdd(list, cb){ const r = this.ref.child(list), f = s => cb(s.key, s.val()); r.on('child_added', f); this.offs.push(() => r.off('child_added', f)); }
  dropOnLeave(k){ (k ? this.ref.child(k) : this.ref).onDisconnect().remove(); }
  remove(k){ return (k ? this.ref.child(k) : this.ref).remove(); }
  close(){ this.offs.forEach(f => f()); this.offs = []; }
}
class LocalRoom {   // まねっこ：同じブラウザのタブどうし（BroadcastChannel）
  constructor(path){
    this.data = {}; this.ls = {}; this.as = {}; this.bc = new BroadcastChannel('ikusa-' + path);
    this.bc.onmessage = e => {
      const m = e.data;
      if (m.hello){ this.bc.postMessage({dump:this.data}); return; }
      if (m.dump){ for (const k in m.dump) if (this.data[k] === undefined) this._put(k, m.dump[k]); return; }
      this._put(m.k, m.v);
    };
    this.bc.postMessage({hello:1});
  }
  _put(k, v){
    this.data[k] = v; (this.ls[k] || []).forEach(f => f(v));
    const p = k.indexOf('/'); if (p > 0 && v != null){ const l = k.slice(0, p), i = k.slice(p + 1); (this.as[l] || []).forEach(f => f(i, v)); }
  }
  get(k){ return new Promise(r => setTimeout(() => r(this.data[k] ?? null), 150)); }
  all(){ return new Promise(r => setTimeout(() => r(Object.fromEntries(Object.entries(this.data).filter(([, v]) => v != null))), 150)); }
  set(k, v){ this.bc.postMessage({k, v}); this._put(k, v); return Promise.resolve(); }
  add(list, i, v){ return this.set(list + '/' + i, v); }
  async claim(k, v){ await new Promise(r => setTimeout(r, 120)); if (this.data[k]) return false; await this.set(k, v); return true; }
  incr(k){ return this.set(k, (this.data[k] || 0) + 1); }
  on(k, cb){ (this.ls[k] = this.ls[k] || []).push(cb); cb(this.data[k] ?? null); }
  onAdd(list, cb){ (this.as[list] = this.as[list] || []).push(cb); for (const k in this.data){ if (k.startsWith(list + '/') && this.data[k] != null) cb(k.slice(list.length + 1), this.data[k]); } }
  dropOnLeave(){}
  remove(k){ if (!k){ for (const kk in this.data) this.set(kk, null); return Promise.resolve(); } for (const kk in this.data) if (kk === k || kk.startsWith(k + '/')) this.set(kk, null); return Promise.resolve(); }
  close(){ this.ls = {}; this.as = {}; this.bc.close(); }
}

function sanitizeLoad(l, scale){
